{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-white p-6 mt-10 rounded shadow">
  <h2 class="text-xl font-bold mb-4">パスワード確認</h2>
  {% if error %}
    <p class="text-red-600 mb-3">{{ error }}</p>
  {% endif %}
  <form method="POST" class="space-y-4">
    <input type="password" name="password" placeholder="パスワード" class="w-full border rounded px-3 py-2" autofocus>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded w-full hover:bg-blue-700">ダウンロード</button>
  </form>
</div>
{% endblock %}
