{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white p-6 mt-10 rounded shadow">
  <h2 class="text-2xl font-bold mb-4">📤 ファイル共有ツール</h2>

  <form method="POST" enctype="multipart/form-data">
    <div class="mb-4">
      <label class="block mb-1 font-semibold">共有ファイル:</label>
      <input type="file" name="files" multiple required class="w-full border rounded px-2 py-1">
      <p class="text-sm text-gray-500 mt-1">※ 最大 10GB まで、複数ファイル選択可能</p>
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-semibold">パスワード（任意）:</label>
      <input type="text" name="password" class="w-full border rounded px-2 py-1" placeholder="未設定の場合は空欄のままでOK">
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-semibold">メモ（任意）:</label>
      <input type="text" name="memo" class="w-full border rounded px-2 py-1" placeholder="例: プロジェクトA資料" maxlength="100">
    </div>

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">
      アップロードして共有URL生成
    </button>
  </form>

  {% if download_url %}
  <div class="mt-8 border-t pt-6">
    <h3 class="text-lg font-semibold mb-2">✅ アップロード完了！</h3>

    {% if display_id %}
    <div class="mb-4">
      <label class="block mb-1 font-semibold">共有ID:</label>
      <p class="text-3xl font-mono font-bold text-blue-600">{{ display_id }}</p>
    </div>
    {% endif %}

    <label class="block mb-1 font-semibold">共有URL:</label>
    <input type="text" readonly value="{{ download_url }}" class="w-full border px-2 py-1 text-blue-800 mb-4 bg-gray-50" onclick="this.select()">

    <label class="block mb-2 font-semibold">QRコード:</label>
    <img src="data:image/png;base64,{{ qr_data }}" alt="QRコード" class="mx-auto w-48 h-48 border p-2 rounded">
  </div>
  {% endif %}

  <!-- ファイルリスト表示エリア -->
  <div class="mt-8 border-t pt-6">
    <h3 class="text-xl font-bold mb-4">📁 共有ファイル一覧</h3>
    <div id="fileList" class="text-gray-500">読み込み中...</div>
  </div>
</div>

<!-- パスワードモーダル -->
<div id="passwordModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded shadow-lg max-w-sm w-full mx-4">
    <h3 class="text-lg font-bold mb-4">🔐 パスワード入力</h3>
    <p id="passwordModalError" class="text-red-600 mb-2 hidden"></p>
    <input type="password" id="passwordInput" class="w-full border rounded px-3 py-2 mb-4" placeholder="パスワード" onkeypress="if(event.key==='Enter') submitPassword()">
    <div class="flex gap-2">
      <button onclick="submitPassword()" class="bg-blue-600 text-white px-4 py-2 rounded flex-1 hover:bg-blue-700">OK</button>
      <button onclick="closePasswordModal()" class="bg-gray-400 text-white px-4 py-2 rounded flex-1 hover:bg-gray-500">キャンセル</button>
    </div>
  </div>
</div>

<script>
let currentUid = null;
let currentAction = null;
let currentFileIndex = null;

// ページ読み込み時にファイルリスト取得
document.addEventListener('DOMContentLoaded', function() {
  loadFileList();
});

// ファイルリスト取得・表示
async function loadFileList() {
  try {
    const response = await fetch('/tools/share/api/list');
    const files = await response.json();

    const listDiv = document.getElementById('fileList');

    if (files.length === 0) {
      listDiv.innerHTML = '<p class="text-gray-500">共有ファイルはありません</p>';
      return;
    }

    let html = '<div class="space-y-4">';

    files.forEach(file => {
      // ISO文字列にZを付けてUTC時刻であることを明示
      const expiresAt = new Date(file.expires_at.endsWith('Z') ? file.expires_at : file.expires_at + 'Z');
      const createdAt = new Date(file.created_at.endsWith('Z') ? file.created_at : file.created_at + 'Z');
      const currentUsername = '{{ current_user.username if current_user.is_authenticated else "" }}';
      const isOwner = file.uploader === currentUsername;

      html += `
        <div class="border rounded p-4 hover:shadow-md transition">
          <div class="flex items-start justify-between">
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                <span class="text-2xl font-mono font-bold text-blue-600">${file.display_id}</span>
                ${file.has_password ? '<span class="text-sm bg-yellow-100 text-yellow-800 px-2 py-1 rounded">🔐 パスワード保護</span>' : ''}
                ${isOwner ? '<span class="text-sm bg-green-100 text-green-800 px-2 py-1 rounded">自分</span>' : ''}
              </div>

              ${file.memo ? `<p class="text-gray-700 mb-2"><strong>メモ:</strong> ${escapeHtml(file.memo)}</p>` : ''}

              <p class="text-sm text-gray-600">
                アップロード: ${file.uploader} | ${formatDate(createdAt)}
              </p>
              <p class="text-sm text-gray-600">
                有効期限: ${formatDate(expiresAt)} | ファイル数: ${file.file_count} | 合計サイズ: ${formatSize(file.total_size)}
              </p>

              <!-- ファイル詳細リスト -->
              <div class="mt-3 bg-gray-50 p-3 rounded">
                <p class="text-sm font-semibold mb-2">📎 ファイル:</p>
                ${file.files.map((f, idx) => `
                  <div class="flex justify-between items-center text-sm py-1">
                    <span class="text-gray-700">${escapeHtml(f.original_name)} (${formatSize(f.size)})</span>
                    <button onclick="downloadSingleFile('${file.uid}', ${idx}, ${file.has_password})"
                            class="text-blue-600 hover:text-blue-800 text-xs underline">
                      ダウンロード
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- アクションボタン -->
          <div class="mt-4 flex gap-2">
            <button onclick="downloadAllFiles('${file.uid}', ${file.has_password})"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm">
              ${file.file_count > 1 ? '全ファイルをZIPでダウンロード' : 'ダウンロード'}
            </button>
            ${isOwner ? `
              <button onclick="deleteFile('${file.uid}')"
                      class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 text-sm">
                削除
              </button>
            ` : ''}
          </div>
        </div>
      `;
    });

    html += '</div>';
    listDiv.innerHTML = html;

  } catch (error) {
    console.error('ファイルリスト取得エラー:', error);
    document.getElementById('fileList').innerHTML = '<p class="text-red-600">ファイルリストの取得に失敗しました</p>';
  }
}

// 個別ファイルダウンロード
function downloadSingleFile(uid, fileIndex, hasPassword) {
  if (hasPassword) {
    currentUid = uid;
    currentAction = 'download_single';
    currentFileIndex = fileIndex;
    showPasswordModal();
  } else {
    window.location.href = `/tools/share/download/${uid}/${fileIndex}`;
  }
}

// 全ファイルダウンロード
function downloadAllFiles(uid, hasPassword) {
  if (hasPassword) {
    currentUid = uid;
    currentAction = 'download_all';
    showPasswordModal();
  } else {
    window.location.href = `/tools/share/download/${uid}`;
  }
}

// パスワードモーダル表示
function showPasswordModal() {
  document.getElementById('passwordModal').classList.remove('hidden');
  document.getElementById('passwordInput').value = '';
  document.getElementById('passwordModalError').classList.add('hidden');
  document.getElementById('passwordInput').focus();
}

// パスワードモーダル閉じる
function closePasswordModal() {
  document.getElementById('passwordModal').classList.add('hidden');
  currentUid = null;
  currentAction = null;
  currentFileIndex = null;
}

// パスワード検証・ダウンロード実行
async function submitPassword() {
  const password = document.getElementById('passwordInput').value;
  const errorDiv = document.getElementById('passwordModalError');

  try {
    const response = await fetch(`/tools/share/api/verify_password/${currentUid}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ password: password })
    });

    const result = await response.json();

    if (result.success) {
      closePasswordModal();

      // パスワード検証成功後、ダウンロード実行
      if (currentAction === 'download_single') {
        window.location.href = `/tools/share/download/${currentUid}/${currentFileIndex}`;
      } else if (currentAction === 'download_all') {
        window.location.href = `/tools/share/download/${currentUid}`;
      }
    } else {
      errorDiv.textContent = result.error || 'パスワードが違います';
      errorDiv.classList.remove('hidden');
    }
  } catch (error) {
    console.error('パスワード検証エラー:', error);
    errorDiv.textContent = '検証に失敗しました';
    errorDiv.classList.remove('hidden');
  }
}

// ファイル削除
async function deleteFile(uid) {
  if (!confirm('本当にこのファイルを削除しますか？')) {
    return;
  }

  try {
    const response = await fetch(`/tools/share/api/delete/${uid}`, {
      method: 'POST'
    });

    const result = await response.json();

    if (result.success) {
      alert('削除しました');
      loadFileList(); // リスト再読み込み
    } else {
      alert('削除に失敗しました: ' + (result.error || '不明なエラー'));
    }
  } catch (error) {
    console.error('削除エラー:', error);
    alert('削除に失敗しました');
  }
}

// ユーティリティ関数
function formatDate(date) {
  return date.toLocaleString('ja-JP', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function formatSize(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
{% endblock %}
