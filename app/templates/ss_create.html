{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='shiftersync/css/ss_common.css') }}">
<script src="{{ url_for('static', filename='vendor/jquery-3.6.0.min.js') }}"></script>
<script src="{{ url_for('static', filename='shiftersync/js/ss_common.js') }}"></script>
<script>
  window.SHIFTERSYNC_HOLIDAYS = {{ shiftersync_holidays|tojson }};
</script>

<main class="ss-page">
  <div class="container animate-fade-in">
    <div class="ss-stack">
      <header class="ss-header-block">
        <div class="ss-eyebrow">ShifterSync</div>
        <h1 class="ss-title">新規シフト作成</h1>
        <p class="ss-subtitle">
          基本情報を決めてからカレンダーを開きます。各シフトには任意のコメントを付けられ、クリックすると詳細を確認できます。
        </p>
      </header>

      <section class="ss-section">
        <div class="ss-section-head">
          <div>
            <h2>基本情報</h2>
          </div>
          <div class="ss-actions">
            <button type="button" id="backBtn" class="btn-secondary" onclick="history.back()">戻る</button>
          </div>
        </div>

        <form id="shiftMetaForm" style="padding: 0; border: 0; background: transparent; box-shadow: none; margin: 0;">
          <div class="ss-meta-grid">
            <div>
              <label for="mode" class="form-label">種別</label>
              <select name="mode" id="mode" class="form-select">
                <option value="scene">現場シフト</option>
                <option value="person">個人シフト</option>
              </select>
            </div>
            <div>
              <label for="year" class="form-label">年</label>
              <input type="number" name="year" id="year" class="form-input" min="2000" max="2100" required>
            </div>
            <div>
              <label for="month" class="form-label">月</label>
              <input type="number" name="month" id="month" class="form-input" min="1" max="12" required>
            </div>
            <div>
              <label id="nameLabel" for="target_name" class="form-label">現場名</label>
              <input type="text" name="target_name" id="target_name" class="form-input" required>
              <input type="hidden" name="target_employee_number" id="target_employee_number">
              <div id="targetCandidatePanel" class="ss-hidden" style="margin-top: 8px; border: 1px solid var(--ss-line); border-radius: 12px; background: #fff; box-shadow: var(--ss-shadow); padding: 8px; max-height: 220px; overflow: auto;"></div>
              <div id="targetSelectedNote" style="margin-top: 6px; color: var(--ss-muted); font-size: 11px; min-height: 1.1em;"></div>
            </div>
          </div>

          <div style="margin-top: 18px;">
            <label style="display: inline-flex; align-items: center; gap: 8px;">
              <input type="checkbox" id="enableCapacity" name="enableCapacity" class="form-checkbox">
              <span class="form-label" style="margin-bottom: 0;">必要人数を設定する</span>
            </label>
            <div id="capacityInputGroup" style="display: none; margin-top: 10px; max-width: 220px;">
              <label for="capacity" class="form-label">必要人数</label>
              <input type="number" id="capacity" name="capacity" class="form-input" min="1" max="99">
            </div>
          </div>

          <div class="ss-actions" style="margin-top: 20px;">
            <button type="button" id="startBtn" class="btn-primary">カレンダーを開く</button>
          </div>
        </form>
      </section>

      <div id="inputArea" style="display: none;"></div>
    </div>
  </div>
</main>

<script src="{{ url_for('static', filename='shiftersync/js/ss_create.js') }}"></script>
{% endblock %}
