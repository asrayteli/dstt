<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DSTT (DaishintoTools) は、社内業務を支援する認証制のWebアプリケーションです。">
  <meta name="robots" content="index,follow">
  <title>DSTT - サイト情報</title>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DSTT (DaishintoTools)",
      "applicationCategory": "BusinessApplication",
      "description": "An internal business productivity application for PDF editing, CSV editing, scheduling, and operational support.",
      "inLanguage": "ja"
    }
  </script>
  <style>
    body { margin: 0; background: #f4f6f8; color: #1f2937; font-family: sans-serif; line-height: 1.7; }
    main { box-sizing: border-box; max-width: 760px; min-height: 100vh; margin: auto; padding: 64px 24px; }
    article { padding: 36px; border: 1px solid #dbe2e8; border-radius: 12px; background: #fff; }
    h1 { margin-top: 0; color: #0b5cab; }
    dt { margin-top: 16px; font-weight: 700; }
    dd { margin-left: 0; }
    a { color: #0868b7; }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>DSTT (DaishintoTools)</h1>
      <p>DSTTは、PDFやCSVの編集、勤務表の作成、社内情報の管理など、日々の事務作業を効率化する社内向け業務アプリケーションです。</p>
      <dl>
        <dt>サイト分類</dt>
        <dd>Business Application / Productivity Tools</dd>
        <dt>PDF編集</dt>
        <dd>ページの並べ替え、結合、分割、回転、注釈などの編集操作ができます。</dd>
        <dt>CSV編集</dt>
        <dd>表のセル・行・列の編集、データの検証、形式変換ができます。</dd>
        <dt>業務支援</dt>
        <dd>勤務表の作成、社内名簿の管理、料金計算などを一つの画面から利用できます。</dd>
      </dl>
      <p><a href="{{ url_for('auth.login') }}">ログイン画面へ</a></p>
    </article>
  </main>
</body>
</html>
