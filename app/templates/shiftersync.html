{% extends "base.html" %}

{% block content %}
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='shiftersync/css/ss_top_style.css') }}">
</head>

<div class="mx-auto max-w-6xl space-y-6 pb-10">
  <section class="dstt-hero" style="background: linear-gradient(135deg, #0369a1 0%, #0284c7 50%, #38bdf8 100%);">
    <div class="dstt-hero-grid">
      <div class="dstt-hero-copy">
        <div class="dstt-hero-pill">SHIFTER SYNC</div>
        <div>
          <h1 class="dstt-hero-title">ShifterSync</h1>
          <p class="dstt-hero-subtitle">シフト作成・編集・重複チェック・カレンダー出力。シフト関連業務の入口となるハブ画面です。</p>
        </div>
      </div>
      <div class="dstt-hero-meta">
        <div class="dstt-hero-card">
          <div class="dstt-hero-card-label">LOGIN</div>
          <div class="dstt-hero-card-value">{{ current_user_id or 'GUEST' }}</div>
        </div>
        <div class="dstt-hero-card">
          <div class="dstt-hero-card-label">SUITE</div>
          <div class="dstt-hero-card-value">5機能</div>
          <div class="dstt-hero-card-note">作成 / 編集 / 重複 / カレンダー / CloudShift</div>
        </div>
      </div>
    </div>
  </section>

  <div class="bg-white p-9 rounded-2xl shadow-xl">
    <div class="text-center mb-6">
      <h2 class="text-gray-800 text-lg font-semibold">シフト関連ツール</h2>
    </div>

    <form method="POST" class="flex flex-col gap-4">
      <div class="flex flex-col sm:flex-row justify-center gap-4">
        <button type="submit" name="action" value="create"
            class="bg-blue-500 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-300">
          新規シフト作成
        </button>
        <button type="submit" name="action" value="upload"
            class="bg-blue-500 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-300">
          既存シフト編集
        </button>
        <button type="submit" name="action" value="check"
            class="bg-blue-500 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-300">
          シフト重複チェック
        </button>
        <button type="submit" name="action" value="calendar"
            class="bg-blue-500 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-300">
          カレンダー出力
        </button>
      </div>
      <div class="flex justify-center">
        <button type="submit" name="action" value="cloudshift"
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300">
          Shifter-Sync CloudShift
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
