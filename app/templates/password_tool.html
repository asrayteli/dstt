<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power IDeep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=M+PLUS+1:wght@300;400;500;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='password_tool.css') }}">
</head>
<body>
  <div
    id="password-tool-app"
    data-vault-url="{{ url_for('password_tool.api_vault_state') }}"
    data-create-vault-url="{{ url_for('password_tool.api_create_vault') }}"
    data-rotate-vault-url="{{ url_for('password_tool.api_rotate_vault') }}"
    data-items-url="{{ url_for('password_tool.api_create_item') }}"
    data-dashboard-url="{{ url_for('main.index') }}"
    data-logout-url="{{ url_for('auth.logout') }}"
  >
    <main class="vault-shell">
      <section class="vault-hero">
        <div class="vault-hero__copy">
          <div class="vault-hero__pill">POWER IDEEP</div>
          <h1 class="vault-hero__title">Power IDeep</h1>
          <p class="vault-hero__sub">高レベルのIDパスワード管理ツール</p>
        </div>
        <div class="vault-hero__actions">
          <div id="vault-pill" class="pill">確認中</div>
          <button id="lock-vault-button" class="button button--secondary" type="button" disabled>ロック</button>
          <a class="button button--ghost" href="{{ url_for('main.index') }}">ダッシュボード</a>
        </div>
      </section>

      <div id="flash-banner" class="flash-banner" hidden></div>

      <section class="vault-frame">
        <div class="tool-tabs" role="tablist" aria-label="Password tool tabs">
          <button class="tool-tab-button" type="button" data-tool-tab="vault">保管庫</button>
          <button class="tool-tab-button" type="button" data-tool-tab="generator">生成</button>
          <button class="tool-tab-button" type="button" data-tool-tab="editor">保存</button>
          <button class="tool-tab-button" type="button" data-tool-tab="list">一覧</button>
        </div>

        <section class="tool-tab-panel" data-tool-tab-panel="vault">

          <!-- コンパクトなメタストリップ -->
          <div id="vault-meta-strip" class="vault-meta-strip" hidden>
            <div id="vault-summary" class="stat-grid"></div>
            <div class="auto-lock-inline">
              <span class="auto-lock-inline__label">
                <span class="js-glossary-term" data-glossary-key="auto-lock">自動ロック</span>
              </span>
              <input id="auto-lock-minutes" class="field__input auto-lock-inline__input" type="number" min="1" max="240" value="15">
              <span class="auto-lock-inline__unit">分</span>
              <div class="auto-lock-inline__divider"></div>
              <span class="auto-lock-inline__remaining-label">残り</span>
              <strong id="auto-lock-readout" class="auto-lock-inline__readout">--:--</strong>
            </div>
          </div>

          <div id="vault-security-note" class="security-note" hidden></div>

          <!-- 認証パネル（中央寄せ） -->
          <div class="vault-auth-section">

            <article id="setup-panel" class="tool-card vault-auth-card" hidden>
              <div class="tool-card__head">
                <div>
                  <p class="tool-card__eyebrow">Create</p>
                  <h2>保管庫を作成</h2>
                </div>
              </div>
              <form id="setup-form" class="stack-form">
                <label class="field">
                  <span class="field__label"><span class="js-glossary-term" data-glossary-key="master-password">マスターパスワード</span></span>
                  <input id="setup-master-password" class="field__input" type="password" autocomplete="new-password">
                </label>
                <label class="field">
                  <span class="field__label">確認入力</span>
                  <input id="setup-master-password-confirm" class="field__input" type="password" autocomplete="new-password">
                </label>
                <label class="field">
                  <span class="field__label"><span class="js-glossary-term" data-glossary-key="kdf-iterations">鍵導出回数</span></span>
                  <input id="setup-kdf-iterations" class="field__input" type="number" min="200000" max="2000000" value="600000">
                </label>
                <button class="button button--primary" type="submit">作成</button>
              </form>
            </article>

            <article id="unlock-panel" class="tool-card vault-auth-card vault-unlock-card" hidden>
              <div class="vault-unlock-icon">🔐</div>
              <div class="vault-unlock-heading">
                <p class="tool-card__eyebrow">Unlock</p>
                <h2>保管庫をアンロック</h2>
              </div>
              <form id="unlock-form" class="stack-form">
                <label class="field">
                  <span class="field__label"><span class="js-glossary-term" data-glossary-key="master-password">マスターパスワード</span></span>
                  <input id="unlock-master-password" class="field__input vault-unlock-input" type="password" autocomplete="current-password">
                </label>
                <button class="button button--primary vault-unlock-btn" type="submit">開く</button>
              </form>
            </article>

            <article id="change-master-panel" class="tool-card vault-auth-card" hidden>
              <div class="tool-card__head">
                <div>
                  <p class="tool-card__eyebrow">Change</p>
                  <h2>マスターパスワード変更</h2>
                </div>
              </div>
              <form id="change-master-form" class="stack-form">
                <label class="field">
                  <span class="field__label">新しい <span class="js-glossary-term" data-glossary-key="master-password">マスターパスワード</span></span>
                  <input id="change-master-password" class="field__input" type="password" autocomplete="new-password">
                </label>
                <label class="field">
                  <span class="field__label">確認入力</span>
                  <input id="change-master-password-confirm" class="field__input" type="password" autocomplete="new-password">
                </label>
                <label class="field">
                  <span class="field__label">新しい <span class="js-glossary-term" data-glossary-key="kdf-iterations">鍵導出回数</span></span>
                  <input id="change-kdf-iterations" class="field__input" type="number" min="200000" max="2000000" value="600000">
                </label>
                <button class="button button--primary" type="submit">更新</button>
              </form>
            </article>

          </div>
        </section>

        <section class="tool-tab-panel" data-tool-tab-panel="generator" hidden>
          <div class="panel-grid panel-grid--generator">
            <article class="tool-card">
              <div class="tool-card__head">
                <div>
                  <p class="tool-card__eyebrow">Generator</p>
                  <h2>生成</h2>
                </div>
              </div>
              <form id="generator-form" class="stack-form">
                <label class="field">
                  <span class="field__label">モード</span>
                  <select id="generator-mode" class="field__input">
                    <option value="random">ランダム文字列</option>
                    <option value="passphrase">パスフレーズ</option>
                  </select>
                </label>

                <div id="generator-random-fields" class="stack-form">
                  <div class="field-row field-row--one">
                    <label class="field">
                      <span class="field__label">長さ</span>
                      <input id="generator-length" class="field__input" type="number" min="4" max="256" value="24">
                    </label>
                  </div>

                  <details class="tool-disclosure">
                    <summary>詳細設定</summary>
                    <div class="tool-disclosure__body">
                      <div class="toggle-grid">
                        <label class="toggle"><input id="generator-lower" type="checkbox" checked><span>小文字</span></label>
                        <label class="toggle"><input id="generator-upper" type="checkbox" checked><span>大文字</span></label>
                        <label class="toggle"><input id="generator-numbers" type="checkbox" checked><span>数字</span></label>
                        <label class="toggle"><input id="generator-symbols" type="checkbox" checked><span>記号</span></label>
                        <label class="toggle"><input id="generator-exclude-ambiguous" type="checkbox"><span>紛らわしい文字を除外</span></label>
                        <label class="toggle"><input id="generator-require-groups" type="checkbox" checked><span>選んだ文字種を含める</span></label>
                      </div>
                      <label class="field">
                        <span class="field__label"><span class="js-glossary-term" data-glossary-key="symbol-set">記号セット</span></span>
                        <input id="generator-symbol-set" class="field__input" type="text" value="!@#$%&*()-_=+[]{};:,.<>?/~">
                      </label>
                      <label class="field">
                        <span class="field__label"><span class="js-glossary-term" data-glossary-key="custom-charset">カスタム文字セット</span></span>
                        <textarea id="generator-custom-charset" class="field__input field__textarea" rows="2" placeholder="例: abcdef123456XYZ"></textarea>
                      </label>
                    </div>
                  </details>
                </div>

                <div id="generator-passphrase-fields" class="stack-form" hidden>
                  <div class="field-row field-row--two">
                    <label class="field">
                      <span class="field__label">単語数</span>
                      <input id="generator-word-count" class="field__input" type="number" min="3" max="12" value="6">
                    </label>
                    <label class="field">
                      <span class="field__label">区切り文字</span>
                      <input id="generator-separator" class="field__input" type="text" maxlength="4" value="-">
                    </label>
                  </div>

                  <details class="tool-disclosure">
                    <summary>詳細設定</summary>
                    <div class="tool-disclosure__body">
                      <label class="field">
                        <span class="field__label">大文字ルール</span>
                        <select id="generator-passphrase-case" class="field__input">
                          <option value="lower">すべて小文字</option>
                          <option value="title">各単語の先頭だけ大文字</option>
                          <option value="upper">すべて大文字</option>
                        </select>
                      </label>
                      <label class="toggle">
                        <input id="generator-passphrase-number-affix" type="checkbox" checked>
                        <span>末尾に数字を追加</span>
                      </label>
                    </div>
                  </details>
                </div>

                <label class="field field--compact">
                  <span class="field__label">生成数</span>
                  <input id="generator-count" class="field__input" type="number" min="1" max="12" value="5">
                </label>
                <button class="button button--primary" type="submit">生成</button>
              </form>
            </article>

            <article class="tool-card">
              <div class="tool-card__head">
                <div>
                  <p class="tool-card__eyebrow">Result</p>
                  <h2>結果</h2>
                </div>
              </div>
              <div id="generator-results" class="result-list empty-state">まだ生成していません。</div>
            </article>
          </div>
        </section>

        <section class="tool-tab-panel" data-tool-tab-panel="editor" hidden>
          <div class="panel-grid panel-grid--editor">
            <article class="tool-card">
              <div class="tool-card__head">
                <div>
                  <p class="tool-card__eyebrow">Editor</p>
                  <h2>保存</h2>
                </div>
              </div>
              <form id="entry-form" class="stack-form" autocomplete="off">
                <input id="entry-id" type="hidden">

                <div class="field-row field-row--two">
                  <label class="field">
                    <span class="field__label">種類</span>
                    <select id="entry-type" class="field__input">
                      <option value="password">パスワード</option>
                      <option value="api-key">API キー</option>
                      <option value="secure-note">セキュアメモ</option>
                    </select>
                  </label>
                  <label class="field">
                    <span class="field__label">タイトル</span>
                    <input id="entry-title" class="field__input" type="text" maxlength="160" placeholder="例: 社内ポータル">
                  </label>
                </div>

                <div class="field-row field-row--two">
                  <label class="field">
                    <span class="field__label">URL</span>
                    <input id="entry-url" class="field__input" type="url" maxlength="500" placeholder="https://">
                  </label>
                  <label class="field">
                    <span class="field__label">ユーザー名 / ID</span>
                    <input id="entry-username" class="field__input" type="text" maxlength="200">
                  </label>
                </div>

                <label class="field">
                  <span class="field__label">秘密情報</span>
                  <div class="inline-field">
                    <input id="entry-password" class="field__input" type="password" maxlength="2000">
                    <button id="entry-password-toggle" class="button button--ghost button--inline" type="button">表示</button>
                  </div>
                </label>

                <label class="field">
                  <span class="field__label"><span class="js-glossary-term" data-glossary-key="totp">TOTP シークレット</span></span>
                  <input id="entry-totp" class="field__input" type="text" maxlength="200" placeholder="任意">
                </label>

                <label class="field">
                  <span class="field__label">タグ</span>
                  <input id="entry-tags" class="field__input" type="text" maxlength="300" placeholder="例: 社内, 管理者">
                </label>

                <label class="field">
                  <span class="field__label">メモ</span>
                  <textarea id="entry-notes" class="field__input field__textarea" rows="4"></textarea>
                </label>

                <div class="button-row">
                  <button id="entry-save-button" class="button button--primary" type="submit" disabled>保存</button>
                  <button id="entry-clear-button" class="button button--secondary" type="button">クリア</button>
                </div>
              </form>
            </article>

            <article class="tool-card">
              <div class="tool-card__head">
                <div>
                  <p class="tool-card__eyebrow">Strength</p>
                  <h2>診断</h2>
                </div>
              </div>
              <div id="editor-strength-panel" class="strength-panel empty-state">秘密情報を入力すると強度を表示します。</div>
            </article>
          </div>
        </section>

        <section id="vault-workspace" class="tool-tab-panel" data-tool-tab-panel="list" hidden>
          <div class="panel-grid panel-grid--list">
            <article class="tool-card">
              <div class="tool-card__head">
                <div>
                  <p class="tool-card__eyebrow">Health</p>
                  <h2>診断</h2>
                </div>
              </div>
              <div id="health-summary" class="health-summary"></div>
              <div id="health-findings" class="finding-list empty-state">保管庫をアンロックすると診断結果を表示します。</div>
            </article>

            <article class="tool-card">
              <div class="tool-card__head">
                <div>
                  <p class="tool-card__eyebrow">Vault</p>
                  <h2>一覧</h2>
                </div>
              </div>
              <div class="toolbar">
                <label class="field field--compact">
                  <span class="field__label">検索</span>
                  <input id="vault-search" class="field__input" type="search" placeholder="タイトル、URL、ユーザー名、タグ">
                </label>
                <label class="field field--compact">
                  <span class="field__label">並び順</span>
                  <select id="vault-sort" class="field__input">
                    <option value="updated_desc">更新日が新しい順</option>
                    <option value="updated_asc">更新日が古い順</option>
                    <option value="title_asc">タイトル順</option>
                    <option value="created_desc">作成日が新しい順</option>
                  </select>
                </label>
              </div>
              <div id="vault-list" class="vault-list empty-state">保管庫に項目がありません。</div>
            </article>
          </div>
        </section>
      </section>
    </main>

    <div id="glossary-popover" class="glossary-popover" hidden>
      <div class="glossary-popover__header">
        <div>
          <p class="glossary-popover__eyebrow">用語</p>
          <h3 id="glossary-popover-title" class="glossary-popover__title"></h3>
        </div>
        <button id="glossary-popover-close" class="glossary-popover__close" type="button" aria-label="用語解説を閉じる">閉じる</button>
      </div>
      <p id="glossary-popover-body" class="glossary-popover__body"></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='password_tool.js') }}" defer></script>
</body>
</html>
