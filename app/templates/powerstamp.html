{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-4">
  <h1 class="text-2xl font-bold">🖋️ PowerSTAMP</h1>
  <p class="text-sm text-gray-600">
    スキャン画像/PDFを背景として読み込み、その上に文字・図形・画像を重ねます。印刷時は背景を除外し、追加したスタンプのみを出力します。
  </p>

  <div class="bg-white rounded-xl shadow p-4 grid lg:grid-cols-4 gap-4">
    <div class="lg:col-span-2">
      <label class="block text-sm font-medium mb-1">背景ファイル（JPG/PNG/PDF）</label>
      <input id="backgroundInput" type="file" accept="image/*,.pdf,application/pdf" class="w-full text-sm" />
      <p class="text-xs text-gray-500 mt-2">PDFは1ページ目を背景表示します。</p>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">キャンバスサイズ(px)</label>
      <div class="flex gap-2">
        <input id="canvasWidth" type="number" value="1200" min="100" class="w-full border rounded px-2 py-1" />
        <input id="canvasHeight" type="number" value="1700" min="100" class="w-full border rounded px-2 py-1" />
      </div>
      <button id="resizeCanvasBtn" class="mt-2 px-3 py-1 rounded bg-gray-700 text-white hover:bg-gray-800">適用</button>
    </div>

    <div class="text-sm bg-gray-50 rounded border p-3 space-y-2">
      <p class="font-semibold mb-1">サイズ推定</p>
      <p id="detectedSize" class="text-gray-700">未読込</p>
      <p id="detectedFileType" class="text-xs text-gray-600">ファイルタイプ: 未判定</p>
      <div class="pt-1 border-t border-gray-200">
        <p class="text-xs font-medium text-gray-700 mb-1">透過PNG出力サイズ</p>
        <label class="flex items-center gap-2 text-xs">
          <input type="radio" name="exportSizeMode" value="source" checked>
          アップロード元サイズ（推奨）
        </label>
        <label class="flex items-center gap-2 text-xs mt-1">
          <input type="radio" name="exportSizeMode" value="canvas">
          ユーザー指定サイズ（キャンバス）
        </label>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow p-4 flex flex-wrap gap-2">
    <button id="printBtn" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">印刷（スタンプのみ）</button>
    <button id="exportBtn" class="px-4 py-2 rounded bg-green-600 text-white hover:bg-green-700">透過PNG保存</button>
    <button id="clearBtn" class="px-4 py-2 rounded bg-red-600 text-white hover:bg-red-700">全削除</button>
  </div>

  <div class="bg-white rounded-xl shadow p-4 grid lg:grid-cols-4 gap-4">
    <div class="space-y-3">
      <h2 class="font-semibold">テキスト追加</h2>
      <input id="textContent" type="text" value="入力文字" class="w-full border rounded px-2 py-1" />
      <div class="flex gap-2">
        <input id="textSize" type="number" value="32" min="8" class="w-full border rounded px-2 py-1" />
        <input id="textColor" type="color" value="#1f2937" class="w-16 h-10 border rounded" />
      </div>
      <button id="addTextBtn" class="w-full px-3 py-2 rounded bg-slate-700 text-white hover:bg-slate-800">テキスト配置</button>
    </div>

    <div class="space-y-3">
      <h2 class="font-semibold">図形追加</h2>
      <div class="flex gap-2">
        <select id="shapeType" class="w-full border rounded px-2 py-1">
          <option value="rect">四角形</option>
          <option value="ellipse">楕円</option>
        </select>
        <input id="shapeStroke" type="color" value="#2563eb" class="w-16 h-10 border rounded" />
        <input id="shapeFill" type="color" value="#93c5fd" class="w-16 h-10 border rounded" />
      </div>
      <div class="flex gap-2">
        <input id="shapeWidth" type="number" value="180" min="10" class="w-full border rounded px-2 py-1" />
        <input id="shapeHeight" type="number" value="80" min="10" class="w-full border rounded px-2 py-1" />
      </div>
      <button id="addShapeBtn" class="w-full px-3 py-2 rounded bg-slate-700 text-white hover:bg-slate-800">図形配置</button>
    </div>

    <div class="space-y-3 lg:col-span-2">
      <h2 class="font-semibold">画像スタンプ追加</h2>
      <div class="flex gap-2">
        <input id="stampImageInput" type="file" accept="image/*" class="w-full text-sm" />
        <input id="imageScale" type="number" value="100" min="10" class="w-24 border rounded px-2 py-1" title="%" />
      </div>
      <button id="addImageBtn" class="px-3 py-2 rounded bg-slate-700 text-white hover:bg-slate-800">画像配置</button>
      <p class="text-xs text-gray-500">選択中スタンプはドラッグ移動、Deleteで削除できます。</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow p-4 overflow-auto">
    <div id="stage" class="relative border border-dashed border-gray-400 mx-auto bg-white" style="width:1200px;height:1700px;">
      <img id="backgroundLayer" class="absolute inset-0 w-full h-full object-contain pointer-events-none select-none" alt="背景" />
      <div id="overlayLayer" class="absolute inset-0"></div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='css/powerstamp.css') }}">
<script src="{{ url_for('static', filename='js/powerstamp.js') }}" defer></script>
{% endblock %}
