{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-4">
  <h1 class="text-2xl font-bold">🖋️ PowerSTAMP</h1>
  <p class="text-sm text-gray-600">
    スキャン画像/PDFを背景として読み込み、その上に文字・図形・画像を重ねます。印刷時は背景を除外し、追加したスタンプのみを出力します。
  </p>

  <div class="bg-white rounded-xl shadow p-4 grid lg:grid-cols-4 gap-4">
    <div class="lg:col-span-2">
      <label class="block text-sm font-medium mb-1">背景ファイル（JPG/PNG/PDF）</label>
      <input id="backgroundInput" type="file" accept="image/*,.pdf,application/pdf" class="w-full text-sm" />
      <p class="text-xs text-gray-500 mt-2">PDFは1ページ目を背景表示します。</p>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">キャンバスサイズ(px)</label>
      <div class="flex gap-2">
        <input id="canvasWidth" type="number" value="1200" min="100" class="w-full border rounded px-2 py-1" />
        <input id="canvasHeight" type="number" value="1700" min="100" class="w-full border rounded px-2 py-1" />
      </div>
      <button id="resizeCanvasBtn" class="mt-2 px-3 py-1 rounded bg-gray-700 text-white hover:bg-gray-800">適用</button>
    </div>

    <div class="text-sm bg-gray-50 rounded border p-3 space-y-2">
      <p class="font-semibold mb-1">サイズ推定</p>
      <p id="detectedSize" class="text-gray-700">未読込</p>
      <p id="detectedFileType" class="text-xs text-gray-600">ファイルタイプ: 未判定</p>
      <div class="pt-1 border-t border-gray-200">
        <p class="text-xs font-medium text-gray-700 mb-1">透過PNG出力サイズ</p>
        <label class="flex items-center gap-2 text-xs">
          <input type="radio" name="exportSizeMode" value="source" checked>
          アップロード元サイズ（推奨）
        </label>
        <label class="flex items-center gap-2 text-xs mt-1">
          <input type="radio" name="exportSizeMode" value="canvas">
          ユーザー指定サイズ（キャンバス）
        </label>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow p-4 flex flex-wrap gap-2">
    <button id="printBtn" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">印刷（スタンプのみ）</button>
    <button id="exportBtn" class="px-4 py-2 rounded bg-green-600 text-white hover:bg-green-700">透過PNG保存</button>
    <button id="clearBtn" class="px-4 py-2 rounded bg-red-600 text-white hover:bg-red-700">全削除</button>
  </div>

  <div class="bg-white rounded-xl shadow p-4 grid lg:grid-cols-4 gap-4">
    <div class="space-y-3">
      <h2 class="font-semibold">テキスト追加</h2>
      <input id="textContent" type="text" value="入力文字" class="w-full border rounded px-2 py-1" />
      <div class="flex gap-2">
        <input id="textSize" type="number" value="32" min="8" class="w-full border rounded px-2 py-1" />
        <input id="textColor" type="color" value="#1f2937" class="w-16 h-10 border rounded" />
      </div>
      <button id="addTextBtn" class="w-full px-3 py-2 rounded bg-slate-700 text-white hover:bg-slate-800">テキスト配置</button>
    </div>

    <div class="space-y-3">
      <h2 class="font-semibold">図形追加</h2>
      <div class="flex gap-2">
        <select id="shapeType" class="w-full border rounded px-2 py-1">
          <option value="rect">四角形</option>
          <option value="ellipse">楕円</option>
        </select>
        <input id="shapeStroke" type="color" value="#2563eb" class="w-16 h-10 border rounded" />
        <input id="shapeFill" type="color" value="#93c5fd" class="w-16 h-10 border rounded" />
      </div>
      <div class="flex gap-2">
        <input id="shapeWidth" type="number" value="180" min="10" class="w-full border rounded px-2 py-1" />
        <input id="shapeHeight" type="number" value="80" min="10" class="w-full border rounded px-2 py-1" />
      </div>
      <button id="addShapeBtn" class="w-full px-3 py-2 rounded bg-slate-700 text-white hover:bg-slate-800">図形配置</button>
    </div>

    <div class="space-y-3 lg:col-span-2">
      <h2 class="font-semibold">画像スタンプ追加</h2>
      <div class="flex gap-2">
        <input id="stampImageInput" type="file" accept="image/*" class="w-full text-sm" />
        <input id="imageScale" type="number" value="100" min="10" class="w-24 border rounded px-2 py-1" title="%" />
      </div>
      <button id="addImageBtn" class="px-3 py-2 rounded bg-slate-700 text-white hover:bg-slate-800">画像配置</button>
      <p class="text-xs text-gray-500">選択中スタンプはドラッグ移動、Deleteで削除できます。</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow p-4 overflow-auto">
    <div id="stage" class="relative border border-dashed border-gray-400 mx-auto bg-white" style="width:1200px;height:1700px;">
      <img id="backgroundLayer" class="absolute inset-0 w-full h-full object-contain pointer-events-none select-none" alt="背景" />
      <div id="overlayLayer" class="absolute inset-0"></div>
    </div>
  </div>
</div>

<style>
  .stamp-item { position: absolute; cursor: move; user-select: none; }
  .stamp-item.selected { outline: 2px dashed #ef4444; outline-offset: 2px; }
  @media print {
    body * { visibility: hidden !important; }
    #stage, #stage * { visibility: visible !important; }
    #stage { position: absolute; left: 0; top: 0; border: none !important; }
    #backgroundLayer { display: none !important; }
  }
</style>

<script>
  const stage = document.getElementById('stage');
  const overlayLayer = document.getElementById('overlayLayer');
  const backgroundLayer = document.getElementById('backgroundLayer');
  const detectedSize = document.getElementById('detectedSize');

  const PAPER_MM = [
    { name: 'A3', w: 297, h: 420 },
    { name: 'A4', w: 210, h: 297 },
    { name: 'B4', w: 257, h: 364 },
    { name: 'B5', w: 182, h: 257 },
  ];

  const detectedFileType = document.getElementById('detectedFileType');

  let selected = null;
  let dragState = null;
  let pdfjsLibPromise = null;
  let sourceSize = { width: stage.clientWidth, height: stage.clientHeight, unit: 'px' };
  let sourceType = '未判定';

  function getPdfJs() {
    if (!pdfjsLibPromise) {
      pdfjsLibPromise = import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs');
    }
    return pdfjsLibPromise;
  }

  function setCanvasSize(width, height) {
    const safeW = Math.max(100, Math.round(width));
    const safeH = Math.max(100, Math.round(height));
    document.getElementById('canvasWidth').value = safeW;
    document.getElementById('canvasHeight').value = safeH;
    stage.style.width = `${safeW}px`;
    stage.style.height = `${safeH}px`;
  }

  function closestPaperSizeByRatio(width, height) {
    const ratio = Math.max(width, height) / Math.min(width, height);
    let best = null;
    for (const paper of PAPER_MM) {
      const pRatio = Math.max(paper.w, paper.h) / Math.min(paper.w, paper.h);
      const diff = Math.abs(ratio - pRatio);
      if (!best || diff < best.diff) best = { paper, diff };
    }
    return best;
  }

  function closestPaperSizeByMm(widthMm, heightMm) {
    const longSide = Math.max(widthMm, heightMm);
    const shortSide = Math.min(widthMm, heightMm);
    let best = null;
    for (const paper of PAPER_MM) {
      const pLong = Math.max(paper.w, paper.h);
      const pShort = Math.min(paper.w, paper.h);
      const diff = Math.abs(longSide - pLong) + Math.abs(shortSide - pShort);
      if (!best || diff < best.diff) best = { paper, diff };
    }
    return best;
  }

  function detectFileTypeFromSize({ widthPx, heightPx, widthMm = null, heightMm = null, sourceKind }) {
    if (widthMm && heightMm) {
      const best = closestPaperSizeByMm(widthMm, heightMm);
      if (best && best.diff < 16) {
        return `${sourceKind} / ${best.paper.name} 推定（実寸ベース）`;
      }
    }

    const bestByRatio = closestPaperSizeByRatio(widthPx, heightPx);
    if (bestByRatio) {
      const pct = ((bestByRatio.diff / (Math.max(widthPx, heightPx) / Math.min(widthPx, heightPx))) * 100).toFixed(2);
      return `${sourceKind} / ${bestByRatio.paper.name} 近似（比率差 ${pct}%）`;
    }

    return sourceKind;
  }

  function updateDetectedInfo(sizeText, typeText) {
    detectedSize.textContent = sizeText;
    detectedFileType.textContent = `ファイルタイプ: ${typeText}`;
  }

  function selectItem(item) {
    document.querySelectorAll('.stamp-item').forEach((el) => el.classList.remove('selected'));
    selected = item;
    if (item) item.classList.add('selected');
  }

  function makeDraggable(item) {
    item.classList.add('stamp-item');
    item.style.left = '80px';
    item.style.top = '80px';

    item.addEventListener('mousedown', (event) => {
      selectItem(item);
      const rect = item.getBoundingClientRect();
      dragState = { item, dx: event.clientX - rect.left, dy: event.clientY - rect.top };
    });
  }

  document.addEventListener('mousemove', (event) => {
    if (!dragState) return;
    const stageRect = stage.getBoundingClientRect();
    const itemRect = dragState.item.getBoundingClientRect();
    const maxX = Math.max(0, stageRect.width - itemRect.width);
    const maxY = Math.max(0, stageRect.height - itemRect.height);
    const x = event.clientX - stageRect.left - dragState.dx;
    const y = event.clientY - stageRect.top - dragState.dy;
    dragState.item.style.left = `${Math.min(maxX, Math.max(0, x))}px`;
    dragState.item.style.top = `${Math.min(maxY, Math.max(0, y))}px`;
  });

  document.addEventListener('mouseup', () => { dragState = null; });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Delete' && selected) {
      selected.remove();
      selected = null;
    }
  });

  document.getElementById('backgroundInput').addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
      try {
        const data = await file.arrayBuffer();
        const pdfjsLib = await getPdfJs();
        const loadingTask = pdfjsLib.getDocument({ data });
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(1);

        const sourceViewport = page.getViewport({ scale: 1 });
        const renderViewport = page.getViewport({ scale: 2 });
        const widthPt = sourceViewport.width;
        const heightPt = sourceViewport.height;
        const widthMm = widthPt * 25.4 / 72;
        const heightMm = heightPt * 25.4 / 72;

        sourceSize = { width: widthPt, height: heightPt, unit: 'pt' };
        sourceType = detectFileTypeFromSize({
          widthPx: widthPt,
          heightPx: heightPt,
          widthMm,
          heightMm,
          sourceKind: 'PDF'
        });

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = renderViewport.width;
        canvas.height = renderViewport.height;

        await page.render({ canvasContext: ctx, viewport: renderViewport }).promise;
        backgroundLayer.src = canvas.toDataURL('image/png');

        setCanvasSize(widthPt, heightPt);
        updateDetectedInfo(
          `PDF 1ページ目: ${Math.round(widthPt)}×${Math.round(heightPt)}pt（約 ${widthMm.toFixed(1)}×${heightMm.toFixed(1)}mm）`,
          sourceType
        );
      } catch (error) {
        updateDetectedInfo(`PDF読込失敗: ${error.message}`, '判定失敗');
      }
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        backgroundLayer.src = e.target.result;
        sourceSize = { width: img.naturalWidth, height: img.naturalHeight, unit: 'px' };
        sourceType = detectFileTypeFromSize({
          widthPx: img.naturalWidth,
          heightPx: img.naturalHeight,
          sourceKind: '画像'
        });
        setCanvasSize(img.naturalWidth, img.naturalHeight);
        updateDetectedInfo(`画像: ${img.naturalWidth}×${img.naturalHeight}px`, sourceType);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('resizeCanvasBtn').addEventListener('click', () => {
    const width = Number(document.getElementById('canvasWidth').value);
    const height = Number(document.getElementById('canvasHeight').value);
    if (width >= 100 && height >= 100) setCanvasSize(width, height);
  });

  document.getElementById('addTextBtn').addEventListener('click', () => {
    const div = document.createElement('div');
    div.textContent = document.getElementById('textContent').value || '入力文字';
    div.style.fontSize = `${Number(document.getElementById('textSize').value)}px`;
    div.style.color = document.getElementById('textColor').value;
    div.style.whiteSpace = 'pre';
    makeDraggable(div);
    overlayLayer.appendChild(div);
    selectItem(div);
  });

  document.getElementById('addShapeBtn').addEventListener('click', () => {
    const shape = document.createElement('div');
    shape.style.width = `${Number(document.getElementById('shapeWidth').value)}px`;
    shape.style.height = `${Number(document.getElementById('shapeHeight').value)}px`;
    shape.style.border = `2px solid ${document.getElementById('shapeStroke').value}`;
    shape.style.background = document.getElementById('shapeFill').value;
    if (document.getElementById('shapeType').value === 'ellipse') shape.style.borderRadius = '9999px';
    makeDraggable(shape);
    overlayLayer.appendChild(shape);
    selectItem(shape);
  });

  document.getElementById('addImageBtn').addEventListener('click', () => {
    const file = document.getElementById('stampImageInput').files[0];
    if (!file) return alert('画像スタンプを選択してください');

    const scale = Number(document.getElementById('imageScale').value) / 100;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = document.createElement('img');
      img.src = event.target.result;
      img.onload = () => {
        img.style.width = `${Math.max(20, img.naturalWidth * scale)}px`;
        img.style.height = `${Math.max(20, img.naturalHeight * scale)}px`;
      };
      makeDraggable(img);
      overlayLayer.appendChild(img);
      selectItem(img);
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    overlayLayer.innerHTML = '';
    selectItem(null);
  });

  document.getElementById('printBtn').addEventListener('click', () => window.print());

  async function drawOverlayToCanvas(ctx, outputWidth, outputHeight) {
    const stageWidth = stage.clientWidth;
    const stageHeight = stage.clientHeight;
    const scaleX = outputWidth / Math.max(1, stageWidth);
    const scaleY = outputHeight / Math.max(1, stageHeight);

    for (const node of Array.from(overlayLayer.children)) {
      const x = parseFloat(node.style.left || '0') * scaleX;
      const y = parseFloat(node.style.top || '0') * scaleY;
      if (node.tagName === 'IMG') {
        await new Promise((resolve) => {
          const image = new Image();
          image.onload = () => {
            const w = parseFloat(node.style.width || image.naturalWidth) * scaleX;
            const h = parseFloat(node.style.height || image.naturalHeight) * scaleY;
            ctx.drawImage(image, x, y, w, h);
            resolve();
          };
          image.src = node.src;
        });
      } else if (node.style.border) {
        const w = parseFloat(node.style.width || '0') * scaleX;
        const h = parseFloat(node.style.height || '0') * scaleY;
        if (node.style.borderRadius) {
          ctx.beginPath();
          ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
          ctx.fillStyle = node.style.background || 'transparent';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = node.style.borderColor || '#000';
          ctx.stroke();
        } else {
          ctx.fillStyle = node.style.background || 'transparent';
          ctx.fillRect(x, y, w, h);
          ctx.lineWidth = 2;
          ctx.strokeStyle = node.style.borderColor || '#000';
          ctx.strokeRect(x, y, w, h);
        }
      } else {
        const fontSize = parseFloat(node.style.fontSize || '24') * Math.min(scaleX, scaleY);
        ctx.fillStyle = node.style.color || '#111';
        ctx.font = `${Math.max(8, fontSize)}px sans-serif`;
        const lines = (node.textContent || '').split('\n');
        const lineHeight = Math.max(10, fontSize * 1.2);
        lines.forEach((line, idx) => {
          ctx.fillText(line, x, y + lineHeight * (idx + 1));
        });
      }
    }
  }

  document.getElementById('exportBtn').addEventListener('click', async () => {
    const mode = document.querySelector('input[name="exportSizeMode"]:checked')?.value || 'source';
    const canvas = document.createElement('canvas');

    const outWidth = mode === 'source' ? Math.round(sourceSize.width || stage.clientWidth) : stage.clientWidth;
    const outHeight = mode === 'source' ? Math.round(sourceSize.height || stage.clientHeight) : stage.clientHeight;

    canvas.width = Math.max(1, outWidth);
    canvas.height = Math.max(1, outHeight);
    const ctx = canvas.getContext('2d');

    await drawOverlayToCanvas(ctx, canvas.width, canvas.height);

    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = mode === 'source' ? 'powerstamp-overlay-source-size.png' : 'powerstamp-overlay-custom-size.png';
    link.click();
  });
</script>
{% endblock %}
