{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-3">
  <h1 class="text-xl font-bold">🧪 PowerSTAMP テストプレビュー（別タブ）</h1>
  <p class="text-sm text-gray-600">背景＋スタンプの見え方確認専用です（保存は元タブで実行）。</p>

  <div id="previewStageWrap" class="bg-white rounded-xl shadow p-4 overflow-auto">
    <div id="previewStage" class="relative border border-dashed border-gray-400 bg-white" style="width:1200px;height:1700px;">
      <img id="previewBackground" class="absolute inset-0 w-full h-full object-fill pointer-events-none" alt="背景" />
      <div id="previewOverlay" class="absolute inset-0"></div>
    </div>
  </div>
</div>

<style>
  .preview-item { position:absolute; user-select:none; }
</style>

<script>
(() => {
  const stateRaw = localStorage.getItem('powerstampPreviewState');
  if (!stateRaw) return;

  let state;
  try { state = JSON.parse(stateRaw); } catch (_) { return; }

  const stage = document.getElementById('previewStage');
  const bg = document.getElementById('previewBackground');
  const overlay = document.getElementById('previewOverlay');

  if (!stage || !bg || !overlay) return;

  const w = Math.max(100, Math.round(Number(state?.canvas?.width || 1200)));
  const h = Math.max(100, Math.round(Number(state?.canvas?.height || 1700)));
  stage.style.width = `${w}px`;
  stage.style.height = `${h}px`;

  if (state?.backgroundSrc) bg.src = state.backgroundSrc;

  (state?.stamps || []).forEach((data) => {
    let node = null;
    if (data.type === 'image') {
      node = document.createElement('img');
      node.src = data.src;
      if (data.width) node.style.width = `${data.width}px`;
      if (data.height) node.style.height = `${data.height}px`;
    } else if (data.type === 'shape') {
      node = document.createElement('div');
      if (data.width) node.style.width = `${data.width}px`;
      if (data.height) node.style.height = `${data.height}px`;
      if (data.border) node.style.border = data.border;
      if (data.borderColor) node.style.borderColor = data.borderColor;
      if (data.background) node.style.background = data.background;
      if (data.borderRadius) node.style.borderRadius = data.borderRadius;
    } else {
      node = document.createElement('div');
      node.textContent = data.text || '';
      node.style.fontSize = data.fontSize || '24px';
      node.style.color = data.color || '#111';
      node.style.whiteSpace = data.whiteSpace || 'pre';
    }

    node.classList.add('preview-item');
    node.style.left = `${Math.max(0, Number(data.left || 0))}px`;
    node.style.top = `${Math.max(0, Number(data.top || 0))}px`;
    overlay.appendChild(node);
  });
})();
</script>
{% endblock %}
