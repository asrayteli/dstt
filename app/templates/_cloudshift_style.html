<link rel="stylesheet" href="{{ url_for('static', filename='shiftersync/css/ss_common.css') }}">
<style>
  :root {
    --cloud-bg: #f2f8ff;
    --cloud-panel: rgba(255, 255, 255, 0.96);
    --cloud-panel-soft: #f6faff;
    --cloud-line: #cfe1f6;
    --cloud-line-strong: #a9caf0;
    --cloud-text: #18324c;
    --cloud-muted: #5d748f;
    --cloud-primary: #3b86d1;
    --cloud-primary-strong: #2f73bc;
    --cloud-primary-soft: #eef6ff;
    --cloud-danger: #bf5252;
    --cloud-danger-soft: #fff0f0;
    --cloud-shadow: 0 18px 40px rgba(47, 106, 173, 0.11);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body.cloud-public-page,
  .cloud-page {
    margin: 0;
    min-height: 100%;
    color: var(--cloud-text);
    font-family: "Yu Gothic UI", "Hiragino Sans", "Segoe UI", sans-serif;
  }

  body.cloud-public-page {
    min-height: 100vh;
    background:
      radial-gradient(circle at top left, rgba(168, 205, 247, 0.34), transparent 38%),
      linear-gradient(180deg, #f7fbff 0%, var(--cloud-bg) 100%);
  }

  .cloud-page {
    display: block;
  }

  .cloud-shell {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    display: grid;
    gap: 16px;
  }

  .cloud-public-shell {
    max-width: 1480px;
    margin: 0 auto;
    padding: 18px clamp(12px, 2vw, 24px) 28px;
  }

  .cloud-hero,
  .cloud-panel {
    min-width: 0;
    border: 1px solid var(--cloud-line);
    border-radius: 24px;
    background: var(--cloud-panel);
    box-shadow: var(--cloud-shadow);
  }

  .cloud-hero {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: flex-start;
    padding: 22px 24px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(243, 248, 255, 0.97)),
      var(--cloud-panel);
  }

  .cloud-hero-copy {
    min-width: 0;
  }

  .cloud-page-kicker {
    color: var(--cloud-primary);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .cloud-page-title {
    margin: 6px 0 8px;
    font-size: clamp(28px, 3vw, 36px);
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.02em;
  }

  .cloud-page-note,
  .cloud-panel-note {
    margin: 0;
    color: var(--cloud-muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .cloud-current-project,
  .cloud-note-chip {
    display: inline-flex;
    align-items: center;
    min-height: 42px;
    max-width: min(420px, 100%);
    border: 1px solid var(--cloud-line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.88);
    color: var(--cloud-muted);
    font-size: 12px;
    font-weight: 800;
    padding: 10px 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cloud-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .cloud-tab {
    appearance: none;
    border: 1px solid var(--cloud-line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.8);
    color: var(--cloud-text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    padding: 11px 16px;
    transition: border-color 0.18s ease, background-color 0.18s ease, color 0.18s ease;
  }

  .cloud-tab:hover {
    border-color: var(--cloud-line-strong);
    background: #ffffff;
  }

  .cloud-tab.is-active {
    border-color: var(--cloud-primary);
    background: linear-gradient(180deg, #4c97e0, var(--cloud-primary));
    color: #fff;
  }

  .cloud-panel {
    display: none;
    padding: 22px;
  }

  .cloud-panel.is-active,
  .cloud-panel-public {
    display: block;
  }

  .cloud-panel-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 18px;
  }

  .cloud-panel-head h2 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 800;
  }

  .cloud-panel-head p,
  .cloud-empty-state p {
    margin: 0;
    color: var(--cloud-muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .cloud-form {
    border: 1px solid var(--cloud-line);
    border-radius: 20px;
    background: linear-gradient(180deg, #fbfdff 0%, var(--cloud-panel-soft) 100%);
    padding: 18px;
  }

  .cloud-form-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }

  .cloud-field {
    display: grid;
    gap: 7px;
    min-width: 0;
  }

  .cloud-field-wide {
    grid-column: span 2;
  }

  .cloud-field-inline {
    grid-template-columns: 64px minmax(0, 1fr);
    align-items: center;
  }

  .cloud-field span {
    color: var(--cloud-muted);
    font-size: 12px;
    font-weight: 800;
  }

  .cloud-input {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--cloud-line);
    border-radius: 12px;
    background: #fff;
    color: var(--cloud-text);
    font-size: 14px;
    padding: 11px 13px;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
  }

  .cloud-input:focus {
    outline: none;
    border-color: var(--cloud-primary);
    box-shadow: 0 0 0 4px rgba(45, 111, 182, 0.12);
  }

  .cloud-actions,
  .cloud-inline-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .cloud-actions {
    margin-top: 16px;
  }

  .cloud-actions.compact {
    margin-top: 0;
  }

  .cloud-inline-actions {
    align-items: end;
  }

  .cloud-btn {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    line-height: 1;
    padding: 12px 15px;
    transition: transform 0.15s ease, background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }

  .cloud-btn:hover {
    transform: translateY(-1px);
  }

  .cloud-btn.primary {
    background: linear-gradient(180deg, #4c97e0, var(--cloud-primary));
    border-color: var(--cloud-primary);
    color: #fff;
  }

  .cloud-btn.primary:hover {
    background: linear-gradient(180deg, #3f8dd8, var(--cloud-primary-strong));
    border-color: var(--cloud-primary-strong);
  }

  .cloud-btn.secondary,
  .cloud-btn.ghost {
    background: #fff;
    border-color: var(--cloud-line);
    color: var(--cloud-text);
  }

  .cloud-btn.secondary:hover,
  .cloud-btn.ghost:hover {
    background: var(--cloud-primary-soft);
    border-color: var(--cloud-line-strong);
  }

  .cloud-btn.danger {
    background: var(--cloud-danger-soft);
    border-color: #f0c8c8;
    color: var(--cloud-danger);
  }

  .cloud-btn.danger:hover {
    background: #ffe5e5;
    border-color: #e8b0b0;
  }

  .cloud-project-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
  }

  .cloud-project-item {
    border: 1px solid var(--cloud-line);
    border-radius: 20px;
    background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
    cursor: pointer;
    padding: 16px;
    transition: transform 0.16s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .cloud-project-item:hover,
  .cloud-project-item.active {
    border-color: var(--cloud-primary);
    box-shadow: 0 16px 32px rgba(45, 111, 182, 0.12);
    transform: translateY(-1px);
  }

  .cloud-project-card-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }

  .cloud-project-card-head h3 {
    margin: 0 0 6px;
    font-size: 17px;
    font-weight: 800;
  }

  .cloud-project-card-head p,
  .cloud-project-meta {
    margin: 0;
    color: var(--cloud-muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .cloud-project-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
  }

  .cloud-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 0;
  }

  .cloud-badge {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--cloud-line);
    border-radius: 999px;
    background: var(--cloud-primary-soft);
    color: var(--cloud-primary);
    font-size: 11px;
    font-weight: 800;
    padding: 7px 10px;
  }

  .cloud-empty-state {
    border: 1px dashed var(--cloud-line-strong);
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(238, 246, 255, 0.9));
    padding: 34px 22px;
    text-align: center;
  }

  .cloud-empty-state h2,
  .cloud-empty-state h3 {
    margin: 0 0 10px;
    font-size: 22px;
    font-weight: 800;
  }

  .cloud-workspace.cloud-hidden,
  .cloud-hidden {
    display: none !important;
  }

  .cloud-editor-bar {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    margin-bottom: 12px;
  }

  .cloud-editor-bar-public {
    margin-bottom: 16px;
  }

  .cloud-editor-heading h2 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }

  .cloud-editor-heading p {
    margin: 0;
    color: var(--cloud-muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .cloud-editor-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: flex-end;
  }

  .cloud-editor-actions.public {
    justify-content: flex-start;
  }

  .cloud-title-field {
    min-width: min(360px, 100%);
  }

  .cloud-tool-dock {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin: 14px 0 18px;
  }

  .cloud-tool-dock-public {
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  }

  .cloud-fold {
    min-width: 0;
    border: 1px solid var(--cloud-line);
    border-radius: 18px;
    background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    overflow: hidden;
  }

  .cloud-fold[open] {
    border-color: var(--cloud-line-strong);
    box-shadow: 0 12px 28px rgba(45, 111, 182, 0.09);
  }

  .cloud-fold-summary {
    position: relative;
    list-style: none;
    cursor: pointer;
    color: var(--cloud-text);
    font-size: 14px;
    font-weight: 800;
    padding: 15px 44px 15px 16px;
  }

  .cloud-fold-summary::-webkit-details-marker {
    display: none;
  }

  .cloud-fold-summary::after {
    content: "+";
    position: absolute;
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    color: var(--cloud-primary);
    font-size: 20px;
    font-weight: 700;
  }

  .cloud-fold[open] .cloud-fold-summary {
    background: var(--cloud-primary-soft);
    color: var(--cloud-primary);
  }

  .cloud-fold[open] .cloud-fold-summary::after {
    content: "−";
  }

  .cloud-fold-content {
    display: grid;
    gap: 14px;
    padding: 16px;
    border-top: 1px solid var(--cloud-line);
  }

  .cloud-fold-danger .cloud-fold-summary::after,
  .cloud-fold-danger[open] .cloud-fold-summary {
    color: var(--cloud-danger);
  }

  .cloud-url-grid,
  .cloud-month-grid {
    display: grid;
    gap: 12px;
  }

  .cloud-history-list {
    display: grid;
    gap: 10px;
  }

  .cloud-history-item {
    border: 1px solid var(--cloud-line);
    border-radius: 16px;
    background: #fff;
    padding: 12px;
  }

  .cloud-history-item ul {
    margin: 8px 0 0;
    padding-left: 18px;
  }

  .cloud-calendar-stage {
    min-width: 0;
    overflow: auto;
    border: 1px solid var(--cloud-line);
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(238, 246, 255, 0.84));
    padding: 14px;
  }

  .cloud-editor-host {
    min-width: 0;
  }

  .cloud-editor-host .container {
    width: 100%;
    max-width: 980px;
    min-width: 0;
    margin: 0 auto;
    padding: 18px;
    border-radius: 20px;
  }

  .cloud-editor-host .weekday-header,
  .cloud-editor-host .calendar-grid {
    min-width: 0;
  }

  .cloud-flash {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 3000;
    display: none;
    min-width: 220px;
    max-width: 360px;
    border-radius: 14px;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    padding: 13px 15px;
    box-shadow: 0 18px 28px rgba(18, 48, 80, 0.18);
  }

  .cloud-flash.info {
    background: #4c80b9;
  }

  .cloud-flash.success {
    background: #2f73bc;
  }

  .cloud-flash.error {
    background: #bb5151;
  }

  @media (max-width: 1180px) {
    .cloud-tool-dock {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 960px) {
    .cloud-form-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .cloud-field-wide {
      grid-column: span 1;
    }

    .cloud-editor-bar,
    .cloud-hero,
    .cloud-panel-head {
      flex-direction: column;
      align-items: stretch;
    }

    .cloud-editor-actions {
      justify-content: flex-start;
    }
  }

  @media (max-width: 720px) {
    .cloud-public-shell {
      padding-inline: 10px;
    }

    .cloud-panel,
    .cloud-hero {
      padding: 18px;
      border-radius: 20px;
    }

    .cloud-form-grid,
    .cloud-tool-dock {
      grid-template-columns: 1fr;
    }

    .cloud-title-field {
      min-width: 0;
      width: 100%;
    }

    .cloud-editor-host .container {
      width: 100%;
      max-width: 100%;
      padding: 16px;
    }
  }

  body.cloud-public-page.cloud-device-mobile .cloud-public-shell {
    gap: 12px;
    padding: 12px 10px 22px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-hero,
  body.cloud-public-page.cloud-device-mobile .cloud-panel-public {
    border-radius: 20px;
    padding: 16px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-page-title {
    font-size: 28px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-bar {
    gap: 12px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-tool-dock-public {
    position: sticky;
    top: 10px;
    z-index: 12;
    grid-template-columns: 1fr;
    margin-bottom: 14px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-tool-dock-public .cloud-fold {
    border-radius: 16px;
    box-shadow: 0 10px 24px rgba(47, 106, 173, 0.1);
  }

  body.cloud-public-page.cloud-device-mobile .cloud-fold-summary {
    padding: 14px 42px 14px 14px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-calendar-stage {
    padding: 10px;
    border-radius: 20px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .container {
    width: 100%;
    padding: 12px;
    border-radius: 18px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .weekday-header {
    display: none;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .calendar-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .day-box.empty {
    display: none;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .day-box {
    min-height: auto;
    gap: 8px;
    padding: 12px;
    border-radius: 16px;
    background: linear-gradient(180deg, #ffffff 0%, #f6fbff 100%);
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .date-label {
    width: fit-content;
    min-width: 72px;
    padding: 7px 10px;
    border-radius: 999px;
    background: #eaf4ff;
    font-size: 13px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .entry-list-container {
    gap: 6px;
    overflow: visible;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .entry-item {
    padding: 10px 11px;
    border-radius: 12px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .entry-item-title {
    font-size: 13px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .entry-item-comment {
    font-size: 11px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .input-group {
    gap: 8px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .input-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .copy-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .day-tool-row {
    gap: 8px;
  }

  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .option-select-btn,
  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .detail-btn,
  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .copy-btn,
  body.cloud-public-page.cloud-device-mobile .cloud-editor-host .add-entry-btn {
    min-height: 38px;
  }
</style>
