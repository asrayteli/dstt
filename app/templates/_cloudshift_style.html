<link rel="stylesheet" href="{{ url_for('static', filename='shiftersync/css/ss_common.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dstt_loading.css') }}">
<style>
  :root {
    --cloud-bg: #f2f8ff;
    --cloud-panel: rgba(255, 255, 255, 0.96);
    --cloud-panel-soft: #f6faff;
    --cloud-line: #cfe1f6;
    --cloud-line-strong: #a9caf0;
    --cloud-text: #18324c;
    --cloud-muted: #5d748f;
    --cloud-primary: #3b86d1;
    --cloud-primary-strong: #2f73bc;
    --cloud-primary-soft: #eef6ff;
    --cloud-danger: #bf5252;
    --cloud-danger-soft: #fff0f0;
    --cloud-shadow: 0 18px 40px rgba(47, 106, 173, 0.11);
    /* 角丸スケール（散在していた 4〜24px の 11 種を 5 段＋ピルに整理）。 */
    --cloud-radius-chip: 8px;   /* バッジ・小チップ（旧 4/6/8px） */
    --cloud-radius-sm: 12px;    /* ボタン・入力・小カード（旧 10/12px） */
    --cloud-radius-md: 16px;    /* カード（旧 14/16px） */
    --cloud-radius-lg: 20px;    /* 大きめのセクション（旧 18/20px） */
    --cloud-radius-xl: 24px;    /* ヒーロー・モーダル・大パネル */
    --cloud-radius-pill: 999px; /* ピル（タブ・バッジ等） */
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body.cloud-public-page,
  .cloud-page {
    margin: 0;
    min-height: 100%;
    color: var(--cloud-text);
    font-family: "Yu Gothic UI", "Hiragino Sans", "Segoe UI", sans-serif;
  }

  body.cloud-public-page {
    min-height: 100vh;
    background:
      radial-gradient(circle at top left, rgba(168, 205, 247, 0.34), transparent 38%),
      linear-gradient(180deg, #f7fbff 0%, var(--cloud-bg) 100%);
  }

  .cloud-page {
    display: block;
  }

  .cloud-shell {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    display: grid;
    gap: 16px;
  }

  .cloud-public-shell {
    max-width: 1480px;
    margin: 0 auto;
    padding: 18px clamp(12px, 2vw, 24px) 28px;
  }

  .cloud-hero,
  .cloud-panel {
    min-width: 0;
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-xl);
    background: var(--cloud-panel);
    box-shadow: var(--cloud-shadow);
  }

  .cloud-hero {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: flex-start;
    padding: 22px 24px;
    /* 主画面の DSTT 統一ヒーロー（濃いグラデ＋白文字）と見た目を揃える。 */
    border-color: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    background: linear-gradient(135deg, #0c4a6e 0%, #0369a1 50%, #06b6d4 100%);
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
  }

  .cloud-hero-copy {
    min-width: 0;
  }

  .cloud-hero .cloud-page-kicker {
    color: rgba(255, 255, 255, 0.92);
  }

  .cloud-hero .cloud-page-title {
    color: #ffffff;
    font-weight: 700;
  }

  .cloud-hero .cloud-page-note {
    color: rgba(255, 255, 255, 0.88);
  }

  .cloud-hero .cloud-current-project {
    border-color: rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.14);
    color: #ffffff;
  }

  .cloud-page-kicker {
    color: var(--cloud-primary);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .cloud-page-title {
    margin: 6px 0 8px;
    font-size: clamp(28px, 3vw, 36px);
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.02em;
  }

  .cloud-page-note,
  .cloud-panel-note {
    margin: 0;
    color: var(--cloud-muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .cloud-current-project,
  .cloud-note-chip {
    display: inline-flex;
    align-items: center;
    min-height: 42px;
    max-width: min(420px, 100%);
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-pill);
    background: rgba(255, 255, 255, 0.88);
    color: var(--cloud-muted);
    font-size: 12px;
    font-weight: 800;
    padding: 10px 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cloud-note-chip.danger {
    border-color: rgba(191, 82, 82, 0.2);
    background: var(--cloud-danger-soft);
    color: var(--cloud-danger);
  }

  .cloud-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .cloud-tab {
    appearance: none;
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-pill);
    background: rgba(255, 255, 255, 0.8);
    color: var(--cloud-text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    padding: 11px 16px;
    transition: border-color 0.18s ease, background-color 0.18s ease, color 0.18s ease;
  }

  .cloud-tab:hover {
    border-color: var(--cloud-line-strong);
    background: #ffffff;
  }

  .cloud-tab.is-active {
    border-color: var(--cloud-primary);
    background: linear-gradient(180deg, #4c97e0, var(--cloud-primary));
    color: #fff;
  }

  .cloud-panel {
    display: none;
    padding: 22px;
  }

  .cloud-panel.is-active,
  .cloud-panel-public {
    display: block;
  }

  .cloud-panel-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 18px;
  }

  .cloud-panel-head h2 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 800;
  }

  .cloud-panel-head p,
  .cloud-empty-state p {
    margin: 0;
    color: var(--cloud-muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .cloud-form {
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-lg);
    background: linear-gradient(180deg, #fbfdff 0%, var(--cloud-panel-soft) 100%);
    padding: 18px;
  }

  .cloud-form-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }

  .cloud-field {
    display: grid;
    gap: 7px;
    min-width: 0;
  }

  .cloud-field-wide {
    grid-column: span 2;
  }

  .cloud-field-inline {
    grid-template-columns: 64px minmax(0, 1fr);
    align-items: center;
  }

  .cloud-field-stack {
    display: grid;
    gap: 8px;
  }

  .cloud-field-stack-inline {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 8px;
  }

  .cloud-field-stack-inline .cloud-input {
    flex: 1 1 260px;
  }

  .cloud-field span {
    color: var(--cloud-muted);
    font-size: 12px;
    font-weight: 800;
  }

  .cloud-input {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-sm);
    background: #fff;
    color: var(--cloud-text);
    font-size: 14px;
    padding: 11px 13px;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
  }

  .cloud-input:focus {
    outline: none;
    border-color: var(--cloud-primary);
    box-shadow: 0 0 0 4px rgba(45, 111, 182, 0.12);
  }

  .cloud-actions,
  .cloud-inline-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .cloud-actions {
    margin-top: 16px;
  }

  .cloud-actions.compact {
    margin-top: 0;
  }

  .cloud-inline-actions {
    align-items: stretch;
  }

  .cloud-action-grid {
    display: grid;
    gap: 10px;
  }

  .cloud-action-group {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 10px;
  }

  .cloud-action-group .cloud-btn {
    width: 100%;
  }

  .cloud-btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid transparent;
    border-radius: var(--cloud-radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    min-height: 42px;
    padding: 12px 15px;
    transition: transform 0.15s ease, background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }

  .cloud-btn:hover {
    transform: translateY(-1px);
  }

  .cloud-btn.primary {
    background: linear-gradient(180deg, #4c97e0, var(--cloud-primary));
    border-color: var(--cloud-primary);
    color: #fff;
  }

  .cloud-btn.primary:hover {
    background: linear-gradient(180deg, #3f8dd8, var(--cloud-primary-strong));
    border-color: var(--cloud-primary-strong);
  }

  .cloud-btn.secondary,
  .cloud-btn.ghost {
    background: #fff;
    border-color: var(--cloud-line);
    color: var(--cloud-text);
  }

  .cloud-btn.secondary:hover,
  .cloud-btn.ghost:hover {
    background: var(--cloud-primary-soft);
    border-color: var(--cloud-line-strong);
  }

  .cloud-btn.danger {
    background: var(--cloud-danger-soft);
    border-color: #f0c8c8;
    color: var(--cloud-danger);
  }

  .cloud-btn.danger:hover {
    background: #ffe5e5;
    border-color: #e8b0b0;
  }

  .cloud-project-list {
    display: grid;
    gap: 18px;
  }

  .cloud-project-group {
    display: grid;
    gap: 10px;
  }

  .cloud-project-group-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--cloud-muted);
    font-size: 12px;
    font-weight: 800;
  }

  .cloud-project-group-head h3 {
    margin: 0;
    color: var(--cloud-text);
    font-size: 16px;
  }

  .cloud-project-group-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
    gap: 14px;
  }

  .cloud-check-project-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
    gap: 12px;
    margin-top: 16px;
  }

  .cloud-project-item {
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-lg);
    background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
    cursor: pointer;
    padding: 16px;
    transition: transform 0.16s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .cloud-project-item:hover,
  .cloud-project-item.active {
    border-color: var(--cloud-primary);
    box-shadow: 0 16px 32px rgba(45, 111, 182, 0.12);
    transform: translateY(-1px);
  }

  .cloud-project-item.is-shared {
    border-color: #d8c9ff;
    background: linear-gradient(180deg, #ffffff 0%, #f8f5ff 100%);
  }

  .cloud-project-item.is-master {
    border-color: #c7b7ff;
    background: linear-gradient(180deg, #ffffff 0%, #f5f0ff 100%);
  }

  .cloud-check-project-item {
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-lg);
    background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    padding: 14px;
  }

  .cloud-check-project-item.is-shared {
    border-color: #d8c9ff;
    background: linear-gradient(180deg, #ffffff 0%, #f8f5ff 100%);
  }

  .cloud-check-project-item.is-selected {
    border-color: var(--cloud-primary);
    box-shadow: 0 14px 28px rgba(45, 111, 182, 0.1);
  }

  .cloud-check-project-label {
    display: grid;
    gap: 10px;
    cursor: pointer;
  }

  .cloud-check-project-head {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .cloud-check-project-head input {
    margin-top: 2px;
  }

  .cloud-check-project-title {
    margin: 0;
    font-size: 15px;
    font-weight: 800;
  }

  .cloud-check-project-meta {
    margin: 4px 0 0;
    color: var(--cloud-muted);
    font-size: 12px;
    line-height: 1.6;
  }

  .cloud-project-card-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }

  .cloud-project-card-head h3 {
    margin: 0 0 6px;
    font-size: 17px;
    font-weight: 800;
  }

  .cloud-project-card-head p,
  .cloud-project-meta {
    margin: 0;
    color: var(--cloud-muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .cloud-project-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
  }

  .cloud-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 0;
  }

  .cloud-badge {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-pill);
    background: var(--cloud-primary-soft);
    color: var(--cloud-primary);
    font-size: 11px;
    font-weight: 800;
    padding: 7px 10px;
  }

  .cloud-badge.shared,
  .cloud-badge.shared-owner {
    background: #f1e8ff;
    border-color: #d8c9ff;
    color: #6b21a8;
  }

  .cloud-badge.duplicate-owner {
    background: #fef2f2;
    border-color: #fecaca;
    color: #b91c1c;
  }

  .cloud-project-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }

  .cloud-btn.small {
    padding: 6px 12px;
    font-size: 12px;
  }

  .cloud-badge-master {
    background: #f1e8ff;
    border-color: #d8c9ff;
    color: #6b21a8;
  }

  .cloud-share-form {
    display: grid;
    gap: 16px;
  }

  .cloud-share-option {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px;
    align-items: flex-start;
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-md);
    padding: 14px;
    background: #fff;
  }

  .cloud-share-option strong,
  .cloud-share-current h4 {
    display: block;
    margin: 0 0 4px;
    font-size: 14px;
  }

  .cloud-share-option small {
    color: var(--cloud-muted);
    line-height: 1.5;
  }

  .cloud-share-textarea {
    min-height: 96px;
    resize: vertical;
  }

  .cloud-empty-state.compact {
    padding: 16px;
    text-align: left;
  }

  .cloud-empty-state {
    border: 1px dashed var(--cloud-line-strong);
    border-radius: var(--cloud-radius-lg);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(238, 246, 255, 0.9));
    padding: 34px 22px;
    text-align: center;
  }

  .cloud-empty-state.warning {
    margin-bottom: 18px;
    border-style: solid;
    border-color: #f59e0b;
    background: #fffbeb;
  }

  .cloud-empty-state h2,
  .cloud-empty-state h3 {
    margin: 0 0 10px;
    font-size: 22px;
    font-weight: 800;
  }

  .cloud-workspace.cloud-hidden,
  .cloud-hidden {
    display: none !important;
  }

  .cloud-editor-bar {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    margin-bottom: 12px;
  }

  .cloud-editor-bar-public {
    margin-bottom: 16px;
  }

  .cloud-editor-heading h2 {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }

  .cloud-editor-title-month {
    color: var(--cloud-ink);
  }

  .cloud-unsaved-indicator {
    border-radius: var(--cloud-radius-pill);
    background: #fee2e2;
    color: #b91c1c;
    font-size: 12px;
    font-weight: 900;
    line-height: 1;
    padding: 5px 9px;
  }

  .cloud-editor-heading p {
    margin: 0;
    color: var(--cloud-muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .cloud-editor-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: flex-end;
  }

  .cloud-editor-actions.public {
    justify-content: flex-start;
  }

  .cloud-editor-actions > .cloud-btn,
  .cloud-editor-actions > .cloud-inline-actions {
    flex-shrink: 0;
  }

  .cloud-draft-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: flex-end;
  }

  .cloud-mode-toggle {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--cloud-line-strong);
    border-radius: var(--cloud-radius-chip);
    background: #fff;
  }

  .cloud-mode-btn {
    border: 0;
    background: transparent;
    color: var(--cloud-muted);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    min-height: 38px;
    padding: 0 14px;
  }

  .cloud-mode-btn + .cloud-mode-btn {
    border-left: 1px solid var(--cloud-line);
  }

  .cloud-mode-btn.is-active {
    background: var(--cloud-primary);
    color: #fff;
  }

  .cloud-workspace.is-draft-mode .cloud-calendar-stage {
    border-color: #fca5a5;
    background: #fff7f7;
  }

  .cloud-workspace.is-draft-mode .entry-item.is-cloud-draft-added {
    border-color: #f87171;
    background: #fff1f2;
    box-shadow: inset 3px 0 0 #ef4444;
  }

  .cloud-workspace.is-draft-mode .entry-item.is-cloud-draft-added .entry-item-title::before {
    content: "仮 ";
    color: #dc2626;
    font-weight: 900;
  }

  .cloud-workspace.is-draft-mode .day-box.has-draft-deletion {
    border-color: #ef4444;
    background: #fff7f7;
    box-shadow: inset 0 0 0 2px rgba(239, 68, 68, 0.22);
  }

  .cloud-workspace.is-draft-mode .day-box.has-draft-deletion .date-label::after {
    content: "削除あり";
    display: inline-block;
    margin-left: 6px;
    border-radius: var(--cloud-radius-pill);
    background: #fee2e2;
    color: #b91c1c;
    font-size: 10px;
    font-weight: 900;
    padding: 2px 6px;
    vertical-align: middle;
  }

  .cloud-draft-badge {
    border-color: #fecaca;
    background: #fff1f2;
    color: #b91c1c;
  }

  .cloud-notify-host {
    position: relative;
  }

  .cloud-notify-badge {
    position: absolute;
    top: -7px;
    right: -7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border: 2px solid #fff;
    border-radius: var(--cloud-radius-pill);
    background: #ef4444;
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    line-height: 1;
    box-shadow: 0 8px 16px rgba(185, 28, 28, 0.24);
    pointer-events: none;
  }

  .cloud-settings-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .cloud-settings-tab {
    position: relative;
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-pill);
    background: rgba(255, 255, 255, 0.8);
    color: var(--cloud-muted);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    min-height: 38px;
    padding: 0 16px;
    transition: border-color 0.18s ease, background-color 0.18s ease, color 0.18s ease;
  }

  .cloud-settings-tab:hover {
    border-color: var(--cloud-line-strong);
    background: #ffffff;
  }

  .cloud-settings-tab.is-active {
    border-color: var(--cloud-primary);
    background: linear-gradient(180deg, #4c97e0, var(--cloud-primary));
    color: #fff;
  }

  .cloud-settings-panel {
    display: grid;
    gap: 14px;
  }

  .cloud-settings-card,
  .cloud-request-card {
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-sm);
    background: #fff;
    padding: 14px;
  }

  .cloud-request-card {
    display: grid;
    gap: 10px;
  }

  .cloud-request-card.is-approved {
    border-color: #bbf7d0;
    background: #f0fdf4;
  }

  .cloud-request-card.is-rejected {
    border-color: #fecaca;
    background: #fff7f7;
  }

  .cloud-request-card.is-planned {
    border-color: #bfdbfe;
    background: #eff6ff;
  }

  .cloud-editor-actions > .cloud-field-note,
  .cloud-editor-actions > .cloud-input-panel {
    flex: 1 1 100%;
    min-width: min(360px, 100%);
  }

  .cloud-title-field {
    min-width: min(360px, 100%);
  }

  .cloud-input-panel {
    border: 1px solid var(--cloud-line);
    border-radius: var(--cloud-radius-sm);
    background: #fff;
    padding: 8px;
    max-height: 220px;
    overflow: auto;
  }

  .cloud-input-panel.wide {
    min-width: min(360px, 100%);
  }

  .cloud-master-picker {
    display: grid;
    grid-template-columns: minmax(160px, 220px) minmax(220px, 1fr);
    gap: 10px;
    min-width: 0;
  }

  .cloud-master-picker .cloud-input-panel,
  .cloud-master-selected {
    grid-column: 1 / -1;
  }

  .cloud-master-selected {
    display: flex;
    flex-wrap: wrap;
