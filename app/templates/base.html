<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSTT - DaishintoTools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/flowbite@2.2.1/dist/flowbite.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

  <div class="flex min-h-screen">
    <!-- サイドバーなど固定部分 -->
    <aside id="app-sidebar" class="w-64 bg-white shadow-lg transition-all duration-300 ease-in-out flex-shrink-0">
      <div class="p-4">
        <a href="/" class="block">
          <img src="{{ url_for('static', filename='img/head.png') }}" alt="DSTT Logo">
        </a>
      </div>
      <nav class="px-4">
        <ul>
          <li class="my-2">
            <a href="/" class="block px-4 py-2 rounded hover:bg-blue-100">🏠 ダッシュボード</a>
          </li>
          <li class="my-2">
            <a href="/tools/datecalc" class="block px-4 py-2 rounded hover:bg-blue-100">📆 日時計算</a>
          </li>
          <li class="my-2">
            <a href="/tools/calc" class="block px-4 py-2 rounded hover:bg-blue-100">🧮 電卓</a>
          </li>
          <li class="my-2">
            <a href="/tools/rename" class="block px-4 py-2 rounded hover:bg-blue-100">🔄 ファイル名一括変換</a>
          </li>
          <li class="my-2">
            <a href="/tools/compress" class="block px-4 py-2 rounded hover:bg-blue-100">📦 圧縮ファイル生成</a>
          </li>
          <li class="my-2">
            <a href="/tools/csvtool" class="block px-4 py-2 rounded hover:bg-blue-100">📊 CSV整形・検証ツール</a>
          </li>
          <li class="my-2">
            <a href="/tools/password_tool" class="block px-4 py-2 rounded hover:bg-blue-100">🔐 パスワード生成管理ツール</a>
          </li>
          <li class="my-2">
            <a href="/tools/workday" class="block px-4 py-2 rounded hover:bg-blue-100">📅 営業日計算ツール</a>
          </li>
          <li class="my-2">
            <a href="/tools/pdf_power" class="block px-4 py-2 rounded hover:bg-blue-100">📚 PDF Power</a>
          </li>
          <li class="my-2">
            <a href="/tools/share" class="block px-4 py-2 rounded hover:bg-blue-100">📪️ FILE POST</a>
          </li>
          <li class="my-2">
            <a href="/tools/car_inspe" class="block px-4 py-2 rounded hover:bg-blue-100">📄 車検証ツール</a>
          </li>
          <li class="my-2">
            <a href="/tools/shiftersync" class="block px-4 py-2 rounded hover:bg-blue-100">👥 ShifterSync</a>
          </li>
          <li class="my-2">
            <a href="/tools/leave_mgr" class="block px-4 py-2 rounded hover:bg-blue-100">⛵ 有休共有ツール</a>
          </li>
          <li class="my-2">
            <a href="/tools/monthly_generator" class="block px-4 py-2 rounded hover:bg-blue-100">📝 月次ジェネレーター</a>
          </li>
          <li class="my-2">
            <a href="/tools/subject_analysis_tool" class="block px-4 py-2 rounded hover:bg-blue-100">⚖️ SAT　科目別分析ツール</a>
          </li>
          <li class="my-2">
            <a href="/tools/pluslist" class="block px-4 py-2 rounded hover:bg-blue-100">📛　社員名簿PLUS</a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- メインコンテンツ -->
    <main id="app-main-content" class="flex-1 p-8">
      <!-- サイドバー切り替えボタン -->
      <button id="sidebar-toggle" class="fixed top-4 z-50 p-2 bg-white rounded-lg shadow-lg hover:bg-gray-100 transition-all duration-200" title="サイドバーを切り替え" style="left: 16px;">
        <svg id="toggle-icon" class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    // サイドバーの表示状態を管理
    (function() {
      const sidebar = document.getElementById('app-sidebar');
      const toggleButton = document.getElementById('sidebar-toggle');

      // localStorageから前回の状態を読み込む
      const sidebarVisible = localStorage.getItem('sidebarVisible') !== 'false';

      // 初期状態を設定
      function setSidebarState(visible) {
        if (visible) {
          // サイドバーを表示
          sidebar.style.display = 'block';
        } else {
          // サイドバーを完全に隠す
          sidebar.style.display = 'none';
        }
        localStorage.setItem('sidebarVisible', visible);
      }

      // ページ読み込み時に前回の状態を適用
      setSidebarState(sidebarVisible);

      // トグルボタンのクリックイベント
      toggleButton.addEventListener('click', function() {
        const currentlyVisible = localStorage.getItem('sidebarVisible') !== 'false';
        setSidebarState(!currentlyVisible);
      });
    })();
  </script>

</body>
</html>
