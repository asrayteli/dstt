<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>To Bell</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='to_bell/to_bell.webmanifest') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="To Bell">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="{{ url_for('static', filename='to_bell/to_bell.css') }}">
</head>
<body class="tobell-pwa-mode" data-pwa-shell="1">
<main id="app-main-content">

<div class="tobell-shell">
  <header class="tobell-header">
    <div class="tobell-header-lead">
      <p class="tobell-kicker">Universal Task Management App</p>
      <h1>ToBell</h1>
    </div>
    <div class="tobell-header-actions">
      <span class="tobell-notify-status" id="tb-notify-status" data-tone="idle">通知: 未設定</span>
      <button type="button" class="tobell-btn" id="tb-reload" hidden>リロード</button>
      <button type="button" class="tobell-btn" id="tb-templates">テンプレート</button>
      <button type="button" class="tobell-btn" id="tb-enable-push-notify">通知を有効化</button>
      <button type="button" class="tobell-btn" id="tb-push-devices">通知先</button>
      <button type="button" class="tobell-btn" id="tb-read-all">通知を既読</button>
    </div>
  </header>

  <section class="tobell-quick">
    <form id="tb-quick-form" class="tobell-quick-form">
      <input name="title" id="tb-title" type="text" placeholder="タスク名だけで追加できます" autocomplete="off" required>
      <div class="tobell-quick-datetime">
        <label class="tobell-quick-field">
          <span class="tobell-quick-field-label">期日</span>
          <input name="due_date" type="date">
        </label>
        <label class="tobell-quick-field">
          <span class="tobell-quick-field-label">時間</span>
          <input name="due_time" type="time">
        </label>
      </div>
      <select name="assigned_to" aria-label="担当者">
        {% for user in users %}
        <option value="{{ user.username }}" {% if user.username == current_user_id %}selected{% endif %}>{{ user.name or user.username }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="tobell-btn tobell-btn-primary">追加</button>
    </form>
  </section>

  <div class="tobell-layout">
    <aside class="tobell-sidebar">
      <nav class="tobell-filters">
        <button class="tobell-filter is-active" data-filter="today">今日</button>
        <button class="tobell-filter" data-filter="inbox">受信箱</button>
        <button class="tobell-filter" data-filter="assigned">自分の担当</button>
        <button class="tobell-filter" data-filter="attention">要対応</button>
        <button class="tobell-filter" data-filter="overdue">期限切れ</button>
        <button class="tobell-filter" data-filter="done">完了</button>
      </nav>
      <div class="tobell-search">
        <input id="tb-search" type="search" placeholder="検索">
      </div>
      <div class="tobell-project-bar" id="tb-project-bar"></div>
    </aside>

    <div class="tobell-main">
      <div class="tobell-views tobell-views-pwa" id="tb-views" role="tablist" aria-label="表示切り替え">
        <button type="button" class="tobell-view-btn is-active" data-view="list">リスト</button>
        <button type="button" class="tobell-view-btn" data-view="kanban">カンバン</button>
        <button type="button" class="tobell-view-btn" data-view="calendar">カレンダー</button>
      </div>
      <div id="tb-summary" class="tobell-summary"></div>
      <div id="tb-task-list" class="tobell-task-list"></div>
    </div>

    <aside class="tobell-detail" id="tb-detail" aria-live="polite">
      <div class="tobell-empty">タスクを選ぶと詳細が開きます。</div>
    </aside>
  </div>
</div>

<template id="tb-detail-template">
  <button type="button" class="tobell-detail-back" id="tb-detail-back">← 一覧へ戻る</button>
  <form class="tobell-detail-form" id="tb-detail-form">
    <input type="hidden" name="id">
    <label>タスク名<input name="title" required></label>
    <label>メモ<textarea name="description" rows="4"></textarea></label>
    <div class="tobell-detail-grid">
      <label>状態
        <select name="status">
          <option value="todo">未着手</option>
          <option value="doing">進行中</option>
          <option value="blocked">保留</option>
          <option value="review">確認待ち</option>
          <option value="returned">差戻し</option>
          <option value="done">完了</option>
        </select>
      </label>
      <label>優先度
        <select name="priority">
          <option value="normal">通常</option>
          <option value="low">低</option>
          <option value="high">高</option>
          <option value="urgent">緊急</option>
        </select>
      </label>
      <label>通知日時<input name="due_at" type="datetime-local"></label>
      <label>担当
        <select name="assigned_to">
          {% for user in users %}
          <option value="{{ user.username }}">{{ user.name or user.username }}</option>
          {% endfor %}
        </select>
      </label>
      <label>プロジェクト
        <select name="project_id" data-project-select>
          <option value="">なし</option>
        </select>
      </label>
    </div>
    <label>タグ<input name="tags" placeholder="カンマ区切り"></label>
    <div class="tobell-detail-actions">
      <button type="submit" class="tobell-btn tobell-btn-primary">保存</button>
      <button type="button" class="tobell-btn" data-action="complete">完了</button>
      <button type="button" class="tobell-btn" data-action="reopen">戻す</button>
      <button type="button" class="tobell-btn" data-action="template">テンプレ化</button>
      <button type="button" class="tobell-btn tobell-danger" data-action="archive">アーカイブ</button>
      <button type="button" class="tobell-btn tobell-danger" data-action="delete">削除</button>
    </div>
  </form>
  <section class="tobell-section">
    <div class="tobell-panel-title">添付</div>
    <form id="tb-attachment-form" class="tobell-inline-form">
      <input name="file" type="file">
      <button type="submit" class="tobell-btn">追加</button>
    </form>
    <div id="tb-attachments"></div>
  </section>
  <section class="tobell-section">
    <div class="tobell-panel-title">サブタスク</div>
    <form id="tb-subtask-form" class="tobell-inline-form">
      <input name="title" placeholder="サブタスクを追加">
      <button type="submit" class="tobell-btn">追加</button>
    </form>
    <div id="tb-subtasks"></div>
  </section>
  <section class="tobell-section">
    <div class="tobell-panel-title">コメント</div>
    <form id="tb-comment-form" class="tobell-comment-form">
      <textarea name="body" rows="3" placeholder="コメントを追加"></textarea>
      <button type="submit" class="tobell-btn">送信</button>
    </form>
    <div id="tb-comments"></div>
  </section>
</template>

<div id="tb-devices-modal" class="tobell-modal" hidden>
  <div class="tobell-modal-backdrop" data-devices-close></div>
  <div class="tobell-modal-card" role="dialog" aria-modal="true" aria-labelledby="tb-devices-title">
    <div class="tobell-modal-head">
      <h2 id="tb-devices-title">通知先</h2>
      <button type="button" class="tobell-btn" data-devices-close aria-label="閉じる">×</button>
    </div>
    <p class="tobell-share-note">現在のDSTTアカウントに登録されている通知先です。名称変更と無効化はPC版からのみ行えます。</p>
    <div id="tb-devices-list" class="tobell-devices-list"></div>
  </div>
</div>

<div id="tb-project-modal" class="tobell-modal" hidden>
  <div class="tobell-modal-backdrop" data-project-close></div>
  <div class="tobell-modal-card" role="dialog" aria-modal="true" aria-labelledby="tb-project-title">
    <div class="tobell-modal-head">
      <h2 id="tb-project-title">プロジェクト</h2>
      <button type="button" class="tobell-btn" data-project-close aria-label="閉じる">×</button>
    </div>
    <form id="tb-project-form" class="tobell-modal-form">
      <input type="hidden" name="id">
      <label>プロジェクト名<input name="name" required></label>
      <label>メモ<textarea name="description" rows="2"></textarea></label>
      <div class="tobell-detail-grid">
        <label>色<input name="color" type="color" value="#2563eb"></label>
        <label>公開範囲
          <select name="visibility_scope">
            <option value="office">所属内で共有</option>
            <option value="private">自分だけ</option>
          </select>
        </label>
      </div>
      <div class="tobell-share-actions">
        <button type="submit" class="tobell-btn tobell-btn-primary">保存</button>
        <button type="button" class="tobell-btn tobell-danger" id="tb-project-delete" hidden>削除</button>
      </div>
    </form>
  </div>
</div>

<div id="tb-template-modal" class="tobell-modal" hidden>
  <div class="tobell-modal-backdrop" data-template-close></div>
  <div class="tobell-modal-card" role="dialog" aria-modal="true" aria-labelledby="tb-template-title">
    <div class="tobell-modal-head">
      <h2 id="tb-template-title">テンプレート</h2>
      <button type="button" class="tobell-btn" data-template-close aria-label="閉じる">×</button>
    </div>
    <p class="tobell-share-note">よく使うタスクをテンプレート化して、ワンタップで作成できます。</p>
    <div id="tb-template-list" class="tobell-template-list"></div>
    <form id="tb-template-form" class="tobell-inline-form tobell-template-create">
      <input name="name" placeholder="空のテンプレートを作成">
      <button type="submit" class="tobell-btn">作成</button>
    </form>
  </div>
</div>

<div id="tb-viewer" class="tobell-viewer" hidden role="dialog" aria-modal="true" aria-labelledby="tb-viewer-title">
  <div class="tobell-viewer-head">
    <strong class="tobell-viewer-title" id="tb-viewer-title">プレビュー</strong>
    <div class="tobell-viewer-actions">
      <button type="button" class="tobell-btn tobell-viewer-zoom" data-viewer-zoom="-1" aria-label="縮小">−</button>
      <button type="button" class="tobell-btn tobell-viewer-zoom" data-viewer-zoom="0" id="tb-viewer-pct">100%</button>
      <button type="button" class="tobell-btn tobell-viewer-zoom" data-viewer-zoom="1" aria-label="拡大">＋</button>
      <a class="tobell-btn tobell-viewer-dl" id="tb-viewer-download" download>ダウンロード</a>
      <button type="button" class="tobell-btn tobell-viewer-close" data-viewer-close aria-label="閉じる">×</button>
    </div>
  </div>
  <div class="tobell-viewer-body" id="tb-viewer-body">
    <div class="tobell-viewer-stage" id="tb-viewer-stage"></div>
  </div>
</div>

<div id="tb-flash" class="tobell-flash info" role="status" aria-live="polite"></div>

<script src="{{ url_for('static', filename='to_bell/to_bell.js') }}"></script>
</main>
</body>
</html>
