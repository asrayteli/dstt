{% extends "manual.html" %}

{% block manual_extra %}
<section class="mt-6 rounded-lg border border-slate-200 bg-white p-5">
  <h2 class="text-lg font-bold text-slate-900">計算で見ているもの</h2>
  <ul class="mt-3 list-disc space-y-2 pl-5 text-sm text-slate-700">
    <li>時間制運賃は、走行時間に出庫前・帰庫後の点呼点検時間を加えて計算します。</li>
    <li>距離制運賃は、出庫から帰庫までの総走行距離を10km単位に切り上げて計算します。</li>
    <li>深夜早朝、交替運転者、特殊車両、仲介手数料は下限割れしないよう別々に表示します。</li>
    <li>監査エラーがある場合は、金額より先に行程や車種を直す必要があります。</li>
  </ul>
</section>
{% endblock %}
