{% extends "base.html" %}

{% block content %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Shiftersync - シフト編集</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='shiftersync/css/ss_common.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='shiftersync/js/ss_common.js') }}"></script>
</head>

<body>

<div style="min-height: 100vh; background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 50%, #e0e7ff 100%); display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="container animate-fade-in">

    <h2 style="text-align: center; margin-bottom: 10px;">
      Shifter-Sync
    </h2>
    <h2 style="text-align: center; font-size: 1.5rem; color: #64748b; margin-bottom: 30px;">
      シフト編集
    </h2>

    <form id="shiftUploadForm">
      <div class="file-upload-group">
        <label for="shiftFile" class="file-upload-label">シフトファイル (CSV)</label>
        <input type="file" name="shiftFile" id="shiftFile" class="file-upload-input" accept=".csv" required>
      </div>

      <div style="text-align: center; display: flex; gap: 12px; justify-content: center; margin-top: 20px;">
        <button type="button" id="uploadBtn" class="btn-primary">
          📤 ファイルアップロード
        </button>
        <button type="button" id="backBtn" onclick="history.back()" class="btn-secondary">
          ← 戻る
        </button>
      </div>
    </form>
  </div>
</div>

<div id="inputArea" style="display: none;"></div>

</body>
<script src="{{ url_for('static', filename='shiftersync/js/ss_upload.js') }}"></script>

</html>

{% endblock %}
