{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='shiftersync/css/ss_common.css') }}">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{{ url_for('static', filename='shiftersync/js/ss_common.js') }}"></script>
<script>
  window.SHIFTERSYNC_HOLIDAYS = {{ shiftersync_holidays|tojson }};
</script>

<main class="ss-page">
  <div class="container animate-fade-in">
    <div class="ss-stack">
      <header class="ss-header-block">
        <div class="ss-eyebrow">ShifterSync</div>
        <h1 class="ss-title">既存シフト編集</h1>
        <p class="ss-subtitle">
          ShifterSync の CSV を読み込み、カレンダー上で編集できます。コメント付きの新形式にも対応しています。
        </p>
      </header>

      <section class="ss-section">
        <div class="ss-section-head">
          <div>
            <h2>CSV 読み込み</h2>
            <p class="ss-section-note">
              旧形式の CSV も読み込めます。コメントがある場合は詳細ポップアップで確認できます。
            </p>
          </div>
          <div class="ss-actions">
            <button type="button" id="backBtn" class="btn-secondary" onclick="history.back()">戻る</button>
          </div>
        </div>

        <form id="shiftUploadForm" style="padding: 0; border: 0; background: transparent; box-shadow: none; margin: 0;">
          <div class="file-upload-group">
            <label for="shiftFile" class="file-upload-label">ShifterSync CSV</label>
            <input type="file" name="shiftFile" id="shiftFile" class="file-upload-input" accept=".csv" required>
          </div>
          <div class="ss-actions" style="margin-top: 18px;">
            <button type="button" id="uploadBtn" class="btn-primary">読み込む</button>
          </div>
        </form>
      </section>

      <div id="inputArea" style="display: none;"></div>
    </div>
  </div>
</main>

<script src="{{ url_for('static', filename='shiftersync/js/ss_upload.js') }}"></script>
{% endblock %}
