{% extends "base.html" %}

{% block content %}
<style>
  .dm-wrap { max-width: 1400px; margin: 0 auto; }
  .dm-panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; box-shadow: 0 10px 26px rgba(15, 23, 42, .06); }
  .dm-btn { border-radius: 8px; border: 1px solid #cbd5e1; padding: .5rem .8rem; font-size: .82rem; font-weight: 700; background: #fff; color: #334155; cursor: pointer; white-space: nowrap; }
  .dm-btn:hover { background: #f1f5f9; }
  .dm-btn-primary { background: #0369a1; border-color: #0369a1; color: #fff; }
  .dm-btn-primary:hover { background: #075985; }
  .dm-btn-danger { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
  .dm-btn:disabled { opacity: .5; cursor: not-allowed; }
  .dm-input, .dm-select { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: .55rem .65rem; font-size: .86rem; background: #fff; }
  .dm-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .dm-table th { position: sticky; top: 0; background: #f8fafc; color: #475569; font-weight: 800; z-index: 1; }
  .dm-table th, .dm-table td { border-bottom: 1px solid #e2e8f0; padding: .55rem .6rem; text-align: left; white-space: nowrap; vertical-align: top; }
  .dm-table tbody tr:hover { background: #f8fafc; }
  .dm-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: .14rem .5rem; font-size: .7rem; font-weight: 800; }
  .dm-active { background: #dcfce7; color: #166534; }
  .dm-expiring { background: #fef3c7; color: #92400e; }
  .dm-expired { background: #fee2e2; color: #991b1b; }
  .dm-incomplete { background: #e2e8f0; color: #475569; }
  .dm-missing { background: #f1f5f9; color: #94a3b8; }
  .dm-doc-cell { font-size: .76rem; line-height: 1.4; }
  .dm-doc-cell .dm-doc-exp { color: #334155; font-weight: 700; }
  .dm-modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(15, 23, 42, .5); padding: 1rem; }
  .dm-modal.open { display: flex; }
  .dm-modal-card { width: 100%; max-width: 720px; max-height: calc(100vh - 2rem); display: flex; flex-direction: column; background: #fff; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .dm-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.1rem; border-bottom: 1px solid #e2e8f0; }
  .dm-modal-body { padding: 1.1rem; overflow-y: auto; }
  .dm-modal-foot { display: flex; gap: .5rem; justify-content: flex-end; padding: 1rem 1.1rem; border-top: 1px solid #e2e8f0; }
  .dm-label { display: block; font-size: .76rem; font-weight: 700; color: #475569; margin-bottom: .25rem; }
  .dm-doc-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: .8rem; margin-bottom: .7rem; }
  .dm-doc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .55rem; }
  .dm-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .6rem; }
  .dm-emp-option { width: 100%; text-align: left; border: 1px solid #cfe1f6; border-radius: 10px; background: #fff; cursor: pointer; padding: .55rem .65rem; font-size: .82rem; margin-bottom: .4rem; }
  .dm-emp-option:hover { border-color: #7dd3fc; background: #f0f9ff; }
  .dm-emp-option[disabled] { opacity: .5; cursor: not-allowed; }
  .dm-msg { font-size: .85rem; }
  .dm-toggle { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; font-weight: 700; color: #334155; }
</style>

<div class="dm-wrap space-y-5">
  <section class="dstt-hero" style="background: linear-gradient(135deg, #075985 0%, #0f766e 60%, #15803d 100%);">
    <div class="dstt-hero-grid">
      <div class="dstt-hero-copy">
        <div class="dstt-hero-pill">DRIVER VEHICLE</div>
        <div>
          <h1 class="dstt-hero-title">運転士マイカー管理</h1>
          <p class="dstt-hero-subtitle">運転士（社員）のマイカーの車検証・自賠責・任意保険・運転免許証の期限と書類を管理。期限が近づくと登録メールへ自動通知します。</p>
        </div>
        <div class="dstt-hero-actions">
          <button id="dm-add" type="button" class="dstt-hero-btn dstt-hero-btn-light">運転士を追加</button>
          <button id="dm-refresh" type="button" class="dstt-hero-btn dstt-hero-btn-ghost">更新</button>
        </div>
      </div>
      <div class="dstt-hero-meta">
        <div class="dstt-hero-card">
          <div class="dstt-hero-card-label">MAIL</div>
          <div id="dm-mail-state" class="dstt-hero-card-value">確認中…</div>
          <div class="dstt-hero-card-note">期限通知の送信状態</div>
        </div>
      </div>
    </div>
  </section>

  <div class="grid gap-4 lg:grid-cols-[300px_minmax(0,1fr)]">
    <aside class="space-y-4">
      <div class="dm-panel p-4 space-y-3">
        <div class="text-sm font-bold text-slate-700">検索・絞り込み</div>
        <input id="dm-q" class="dm-input" placeholder="社員番号 / 氏名 / 所属 / ナンバー / メール">
        <select id="dm-status" class="dm-select">
          <option value="">すべての状態</option>
          <option value="expired">期限切れあり</option>
          <option value="expiring">期限間近あり</option>
          <option value="incomplete">未登録の書類あり</option>
          <option value="active">すべて有効</option>
        </select>
        <button id="dm-search" class="dm-btn dm-btn-primary w-full">検索</button>
      </div>

      <div class="dm-panel p-4 grid grid-cols-2 gap-3 text-sm">
        <div><div class="text-xs text-slate-500">運転士</div><div id="dm-s-drivers" class="text-xl font-bold text-slate-900">-</div></div>
        <div><div class="text-xs text-slate-500">期限切れ</div><div id="dm-s-expired" class="text-xl font-bold text-rose-600">-</div></div>
        <div><div class="text-xs text-slate-500">期限間近</div><div id="dm-s-expiring" class="text-xl font-bold text-amber-600">-</div></div>
        <div><div class="text-xs text-slate-500">書類不足</div><div id="dm-s-incomplete" class="text-xl font-bold text-slate-600">-</div></div>
      </div>

      <div id="dm-admin-box" class="dm-panel p-4 space-y-2 hidden">
        <div class="text-sm font-bold text-slate-700">メール送信テスト（管理者）</div>
        <input id="dm-test-to" class="dm-input" placeholder="送信先メールアドレス">
        <button id="dm-test-send" class="dm-btn w-full">テスト送信</button>
        <div id="dm-test-result" class="text-xs text-slate-500"></div>
      </div>
    </aside>

    <main class="dm-panel overflow-hidden">
      <div class="flex items-center justify-between gap-3 border-b border-slate-200 p-4">
        <div>
          <div class="text-base font-bold text-slate-900">運転士一覧</div>
          <div id="dm-count" class="text-xs text-slate-500">読み込み中…</div>
        </div>
      </div>
      <div id="dm-message" class="hidden border-b border-slate-200 px-4 py-2 dm-msg"></div>
      <div class="overflow-auto" style="max-height: 700px;">
        <table class="dm-table">
          <thead>
            <tr>
              <th>状態</th><th>社員番号</th><th>氏名</th><th>所属</th><th>車両</th>
              <th>車検証</th><th>自賠責</th><th>任意保険</th><th>免許証</th><th>通知</th><th></th>
            </tr>
          </thead>
          <tbody id="dm-body"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- 運転士追加（社員検索）モーダル -->
<div id="dm-emp-modal" class="dm-modal">
  <div class="dm-modal-card" style="max-width: 560px;">
    <div class="dm-modal-head">
      <div class="font-bold text-slate-900">運転士を追加（社員名簿PLUSから選択）</div>
      <button type="button" class="dm-btn" data-close="dm-emp-modal">閉じる</button>
    </div>
    <div class="dm-modal-body">
      <input id="dm-emp-q" class="dm-input mb-3" placeholder="社員番号 / 氏名 / カナで検索">
      <div id="dm-emp-list"></div>
    </div>
  </div>
</div>

<!-- 運転士編集モーダル -->
<div id="dm-edit-modal" class="dm-modal">
  <div class="dm-modal-card">
    <div class="dm-modal-head">
      <div>
        <div id="dm-edit-title" class="font-bold text-slate-900">運転士の編集</div>
        <div id="dm-edit-sub" class="text-xs text-slate-500"></div>
      </div>
      <button type="button" class="dm-btn" data-close="dm-edit-modal">閉じる</button>
    </div>
    <div class="dm-modal-body space-y-4">
      <div class="dm-grid-2">
        <div>
          <label class="dm-label">通知先メールアドレス</label>
          <input id="dm-f-email" class="dm-input" placeholder="example@company.co.jp">
        </div>
        <div>
          <label class="dm-label">通知</label>
          <label class="dm-toggle"><input id="dm-f-notify" type="checkbox"> 期限が近づいたら通知する</label>
        </div>
        <div>
          <label class="dm-label">メーカー</label>
          <input id="dm-f-maker" class="dm-input" placeholder="例: トヨタ">
        </div>
        <div>
          <label class="dm-label">車名</label>
          <input id="dm-f-carname" class="dm-input" placeholder="例: プリウス">
        </div>
        <div class="col-span-2">
          <label class="dm-label">登録番号 / ナンバー</label>
          <input id="dm-f-reg" class="dm-input" placeholder="例: 品川 300 あ 12-34">
        </div>
        <div class="col-span-2">
          <label class="dm-label">メモ</label>
          <textarea id="dm-f-notes" class="dm-input" rows="2"></textarea>
        </div>
      </div>

      <div>
        <div class="text-sm font-bold text-slate-700 mb-2">書類の有効期限</div>
        <div id="dm-docs"></div>
      </div>
    </div>
    <div class="dm-modal-foot">
      <button type="button" id="dm-delete-driver" class="dm-btn dm-btn-danger mr-auto">運転士を削除</button>
      <button type="button" class="dm-btn" data-close="dm-edit-modal">閉じる</button>
      <button type="button" id="dm-save-driver" class="dm-btn dm-btn-primary">基本情報を保存</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DOC_TYPES = ['inspection', 'liability_insurance', 'voluntary_insurance', 'license'];
  const DOC_LABELS = {
    inspection: '車検証',
    liability_insurance: '自賠責保険証',
    voluntary_insurance: '任意保険証',
    license: '運転免許証',
  };
  const STATUS_LABELS = {
    active: '有効', expiring: '期限間近', expired: '期限切れ', incomplete: '書類不足', missing: '未登録',
  };
  const state = { drivers: [], canAdmin: false, current: null, empTimer: null };

  const esc = (v) => { const d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; };

  function statusBadge(status) {
    const cls = { active: 'dm-active', expiring: 'dm-expiring', expired: 'dm-expired', incomplete: 'dm-incomplete', missing: 'dm-missing' }[status] || 'dm-missing';
    return `<span class="dm-badge ${cls}">${esc(STATUS_LABELS[status] || status)}</span>`;
  }

  function docCell(driver, type) {
    const doc = (driver.documents || {})[type];
    const status = (driver.doc_statuses || {})[type] || 'missing';
    if (!doc || !doc.expiry_display) {
      return `<div class="dm-doc-cell">${statusBadge(status)}<div class="text-slate-400">未登録</div></div>`;
    }
    return `<div class="dm-doc-cell">${statusBadge(status)}<div class="dm-doc-exp">${esc(doc.expiry_display)}</div>${doc.has_pdf ? `<a class="text-sky-700" href="/tools/car_inspe/api/documents/${doc.id}/download">書類DL</a>` : ''}</div>`;
  }

  async function api(url, options = {}) {
    let res;
    try {
      res = await fetch(url, options);
    } catch (e) {
      throw new Error(`通信に失敗しました: ${e.message || e}`);
    }
    let data = {};
    try { data = await res.json(); } catch (_) { data = {}; }
    if (!res.ok) throw new Error(data.error || `処理に失敗しました (HTTP ${res.status})`);
    return data;
  }

  function showMessage(text, kind) {
    const el = $('dm-message');
    if (!text) { el.classList.add('hidden'); el.textContent = ''; return; }
    el.textContent = text;
    el.classList.remove('hidden');
    el.style.color = kind === 'error' ? '#b91c1c' : kind === 'success' ? '#15803d' : '#475569';
    el.style.background = kind === 'error' ? '#fef2f2' : kind === 'success' ? '#ecfdf5' : '#f8fafc';
  }

  function openModal(id) { $(id).classList.add('open'); }
  function closeModal(id) { $(id).classList.remove('open'); }

  function renderTable() {
    const body = $('dm-body');
    if (!state.drivers.length) {
      body.innerHTML = '<tr><td colspan="11" class="text-center text-slate-500 py-6">運転士が登録されていません。「運転士を追加」から登録してください。</td></tr>';
      return;
    }
    body.innerHTML = state.drivers.map((d, idx) => `
      <tr>
        <td>${statusBadge(d.status)}</td>
        <td>${esc(d.employee_number)}</td>
        <td>${esc(d.employee_name || '-')}</td>
        <td>${esc(d.office_name || '-')}</td>
        <td>${esc([d.car_maker, d.car_name, d.registration_number].filter(Boolean).join(' ') || '-')}</td>
        <td>${docCell(d, 'inspection')}</td>
        <td>${docCell(d, 'liability_insurance')}</td>
        <td>${docCell(d, 'voluntary_insurance')}</td>
        <td>${docCell(d, 'license')}</td>
        <td>${d.notify_enabled ? '<span class="dm-badge dm-active">ON</span>' : '<span class="dm-badge dm-missing">OFF</span>'}</td>
        <td><button class="dm-btn" data-edit="${idx}">編集</button></td>
      </tr>`).join('');
    body.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => openEdit(state.drivers[Number(b.dataset.edit)])));
  }

  async function load() {
    const params = new URLSearchParams();
    if ($('dm-q').value) params.set('q', $('dm-q').value);
    if ($('dm-status').value) params.set('status', $('dm-status').value);
    const data = await api(`/tools/car_inspe/api/drivers?${params.toString()}`);
    state.drivers = data.drivers || [];
    state.canAdmin = Boolean(data.can_admin);
    $('dm-count').textContent = `${state.drivers.length}件`;
    $('dm-s-drivers').textContent = data.summary?.drivers ?? '-';
    $('dm-s-expired').textContent = data.summary?.expired ?? '-';
    $('dm-s-expiring').textContent = data.summary?.expiring ?? '-';
    $('dm-s-incomplete').textContent = data.summary?.incomplete ?? '-';
    $('dm-mail-state').textContent = data.mail_configured ? '送信設定OK' : '未設定（保留）';
    $('dm-admin-box').classList.toggle('hidden', !state.canAdmin);
    renderTable();
  }

  // ---- 運転士追加（社員検索） ----
  function scheduleEmpSearch() {
    window.clearTimeout(state.empTimer);
    state.empTimer = window.setTimeout(() => searchEmployees().catch((e) => { $('dm-emp-list').innerHTML = `<div class="text-rose-600 text-sm">${esc(e.message)}</div>`; }), 220);
  }
  async function searchEmployees() {
    const q = $('dm-emp-q').value.trim();
    const data = await api(`/tools/car_inspe/api/employees?q=${encodeURIComponent(q)}&limit=50`);
    const list = data.employees || [];
    $('dm-emp-list').innerHTML = list.length ? list.map((e, i) => `
      <button type="button" class="dm-emp-option" data-emp="${i}" ${e.has_profile ? 'disabled' : ''}>
        <strong>${esc(e.employee_number)}</strong> ${esc(e.employee_name)} <span class="text-slate-500">${esc(e.office_name || '')}</span>
        ${e.email ? `<div class="text-xs text-slate-500">${esc(e.email)}</div>` : '<div class="text-xs text-amber-600">メール未登録</div>'}
        ${e.has_profile ? '<div class="text-xs text-slate-400">登録済み</div>' : ''}
      </button>`).join('') : '<div class="text-sm text-slate-500">該当する社員が見つかりません。</div>';
    $('dm-emp-list').querySelectorAll('[data-emp]').forEach((b) => {
      if (b.disabled) return;
      b.addEventListener('click', () => addDriver(list[Number(b.dataset.emp)]));
    });
  }
  async function addDriver(emp) {
    try {
      const data = await api('/tools/car_inspe/api/drivers', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employee_number: emp.employee_number }),
      });
      closeModal('dm-emp-modal');
      showMessage(`${emp.employee_name || emp.employee_number} を追加しました。`, 'success');
      await load();
      const created = state.drivers.find((d) => d.employee_number === emp.employee_number) || data.driver;
      if (created) openEdit(created);
    } catch (e) {
      $('dm-emp-list').innerHTML = `<div class="text-rose-600 text-sm">${esc(e.message)}</div>` + $('dm-emp-list').innerHTML;
    }
  }

  // ---- 運転士編集 ----
  function openEdit(driver) {
    state.current = driver;
    $('dm-edit-title').textContent = `${driver.employee_name || ''}（${driver.employee_number}）`;
    $('dm-edit-sub').textContent = driver.office_name || '';
    $('dm-f-email').value = driver.email || '';
    $('dm-f-notify').checked = Boolean(driver.notify_enabled);
    $('dm-f-maker').value = driver.car_maker || '';
    $('dm-f-carname').value = driver.car_name || '';
    $('dm-f-reg').value = driver.registration_number || '';
    $('dm-f-notes').value = driver.notes || '';
    renderDocEditors(driver);
    openModal('dm-edit-modal');
  }

  function renderDocEditors(driver) {
    const box = $('dm-docs');
    box.innerHTML = DOC_TYPES.map((type) => {
      const doc = (driver.documents || {})[type] || {};
      const status = (driver.doc_statuses || {})[type] || 'missing';
      return `
        <div class="dm-doc-card" data-doc="${type}">
          <div class="dm-doc-head">
            <div class="font-bold text-slate-800">${esc(DOC_LABELS[type])} ${statusBadge(status)}</div>
            <div class="flex gap-2">
              ${doc.has_pdf ? `<a class="dm-btn" href="/tools/car_inspe/api/documents/${doc.id}/download">書類DL</a>` : ''}
              ${doc.id ? `<button type="button" class="dm-btn dm-btn-danger" data-doc-del="${type}">削除</button>` : ''}
            </div>
          </div>
          <div class="dm-grid-2">
            <div><label class="dm-label">有効期限</label><input class="dm-input" data-field="expiry_date" placeholder="2027-03-31" value="${esc(doc.expiry_display || '')}"></div>
            <div><label class="dm-label">番号（証券/免許番号）</label><input class="dm-input" data-field="document_number" value="${esc(doc.document_number || '')}"></div>
            <div><label class="dm-label">発行元 / 保険会社</label><input class="dm-input" data-field="issuer" value="${esc(doc.issuer || '')}"></div>
            <div><label class="dm-label">書類ファイル（PDF/画像）</label><input class="dm-input" type="file" data-field="file" accept=".pdf,.png,.jpg,.jpeg"></div>
            <div class="col-span-2"><label class="dm-label">メモ</label><input class="dm-input" data-field="notes" value="${esc(doc.notes || '')}"></div>
          </div>
          <div class="mt-2 text-right"><button type="button" class="dm-btn dm-btn-primary" data-doc-save="${type}">この書類を保存</button></div>
        </div>`;
    }).join('');
    box.querySelectorAll('[data-doc-save]').forEach((b) => b.addEventListener('click', () => saveDoc(b.dataset.docSave)));
    box.querySelectorAll('[data-doc-del]').forEach((b) => b.addEventListener('click', () => deleteDoc(b.dataset.docDel)));
  }

  function refreshCurrent() {
    const updated = state.drivers.find((d) => d.id === state.current?.id);
    if (updated) { state.current = updated; renderDocEditors(updated); }
  }

  async function saveDoc(type) {
    const card = $('dm-docs').querySelector(`[data-doc="${type}"]`);
    if (!card || !state.current) return;
    const fd = new FormData();
    fd.append('expiry_date', card.querySelector('[data-field="expiry_date"]').value);
    fd.append('document_number', card.querySelector('[data-field="document_number"]').value);
    fd.append('issuer', card.querySelector('[data-field="issuer"]').value);
    fd.append('notes', card.querySelector('[data-field="notes"]').value);
    const fileInput = card.querySelector('[data-field="file"]');
    if (fileInput.files[0]) fd.append('file', fileInput.files[0]);
    try {
      const data = await api(`/tools/car_inspe/api/drivers/${state.current.id}/documents/${type}`, { method: 'POST', body: fd });
      showMessage(`${DOC_LABELS[type]}を保存しました。`, 'success');
      await load();
      state.current = data.driver;
      renderDocEditors(data.driver);
    } catch (e) {
      showMessage(e.message, 'error');
    }
  }

  async function deleteDoc(type) {
    if (!state.current || !window.confirm(`${DOC_LABELS[type]}の登録を削除します。よろしいですか？`)) return;
    try {
      const data = await api(`/tools/car_inspe/api/drivers/${state.current.id}/documents/${type}`, { method: 'DELETE' });
      showMessage(`${DOC_LABELS[type]}を削除しました。`, 'success');
      await load();
      state.current = data.driver;
      renderDocEditors(data.driver);
    } catch (e) {
      showMessage(e.message, 'error');
    }
  }

  async function saveDriver() {
    if (!state.current) return;
    const payload = {
      email: $('dm-f-email').value,
      notify_enabled: $('dm-f-notify').checked,
      car_maker: $('dm-f-maker').value,
      car_name: $('dm-f-carname').value,
      registration_number: $('dm-f-reg').value,
      notes: $('dm-f-notes').value,
    };
    try {
      const data = await api(`/tools/car_inspe/api/drivers/${state.current.id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      state.current = data.driver;
      showMessage('基本情報を保存しました。', 'success');
      await load();
    } catch (e) {
      showMessage(e.message, 'error');
    }
  }

  async function deleteDriver() {
    if (!state.current || !window.confirm('この運転士のマイカー登録と書類をすべて削除します。よろしいですか？')) return;
    try {
      await api(`/tools/car_inspe/api/drivers/${state.current.id}`, { method: 'DELETE' });
      closeModal('dm-edit-modal');
      showMessage('運転士を削除しました。', 'success');
      await load();
    } catch (e) {
      showMessage(e.message, 'error');
    }
  }

  async function testMail() {
    const to = $('dm-test-to').value.trim();
    const result = $('dm-test-result');
    if (!to) { result.textContent = '送信先を入力してください。'; result.style.color = '#b91c1c'; return; }
    result.textContent = '送信中…'; result.style.color = '#475569';
    try {
      await api('/tools/car_inspe/api/test-mail', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to }),
      });
      result.textContent = '送信しました。受信箱を確認してください。'; result.style.color = '#15803d';
    } catch (e) {
      result.textContent = e.message; result.style.color = '#b91c1c';
    }
  }

  // ---- イベント ----
  $('dm-add').addEventListener('click', () => { $('dm-emp-q').value = ''; $('dm-emp-list').innerHTML = ''; openModal('dm-emp-modal'); searchEmployees().catch(() => {}); });
  $('dm-refresh').addEventListener('click', () => load().catch((e) => showMessage(e.message, 'error')));
  $('dm-search').addEventListener('click', () => load().catch((e) => showMessage(e.message, 'error')));
  $('dm-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') load().catch((err) => showMessage(err.message, 'error')); });
  $('dm-status').addEventListener('change', () => load().catch((e) => showMessage(e.message, 'error')));
  $('dm-emp-q').addEventListener('input', scheduleEmpSearch);
  $('dm-save-driver').addEventListener('click', saveDriver);
  $('dm-delete-driver').addEventListener('click', deleteDriver);
  $('dm-test-send').addEventListener('click', testMail);
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => closeModal(b.dataset.close)));
  document.querySelectorAll('.dm-modal').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) closeModal(m.id); }));

  load().catch((e) => showMessage(e.message || '読み込みに失敗しました。', 'error'));
})();
</script>
{% endblock %}
