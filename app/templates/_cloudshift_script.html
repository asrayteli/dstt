    function bindAssistFormEvents(scope) {
      scope.querySelectorAll('[data-assist-candidate-input]').forEach((input) => {
        input.addEventListener('input', () => scheduleAssistCandidateSearch(input.closest('[data-assist-candidate-field]')));
      });
      scope.querySelectorAll('[name="date"]').forEach((input) => {
        const note = input.parentElement ? input.parentElement.querySelector('[data-assist-date-note]') : null;
        const sync = () => {
          if (note) note.textContent = assistWeekdayLabelFromDate(input.value);
        };
        input.addEventListener('input', sync);
        input.addEventListener('change', sync);
        sync();
      });
      scope.querySelectorAll('[data-assist-site-form] [name="site_name"]').forEach((input) => {
        if (input.dataset.assistSiteInputBound === '1') return;
        input.dataset.assistSiteInputBound = '1';
        const sync = () => {
          const form = input.closest('form');
          const refs = assistSiteFieldRefs(form);
          if (!refs.siteNameInput) return;
          const normalizedName = refs.siteNameInput.value.trim();
          if (!normalizedName) {
            if (refs.rowIdInput) refs.rowIdInput.value = '';
            if (refs.siteIdInput) refs.siteIdInput.value = '';
            if (refs.note) refs.note.textContent = '現場名を入力するか、現場リストPLUSから選択してください';
            return;
          }
          if (refs.rowIdInput && refs.rowIdInput.value) {
            refs.rowIdInput.value = '';
            if (refs.siteIdInput) refs.siteIdInput.value = '';
            if (refs.note) refs.note.textContent = '手入力に変更したため、現場リンクを解除しました';
          } else if (refs.note && !refs.siteIdInput?.value) {
            refs.note.textContent = '未紐付けの現場名です。必要に応じて現場リストPLUSから選択してください';
          }
        };
        input.addEventListener('input', sync);
      });
      scope.querySelectorAll('[data-assist-add-assignment]').forEach((button) => {
        button.addEventListener('click', () => {
          const container = button.closest('form').querySelector('[data-assist-assignments]');
          container.insertAdjacentHTML('beforeend', buildAssistRuleAssignmentRow({ role_type: 'backup', priority: 1 }, container.children.length));
          bindAssistFormEvents(container);
        });
      });
      scope.querySelectorAll('[data-assist-remove-assignment]').forEach((button) => {
        button.addEventListener('click', () => {
          const row = button.closest('[data-assist-assignment-row]');
          const container = row.parentElement;
          row.remove();
          if (!container.querySelector('[data-assist-assignment-row]')) {
            container.insertAdjacentHTML('beforeend', buildAssistRuleAssignmentRow({ role_type: 'backup', priority: 1 }, 0));
            bindAssistFormEvents(container);
          }
        });
      });
      scope.querySelectorAll('[data-assist-pick-site]').forEach((button) => {
        if (button.dataset.assistSitePickerBound === '1') return;
        button.dataset.assistSitePickerBound = '1';
        button.addEventListener('click', () => {
          openAssistSitePickerForForm(button.closest('form')).catch((error) => showFlash(error.message, 'error'));
        });
      });
      if (!scope.dataset.assistCandidateClickBound) {
        scope.dataset.assistCandidateClickBound = '1';
        scope.addEventListener('click', (event) => {
          const candidate = event.target.closest('.cloud-assist-candidate');
          if (!candidate) return;
          event.preventDefault();
          applyAssistCandidateSelection(candidate.closest('[data-assist-candidate-field]'), {
            candidate_id: candidate.getAttribute('data-candidate-id') || '',
            candidate_name: candidate.getAttribute('data-candidate-name') || candidate.getAttribute('data-employee-name') || '',
            employee_name: candidate.getAttribute('data-employee-name') || '',
            employee_number: candidate.getAttribute('data-employee-number') || ''
          });
        });
      }
    }

    function bindAssistModalEvents(modal) {
      bindAssistFormEvents(modal);
      bindAssistTemplateEvents(modal);
      modal.querySelectorAll('[data-assist-open-engine]').forEach((button) => {
        button.addEventListener('click', () => {
          closeCloudModal('cloud-assist-modal');
          openShiftEngineModal().catch((error) => showFlash(error.message, 'error'));
        });
      });
      modal.querySelectorAll('[data-assist-tab]').forEach((button) => {
        button.addEventListener('click', () => {
          state.assist.activeTab = button.getAttribute('data-assist-tab') || 'register';
          renderAssistModalContent(modal);
        });
      });
      modal.querySelectorAll('[data-assist-expand-sites]').forEach((button) => {
        button.addEventListener('click', () => {
          openAssistSiteDetailPopup(button.getAttribute('data-assist-expand-sites') || 'experienced');
        });
      });
      modal.querySelectorAll('[data-assist-expand-people]').forEach((button) => {
        button.addEventListener('click', () => {
          openAssistScenePeopleDetailPopup();
        });
      });
      modal.querySelectorAll('[data-assist-register-view]').forEach((button) => {
        button.addEventListener('click', () => {
          state.assist.registerView = button.getAttribute('data-assist-register-view') || (currentAssistMode() === 'person' ? 'experienced' : 'record');
          renderAssistModalContent(modal);
        });
      });
      modal.querySelectorAll('[data-assist-edit-view]').forEach((button) => {
        button.addEventListener('click', () => {
          state.assist.editView = button.getAttribute('data-assist-edit-view') || (currentAssistMode() === 'person' ? 'experienced' : 'records');
          renderAssistModalContent(modal);
        });
      });
      modal.querySelectorAll('[data-assist-detail-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const sectionKey = button.getAttribute('data-assist-detail-toggle') || '';
          if (!sectionKey) return;
          state.assist.detailSections = Object.assign({}, state.assist.detailSections || {}, {
            [sectionKey]: !((state.assist.detailSections || {})[sectionKey] === true)
          });
          renderAssistModalContent(modal);
        });
      });
      modal.querySelectorAll('[data-assist-add-search-result-index]').forEach((button) => {
        button.addEventListener('click', () => {
          const result = state.assist.searchResult || {};
          const items = Array.isArray(result.results) ? result.results : [];
          const index = parseInt(button.getAttribute('data-assist-add-search-result-index') || '', 10);
          const candidate = Number.isInteger(index) ? items[index] : null;
          if (!candidate) {
            showFlash('追加対象の候補が見つかりません', 'error');
            return;
          }
          if (assistTargetEntryIdFromContext()) {
            if (!replaceAssistTargetEntryWithCandidate(candidate)) {
              showFlash('差し替え対象のエントリが見つかりませんでした', 'error');
              return;
            }
            notifyAssistAction('エントリの名前を候補者に差し替えました。オプション・コメントはそのままです。保存ボタンで確定してください');
            return;
          }
          if (!appendAssistSearchResultToDay(candidate)) {
            showFlash('候補をシフトに追加できませんでした', 'error');
            return;
          }
          notifyAssistAction('候補をその日のシフトに追加しました。保存ボタンで確定してください');
        });
      });
      modal.querySelectorAll('[data-assist-reset-filters]').forEach((button) => {
        button.addEventListener('click', () => {
          resetAssistFilters();
          renderAssistModalContent(modal);
        });
      });
      const recordCreateForm = modal.querySelector('[data-assist-record-form][data-form-id="assist-create-record"]');
      if (recordCreateForm) {
        recordCreateForm.addEventListener('submit', async (event) => {

    async function openAssistModal(options) {
      const next = options || {};
      if (!isAssistAvailable()) {
        showFlash('アシスト機能は scene / person モードで利用できます', 'info');
        return;
      }
      const mode = currentAssistMode();
      if (Object.prototype.hasOwnProperty.call(next, 'activeTab')) {
        state.assist.activeTab = next.activeTab;
      }
      if (Object.prototype.hasOwnProperty.call(next, 'registerView')) {
        state.assist.registerView = next.registerView;
      }
      if (Object.prototype.hasOwnProperty.call(next, 'recordDraft')) {
        state.assist.recordDraft = next.recordDraft;
      }
      if (Object.prototype.hasOwnProperty.call(next, 'dayContext')) {
        state.assist.dayContext = next.dayContext;
      }
      if (Object.prototype.hasOwnProperty.call(next, 'searchForm')) {
        state.assist.searchForm = Object.assign(
          {
            target_date: defaultAssistTargetDate(),
            shift_key: ''
          },
          next.searchForm || {}
        );
      }
      if (mode === 'person') {
        if (!Object.prototype.hasOwnProperty.call(next, 'registerView')) {
          state.assist.registerView = next.recordDraft && next.recordDraft.site_type === 'training'
            ? 'training'
            : 'experienced';
        }
        if (!Object.prototype.hasOwnProperty.call(next, 'dayContext') && !Object.prototype.hasOwnProperty.call(next, 'recordDraft')) {
          state.assist.recordDraft = null;
        }
      }
      const modal = openCloudModal('cloud-assist-modal', `アシスト / ${currentProject().title}`);
      modalBody(modal).innerHTML = '<div class="cloud-empty-state"><p>アシストデータを読み込み中です...</p></div>';
      modalFooter(modal).innerHTML = '<button type="button" class="cloud-btn secondary" data-cloud-assist-close>閉じる</button>';
      modalFooter(modal).querySelector('[data-cloud-assist-close]').addEventListener('click', () => closeCloudModal('cloud-assist-modal'));
      // アシストを開くたびに最新の集計（現場経験者など）を取り直す。
      await ensureAssistLoaded(true);
      if (next.autoSearch) {
        await executeAssistSearch(state.assist.searchForm || {});
      }
      renderAssistModalContent(modal);
    }

    // エントリ詳細（ss_common のエントリモーダル）からアシストの候補サーチを開く。
    // 「未定」などの仮の名前で押さえておいた行を、後から実在する人へ差し替えるための入口。
    async function openAssistSearchForEntry(context) {
      const day = String(context && context.day ? context.day : '').trim();
      const entryId = String(context && context.entryId ? context.entryId : '').trim();
      const entry = (context && context.entry) || currentEntryByDayAndId(day, entryId);
      if (!day || !entryId || !entry) {
        showFlash('対象のエントリが見つからないためアシストを開けません', 'error');
        return;
      }
      if (currentAssistMode() !== 'scene') {
        showFlash('エントリからの候補サーチは現場シフトで利用できます', 'info');
        return;
      }
      const parsed = parseCalendarAssistEntry(entry);
      // 検索条件は日付セルの「詳細」→「アシスト」から開いたときと同じにする。
      // 同日競合の判定はここで渡すオプションに左右されるため、入口によって
      // 結果が変わらないようにそろえておく。差し替え時はエントリ自身の
      // オプション・コメント・並び順をそのまま残す。
      const searchPayload = assistDaySearchPayload(day, assistSelectedShiftKeyForDay(day));
      await openAssistModal({
        activeTab: 'search',
        recordDraft: null,
        dayContext: {
          day,
          date: searchPayload.target_date,
          shift_key: searchPayload.shift_key,
          entry_id: entryId,
          entry_name: parsed.candidate_name
        },
        searchForm: searchPayload,
        autoSearch: true
      });
    }

    async function openAssistDayActionModal(day) {
      if (!isAssistAvailable()) {
        showFlash('アシスト機能は scene / person モードで利用できます', 'info');
        return;
      }
      let previewResult = null;
      let previewError = '';
      if (currentAssistMode() === 'person') {
        await ensureAssistLoaded(false);
      } else {
        try {
          previewResult = await fetchAssistSearchPreview(assistDaySearchPayload(day, assistSelectedShiftKeyForDay(day)));
        } catch (error) {
          previewError = error && error.message ? error.message : '候補者の取得に失敗しました';
        }
      }
      const modal = openCloudModal('cloud-assist-day-modal', `アシスト / ${assistDateTextForDay(day)}`);
      modalBody(modal).innerHTML = buildAssistDayActionModal(day, previewResult, previewError);
      modalFooter(modal).innerHTML = '<button type="button" class="cloud-btn secondary" data-cloud-assist-day-close>閉じる</button>';
      modalFooter(modal).querySelector('[data-cloud-assist-day-close]').addEventListener('click', () => closeCloudModal('cloud-assist-day-modal'));
      if (currentAssistMode() === 'person') {
        modal.querySelectorAll('[data-day-assist-training-pick]').forEach((button) => {
          button.addEventListener('click', () => {
            const siteId = button.getAttribute('data-day-assist-training-id') || '';
            const site = (currentAssistData().training_sites || []).find((item) => item.id === siteId);
            if (!site) {
              showFlash('候補の研修要現場が見つかりません', 'error');
              return;
            }

              showFlash('候補を予定に追加できませんでした', 'error');
              return;

            const source = index === '' ? null : entries[parseInt(index || '0', 10)] || null;
            const shiftKey = source && source.shift_key ? source.shift_key : assistSelectedShiftKeyForDay(targetDay);
            await openAssistModal({
              activeTab: 'register',
              registerView: siteType,
              dayContext: {
                date: dateText,
                shift_key: shiftKey
              },
              recordDraft: {
                site_type: siteType,
                date: dateText,
                site_name: source ? source.candidate_name : '',
                shift_key: shiftKey,
                notes: source ? source.notes : ''
              }
            });
          });
        });
        return;
      }
      modal.querySelectorAll('[data-day-assist-search]').forEach((button) => {
        button.addEventListener('click', async () => {
          closeCloudModal('cloud-assist-day-modal');
          const dateText = assistDateTextForDay(button.getAttribute('data-day-assist-search'));
          const shiftKey = button.getAttribute('data-day-assist-shift') || '';
          await openAssistModal({
            activeTab: 'search',
            recordDraft: null,
            dayContext: {
              day: button.getAttribute('data-day-assist-search'),
              date: dateText,
              shift_key: shiftKey

              shift_key: shiftKey

            autoSearch: true

        button.addEventListener('click', () => {

          const candidate = {
            name: button.getAttribute('data-day-assist-top-name') || '',
            employee_number: button.getAttribute('data-day-assist-top-employee') || ''
          };
          if (!appendAssistSearchResultToSpecificDay(targetDay, shiftKey, candidate)) {
            showFlash('最有力候補を予定に追加できませんでした', 'error');
            return;
          }
          notifyAssistAction('最有力候補をその日の予定に入れました。保存ボタンで確定してください');

      modal.querySelectorAll('[data-day-assist-record]').forEach((button) => {
        button.addEventListener('click', async () => {
          closeCloudModal('cloud-assist-day-modal');
          const targetDay = button.getAttribute('data-day-assist-record');
          const index = button.getAttribute('data-day-assist-index');
          const dateText = assistDateTextForDay(targetDay);
          const entries = currentDayEntries(targetDay).map((entry) => parseCalendarAssistEntry(entry));
          const source = index === '' ? null : entries[parseInt(index || '0', 10)] || null;
          await openAssistModal({
            activeTab: 'register',
            registerView: 'record',
            dayContext: {
              date: dateText,
              shift_key: source && source.shift_key ? source.shift_key : assistSelectedShiftKeyForDay(targetDay)
            },
            recordDraft: {
              date: dateText,
              shift_key: source && source.shift_key ? source.shift_key : assistSelectedShiftKeyForDay(targetDay),
              candidate_name: source ? source.candidate_name : '',
              employee_number: source ? source.employee_number : '',

    // 自分のシフト帳一覧と「一覧（表示・非表示）」モーダルの両方で使う共通グルーピング。
    // - 共有されたシフトは「個人 / 現場 / マスター / その他」に分割する
    //   （個人と現場が混在してごちゃつくのを防ぐ）。
    // - alwaysShow=true のグループは該当0件でも一覧に表示する（従来の挙動を維持）。
    //   分割した共有グループは該当がある場合のみ表示する。
    function projectGroupsFor(projects) {
      const list = Array.isArray(projects) ? projects : [];
      const owned = list.filter((project) => project.access_role !== 'viewer');
      const shared = list.filter((project) => project.access_role === 'viewer');
      const masterOwned = owned.filter((project) => project.mode === 'master');
      const sharedOther = shared.filter((project) => !['person', 'scene', 'master', 'large'].includes(project.mode));
      return [
        { key: 'substitute', title: '要代務シフト', alwaysShow: true, projects: owned.filter((project) => project.mode === 'substitute') },
        ...(masterOwned.length ? [{ key: 'master', title: 'マスターシフト', alwaysShow: true, projects: masterOwned }] : []),
        { key: 'large', title: '大規模シフト', alwaysShow: true, projects: owned.filter((project) => project.mode === 'large') },
        { key: 'person', title: '個人シフト', alwaysShow: true, projects: owned.filter((project) => project.mode === 'person') },
        { key: 'scene', title: '現場シフト', alwaysShow: true, projects: owned.filter((project) => project.mode === 'scene') },
        { key: 'shared-person', title: '共有された個人シフト', alwaysShow: false, projects: shared.filter((project) => project.mode === 'person') },
        { key: 'shared-scene', title: '共有された現場シフト', alwaysShow: false, projects: shared.filter((project) => project.mode === 'scene') },
        { key: 'shared-master', title: '共有されたマスターシフト', alwaysShow: false, projects: shared.filter((project) => project.mode === 'master') },
        { key: 'shared-large', title: '共有された大規模シフト', alwaysShow: false, projects: shared.filter((project) => project.mode === 'large') },
        { key: 'shared-other', title: '共有されたその他のシフト', alwaysShow: false, projects: sharedOther }
      ];
    }

    function renderProjectList() {
      const list = $('cloud-project-list');
      if (!list) return;

      if (!state.projects.length) {
        list.innerHTML = '<div class="cloud-empty-state"><p>まだシフト帳がありません。</p></div>';
        return;
      }

      const groups = projectGroupsFor(state.projects).filter((group) => group.alwaysShow || group.projects.length);

      function projectCard(project) {
        const shareText = shareBadgeText(project);
        const masterInfo = project.master || {};
        const masterTargetLabel = masterInfo.target_label || (masterInfo.target_type === 'scene' ? '現場' : '個人');
        const masterTargetCount = masterInfo.target_type === 'scene' ? (masterInfo.site_count || 0) : (masterInfo.people_count || 0);
        return `
          <article class="cloud-project-item${currentProject() && currentProject().id === project.id ? ' active' : ''}${project.access_role === 'viewer' ? ' is-shared' : ''}${project.mode === 'master' ? ' is-master' : ''}" data-project-id="${project.id}">
            <div class="cloud-project-card-head">
              <div>
                <h3>${escapeHtml(project.title)}</h3>
                <p>${modeLongLabel(project.mode)} / ${project.month_count}か月${(project.mode === 'scene' || project.mode === 'large') ? ` / ${escapeHtml(project.site && project.site.site_id ? project.site.site_id : '現場未設定')}` : ''}${project.mode === 'master' ? ` / ${escapeHtml(masterTargetLabel)} ${escapeHtml(String(masterTargetCount))}件` : ''}</p>
              </div>
              <span class="cloud-badge">${project.latest_month_key ? escapeHtml(formatMonthKey(project.latest_month_key)) : '未作成月'}</span>
            </div>
            <div class="cloud-project-meta">
              <span>最終更新: ${escapeHtml(formatTimestamp(project.updated_at) || '-')}</span>
              ${shareText ? `<span class="cloud-badge ${project.access_role === 'viewer' ? 'shared' : 'shared-owner'}">${escapeHtml(shareText)}</span>` : ''}
            </div>
            ${project.access_role !== 'viewer' && project.can_hide ? `
            <div class="cloud-project-actions">
              <span class="cloud-badge duplicate-owner">他オーナーと重複</span>
              <button type="button" class="cloud-btn small ghost" data-project-hide="${project.id}">この帳簿を非表示</button>
            </div>` : ''}
          </article>
        `;
      }

      list.innerHTML = groups.map((group) => `
        <section class="cloud-project-group" data-project-group="${group.key}">
          <div class="cloud-project-group-head">
            <h3>${group.title}</h3>
            <span>${group.projects.length}件</span>
          </div>
          ${group.projects.length
            ? `<div class="cloud-project-group-grid">${group.projects.map(projectCard).join('')}</div>`
            : '<div class="cloud-empty-state compact"><p>該当するシフト帳はありません。</p></div>'}
        </section>
      `).join('');
    }

    // 「一覧」ボタンから開く、シフト帳ごとの表示 / 非表示の管理モーダル。
    // ここでの切替は「自分の一覧の見え方」だけに影響し、他ユーザーや共有相手には影響しない。
    // 共有されたシフト帳（別オーナー所有）にも対応する。
    async function openVisibilityManager() {
      const modal = openCloudModal('cloud-visibility-modal', 'シフト帳の表示・非表示');
      if (!modal.dataset.visibilityBound) {
        modal.dataset.visibilityBound = '1';
        modal.addEventListener('change', (event) => {
          const toggle = event.target.closest('[data-visibility-toggle]');
          if (!toggle) return;
          handleVisibilityToggle(toggle).catch((error) => notifyActionError(error));
        });
      }
      const body = modalBody(modal);
      const footer = modalFooter(modal);
      body.innerHTML = '<div class="cloud-empty-state"><p>一覧を読み込み中です...</p></div>';
      footer.innerHTML = '<button type="button" class="cloud-btn secondary" data-cloud-visibility-close>閉じる</button>';
      const closeBtn = footer.querySelector('[data-cloud-visibility-close]');
      if (closeBtn) closeBtn.addEventListener('click', () => closeCloudModal('cloud-visibility-modal'));
      try {
        const data = await requestJson('/tools/shiftersync/cloudshift/api/list?include_hidden=1');
        renderVisibilityManager(modal, data.projects || []);
      } catch (error) {
        body.innerHTML = `<div class="cloud-empty-state"><p>${escapeHtml((error && error.message) || '読み込みに失敗しました')}</p></div>`;
      }
    }

    function renderVisibilityManager(modal, projects) {
      const body = modalBody(modal);
      if (!projects.length) {
        body.innerHTML = '<div class="cloud-empty-state"><p>表示・非表示を切り替えられるシフト帳がありません。</p></div>';
        return;
      }
      const groups = projectGroupsFor(projects).filter((group) => group.projects.length);

      function visibilityRow(project) {
        const hidden = !!project.hidden;
        const metaParts = [modeLongLabel(project.mode), `${project.month_count}か月`];
        if (project.mode === 'scene' || project.mode === 'large') {
          metaParts.push(project.site && project.site.site_id ? project.site.site_id : '現場未設定');
        }
        return `
          <label class="cloud-visibility-row${hidden ? ' is-hidden' : ''}" data-visibility-row="${escapeHtml(project.id)}">
            <span class="cloud-visibility-info">
              <span class="cloud-visibility-title">${escapeHtml(project.title)}</span>
              <span class="cloud-visibility-meta">${escapeHtml(metaParts.join(' / '))}</span>
            </span>
            <span class="cloud-visibility-switch">
              <span class="cloud-visibility-state">${hidden ? '非表示' : '表示'}</span>
              <input type="checkbox" data-visibility-toggle="${escapeHtml(project.id)}" ${hidden ? '' : 'checked'} aria-label="このシフト帳を表示">
            </span>
          </label>
        `;
      }

      body.innerHTML = `
        <p class="cloud-panel-note">チェックを外すと、そのシフト帳は<strong>自分の一覧からのみ</strong>非表示になります。データは削除されず、他のユーザーや共有相手には影響しません。共有されたシフト帳も非表示にできます。</p>
        <div class="cloud-visibility-groups">
          ${groups.map((group) => `
            <section class="cloud-visibility-group">
              <div class="cloud-visibility-group-head">
                <h4>${group.title}</h4>
                <span>${group.projects.length}件</span>
              </div>
              <div class="cloud-visibility-list">
                ${group.projects.map(visibilityRow).join('')}
              </div>
            </section>
          `).join('')}
        </div>
      `;
    }

    async function handleVisibilityToggle(toggle) {
      const projectId = toggle.getAttribute('data-visibility-toggle');
      if (!projectId) return;
      const hidden = !toggle.checked;
      const row = toggle.closest('[data-visibility-row]');
      toggle.disabled = true;
      // 表示状態の保存だけは確実に成否判定する。ここが失敗したときのみチェックを戻す。
      try {
        await requestJson(`/tools/shiftersync/cloudshift/api/project/${projectId}/visibility`, {
          method: 'POST',
          body: { hidden }
        });
      } catch (error) {
        toggle.checked = !toggle.checked;
        toggle.disabled = false;
        throw error;
      }
      if (row) {
        row.classList.toggle('is-hidden', hidden);
        const stateNode = row.querySelector('.cloud-visibility-state');
        if (stateNode) stateNode.textContent = hidden ? '非表示' : '表示';
      }
      toggle.disabled = false;
      // 一覧本体の更新（非表示は消え、再表示は戻る）。保存は済んでいるので、
      // ここでの失敗はチェック状態に反映せず、握りつぶして整合を保つ。
      try {
        await loadProjects();
      } catch (_) {
        /* noop */
      }
      showFlash(hidden ? 'シフト帳を一覧から非表示にしました' : 'シフト帳を一覧に表示しました', 'success');

    function loadSpotIncludeOptions() {
      try {
        const raw = window.localStorage ? window.localStorage.getItem(SPOT_INCLUDE_STORAGE_KEY) : '';
        const parsed = raw ? JSON.parse(raw) : null;
        if (!parsed || typeof parsed !== 'object') return;
        SPOT_RESULT_SECTIONS.forEach((section) => {
          if (Object.prototype.hasOwnProperty.call(parsed, section.key)) {
            state.spot.include[section.key] = parsed[section.key] !== false;
          }
        });
      } catch (_) {}
    }

    function saveSpotIncludeOptions() {
      try {
        if (window.localStorage) window.localStorage.setItem(SPOT_INCLUDE_STORAGE_KEY, JSON.stringify(state.spot.include));
      } catch (_) {}
    }

    function syncSpotIncludeFromInputs() {
      SPOT_RESULT_SECTIONS.forEach((section) => {
        const input = document.querySelector(`[data-spot-include="${section.key}"]`);
        if (input) state.spot.include[section.key] = !!input.checked;
      });
    }

    function syncSpotFormState() {
      const dateInput = $('cloud-spot-date');
      const personInput = $('cloud-spot-person-query');
      const siteInput = $('cloud-spot-site-query');
      if (!state.spot.date) {
        state.spot.date = currentJstDateText();
      }
      if (dateInput && !dateInput.value) dateInput.value = state.spot.date;
      if (personInput && personInput.value !== state.spot.personQuery) personInput.value = state.spot.personQuery;
      if (siteInput && siteInput.value !== state.spot.siteQuery) siteInput.value = state.spot.siteQuery;
      SPOT_RESULT_SECTIONS.forEach((section) => {
        const input = document.querySelector(`[data-spot-include="${section.key}"]`);
        if (input) input.checked = state.spot.include[section.key] !== false;
      });
    }

    async function runSpotSearch() {
      const dateInput = $('cloud-spot-date');
      const personInput = $('cloud-spot-person-query');
      const siteInput = $('cloud-spot-site-query');
      state.spot.date = dateInput && dateInput.value ? dateInput.value : currentJstDateText();
      state.spot.personQuery = personInput ? personInput.value.trim() : '';
      state.spot.siteQuery = siteInput ? siteInput.value.trim() : '';
      syncSpotIncludeFromInputs();
      saveSpotIncludeOptions();
      const params = new URLSearchParams();
      params.set('date', state.spot.date);
      if (state.spot.personQuery) params.set('person_query', state.spot.personQuery);
      if (state.spot.siteQuery) params.set('site_query', state.spot.siteQuery);
      let selectedSpotSectionCount = 0;
      SPOT_RESULT_SECTIONS.forEach((section) => {
        if (state.spot.include[section.key] !== false) {
          params.append('include', section.key);
          selectedSpotSectionCount += 1;
        }
      });
      if (selectedSpotSectionCount === 0) params.append('include', '__none__');
      const result = await requestJson(`/tools/shiftersync/cloudshift/api/spot?${params.toString()}`);
      state.spot.result = result;
      renderSpotPanel();
      showFlash('スポット検索を更新しました', 'success');
    }

    function conflictModeMatches(project, mode) {
      if (!project) return false;
      // 現場モードでは大規模シフト（人数分の擬似現場に展開して比較）も対象に含める。
      if (mode === 'scene') return project.mode === 'scene' || project.mode === 'large';
      return project.mode === mode;
    }

    function conflictCheckMonthKeys(mode) {
      const keys = new Set();
      state.projects
        .filter((project) => conflictModeMatches(project, mode))
        .forEach((project) => {
          (project.month_keys || []).forEach((key) => keys.add(key));
        });
      return Array.from(keys).sort();
    }

    function defaultConflictCheckMonthKey(mode, availableKeys) {
      if (currentProject() && conflictModeMatches(currentProject(), mode) && currentMonthKey() && availableKeys.includes(currentMonthKey())) {
        return currentMonthKey();
      }
      return availableKeys.length ? availableKeys[availableKeys.length - 1] : '';
    }

    function syncConflictCheckState() {
      const nextMode = state.conflictCheck.mode === 'person' ? 'person' : 'scene';
      const monthKeys = conflictCheckMonthKeys(nextMode);
      state.conflictCheck.mode = nextMode;

      if (!monthKeys.length) {
        state.conflictCheck.monthKey = '';
        state.conflictCheck.selectedProjectIds = [];
        state.conflictCheck.result = null;
        return;
      }

      if (!monthKeys.includes(state.conflictCheck.monthKey)) {
        state.conflictCheck.monthKey = defaultConflictCheckMonthKey(nextMode, monthKeys);
        state.conflictCheck.result = null;
      }

      const availableIds = state.projects
        .filter((project) => conflictModeMatches(project, nextMode) && (project.month_keys || []).includes(state.conflictCheck.monthKey))
        .map((project) => project.id);
      const defaultAvailableIds = state.projects
        .filter((project) => project.access_role !== 'viewer' && conflictModeMatches(project, nextMode) && (project.month_keys || []).includes(state.conflictCheck.monthKey))
        .map((project) => project.id);
      const currentIds = Array.isArray(state.conflictCheck.selectedProjectIds) ? state.conflictCheck.selectedProjectIds : null;
      const filteredIds = currentIds ? currentIds.filter((projectId) => availableIds.includes(projectId)) : [];
      if (currentIds && filteredIds.length !== currentIds.length) {
        state.conflictCheck.result = null;
      }
      state.conflictCheck.selectedProjectIds = currentIds === null ? defaultAvailableIds.slice() : filteredIds;
    }

    function selectedConflictCheckProjects() {
      syncConflictCheckState();
      const selectedIds = new Set(state.conflictCheck.selectedProjectIds);
      return state.projects.filter((project) => selectedIds.has(project.id) && conflictModeMatches(project, state.conflictCheck.mode) && (project.month_keys || []).includes(state.conflictCheck.monthKey));
    }

    function renderConflictCheckProjectList() {
      const container = $('cloud-check-project-list');
      if (!container) return;

      syncConflictCheckState();
      const monthKey = state.conflictCheck.monthKey;
      const projects = state.projects.filter((project) => conflictModeMatches(project, state.conflictCheck.mode) && (project.month_keys || []).includes(monthKey));
      if (!projects.length) {
        container.innerHTML = '<div class="cloud-empty-state"><p>選択中の条件に一致するシフト帳がありません。</p></div>';
        return;
      }

      const selectedIds = new Set(state.conflictCheck.selectedProjectIds);
      container.innerHTML = projects.map((project) => `
        <article class="cloud-check-project-item ${selectedIds.has(project.id) ? 'is-selected' : ''}${project.access_role === 'viewer' ? ' is-shared' : ''}" data-check-project-card="${project.id}">
          <label class="cloud-check-project-label">
            <div class="cloud-check-project-head">
              <input type="checkbox" data-check-project-id="${project.id}" ${selectedIds.has(project.id) ? 'checked' : ''}>
              <div>
                <h3 class="cloud-check-project-title">${escapeHtml(project.title)}</h3>
                <p class="cloud-check-project-meta">${escapeHtml(modeLongLabel(project.mode))} / ${escapeHtml(formatMonthKey(monthKey))}</p>
              </div>
            </div>
            <div class="cloud-badges">
              <span class="cloud-badge">${escapeHtml(project.latest_month_key ? formatMonthKey(project.latest_month_key) : '未作成月')}</span>
              <span class="cloud-badge">${escapeHtml(`${project.month_count}か月`)}</span>
              ${project.access_role === 'viewer' ? '<span class="cloud-badge shared">共有されたシフト帳</span>' : ''}
            </div>
          </label>
        </article>
      `).join('');
    }

    function renderConflictCheckResult(result) {
      const container = $('cloud-check-results');
      if (!container) return;

      if (!result) {
        container.innerHTML = '<div class="cloud-empty-state"><p>比較条件を選んで「比較する」を押すと結果を表示します。</p></div>';
        return;
      }

      const sources = Array.isArray(result.sources) && result.sources.length
        ? result.sources
        : (result.targets || []).map((label) => ({ label }));
      const labels = sources.map((source) => source.label || source.title || 'シフト帳');
      const capacities = Array.isArray(result.capacities) ? result.capacities : [];
      const dates = Array.isArray(result.dates) ? result.dates : [];
      const matrix = result.matrix && typeof result.matrix === 'object' ? result.matrix : {};
      const conflicts = Array.isArray(result.conflicts) ? result.conflicts : [];
      const sameSiteConflicts = Array.isArray(result.same_site_conflicts) ? result.same_site_conflicts : [];
      const conflictSet = new Set(conflicts.map((item) => `${item.date}-${item.entry}`));
      const sameSiteSet = new Set(sameSiteConflicts.map((item) => `${item.date}-${item.entry}-${item.file_index}`));

      const summaryHtml = `
        <div class="cloud-check-summary">
          <span class="cloud-badge">対象 ${labels.length}件</span>
          <span class="cloud-badge">年月 ${escapeHtml(formatMonthKey(result.month_key || `${result.year}-${String(result.month || '').padStart(2, '0')}`))}</span>
          <span class="cloud-badge">他シフト重複 ${conflicts.length}件</span>
          <span class="cloud-badge">同一シフト帳内重複 ${sameSiteConflicts.length}件</span>
        </div>
      `;

      const headerRow = `
        <div class="cloud-check-header-row">
          <div class="cloud-check-corner">日付</div>
          ${labels.map((label, index) => `
            <div class="cloud-check-header-cell">
              <div class="cloud-check-header-title">${escapeHtml(label)}</div>
              <div class="cloud-check-header-meta">${capacities[index] ? `必要人数 ${escapeHtml(String(capacities[index]))}` : '必要人数なし'}</div>
            </div>
          `).join('')}
        </div>
      `;

      const weekdayLabels = ['日', '月', '火', '水', '木', '金', '土'];
      const resultYear = Number(result.year);
      const resultMonth = Number(result.month);
      const hasYearMonth = Number.isFinite(resultYear) && Number.isFinite(resultMonth) && resultMonth > 0;

      const bodyRows = dates.map((day) => {
        let weekdayClass = '';
        let weekdayText = '';
        if (hasYearMonth) {
          const weekdayIdx = new Date(resultYear, resultMonth - 1, day).getDay();
          weekdayText = weekdayLabels[weekdayIdx] || '';
          if (weekdayIdx === 6) weekdayClass = ' is-saturday';
          else if (weekdayIdx === 0) weekdayClass = ' is-sunday';
        }
        return `
        <div class="cloud-check-date-row${weekdayClass}">
          <div class="cloud-check-date-cell${weekdayClass}">${day}日${weekdayText ? ` (${weekdayText})` : ''}</div>
          ${labels.map((_, index) => {
            const entries = Array.isArray(matrix[day] && matrix[day][index]) ? matrix[day][index] : [];
            const capacity = capacities[index];
            const needsWarning = capacity && entries.length < capacity;
            const entryHtml = entries.length
              ? entries.map((entry) => {
                  const isConflict = conflictSet.has(`${day}-${entry.original}`);
                  const isSameSite = sameSiteSet.has(`${day}-${entry.original}-${index}`);
                  return `<div class="cloud-check-entry${isConflict ? ' is-conflict' : ''}${isSameSite ? ' is-self-conflict' : ''}">${escapeHtml(entry.display || entry.original || '')}</div>`;
                }).join('')
              : '<div class="cloud-check-entry is-empty">未登録</div>';
            return `<div class="cloud-check-cell${weekdayClass}${needsWarning ? ' is-capacity-warning' : ''}"><div class="cloud-check-entry-list">${entryHtml}</div></div>`;
          }).join('')}
        </div>
      `;
      }).join('');

      container.innerHTML = `
        ${summaryHtml}
        <div class="cloud-check-scroll">
          <div class="cloud-check-table" style="--cloud-check-columns: ${labels.length};">
            ${headerRow}
            ${bodyRows}
          </div>
        </div>
      `;
    }

    function renderConflictCheckPanel() {
      const modeSelect = $('cloud-check-mode');
      const monthSelect = $('cloud-check-month');
      const summary = $('cloud-check-selection-summary');
      if (!modeSelect || !monthSelect || !summary) {
        return;
      }

      syncConflictCheckState();
      const availableMonthKeys = conflictCheckMonthKeys(state.conflictCheck.mode);
      modeSelect.value = state.conflictCheck.mode;
      monthSelect.innerHTML = availableMonthKeys.length
        ? availableMonthKeys.map((key) => `<option value="${key}" ${key === state.conflictCheck.monthKey ? 'selected' : ''}>${formatMonthKey(key)}</option>`).join('')
        : '<option value="">対象なし</option>';
      monthSelect.disabled = !availableMonthKeys.length;

      const selectedProjects = selectedConflictCheckProjects();
      if (!availableMonthKeys.length) {
        summary.textContent = '対象月がありません';
      } else if (!selectedProjects.length) {
        summary.textContent = '比較対象を選択してください';
      } else {
        summary.textContent = `${formatMonthKey(state.conflictCheck.monthKey)} / ${selectedProjects.length}件選択中`;
      }

      renderConflictCheckProjectList();
      renderConflictCheckResult(state.conflictCheck.result);
    }

    async function runConflictCheck() {
      syncConflictCheckState();
      const selectedProjects = selectedConflictCheckProjects();
      if (!state.conflictCheck.monthKey) {
        showFlash('比較する年月を選択してください', 'error');
        return;
      }
      if (!selectedProjects.length) {
        showFlash('比較するシフト帳を選択してください', 'error');
        return;
      }

      const result = await requestJson('/tools/shiftersync/cloudshift/api/conflict-check', {
        method: 'POST',
        body: {
          month_key: state.conflictCheck.monthKey,
          project_ids: selectedProjects.map((project) => project.id)
        }
      });
      state.conflictCheck.result = result;
      renderConflictCheckPanel();
      showFlash('重複チェックを更新しました', 'success');
    }

    function ensureActionButton(buttonId, label, className, onClick) {
      if (document.getElementById(buttonId)) {
        return;
      }
      const exportButton = document.getElementById('cloud-export-xlsx');
      const row = exportButton ? (exportButton.closest('.cloud-action-group') || exportButton.closest('.cloud-actions.compact')) : null;
      if (!row) {
        return;
      }
      const button = document.createElement('button');
      button.type = 'button';
      button.id = buttonId;
      button.className = className;
      button.textContent = label;
      button.addEventListener('click', onClick);
      const exportStart = row.querySelector('#cloud-export-calendar');
      if (exportStart) {
        row.insertBefore(button, exportStart);
      } else {
        row.appendChild(button);
      }
    }

      if (PAGE.type === 'owner' || PAGE.accessMode === 'edit') {
        ensureActionButton('cloud-open-assist', 'アシスト', 'cloud-btn secondary', () => openAssistModal({

          dayContext: null,
          searchForm: {

          }

    // テンプレート作成ウィンドウからの保存通知を受け取り、一覧を最新化する。
    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) {
        return;
      }
      const data = event.data || {};
      if (!data || data.type !== 'cloudshift-template-saved') {
        return;
      }
      const project = currentProject();
      if (!project || !data.projectId || String(data.projectId) !== String(project.id)) {
        return;
      }
      ensureTemplatesLoaded(currentAssistModal(), true).catch(() => { /* 一覧更新失敗は致命的ではない */ });
    });

    function currentEntriesSnapshot() {
      return ShifterSync.getEntriesPerDay ? ShifterSync.getEntriesPerDay() : {};
    }

    function currentEntryByDayAndId(dayKey, entryId) {
      const entriesPerDay = currentEntriesSnapshot();
      const entries = Array.isArray(entriesPerDay[String(dayKey)]) ? entriesPerDay[String(dayKey)] : [];
      return entries.find((entry) => String(entry && entry.id ? entry.id : '') === String(entryId || '')) || null;
    }

    function replaceCalendarEntries(nextEntries) {
      if (!ShifterSync.replaceEntriesPerDay) return;
      ShifterSync.replaceEntriesPerDay(nextEntries);
      if (currentMonth()) {
        ShifterSync.setState('mode', currentProject().mode);
        ShifterSync.setState('name', currentProject().title);
      }
    }

    function monthDayListForCurrentMonth() {
      return monthDayKeys(currentMonth()).map((day) => parseInt(day, 10));
    }

    function buildBulkDatePickCells(month) {
      if (!month) return '';
      const totalDays = monthDays(month);
      const firstDow = (new Date(month.year, month.month - 1, 1).getDay() + 6) % 7;
      const cells = [];
      for (let index = 0; index < firstDow; index += 1) {
        cells.push('<div class="cloud-bulk-date-cell is-empty" aria-hidden="true"></div>');
      }
      for (let day = 1; day <= totalDays; day += 1) {
        cells.push(`
          <button
            type="button"
            class="cloud-bulk-date-cell"
            data-bulk-picked-day="${day}"
            aria-pressed="false"
          >${day}</button>
        `);
      }
      return cells.join('');
    }

    function selectedPickedDaysFromBulkForm(form) {
      return Array.from(form.querySelectorAll('[data-bulk-picked-day].is-selected'))
        .map((button) => parseInt(button.getAttribute('data-bulk-picked-day') || '0', 10))
        .filter((day) => !!day)
        .sort((a, b) => a - b);
    }

    function toggleBulkPickedDay(form, day) {
      const button = form.querySelector(`[data-bulk-picked-day="${day}"]`);
      if (!button) return;
      const selected = !button.classList.contains('is-selected');
      button.classList.toggle('is-selected', selected);
      button.setAttribute('aria-pressed', selected ? 'true' : 'false');
    }

    function buildBulkRangeCopyCells(month) {
      if (!month) return '';
      const totalDays = monthDays(month);
      const firstDow = (new Date(month.year, month.month - 1, 1).getDay() + 6) % 7;
      const cells = [];
      for (let index = 0; index < firstDow; index += 1) {
        cells.push('<div class="cloud-bulk-date-cell is-empty" aria-hidden="true"></div>');
      }
      for (let day = 1; day <= totalDays; day += 1) {
        cells.push(`
          <button
            type="button"
            class="cloud-bulk-date-cell"
            data-bulk-range-copy-day="${day}"
          >${day}</button>
        `);
      }
      return cells.join('');
    }

    function bulkRangeCopyValue(form, name) {
      const input = form.querySelector(`[name="${name}"]`);
      const value = parseInt((input && input.value) || '0', 10);
      return value > 0 ? value : 0;
    }

    function setBulkRangeCopyValue(form, name, value) {
      const input = form.querySelector(`[name="${name}"]`);
      if (input) input.value = value > 0 ? String(value) : '';
    }

    function handleBulkRangeCopyClick(form, day) {
      if (!day) return;
      const step = form.dataset.rangeCopyStep || 'start';
      if (step === 'end') {
        const start = bulkRangeCopyValue(form, 'bulk_range_copy_start');
        if (!start) {
          setBulkRangeCopyValue(form, 'bulk_range_copy_start', day);
        } else if (day < start) {
          // Clicked before the start: the earlier day becomes the new start.
          setBulkRangeCopyValue(form, 'bulk_range_copy_start', day);
          setBulkRangeCopyValue(form, 'bulk_range_copy_end', start);
          form.dataset.rangeCopyStep = 'paste';
        } else {
          setBulkRangeCopyValue(form, 'bulk_range_copy_end', day);
          form.dataset.rangeCopyStep = 'paste';
        }
      } else if (step === 'paste') {
        setBulkRangeCopyValue(form, 'bulk_range_copy_paste', day);
        form.dataset.rangeCopyStep = 'done';
      } else {
        // 'start' or restart after 'done'
        setBulkRangeCopyValue(form, 'bulk_range_copy_start', day);
        setBulkRangeCopyValue(form, 'bulk_range_copy_end', 0);
        setBulkRangeCopyValue(form, 'bulk_range_copy_paste', 0);
        form.dataset.rangeCopyStep = 'end';
      }
      updateBulkRangeCopyHighlights(form);
      updateBulkPreview(form);
    }

    function resetBulkRangeCopy(form) {
      setBulkRangeCopyValue(form, 'bulk_range_copy_start', 0);
      setBulkRangeCopyValue(form, 'bulk_range_copy_end', 0);
      setBulkRangeCopyValue(form, 'bulk_range_copy_paste', 0);
      form.dataset.rangeCopyStep = 'start';
      updateBulkRangeCopyHighlights(form);
      updateBulkPreview(form);
    }

    function updateBulkRangeCopyHighlights(form) {
      const start = bulkRangeCopyValue(form, 'bulk_range_copy_start');
      const end = bulkRangeCopyValue(form, 'bulk_range_copy_end');
      const paste = bulkRangeCopyValue(form, 'bulk_range_copy_paste');
      const hasRange = start && end && end >= start;
      const span = hasRange ? (end - start) : 0;
      form.querySelectorAll('[data-bulk-range-copy-day]').forEach((cell) => {
        const day = parseInt(cell.getAttribute('data-bulk-range-copy-day') || '0', 10);
        cell.classList.remove('is-copy-start', 'is-copy-end', 'is-copy-range', 'is-paste-base', 'is-paste-range');
        if (!day) return;
        if (hasRange && day >= start && day <= end) {
          cell.classList.add('is-copy-range');
        }
        if (start && day === start) cell.classList.add('is-copy-start');
        if (end && day === end) cell.classList.add('is-copy-end');
        if (paste) {
          const pasteEnd = paste + span;
          if (day === paste) cell.classList.add('is-paste-base');
          else if (day > paste && day <= pasteEnd) cell.classList.add('is-paste-range');
        }
      });
      const stepNote = form.querySelector('[data-bulk-range-copy-step]');
      if (stepNote) {
        const step = form.dataset.rangeCopyStep || 'start';
        if (step === 'end') stepNote.textContent = 'カレンダーをクリック: ② コピー終了日';
        else if (step === 'paste') stepNote.textContent = 'カレンダーをクリック: ③ ペースト基準日';
        else if (step === 'done') stepNote.textContent = '選択完了。「適用」で貼り付けます（やり直す場合は「選択しなおす」）';
        else stepNote.textContent = 'カレンダーをクリック: ① コピー開始日';
      }
    }

    function weekdayKeyForDay(day) {
      const month = currentMonth();
      if (!month) return null;
      return new Date(month.year, month.month - 1, day).getDay();
    }

    function selectedDaysFromBulkForm(form) {
      const scope = form.querySelector('[name="bulk_scope"]').value;
      const month = currentMonth();
      if (!month) return [];
      const days = monthDayListForCurrentMonth();
      if (scope === 'all') {
        return days;
      }
      if (scope === 'range') {
        const start = parseInt(form.querySelector('[name="bulk_start_day"]').value || '0', 10);
        const end = parseInt(form.querySelector('[name="bulk_end_day"]').value || '0', 10);
        if (!start || !end || start > end) return [];
        return days.filter((day) => day >= start && day <= end);
      }
      if (scope === 'weekends') {
        return days.filter((day) => {
          const weekday = weekdayKeyForDay(day);
          return weekday === 0 || weekday === 6;
        });
      }
      if (scope === 'weekdays') {
        const selected = Array.from(form.querySelectorAll('[data-bulk-weekday]:checked')).map((input) => parseInt(input.value, 10));
        if (!selected.length) return [];
        return days.filter((day) => selected.includes(weekdayKeyForDay(day)));
      }
      if (scope === 'picked') {
        return selectedPickedDaysFromBulkForm(form);
      }
      return [];
    }

    async function loadRevisionSnapshots(project, month) {
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/revisions`);
      const rows = Array.isArray(data.revisions)
        ? data.revisions
        : Array.isArray(data.items)
          ? data.items
          : Array.isArray(data.snapshots)
            ? data.snapshots
            : [];
      const currentRevision = Number(month.revision || 0);
      if (currentRevision && !rows.some((item) => Number(item.revision || item.version || item.rev || 0) === currentRevision)) {
        rows.unshift({
          revision: currentRevision,
          updated_at: formatTimestamp(month.updated_at || month.created_at) || '-',
          entry_count: Object.values(month.entries_per_day || {}).reduce((total, entries) => total + (Array.isArray(entries) ? entries.length : 0), 0),
          current: true,
          note: '現在の版'
        });
      }
      return rows;
    }

    function renderRestoreModalRows(revisions) {
      if (!revisions.length) {
        return '<div class="cloud-empty-state"><p>復元できるリビジョンがまだありません。</p></div>';
      }

      const firstRestorableIndex = revisions.findIndex((revision) => !(revision.current || revision.is_current));
      return revisions.map((revision, index) => {
        const revisionNo = Number(revision.revision || revision.version || revision.rev || index + 1);
        const updatedAt = formatTimestamp(revision.updated_at || revision.timestamp || revision.created_at) || '-';
        const entryCount = revision.entry_count ?? revision.entries_count ?? revision.total_entries ?? '';
        const commentCount = revision.comment_count ?? revision.comments_count ?? '';
        const isCurrent = !!revision.current || !!revision.is_current;
        const labelParts = [`版 ${revisionNo}`];
        if (updatedAt && updatedAt !== '-') labelParts.push(updatedAt);
        if (entryCount !== '') labelParts.push(`${entryCount}件`);
        if (commentCount !== '') labelParts.push(`コメント${commentCount}件`);
        if (isCurrent) labelParts.push('現在の版');
        return `
          <label class="cloud-revision-row">
            <input
              type="radio"
              name="cloud-restore-revision"
              value="${revisionNo}"
              ${!isCurrent && index === firstRestorableIndex ? 'checked' : ''}
              ${isCurrent ? 'disabled' : ''}
            >
            <span class="cloud-revision-main">
              <span class="cloud-revision-title">${escapeHtml(labelParts.join(' / '))}</span>
              <span class="cloud-revision-meta">${escapeHtml(revision.note || revision.description || revision.editor_name || '')}</span>
            </span>
          </label>
        `;
      }).join('');
    }

    async function restoreSelectedRevision(modal) {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;
      if (!confirmDiscardUnsavedChanges('未保存の変更があります。保存せずに復元すると、このセッションでの編集内容は失われます。続行しますか？')) return;
      const selected = modal.querySelector('input[name="cloud-restore-revision"]:checked');
      const revision = selected ? parseInt(selected.value || '0', 10) : 0;
      if (!revision) {
        showFlash('復元するリビジョンを選択してください', 'error');
        return;
      }

      const payload = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/restore`, {
        method: 'POST',
        body: { revision }
      });
      state.projectPayload = unwrapProjectPayload(payload);
      state.baseMonth = state.projectPayload.month ? deepClone(state.projectPayload.month) : null;
      await renderWorkspaceWithSiteBranches(true);
      await loadProjects();
      await loadHistory(project.id);
      closeCloudModal('cloud-restore-modal');
      showFlash(`版 ${revision} を復元しました`, 'success');
    }

    async function openRestoreModal() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;

      const modal = openCloudModal('cloud-restore-modal', `復元 / ${formatMonthKey(currentMonthKey())}`);
      modalBody(modal).innerHTML = '<div class="cloud-empty-state"><p>リビジョンを読み込み中です...</p></div>';
      modalFooter(modal).innerHTML = `
        <button type="button" class="cloud-btn secondary" data-cloud-restore-cancel>閉じる</button>
        <button type="button" class="cloud-btn primary" data-cloud-restore-confirm>復元</button>
      `;
      modalFooter(modal).querySelector('[data-cloud-restore-cancel]').addEventListener('click', () => closeCloudModal('cloud-restore-modal'));

      try {
        const revisions = await loadRevisionSnapshots(project, month);
        modalBody(modal).innerHTML = `
          <p class="cloud-panel-note">選んだリビジョンを現在版として復元します。現在の内容は失われません。</p>
          <div class="cloud-revision-list">${renderRestoreModalRows(revisions)}</div>
        `;
        modalFooter(modal).querySelector('[data-cloud-restore-confirm]').addEventListener('click', () => {
          restoreSelectedRevision(modal).catch((error) => showFlash(error.message, 'error'));
        });
      } catch (error) {
        modalBody(modal).innerHTML = `<div class="cloud-empty-state"><p>${escapeHtml(error.message || 'リビジョン一覧の取得に失敗しました')}</p></div>`;
        modalFooter(modal).querySelector('[data-cloud-restore-confirm]').disabled = true;
      }
    }

    function buildBulkOptionSelect(mode) {
      return bulkOptionSectionsForMode(mode).map((section) => `
        <optgroup label="${escapeHtml(section.title)}">
          ${section.optionKeys.map((key) => `<option value="${escapeHtml(key)}">${escapeHtml(optionLabelForKey(key))}</option>`).join('')}
        </optgroup>

    function buildBulkWeekdayChecks() {
      const labels = ['日', '月', '火', '水', '木', '金', '土'];
      return labels.map((label, index) => `
        <label class="cloud-bulk-weekday">
          <input type="checkbox" data-bulk-weekday value="${index}" ${index >= 1 && index <= 5 ? 'checked' : ''}>
          <span>${label}</span>
        </label>
      `).join('');

    function updateBulkBranchOptions(form) {
      const branchField = form.querySelector('[data-bulk-branch-field]');
      const branchSelect = form.querySelector('[name="bulk_site_branch_row_id"]');
      const note = form.querySelector('[data-bulk-branch-note]');
      if (!branchField || !branchSelect) return;

      const project = currentProject();
      if (!project || !['scene', 'person'].includes(project.mode)) {
        branchField.classList.add('cloud-hidden');
        return;
      }

      const optionKey = (form.querySelector('[name="bulk_option"]') || {}).value || '';
      let availableBranches = currentProjectSiteBranches();
      if (project.mode === 'person') {
        const nameInput = form.querySelector('[name="bulk_name"]');
        try {
          availableBranches = JSON.parse(String(nameInput && nameInput.dataset.siteBranches || '[]'))
            .map((branch) => normalizeSiteBranchCandidate(branch)).filter(Boolean);
        } catch (_) {
          availableBranches = [];
        }
        if (!String(nameInput && nameInput.dataset.siteRowId || '').trim()) {
          branchField.classList.add('cloud-hidden');
          return;
        }
      }
      branchField.classList.remove('cloud-hidden');
      const normalizedOption = String(optionKey || '').trim().toUpperCase();
      const matchedBranches = normalizedOption
        ? availableBranches.filter((branch) => branch.cloudshift_option_key === normalizedOption)
        : availableBranches;
      const candidates = matchedBranches.length ? matchedBranches : availableBranches;
      const previousValue = normalizeSiteBranchRowId(branchSelect.value);
      branchSelect.innerHTML = ['<option value="">未設定</option>']
        .concat(candidates.map((branch) => (
          `<option value="${escapeHtml(branch.id)}" data-site-branch="${escapeHtml(branch.site_branch)}">${escapeHtml(`${branch.site_branch} / ${branch.option_label || optionLabelForKey(branch.cloudshift_option_key)}`)}</option>`
        )))
        .join('');

      let nextValue = previousValue && branchSelect.querySelector(`option[value="${previousValue}"]`) ? previousValue : '';
      if (!nextValue && candidates.length === 1) {
        nextValue = candidates[0].id;
        if (note) note.textContent = `候補が1件のため 枝${candidates[0].site_branch} を自動選択します`;
      } else if (!candidates.length) {
        if (note) note.textContent = '選べる枝番号がありません。このままでも適用できます';
      } else if (optionKey && !candidates.some((branch) => branch.cloudshift_option_key === String(optionKey).trim().toUpperCase())) {
        if (note) note.textContent = '一致する枝番号がないため、登録済みの枝番号を表示しています';
      } else if (note) {
        note.textContent = '必要に応じて枝番号を選択してください';
      }
      branchSelect.value = nextValue;
    }

    function updateBulkFieldVisibility(form) {
      const operation = form.querySelector('[name="bulk_operation"]').value;
      const scope = form.querySelector('[name="bulk_scope"]').value;
      const isRangeCopy = operation === 'range_copy';
      const template = form.querySelector('[data-bulk-template]');
      const copy = form.querySelector('[data-bulk-copy]');
      const rangeCopy = form.querySelector('[data-bulk-range-copy]');
      const scopeField = form.querySelector('[data-bulk-scope-field]');
      const ranges = form.querySelectorAll('[data-bulk-range]');
      const weekdays = form.querySelector('[data-bulk-weekdays]');
      const picked = form.querySelector('[data-bulk-picked-days]');
      const branchField = form.querySelector('[data-bulk-branch-field]');
      template.classList.toggle('cloud-hidden', isRangeCopy || operation === 'delete' || operation === 'copy');
      copy.classList.toggle('cloud-hidden', operation !== 'copy');
      if (rangeCopy) rangeCopy.classList.toggle('cloud-hidden', !isRangeCopy);
      if (scopeField) scopeField.classList.toggle('cloud-hidden', isRangeCopy);
      ranges.forEach((node) => node.classList.toggle('cloud-hidden', isRangeCopy || scope !== 'range'));
      weekdays.classList.toggle('cloud-hidden', isRangeCopy || scope !== 'weekdays');
      picked.classList.toggle('cloud-hidden', isRangeCopy || scope !== 'picked');
      if (branchField) {
        branchField.classList.toggle('cloud-hidden', isRangeCopy || operation === 'delete' || operation === 'copy' || currentProject().mode !== 'scene');
      }
    }

    function updateBulkPreview(form) {
      const preview = form.querySelector('[data-bulk-preview]');
      if (form.querySelector('[name="bulk_operation"]').value === 'range_copy') {
        const start = bulkRangeCopyValue(form, 'bulk_range_copy_start');
        const end = bulkRangeCopyValue(form, 'bulk_range_copy_end');
        const paste = bulkRangeCopyValue(form, 'bulk_range_copy_paste');
        const month = currentMonth();
        if (!month || !start || !end || end < start || !paste) {
          preview.textContent = 'コピー元の範囲とペースト基準日をカレンダーで選択してください';
          return;
        }
        const span = end - start;
        const totalDays = monthDays(month);
        const pasteEnd = paste + span;
        const within = Math.min(pasteEnd, totalDays);
        const skipped = pasteEnd > totalDays ? (pasteEnd - totalDays) : 0;
        let text = `コピー元 ${start}日〜${end}日（${span + 1}日分）を ${paste}日 から貼り付け（${paste}日〜${within}日）`;
        if (skipped) text += ` ※月末を超える ${skipped}日分はスキップ`;
        preview.textContent = text;
        return;
      }
      const targetDays = selectedDaysFromBulkForm(form);
      if (!targetDays.length) {
        preview.textContent = '対象範囲を選択してください';
        return;
      }
      const previewDays = targetDays.slice(0, 8).map((day) => `${day}日`).join('、');
      preview.textContent = targetDays.length > 8
        ? `対象 ${targetDays.length}日: ${previewDays} ほか`
        : `対象 ${targetDays.length}日: ${previewDays}`;
    }

    function buildLocalSummary(project, month, payload) {
      const entriesPerDay = payload && payload.entries_per_day ? payload.entries_per_day : currentEntriesSnapshot();
      const days = monthDays(month);
      const sections = optionSectionsForMode(project.mode).map((section) => ({
        title: section.title,
        optionKeys: Array.isArray(section.optionKeys) ? section.optionKeys.slice() : [],
        rows: section.optionKeys.map((key) => ({ label: optionLabelForKey(key), value: 0 }))
      }));
      const countsByKey = {};
      const uniquePeople = new Set();
      let totalEntries = 0;
      let activeDays = 0;
      let commentCount = 0;

      Object.keys(entriesPerDay || {}).forEach((dayKey) => {
        const entries = Array.isArray(entriesPerDay[dayKey]) ? entriesPerDay[dayKey] : [];
        if (!entries.length) return;
        activeDays += 1;
        entries.forEach((entry) => {
          const parsed = parseEntryValue(entry && entry.value);
          totalEntries += 1;
          if (entry && entry.comment) commentCount += 1;
          if (project.mode === 'scene') {
            const sceneKey = entry && entry.employee_number ? String(entry.employee_number) : parsed.name;
            if (sceneKey) uniquePeople.add(sceneKey);
          } else if (entry && entry.employee_number) {
            uniquePeople.add(String(entry.employee_number));
          }
          if (parsed.optionKey) {
            countsByKey[parsed.optionKey] = (countsByKey[parsed.optionKey] || 0) + 1;
          }
        });
      });

      sections.forEach((section) => {
        section.rows = section.rows.map((row, index) => {
          const key = section.optionKeys[index];
          return { label: row.label, value: countsByKey[key] || 0 };
        });
      });

      return {
        title: `${project.title} / ${formatMonthKey(currentMonthKey())}`,
        mode: project.mode,
        metrics: [
          { label: "日数", value: days },
          { label: "登録日", value: activeDays },
          { label: "エントリ", value: totalEntries },
          { label: "コメント", value: commentCount },
          { label: project.mode === 'scene' ? "人数" : "社員番号", value: uniquePeople.size },
          ...(parseInt((payload && payload.required_capacity) || month.required_capacity || 0, 10) > 0
            ? [{ label: "必要人数", value: parseInt((payload && payload.required_capacity) || month.required_capacity || 0, 10) }]
            : [])
        ],
        sections,
        note: payload ? "未保存の編集内容を反映したローカル集計です" : "保存済みの内容で集計しました"
      };
    }

    function normalizeSummaryPayload(payload, fallback) {
      if (!payload) return fallback;
      if (payload.summary) {
        const summary = payload.summary;
        if (Array.isArray(summary.overview) || (Array.isArray(summary.sections) && summary.sections.some((section) => Array.isArray(section.items)))) {
          return {
            title: summary.title || fallback.title,
            mode: summary.mode || fallback.mode,
            note: summary.revision ? `revision ${summary.revision} を集計しています` : (summary.note || fallback.note),
            metrics: Array.isArray(summary.overview)
              ? summary.overview.map((item) => ({
                  label: item.label || '',
                  value: item.value || ''
                }))
              : (fallback.metrics || []),
            sections: Array.isArray(summary.sections)
              ? summary.sections.map((section) => ({
                  title: section.title || '',
                  emptyMessage: section.empty_message || section.emptyMessage || '',
                  rows: Array.isArray(section.items)
                    ? section.items.map((item) => ({
                        label: item.meta ? `${item.label} / ${item.meta}` : item.label,
                        value: item.count
                      }))
                    : []
                }))
              : (fallback.sections || [])
          };
        }
        return summary;
      }
      if (payload.metrics || payload.sections) return payload;
      return fallback;
    }

      const basePath = PAGE.type === 'owner'

        : `/tools/shiftersync/cloudshift/api/public/${PAGE.accessMode}/${PAGE.token}/month/${month.year}/${month.month}/summary`;
      const payload = includeDraft ? collectMonthPayload() : null;
      const requestOptions = includeDraft

    function applyBulkRangeCopy(form) {
      const month = currentMonth();
      if (!month) return;
      const start = bulkRangeCopyValue(form, 'bulk_range_copy_start');
      const end = bulkRangeCopyValue(form, 'bulk_range_copy_end');
      const paste = bulkRangeCopyValue(form, 'bulk_range_copy_paste');
      const copyMode = form.querySelector('[name="bulk_range_copy_mode"]').value;
      if (!start || !end || end < start || !paste) {
        showFlash('コピー開始日・終了日・ペースト基準日をカレンダーで選択してください', 'error');
        return;
      }
      const totalDays = monthDays(month);
      const currentEntries = currentEntriesSnapshot();
      const nextEntries = deepClone(currentEntries);
      let copiedDays = 0;
      let copiedEntries = 0;
      let skippedDays = 0;
      for (let day = start; day <= end; day += 1) {
        const target = paste + (day - start);
        if (target < 1 || target > totalDays) {
          skippedDays += 1;
          continue;
        }
        const sourceEntries = Array.isArray(currentEntries[String(day)]) ? currentEntries[String(day)] : [];
        const clonedEntries = bulkCopyableSourceEntries(sourceEntries).map((entry) => cloneEntryForBulk(entry));
        const key = String(target);
        nextEntries[key] = copyMode === 'append'
          ? (Array.isArray(nextEntries[key]) ? nextEntries[key] : []).concat(clonedEntries)
          : clonedEntries;
        copiedDays += 1;
        copiedEntries += clonedEntries.length;
      }
      replaceCalendarEntries(nextEntries);
      closeCloudModal('cloud-bulk-modal');
      let message = `${start}日〜${end}日 を ${paste}日 から ${copiedDays}日分コピーしました（${copiedEntries}件）。保存ボタンで確定してください`;
      if (skippedDays) {
        message += `。月末を超える ${skippedDays}日分はスキップしました`;
      }
      showFlash(message, 'success');
    }

    function applyBulkEditFromModal(modal) {
      const form = modal.querySelector('form');
      const project = currentProject();
      if (!project || !form) return;
      const operation = form.querySelector('[name="bulk_operation"]').value;
      if (operation === 'range_copy') {
        applyBulkRangeCopy(form);
        return;
      }
      const targetDays = selectedDaysFromBulkForm(form);
      if (!targetDays.length) {
        showFlash('対象日を選択してください', 'error');
        return;
      }

      const currentEntries = currentEntriesSnapshot();
      const nextEntries = deepClone(currentEntries);

      if (operation === 'delete') {
        targetDays.forEach((day) => {
          nextEntries[String(day)] = [];
        });
      } else if (operation === 'copy') {
        const sourceDay = parseInt(form.querySelector('[name="bulk_copy_source_day"]').value || '0', 10);
        const copyMode = form.querySelector('[name="bulk_copy_mode"]').value;
        // 範囲コピーと同様、同期ミラー・代務要請の表示専用エントリは複製対象から外す。
        const sourceEntries = bulkCopyableSourceEntries(currentEntries[String(sourceDay)]);
        if (!sourceDay || !sourceEntries.length) {
          showFlash('コピー元の日にデータがありません', 'error');
          return;
        }
        targetDays.forEach((day) => {
          const clonedEntries = sourceEntries.map((entry) => cloneEntryForBulk(entry));
          const key = String(day);
          nextEntries[key] = copyMode === 'append'
            ? (Array.isArray(nextEntries[key]) ? nextEntries[key] : []).concat(clonedEntries)
            : clonedEntries;
        });
      } else {
        const templateEntry = createBulkEntryFromForm(null, {
          nameInput: form.querySelector('[name="bulk_name"]'),
          commentInput: form.querySelector('[name="bulk_comment"]'),
          optionSelect: form.querySelector('[name="bulk_option"]'),
          secondOptionSelect: form.querySelector('[name="bulk_second_option"]'),
          employeeInput: form.querySelector('[name="bulk_employee_number"]'),
          branchSelect: form.querySelector('[name="bulk_site_branch_row_id"]'),
          showAttendanceInput: form.querySelector('[name="bulk_show_attendance_time"]'),
          showReportInput: form.querySelector('[name="bulk_show_report_time"]')
        });
        if (!templateEntry) {
          showFlash('追加内容を入力してください', 'error');
          return;
        }
        targetDays.forEach((day) => {
          const key = String(day);
          const nextDayEntries = Array.isArray(nextEntries[key]) ? nextEntries[key].slice() : [];
          if (operation === 'replace') {
            nextEntries[key] = [cloneEntryForBulk(templateEntry)];
          } else {
            nextDayEntries.push(cloneEntryForBulk(templateEntry));
            nextEntries[key] = nextDayEntries;
          }
        });
      }

      replaceCalendarEntries(nextEntries);
      closeCloudModal('cloud-bulk-modal');
      showFlash(`対象 ${targetDays.length} 日を更新しました。保存ボタンで確定してください`, 'success');
    }

        && project.mode === 'person'

        && state.projectPayload.viewer_capabilities

      ShifterSync.buildCalendar(month.year, month.month, project.mode, displayedEntriesForMonth(month), {
        editable,
        substituteRequestEnabled,
        onSubstituteRequest: substituteRequestEnabled ? requestSubstituteFromEntry : null,
        entryAssistEnabled,
        onEntryAssist: entryAssistEnabled ? openAssistSearchForEntry : null,
        leaveChangeRequestEnabled,
        onLeaveChangeRequest: leaveChangeRequestEnabled ? submitLeaveChangeRequestFromPublicView : null,
        leaveChangePendingRequestEntryIds: state.projectPayload && state.projectPayload.viewer_capabilities
          ? state.projectPayload.viewer_capabilities.pending_leave_change_request_entry_ids || []
          : []
      });
      applyDraftVisualState(month);
      watchDraftVisualState(month);
      watchUnsavedState();

      if ($('cloud-open-pwa-url')) $('cloud-open-pwa-url').classList.toggle('cloud-hidden', !canManageProject);
      if ($('cloud-copy-pwa-url')) $('cloud-copy-pwa-url').classList.toggle('cloud-hidden', !canManageProject);

      if ($('cloud-editor-title')) {
        $('cloud-editor-title').innerHTML = month
          ? `<span>${escapeHtml(project.title)}</span><span class="cloud-editor-title-month"> / ${escapeHtml(formatMonthKey(currentMonthKey()))}</span><span id="cloud-unsaved-indicator" class="cloud-unsaved-indicator cloud-hidden">未保存有り</span>`
          : `<span>${escapeHtml(project.title)}</span><span class="cloud-editor-title-month"> / 未作成月</span><span id="cloud-unsaved-indicator" class="cloud-unsaved-indicator cloud-hidden">未保存有り</span>`;

      setShifterSyncSiteStateForCurrentProject();

    function collectMonthPayload() {
      const month = currentMonth();
      if (!month) return null;
      const baseMonth = state.baseMonth || month;
      const payload = {
        base_month: {
          year: baseMonth.year,
          month: baseMonth.month,
          revision: baseMonth.revision,
          created_at: baseMonth.created_at,
          updated_at: baseMonth.updated_at,
          required_capacity: baseMonth.required_capacity,
          entries_per_day: baseMonth.entries_per_day
        },
        required_capacity: parseInt(($('cloud-required-capacity') && $('cloud-required-capacity').value) || '0', 10) || 0,
        entries_per_day: entriesWithoutSubstituteRequestDisplays(currentEditingEntries()),
        leave_change_request_decisions: {
          approved: state.shiftBookSettings.approvedRequestIds.slice()
        }
      };
      if (currentProject() && currentProject().mode === 'large') {
        payload.meta_data = currentEditingMeta();
      }
      return payload;
    }

    async function renderWorkspaceWithSiteBranches(editable) {
      renderWorkspace(editable);
      try {
        await syncCurrentProjectSiteBranches();
      } catch (error) {
        showFlash(error.message, 'error');
      }
      resetUnsavedBaseline();
      updateUnsavedIndicator();
    }

    async function loadProjects() {
      if (PAGE.type !== 'owner') return;
      const data = await requestJson('/tools/shiftersync/cloudshift/api/list');
      state.projects = data.projects || [];
      renderProjectList();
      renderConflictCheckPanel();

    async function loadHistory(projectId) {
      if (PAGE.type !== 'owner') return;
      try {
        const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${projectId}/history`);
        renderHistory(data.history || []);
      } catch (_) {

    // 作成・取込の完了後に行う付随的な再読み込み（一覧・休暇連携・履歴）。
    // ここでの失敗が編集画面への遷移や本体表示を妨げないよう、個別に握りつぶす。
    // 特に休暇連携カレンダーの取得は外部サブシステムに依存し失敗し得るため、
    // 本処理を遷移後に分離しておくことが重要。
    async function loadProjectSidecars(projectId) {
      try {
        await loadProjects();
      } catch (error) {
        if (window.console && console.error) console.error('loadProjects failed', error);
      }
      try {
        await loadHistory(projectId);
      } catch (error) {

      }

    async function selectProject(projectId, monthKey, options) {
      const settings = options || {};
      const losesCurrentEdits = targetLosesCurrentEdits(projectId, monthKey);
      if (!settings.skipUnsavedGuard && losesCurrentEdits && !confirmDiscardUnsavedChanges()) {
        if ($('cloud-month-select')) $('cloud-month-select').value = currentMonthKey() || '';
        updateUnsavedIndicator();
        return false;
      }
      if (losesCurrentEdits) {
        clearPendingSubstituteRequests();
      }
      if (!settings.preserveSyncReturnContext) {
        state.syncReturnContext = null;
      }
      const suffix = monthKey ? `?month_key=${encodeURIComponent(monthKey)}` : '';
      const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/project/${projectId}${suffix}`));
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      state.editorMode = 'normal';
      state.shiftBookSettings.approvedRequestIds = [];
      syncAssistContext();
      renderProjectList();
      await renderWorkspaceWithSiteBranches(projectAccessRole(payload.project) !== 'viewer');
      if (projectAccessRole(payload.project) !== 'viewer') {
        await loadHistory(projectId);
      } else {
        renderHistory([]);
      }
      switchTab('editor');
      return true;
    }

    async function loadPublic(monthKey, options) {
      const settings = options || {};
      const losesCurrentEdits = currentMonth() && monthKey && String(monthKey) !== String(currentMonthKey() || '');
      if (!settings.skipUnsavedGuard && losesCurrentEdits && !confirmDiscardUnsavedChanges()) {
        if ($('cloud-month-select')) $('cloud-month-select').value = currentMonthKey() || '';
        updateUnsavedIndicator();
        return false;
      }
      if (losesCurrentEdits) {
        clearPendingSubstituteRequests();
      }
      const suffix = monthKey ? `?month_key=${encodeURIComponent(monthKey)}` : '';
      const payload = await requestJson(`/tools/shiftersync/cloudshift/api/public/${PAGE.accessMode}/${PAGE.token}${suffix}`);
      if (payload.authenticated_editor_name) {
        PAGE.authenticatedEditorName = payload.authenticated_editor_name;
        state.guestName = payload.authenticated_editor_name;
      }
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      state.editorMode = 'normal';
      state.shiftBookSettings.approvedRequestIds = [];
      syncAssistContext();
      updateCurrentProjectLabel();
      await renderWorkspaceWithSiteBranches(PAGE.accessMode === 'edit');
