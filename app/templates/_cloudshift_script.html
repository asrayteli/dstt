<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{{ url_for('static', filename='shiftersync/js/ss_common.js') }}"></script>
<script>
  (function() {
    'use strict';

    const PAGE = window.CLOUDSHIFT_PAGE || {};
    const state = {
      projects: [],
      projectPayload: null,
      baseMonth: null,
      guestName: PAGE.authenticatedEditorName || '',
      leaveSync: {
        calendars: [],
        selectedCalendarId: ''
      }
    };
    const employeeSearchCache = new Map();

    function $(id) {
      return document.getElementById(id);
    }

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function makeEntryId() {
      return `cloud-entry-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function parseEntryValue(value) {
      const text = String(value || '').trim();
      const match = text.match(/^!([^!]+)!(.+)$/);
      if (!match) {
        return { optionKey: null, name: text };
      }
      return { optionKey: match[1], name: match[2] };
    }

    function formatEntryValue(optionKey, name) {
      const safeName = String(name || '').trim();
      if (!safeName) {
        return '';
      }
      return optionKey ? `!${optionKey}!${safeName}` : safeName;
    }

    function optionMappings() {
      if (ShifterSync.getOptionMappings) {
        return ShifterSync.getOptionMappings();
      }
      return {
        A: "午前",
        P: "午後",
        E: "早番",
        L: "遅番",
        M: "マイクロ",
        C: "中型",
        O: "大型",
        W: "ワゴン",
        V: "役員車両",
        N1: "1号車",
        N2: "2号車",
        N3: "3号車",
        N4: "4号車",
        N5: "5号車",
        PAID: "有休",
        COMP: "代休",
        CONDOLENCE: "慶弔休暇",
        CARE: "介護休暇",
        REFRESH: "リフレッシュ休暇",
        OTHER: "その他"
      };
    }

    function optionSectionsForMode(mode) {
      if (ShifterSync.getOptionSectionsForMode) {
        return ShifterSync.getOptionSectionsForMode(mode) || [];
      }
      const sections = [{ title: "時間帯", optionKeys: ["A", "P", "E", "L"] }];
      if (mode === "person") {
        sections.push({ title: "休暇種別", optionKeys: ["PAID", "COMP", "CONDOLENCE", "CARE", "REFRESH", "OTHER"] });
      }
      sections.push(
        { title: "車両タイプ", optionKeys: ["M", "C", "O", "W", "V"] },
        { title: "車番", optionKeys: ["N1", "N2", "N3", "N4", "N5"] }
      );
      return sections;
    }

    function bulkOptionSectionsForMode(mode) {
      return optionSectionsForMode(mode).map((section) => ({
        title: section.title,
        optionKeys: Array.isArray(section.optionKeys) ? section.optionKeys.slice() : []
      }));
    }

    function optionLabelForKey(optionKey) {
      return optionMappings()[optionKey] || optionKey;
    }

    function monthDays(month) {
      if (!month) return 0;
      return new Date(month.year, month.month, 0).getDate();
    }

    function monthDayKeys(month) {
      return Array.from({ length: monthDays(month) }, (_, index) => String(index + 1));
    }

    function createBulkEntryFromForm(dayKey, refs) {
      const name = refs.nameInput ? refs.nameInput.value.trim() : '';
      if (!name) return null;
      const optionKey = refs.optionSelect ? refs.optionSelect.value : '';
      const comment = refs.commentInput ? refs.commentInput.value.trim() : '';
      const employeeNumber = refs.employeeInput
        ? refs.employeeInput.value.trim()
        : (refs.nameInput && refs.nameInput.dataset ? String(refs.nameInput.dataset.employeeNumber || '').trim() : '');
      return {
        id: makeEntryId(),
        value: formatEntryValue(optionKey || null, name),
        comment,
        employee_number: employeeNumber
      };
    }

    function cloneEntryForBulk(entry) {
      return {
        id: makeEntryId(),
        value: String(entry && entry.value ? entry.value : '').trim(),
        comment: String(entry && entry.comment ? entry.comment : '').trim(),
        employee_number: String(entry && entry.employee_number ? entry.employee_number : '').trim()
      };
    }

    function ensureCloudModal(modalId, titleText) {
      let modal = document.getElementById(modalId);
      if (modal) {
        if (titleText) {
          const title = modal.querySelector('[data-cloud-modal-title]');
          if (title) title.textContent = titleText;
        }
        return modal;
      }

      modal = document.createElement('div');
      modal.id = modalId;
      modal.className = 'cloud-modal-overlay cloud-hidden';
      modal.innerHTML = `
        <div class="cloud-modal-panel" role="dialog" aria-modal="true">
          <div class="cloud-modal-header">
            <div>
              <div class="cloud-modal-kicker">CloudShift</div>
              <h3 class="cloud-modal-title" data-cloud-modal-title>${escapeHtml(titleText || '')}</h3>
            </div>
            <button type="button" class="cloud-btn secondary cloud-modal-close" data-cloud-modal-close>閉じる</button>
          </div>
          <div class="cloud-modal-body" data-cloud-modal-body></div>
          <div class="cloud-modal-footer" data-cloud-modal-footer></div>
        </div>
      `;
      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          closeCloudModal(modalId);
        }
      });
      modal.querySelector('[data-cloud-modal-close]').addEventListener('click', () => closeCloudModal(modalId));
      document.body.appendChild(modal);
      return modal;
    }

    function closeCloudModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.add('cloud-hidden');
      }
      if (!document.querySelector('.cloud-modal-overlay:not(.cloud-hidden)')) {
        document.body.classList.remove('cloud-modal-open');
      }
    }

    function openCloudModal(modalId, titleText) {
      const modal = ensureCloudModal(modalId, titleText);
      if (titleText) {
        const title = modal.querySelector('[data-cloud-modal-title]');
        if (title) title.textContent = titleText;
      }
      modal.classList.remove('cloud-hidden');
      document.body.classList.add('cloud-modal-open');
      return modal;
    }

    function modalBody(modal) {
      return modal.querySelector('[data-cloud-modal-body]');
    }

    function modalFooter(modal) {
      return modal.querySelector('[data-cloud-modal-footer]');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function modeLabel(mode) {
      return mode === 'scene' ? '現場' : '個人';
    }

    function modeLongLabel(mode) {
      return mode === 'scene' ? '現場シフト' : '個人シフト';
    }

    function isLikelyMobileDevice() {
      const ua = navigator.userAgent || '';
      const touchDevice = navigator.maxTouchPoints > 1;
      const narrowViewport = window.matchMedia('(max-width: 820px)').matches;
      return narrowViewport || /iPhone|iPad|iPod|Android|Mobile/i.test(ua) || touchDevice;
    }

    function applyPublicDeviceMode() {
      if (PAGE.type !== 'public') return;
      const mobile = isLikelyMobileDevice();
      document.body.classList.toggle('cloud-device-mobile', mobile);
      document.body.classList.toggle('cloud-device-desktop', !mobile);
      document.body.setAttribute('data-cloud-device', mobile ? 'mobile' : 'desktop');
      const shell = document.querySelector('.cloud-public-shell');
      if (shell) {
        shell.setAttribute('data-cloud-device', mobile ? 'mobile' : 'desktop');
      }
    }

    function showFlash(message, type) {
      const node = $('cloud-flash');
      if (!node) return;
      node.className = `cloud-flash ${type || 'info'}`;
      node.textContent = message;
      node.style.display = 'block';
      clearTimeout(showFlash._timer);
      showFlash._timer = setTimeout(() => {
        node.style.display = 'none';
      }, 2600);
    }

    async function requestJson(url, options) {
      const opts = Object.assign({ headers: {} }, options || {});
      if (opts.body && !(opts.body instanceof FormData) && !opts.headers['Content-Type']) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      const response = await fetch(url, opts);
      const isJson = (response.headers.get('content-type') || '').includes('application/json');
      const payload = isJson ? await response.json() : null;
      if (!response.ok) {
        throw new Error((payload && payload.error) || 'リクエストに失敗しました');
      }
      return payload;
    }

    function unwrapProjectPayload(payload) {
      return payload && payload.project && payload.project.project ? payload.project : payload;
    }

    function currentProject() {
      return state.projectPayload ? state.projectPayload.project : null;
    }

    function currentMonth() {
      return state.projectPayload ? state.projectPayload.month : null;
    }

    function currentMonthKey() {
      return state.projectPayload ? state.projectPayload.active_month_key : null;
    }

    function isPersonProject() {
      const project = currentProject();
      return !!project && project.mode === 'person';
    }

    function parseMonthKey(monthKey) {
      const match = String(monthKey || '').match(/^(\d{4})-(\d{2})$/);
      if (!match) return null;
      return { year: parseInt(match[1], 10), month: parseInt(match[2], 10) };
    }

    function formatMonthKey(monthKey) {
      const parsed = parseMonthKey(monthKey);
      return parsed ? `${parsed.year}年${parsed.month}月` : '未選択';
    }

    function nextMonthKey(monthKey, delta) {
      const parsed = parseMonthKey(monthKey);
      if (!parsed) return null;
      const date = new Date(parsed.year, parsed.month - 1 + delta, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    function promptMonthKey(defaultValue) {
      return window.prompt('作成する年月を YYYY-MM 形式で入力してください', defaultValue || new Date().toISOString().slice(0, 7));
    }

    function selectedLeaveCalendarId() {
      const node = $('cloud-sync-calendar');
      return node ? node.value : state.leaveSync.selectedCalendarId;
    }

    function titleFieldRefs(kind) {
      if (kind === 'create') {
        return {
          input: $('cloud-create-title'),
          hidden: $('cloud-create-employee-number'),
          panel: $('cloud-create-candidate-panel'),
          note: $('cloud-create-selected-note'),
          label: $('cloud-create-title') ? $('cloud-create-title').previousElementSibling : null
        };
      }
      return {
        input: $('cloud-project-title'),
        hidden: $('cloud-project-employee-number'),
        panel: $('cloud-project-candidate-panel'),
        note: $('cloud-project-selected-note'),
        label: $('cloud-project-title') ? $('cloud-project-title').previousElementSibling : null
      };
    }

    function titleFieldMode(kind) {
      if (kind === 'create') {
        return $('cloud-create-mode') ? $('cloud-create-mode').value : 'scene';
      }
      return currentProject() ? currentProject().mode : 'scene';
    }

    function setTitleFieldMode(kind) {
      const refs = titleFieldRefs(kind);
      const isPerson = titleFieldMode(kind) === 'person';
      if (refs.label) {
        refs.label.textContent = isPerson ? '社員' : 'タイトル';
      }
      if (refs.input) {
        refs.input.placeholder = isPerson ? '社員名' : 'タイトル';
      }
      if (!isPerson) {
        if (refs.hidden) refs.hidden.value = '';
        if (refs.note) refs.note.textContent = '';
        if (refs.panel) {
          refs.panel.innerHTML = '';
          refs.panel.classList.add('cloud-hidden');
        }
      }
    }

    async function fetchEmployeeCandidates(query) {
      const key = String(query || '').trim();
      if (!key) return [];
      if (employeeSearchCache.has(key)) {
        return employeeSearchCache.get(key);
      }
      const response = await fetch(`/tools/pluslist/api/search_employee?q=${encodeURIComponent(key)}`, {
        credentials: 'same-origin',
        headers: { Accept: 'application/json' }
      });
      if (!response.ok) {
        throw new Error('社員候補の取得に失敗しました');
      }
      const payload = await response.json();
      const candidates = Array.isArray(payload)
        ? payload
        : Array.isArray(payload.results)
          ? payload.results
          : Array.isArray(payload.items)
            ? payload.items
            : Array.isArray(payload.employees)
              ? payload.employees
              : [];
      employeeSearchCache.set(key, candidates);
      return candidates;
    }

    function applyEmployeeCandidate(kind, candidate) {
      const refs = titleFieldRefs(kind);
      if (!refs.input || !refs.hidden) {
        return;
      }
      refs.input.value = String(candidate.employee_name || '');
      refs.input.dataset.selectedEmployeeName = String(candidate.employee_name || '');
      refs.hidden.value = String(candidate.employee_number || '');
      if (refs.note) {
        refs.note.textContent = refs.hidden.value ? `社員番号: ${refs.hidden.value}` : '';
      }
      if (refs.panel) {
        refs.panel.innerHTML = '';
        refs.panel.classList.add('cloud-hidden');
      }
    }

    function renderEmployeeCandidates(kind, candidates) {
      const refs = titleFieldRefs(kind);
      if (!refs.panel) {
        return;
      }
      if (titleFieldMode(kind) !== 'person') {
        refs.panel.innerHTML = '';
        refs.panel.classList.add('cloud-hidden');
        return;
      }
      const normalized = (Array.isArray(candidates) ? candidates : [])
        .map((item) => ({
          employee_number: String(item.employee_number || '').trim(),
          employee_name: String(item.employee_name || '').trim()
        }))
        .filter((item) => item.employee_number && item.employee_name);
      if (!normalized.length) {
        refs.panel.innerHTML = '<div style="color: var(--cloud-muted); font-size: 12px; padding: 4px 2px;">候補が見つかりません</div>';
        refs.panel.classList.remove('cloud-hidden');
        return;
      }
      refs.panel.innerHTML = normalized.slice(0, 8).map((candidate) => {
        const label = [
          candidate.employee_name,
          candidate.employee_number
        ].filter(Boolean).join(' / ');
        return `
          <button
            type="button"
            class="cloud-employee-candidate"
            data-kind="${kind}"
            data-employee-name="${escapeHtml(candidate.employee_name)}"
            data-employee-number="${escapeHtml(candidate.employee_number)}"
            style="display:block; width:100%; text-align:left; border:1px solid var(--cloud-line); border-radius:10px; background:#fff; color:var(--cloud-text); padding:8px 10px; cursor:pointer; margin:0 0 6px;"
          >${escapeHtml(label)}</button>
        `;
      }).join('');
      refs.panel.classList.remove('cloud-hidden');
    }

    let employeeSearchTimer = null;
    let bulkEmployeeSearchTimer = null;
    function scheduleEmployeeSearch(kind) {
      const refs = titleFieldRefs(kind);
      if (!refs.input || titleFieldMode(kind) !== 'person') {
        return;
      }
      const query = refs.input.value.trim();
      if (refs.input.dataset.selectedEmployeeName && refs.input.dataset.selectedEmployeeName !== query) {
        refs.hidden.value = '';
        if (refs.note) refs.note.textContent = '';
      }
      if (!query) {
        if (refs.panel) {
          refs.panel.innerHTML = '';
          refs.panel.classList.add('cloud-hidden');
        }
        return;
      }
      window.clearTimeout(employeeSearchTimer);
      employeeSearchTimer = window.setTimeout(async () => {
        const latestQuery = refs.input.value.trim();
        if (!latestQuery) {
          if (refs.panel) {
            refs.panel.innerHTML = '';
            refs.panel.classList.add('cloud-hidden');
          }
          return;
        }
        try {
          const candidates = await fetchEmployeeCandidates(latestQuery);
          if (refs.input.value.trim() !== latestQuery) {
            return;
          }
          renderEmployeeCandidates(kind, candidates);
        } catch (_) {
          if (refs.panel) {
            refs.panel.innerHTML = '';
            refs.panel.classList.add('cloud-hidden');
          }
        }
      }, 220);
    }

    function bulkFieldRefs(form) {
      if (!form) {
        return {
          nameInput: null,
          employeeInput: null,
          panel: null,
          note: null
        };
      }
      return {
        nameInput: form.querySelector('[name="bulk_name"]'),
        employeeInput: form.querySelector('[name="bulk_employee_number"]'),
        panel: form.querySelector('[data-bulk-candidate-panel]'),
        note: form.querySelector('[data-bulk-selected-note]')
      };
    }

    function clearBulkEmployeeSelection(form) {
      const refs = bulkFieldRefs(form);
      if (!refs.nameInput) return;
      refs.nameInput.removeAttribute('data-employee-number');
      refs.nameInput.removeAttribute('data-selected-employee-name');
      if (refs.employeeInput) {
        refs.employeeInput.value = '';
      }
      if (refs.note) {
        refs.note.textContent = '';
        refs.note.classList.add('cloud-hidden');
      }
    }

    function applyBulkEmployeeCandidate(form, candidate) {
      const refs = bulkFieldRefs(form);
      if (!refs.nameInput) return;
      refs.nameInput.value = String(candidate.employee_name || '');
      refs.nameInput.dataset.selectedEmployeeName = String(candidate.employee_name || '');
      refs.nameInput.dataset.employeeNumber = String(candidate.employee_number || '');
      if (refs.employeeInput) {
        refs.employeeInput.value = String(candidate.employee_number || '');
      }
      if (refs.note) {
        refs.note.textContent = candidate.employee_number ? `社員番号: ${candidate.employee_number}` : '';
        refs.note.classList.toggle('cloud-hidden', !candidate.employee_number);
      }
      if (refs.panel) {
        refs.panel.innerHTML = '';
        refs.panel.classList.add('cloud-hidden');
      }
    }

    function renderBulkEmployeeCandidates(form, candidates) {
      const refs = bulkFieldRefs(form);
      if (!refs.panel) {
        return;
      }
      const normalized = (Array.isArray(candidates) ? candidates : [])
        .map((item) => ({
          employee_number: String(item.employee_number || '').trim(),
          employee_name: String(item.employee_name || '').trim()
        }))
        .filter((item) => item.employee_number && item.employee_name);
      if (!normalized.length) {
        refs.panel.innerHTML = '<div style="color: var(--cloud-muted); font-size: 12px; padding: 4px 2px;">候補が見つかりません</div>';
        refs.panel.classList.remove('cloud-hidden');
        return;
      }
      refs.panel.innerHTML = normalized.slice(0, 8).map((candidate) => `
        <button
          type="button"
          class="cloud-bulk-employee-candidate"
          data-employee-name="${escapeHtml(candidate.employee_name)}"
          data-employee-number="${escapeHtml(candidate.employee_number)}"
          style="display:block; width:100%; text-align:left; border:1px solid var(--cloud-line); border-radius:10px; background:#fff; color:var(--cloud-text); padding:8px 10px; cursor:pointer; margin:0 0 6px;"
        >${escapeHtml(`${candidate.employee_name} / ${candidate.employee_number}`)}</button>
      `).join('');
      refs.panel.classList.remove('cloud-hidden');
    }

    function scheduleBulkEmployeeSearch(form) {
      const project = currentProject();
      const refs = bulkFieldRefs(form);
      if (!project || project.mode !== 'scene' || !refs.nameInput) {
        return;
      }
      const query = refs.nameInput.value.trim();
      if (refs.nameInput.dataset.selectedEmployeeName && refs.nameInput.dataset.selectedEmployeeName !== query) {
        clearBulkEmployeeSelection(form);
      }
      if (!query) {
        if (refs.panel) {
          refs.panel.innerHTML = '';
          refs.panel.classList.add('cloud-hidden');
        }
        return;
      }
      window.clearTimeout(bulkEmployeeSearchTimer);
      bulkEmployeeSearchTimer = window.setTimeout(async () => {
        const latestQuery = refs.nameInput.value.trim();
        if (!latestQuery) {
          if (refs.panel) {
            refs.panel.innerHTML = '';
            refs.panel.classList.add('cloud-hidden');
          }
          return;
        }
        try {
          const candidates = await fetchEmployeeCandidates(latestQuery);
          if (refs.nameInput.value.trim() !== latestQuery) {
            return;
          }
          renderBulkEmployeeCandidates(form, candidates);
        } catch (_) {
          if (refs.panel) {
            refs.panel.innerHTML = '';
            refs.panel.classList.add('cloud-hidden');
          }
        }
      }, 220);
    }

    function updateCurrentProjectLabel() {
      const node = $('cloud-current-project') || $('cloud-public-identity');
      if (!node) return;

      if (PAGE.type === 'public') {
        if (PAGE.accessMode !== 'edit') {
          node.classList.add('cloud-hidden');
          return;
        }

        const editorName = PAGE.authenticatedEditorName || state.guestName;
        if (!editorName) {
          node.classList.add('cloud-hidden');
          return;
        }

        node.textContent = `編集中: ${editorName}`;
        node.classList.remove('cloud-hidden');

        const note = $('cloud-public-editor-note');
        if (note) {
          note.textContent = `${editorName} として編集中です`;
        }
        return;
      }

      const project = currentProject();
      node.textContent = project ? `${project.title} / ${modeLabel(project.mode)}` : '未選択';
    }

    function switchTab(tabName) {
      document.querySelectorAll('[data-cloud-tab]').forEach((button) => {
        button.classList.toggle('is-active', button.getAttribute('data-cloud-tab') === tabName);
      });
      document.querySelectorAll('.cloud-panel').forEach((panel) => {
        panel.classList.toggle('is-active', panel.id === `cloud-panel-${tabName}`);
      });
    }

    function renderProjectList() {
      const list = $('cloud-project-list');
      if (!list) return;

      if (!state.projects.length) {
        list.innerHTML = '<div class="cloud-empty-state"><p>まだシフト表がありません。</p></div>';
        return;
      }

      list.innerHTML = state.projects.map((project) => `
        <article class="cloud-project-item${currentProject() && currentProject().id === project.id ? ' active' : ''}" data-project-id="${project.id}">
          <div class="cloud-project-card-head">
            <div>
              <h3>${escapeHtml(project.title)}</h3>
              <p>${modeLongLabel(project.mode)} / ${project.month_count}か月</p>
            </div>
            <span class="cloud-badge">${project.latest_month_key ? escapeHtml(formatMonthKey(project.latest_month_key)) : '未作成月'}</span>
          </div>
          <div class="cloud-project-meta">
            <span>最終更新: ${escapeHtml(project.updated_at || '-')}</span>
          </div>
        </article>
      `).join('');
    }

    function renderHistory(history) {
      const list = $('cloud-history-list');
      if (!list) return;

      if (!history || history.length === 0) {
        list.innerHTML = '<div class="cloud-empty-state"><p>編集履歴はまだありません。</p></div>';
        return;
      }

      list.innerHTML = history.map((item) => `
        <article class="cloud-history-item">
          <div class="cloud-badge">${escapeHtml(item.timestamp || '')} / ${escapeHtml(item.editor_name || '')}</div>
          <ul>${(item.changes || []).map((change) => `<li>${escapeHtml(change)}</li>`).join('')}</ul>
        </article>
      `).join('');
    }

    function ensureActionButton(buttonId, label, className, onClick) {
      if (document.getElementById(buttonId)) {
        return;
      }
      const exportButton = document.getElementById('cloud-export-xlsx');
      const row = exportButton ? exportButton.closest('.cloud-actions.compact') : null;
      if (!row) {
        return;
      }
      const button = document.createElement('button');
      button.type = 'button';
      button.id = buttonId;
      button.className = className;
      button.textContent = label;
      button.addEventListener('click', onClick);
      row.appendChild(button);
    }

    function ensureCloudActionButtons() {
      ensureActionButton('cloud-open-summary', '月間集計', 'cloud-btn secondary', () => openSummaryModal().catch((error) => showFlash(error.message, 'error')));
      if (PAGE.type === 'owner' || PAGE.accessMode === 'edit') {
        ensureActionButton('cloud-open-bulk-edit', '範囲一括編集', 'cloud-btn secondary', () => openBulkEditModal().catch((error) => showFlash(error.message, 'error')));
      }
      if (PAGE.type === 'owner') {

    function currentEntriesSnapshot() {
      return ShifterSync.getEntriesPerDay ? ShifterSync.getEntriesPerDay() : {};
    }

    function replaceCalendarEntries(nextEntries) {
      if (!ShifterSync.replaceEntriesPerDay) return;
      ShifterSync.replaceEntriesPerDay(nextEntries);
      if (currentMonth()) {
        ShifterSync.setState('mode', currentProject().mode);
        ShifterSync.setState('name', currentProject().title);
      }
    }

    function monthDayListForCurrentMonth() {
      return monthDayKeys(currentMonth()).map((day) => parseInt(day, 10));
    }

    function weekdayKeyForDay(day) {
      const month = currentMonth();
      if (!month) return null;
      return new Date(month.year, month.month - 1, day).getDay();
    }

    function selectedDaysFromBulkForm(form) {
      const scope = form.querySelector('[name="bulk_scope"]').value;
      const month = currentMonth();
      if (!month) return [];
      const days = monthDayListForCurrentMonth();
      if (scope === 'all') {
        return days;
      }
      if (scope === 'range') {
        const start = parseInt(form.querySelector('[name="bulk_start_day"]').value || '0', 10);
        const end = parseInt(form.querySelector('[name="bulk_end_day"]').value || '0', 10);
        if (!start || !end || start > end) return [];
        return days.filter((day) => day >= start && day <= end);
      }
      if (scope === 'weekends') {
        return days.filter((day) => {
          const weekday = weekdayKeyForDay(day);
          return weekday === 0 || weekday === 6;
        });
      }
      if (scope === 'weekdays') {
        const selected = Array.from(form.querySelectorAll('[data-bulk-weekday]:checked')).map((input) => parseInt(input.value, 10));
        if (!selected.length) return [];
        return days.filter((day) => selected.includes(weekdayKeyForDay(day)));
      }
      return [];
    }

    async function loadRevisionSnapshots(project, month) {
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/revisions`);
      const rows = Array.isArray(data.revisions)
        ? data.revisions
        : Array.isArray(data.items)
          ? data.items
          : Array.isArray(data.snapshots)
            ? data.snapshots
            : [];
      const currentRevision = Number(month.revision || 0);
      if (currentRevision && !rows.some((item) => Number(item.revision || item.version || item.rev || 0) === currentRevision)) {
        rows.unshift({
          revision: currentRevision,
          updated_at: month.updated_at || month.created_at || '-',
          entry_count: Object.values(month.entries_per_day || {}).reduce((total, entries) => total + (Array.isArray(entries) ? entries.length : 0), 0),
          current: true,
          note: '現在の版'
        });
      }
      return rows;
    }

    function renderRestoreModalRows(revisions) {
      if (!revisions.length) {
        return '<div class="cloud-empty-state"><p>復元できるリビジョンがまだありません。</p></div>';
      }

      const firstRestorableIndex = revisions.findIndex((revision) => !(revision.current || revision.is_current));
      return revisions.map((revision, index) => {
        const revisionNo = Number(revision.revision || revision.version || revision.rev || index + 1);
        const updatedAt = revision.updated_at || revision.timestamp || revision.created_at || '-';
        const entryCount = revision.entry_count ?? revision.entries_count ?? revision.total_entries ?? '';
        const commentCount = revision.comment_count ?? revision.comments_count ?? '';
        const isCurrent = !!revision.current || !!revision.is_current;
        const labelParts = [`rev ${revisionNo}`];
        if (updatedAt && updatedAt !== '-') labelParts.push(updatedAt);
        if (entryCount !== '') labelParts.push(`entries ${entryCount}`);
        if (commentCount !== '') labelParts.push(`comments ${commentCount}`);
        if (isCurrent) labelParts.push('current');
        return `
          <label class="cloud-revision-row">
            <input
              type="radio"
              name="cloud-restore-revision"
              value="${revisionNo}"
              ${!isCurrent && index === firstRestorableIndex ? 'checked' : ''}
              ${isCurrent ? 'disabled' : ''}
            >
            <span class="cloud-revision-main">
              <span class="cloud-revision-title">${escapeHtml(labelParts.join(' / '))}</span>
              <span class="cloud-revision-meta">${escapeHtml(revision.note || revision.description || revision.editor_name || '')}</span>
            </span>
          </label>
        `;
      }).join('');
    }

    async function restoreSelectedRevision(modal) {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;
      const selected = modal.querySelector('input[name="cloud-restore-revision"]:checked');
      const revision = selected ? parseInt(selected.value || '0', 10) : 0;
      if (!revision) {
        showFlash('復元するリビジョンを選択してください', 'error');
        return;
      }

      const payload = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/restore`, {
        method: 'POST',
        body: { revision }
      });
      state.projectPayload = unwrapProjectPayload(payload);
      state.baseMonth = state.projectPayload.month ? deepClone(state.projectPayload.month) : null;
      renderWorkspace(true);
      await loadProjects();
      await loadHistory(project.id);
      closeCloudModal('cloud-restore-modal');
      showFlash(`rev ${revision} を復元しました`, 'success');
    }

    async function openRestoreModal() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;

      const modal = openCloudModal('cloud-restore-modal', `復元 / ${formatMonthKey(currentMonthKey())}`);
      modalBody(modal).innerHTML = '<div class="cloud-empty-state"><p>リビジョンを読み込み中です...</p></div>';

    function updateBulkPreview(form) {
      const preview = form.querySelector('[data-bulk-preview]');

      }

        ? `対象 ${targetDays.length}日: ${previewDays} ほか`

    function buildLocalSummary(project, month, payload) {
      const entriesPerDay = payload && payload.entries_per_day ? payload.entries_per_day : currentEntriesSnapshot();
      const days = monthDays(month);
      const sections = optionSectionsForMode(project.mode).map((section) => ({
        title: section.title,
        optionKeys: Array.isArray(section.optionKeys) ? section.optionKeys.slice() : [],
        rows: section.optionKeys.map((key) => ({ label: optionLabelForKey(key), value: 0 }))
      }));
      const countsByKey = {};
      const uniquePeople = new Set();
      let totalEntries = 0;
      let activeDays = 0;
      let commentCount = 0;

      Object.keys(entriesPerDay || {}).forEach((dayKey) => {
        const entries = Array.isArray(entriesPerDay[dayKey]) ? entriesPerDay[dayKey] : [];
        if (!entries.length) return;
        activeDays += 1;
        entries.forEach((entry) => {
          const parsed = parseEntryValue(entry && entry.value);
          totalEntries += 1;
          if (entry && entry.comment) commentCount += 1;
          if (project.mode === 'scene') {
            const sceneKey = entry && entry.employee_number ? String(entry.employee_number) : parsed.name;
            if (sceneKey) uniquePeople.add(sceneKey);
          } else if (entry && entry.employee_number) {
            uniquePeople.add(String(entry.employee_number));
          }
          if (parsed.optionKey) {
            countsByKey[parsed.optionKey] = (countsByKey[parsed.optionKey] || 0) + 1;
          }
        });
      });

      sections.forEach((section) => {
        section.rows = section.rows.map((row, index) => {
          const key = section.optionKeys[index];
          return { label: row.label, value: countsByKey[key] || 0 };
        });
      });

      return {
        title: `${project.title} / ${formatMonthKey(currentMonthKey())}`,
        mode: project.mode,
        metrics: [
          { label: "日数", value: days },
          { label: "登録日", value: activeDays },
          { label: "エントリ", value: totalEntries },
          { label: "コメント", value: commentCount },
          { label: project.mode === 'scene' ? "人数" : "社員番号", value: uniquePeople.size },
          ...(parseInt((payload && payload.required_capacity) || month.required_capacity || 0, 10) > 0
            ? [{ label: "必要人数", value: parseInt((payload && payload.required_capacity) || month.required_capacity || 0, 10) }]
            : [])
        ],
        sections,
        note: payload ? "未保存の編集内容を反映したローカル集計です" : "保存済みの内容で集計しました"
      };
    }

    function normalizeSummaryPayload(payload, fallback) {
      if (!payload) return fallback;
      if (payload.summary) {
        const summary = payload.summary;
        if (Array.isArray(summary.overview) || (Array.isArray(summary.sections) && summary.sections.some((section) => Array.isArray(section.items)))) {
          return {
            title: summary.title || fallback.title,
            mode: summary.mode || fallback.mode,
            note: summary.revision ? `revision ${summary.revision} を集計しています` : (summary.note || fallback.note),
            metrics: Array.isArray(summary.overview)
              ? summary.overview.map((item) => ({
                  label: item.label || '',
                  value: item.value || ''
                }))
              : (fallback.metrics || []),
            sections: Array.isArray(summary.sections)
              ? summary.sections.map((section) => ({
                  title: section.title || '',
                  emptyMessage: section.empty_message || section.emptyMessage || '',
                  rows: Array.isArray(section.items)
                    ? section.items.map((item) => ({
                        label: item.meta ? `${item.label} / ${item.meta}` : item.label,
                        value: item.count
                      }))
                    : []
                }))
              : (fallback.sections || [])
          };
        }
        return summary;
      }
      if (payload.metrics || payload.sections) return payload;
      return fallback;
    }

    async function fetchMonthlySummary(project, month, includeDraft) {
      const basePath = PAGE.type === 'owner'
        ? `/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/summary`
        : `/tools/shiftersync/cloudshift/api/public/${PAGE.accessMode}/${PAGE.token}/month/${month.year}/${month.month}/summary`;
      const payload = includeDraft ? collectMonthPayload() : null;
      const requestOptions = includeDraft
        ? { method: 'POST', body: Object.assign({ mode: project.mode }, payload) }
        : { method: 'GET' };
      try {
        return normalizeSummaryPayload(await requestJson(basePath, requestOptions), buildLocalSummary(project, month, includeDraft ? payload : null));
      } catch (_) {
        return buildLocalSummary(project, month, includeDraft ? payload : null);
      }
    }

    function applyBulkEditFromModal(modal) {
      const form = modal.querySelector('form');
      const project = currentProject();
      if (!project || !form) return;
      const targetDays = selectedDaysFromBulkForm(form);
      if (!targetDays.length) {
        showFlash('対象日を選択してください', 'error');
        return;
      }

      const operation = form.querySelector('[name="bulk_operation"]').value;
      const currentEntries = currentEntriesSnapshot();
      const nextEntries = deepClone(currentEntries);

      if (operation === 'delete') {
        targetDays.forEach((day) => {
          nextEntries[String(day)] = [];
        });
      } else if (operation === 'copy') {
        const sourceDay = parseInt(form.querySelector('[name="bulk_copy_source_day"]').value || '0', 10);
        const copyMode = form.querySelector('[name="bulk_copy_mode"]').value;
        const sourceEntries = Array.isArray(currentEntries[String(sourceDay)]) ? currentEntries[String(sourceDay)] : [];
        if (!sourceDay || !sourceEntries.length) {
          showFlash('コピー元の日にデータがありません', 'error');
          return;
        }
        targetDays.forEach((day) => {
          const clonedEntries = sourceEntries.map((entry) => cloneEntryForBulk(entry));
          const key = String(day);
          nextEntries[key] = copyMode === 'append'
            ? (Array.isArray(nextEntries[key]) ? nextEntries[key] : []).concat(clonedEntries)
            : clonedEntries;
        });
      } else {
        const templateEntry = createBulkEntryFromForm(null, {
          nameInput: form.querySelector('[name="bulk_name"]'),
          commentInput: form.querySelector('[name="bulk_comment"]'),
          optionSelect: form.querySelector('[name="bulk_option"]'),
          employeeInput: form.querySelector('[name="bulk_employee_number"]')
        });
        if (!templateEntry) {
          showFlash('追加内容を入力してください', 'error');
          return;
        }
        targetDays.forEach((day) => {
          const key = String(day);
          const nextDayEntries = Array.isArray(nextEntries[key]) ? nextEntries[key].slice() : [];
          if (operation === 'replace') {
            nextEntries[key] = [cloneEntryForBulk(templateEntry)];
          } else {
            nextDayEntries.push(cloneEntryForBulk(templateEntry));
            nextEntries[key] = nextDayEntries;
          }
        });
      }

      replaceCalendarEntries(nextEntries);
      closeCloudModal('cloud-bulk-modal');
      showFlash(`対象 ${targetDays.length} 日を更新しました。保存ボタンで確定してください`, 'success');
    }

        return;
      }

      const calendars = state.leaveSync.calendars || [];
      if (!calendars.length) {
        select.innerHTML = '<option value="">営業所がありません</option>';
        select.disabled = true;
        button.disabled = true;
        return;
      }

      if (!state.leaveSync.selectedCalendarId || !calendars.some((item) => item.calendar_id === state.leaveSync.selectedCalendarId)) {
        state.leaveSync.selectedCalendarId = calendars[0].calendar_id;
      }

      select.innerHTML = calendars.map((item) => `
        <option value="${escapeHtml(item.calendar_id)}" ${item.calendar_id === state.leaveSync.selectedCalendarId ? 'selected' : ''}>
          ${escapeHtml(item.name || item.calendar_id)}
        </option>
      `).join('');
      select.disabled = false;
      button.disabled = !selectedLeaveCalendarId();
    }

    async function loadLeaveSyncCalendars(projectId) {
      if (PAGE.type !== 'owner' || !projectId) {
        state.leaveSync.calendars = [];
        state.leaveSync.selectedCalendarId = '';
        renderLeaveSyncControls();
        return;
      }

      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${projectId}/leave-sync/calendars`);
      state.leaveSync.calendars = data.calendars || [];
      if (!state.leaveSync.calendars.some((item) => item.calendar_id === state.leaveSync.selectedCalendarId)) {
        state.leaveSync.selectedCalendarId = state.leaveSync.calendars[0] ? state.leaveSync.calendars[0].calendar_id : '';
      }
      renderLeaveSyncControls();
    }

    async function syncCurrentMonthLeaves() {
      const project = currentProject();
      const month = currentMonth();
      const calendarId = selectedLeaveCalendarId();
      if (!project || !month) {
        return;
      }
      if (!calendarId) {
        showFlash('営業所を選択してください', 'error');
        return;
      }

      const result = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/leave-sync/${month.year}/${month.month}`, {
        method: 'POST',
        body: {
          calendar_id: calendarId
        }
      });

      let message = `月次マネージャーへ反映しました: 登録 ${result.created_total} 件 / 置換削除 ${result.removed_total} 件`;
      if (result.skipped_total) {
        message += ` / スキップ ${result.skipped_total} 件`;
      }
      showFlash(message, result.skipped_total ? 'info' : 'success');
      if (project.id) {
        await loadHistory(project.id);
      }
    }

    function buildCalendarHost(targetId) {
      const host = $(targetId);
      if (!host) return;
      host.innerHTML = `
        <div class="container cloud-calendar-container">
          <div class="weekday-header">
            <div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div>
          </div>
          <div id="shiftGrid" class="calendar-grid"></div>
        </div>
      `;
    }

    function mountEditor(editable) {
      const project = currentProject();
      const month = currentMonth();
      const host = $('cloud-editor-panel');
      if (!host || !project) return;

      if (!month) {
        host.innerHTML = '';
        const empty = $('cloud-month-empty') || $('cloud-public-empty');
        if (empty) empty.classList.remove('cloud-hidden');
        return;
      }

      const empty = $('cloud-month-empty') || $('cloud-public-empty');
      if (empty) empty.classList.add('cloud-hidden');

      buildCalendarHost('cloud-editor-panel');
      ShifterSync.setState('mode', project.mode);
      ShifterSync.setState('name', project.title);
      ShifterSync.setState('capacityEnabled', (parseInt(($('cloud-required-capacity') && $('cloud-required-capacity').value) || '0', 10) || 0) > 0);
      ShifterSync.setState('requiredCapacity', parseInt(($('cloud-required-capacity') && $('cloud-required-capacity').value) || '0', 10) || 0);
      ShifterSync.buildCalendar(month.year, month.month, project.mode, month.entries_per_day || {}, { editable });
    }

    function renderWorkspace(editable) {
      const project = currentProject();
      const month = currentMonth();

      if (PAGE.type === 'owner') {
        $('cloud-empty-state').classList.toggle('cloud-hidden', !!project);
        $('cloud-workspace').classList.toggle('cloud-hidden', !project);
      }

      if (!project) {
        if ($('cloud-editor-panel')) $('cloud-editor-panel').innerHTML = '';
        updateCurrentProjectLabel();
        renderLeaveSyncControls();
        if (PAGE.type === 'owner') renderHistory([]);
        return;
      }

      updateCurrentProjectLabel();

      if ($('cloud-project-title')) {
        $('cloud-project-title').value = project.title || '';
        $('cloud-project-title').dataset.selectedEmployeeName = project.title || '';
      }
      if ($('cloud-project-employee-number')) $('cloud-project-employee-number').value = project.employee_number || '';
      if ($('cloud-project-selected-note')) {
        $('cloud-project-selected-note').textContent = project.employee_number ? `社員番号: ${project.employee_number}` : '';
      }
      setTitleFieldMode('project');
      if ($('cloud-view-url')) $('cloud-view-url').value = project.urls.view_url || '';
      if ($('cloud-edit-url')) $('cloud-edit-url').value = project.urls.edit_url || '';

      if ($('cloud-project-badges')) {
        $('cloud-project-badges').innerHTML = `
          <span class="cloud-badge">${modeLongLabel(project.mode)}</span>
          <span class="cloud-badge">${(project.month_keys || []).length}か月</span>
          <span class="cloud-badge">${escapeHtml(project.updated_at || '')}</span>
        `;
      }

      if ($('cloud-month-select')) {
        $('cloud-month-select').innerHTML = (project.month_keys || []).map((key) => `
          <option value="${key}" ${key === currentMonthKey() ? 'selected' : ''}>${formatMonthKey(key)}</option>
        `).join('');
      }

      if ($('cloud-required-capacity')) {
        $('cloud-required-capacity').value = month ? (month.required_capacity || 0) : 0;
        $('cloud-required-capacity').disabled = !editable;
      }

      renderLeaveSyncControls();

      if ($('cloud-capacity-field')) {
        $('cloud-capacity-field').classList.toggle('cloud-hidden', PAGE.accessMode !== 'edit');
      }

      if ($('cloud-save-month')) $('cloud-save-month').classList.toggle('cloud-hidden', !editable);
      if ($('cloud-add-prev-month')) $('cloud-add-prev-month').classList.toggle('cloud-hidden', !editable);
      if ($('cloud-add-next-month')) $('cloud-add-next-month').classList.toggle('cloud-hidden', !editable);
      if ($('cloud-create-first-month')) $('cloud-create-first-month').classList.toggle('cloud-hidden', !editable);
      if ($('cloud-open-summary')) $('cloud-open-summary').classList.toggle('cloud-hidden', !month);
      if ($('cloud-open-bulk-edit')) $('cloud-open-bulk-edit').classList.toggle('cloud-hidden', !month || !editable || (PAGE.type === 'public' && PAGE.accessMode !== 'edit'));
      if ($('cloud-open-restore')) $('cloud-open-restore').classList.toggle('cloud-hidden', !month || PAGE.type !== 'owner');

      if ($('cloud-editor-title')) {
        $('cloud-editor-title').textContent = month ? `${project.title} / ${formatMonthKey(currentMonthKey())}` : `${project.title} / 未作成月`;
      }

      if ($('cloud-editor-meta')) {
        $('cloud-editor-meta').textContent = month
          ? `${modeLongLabel(project.mode)} / リビジョン ${month.revision}`
          : '最初の月を作成するとカレンダーを編集できます';
      }

      mountEditor(editable);
    }

    function collectMonthPayload() {
      const month = currentMonth();
      if (!month) return null;
      const baseMonth = state.baseMonth || month;
      return {
        base_month: {
          year: baseMonth.year,
          month: baseMonth.month,
          revision: baseMonth.revision,
          created_at: baseMonth.created_at,
          updated_at: baseMonth.updated_at,
          required_capacity: baseMonth.required_capacity,
          entries_per_day: baseMonth.entries_per_day
        },
        required_capacity: parseInt(($('cloud-required-capacity') && $('cloud-required-capacity').value) || '0', 10) || 0,
        entries_per_day: ShifterSync.getEntriesPerDay()
      };
    }

    async function loadProjects() {
      if (PAGE.type !== 'owner') return;
      const data = await requestJson('/tools/shiftersync/cloudshift/api/list');
      state.projects = data.projects || [];
      renderProjectList();
    }

    async function loadHistory(projectId) {
      if (PAGE.type !== 'owner') return;
      try {
        const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${projectId}/history`);
        renderHistory(data.history || []);
      } catch (_) {
        renderHistory([]);
      }
    }

    async function selectProject(projectId, monthKey) {
      const suffix = monthKey ? `?month_key=${encodeURIComponent(monthKey)}` : '';
      const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/project/${projectId}${suffix}`));
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      renderProjectList();
      renderWorkspace(true);
      await loadLeaveSyncCalendars(projectId);
      await loadHistory(projectId);
      switchTab('editor');
    }

    async function loadPublic(monthKey) {
      const suffix = monthKey ? `?month_key=${encodeURIComponent(monthKey)}` : '';
      const payload = await requestJson(`/tools/shiftersync/cloudshift/api/public/${PAGE.accessMode}/${PAGE.token}${suffix}`);
      if (payload.authenticated_editor_name) {
        PAGE.authenticatedEditorName = payload.authenticated_editor_name;
        state.guestName = payload.authenticated_editor_name;
      }
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      updateCurrentProjectLabel();
      renderWorkspace(PAGE.accessMode === 'edit');
    }

    function guestNameKey() {
      return `cloudshift:guest:${PAGE.token}`;
    }

    function ensureGuestName() {
      if (PAGE.authenticatedEditorName) {
        state.guestName = PAGE.authenticatedEditorName;
        updateCurrentProjectLabel();
        return true;
      }

      if (!state.guestName) {
        state.guestName = window.localStorage.getItem(guestNameKey()) || '';
      }

      if (!state.guestName) {
        const entered = window.prompt('編集者名を入力してください', '');
        if (!entered || !entered.trim()) {
          showFlash('編集者名を入力してください', 'error');
          return false;
        }
        state.guestName = entered.trim();
        window.localStorage.setItem(guestNameKey(), state.guestName);
      }

      updateCurrentProjectLabel();
      return true;
    }

    async function saveMonthOwner() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;

      const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}`, {
        method: 'PUT',
        body: collectMonthPayload()
      }));
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      renderWorkspace(true);
      await loadProjects();
      await loadHistory(project.id);
      showFlash('この月を保存しました', 'success');
    }

    async function saveMonthPublic() {
      const month = currentMonth();
      if (!month || !ensureGuestName()) return;

      const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/public/edit/${PAGE.token}/month/${month.year}/${month.month}`, {
        method: 'PUT',
        body: Object.assign(collectMonthPayload(), { editor_name: state.guestName })
      }));
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      renderWorkspace(true);
      showFlash('この月を保存しました', 'success');
    }

    async function createMonth(targetKey, ownerMode) {
      const project = currentProject();
      if (!project) return;

      const parsed = parseMonthKey(targetKey);
      if (!parsed) {
        showFlash('年月を YYYY-MM 形式で入力してください', 'error');
        return;
      }

      const sourceMonthKey = currentMonthKey();
      const useCopy = sourceMonthKey
        ? window.confirm(`${formatMonthKey(targetKey)} を現在の月からコピーして作成しますか？\nOK: コピー / キャンセル: 空で作成`)
        : false;

      const body = {
        year: parsed.year,
        month: parsed.month,
        init_mode: useCopy ? 'copy' : 'blank',
        source_month_key: useCopy ? sourceMonthKey : null,
        required_capacity: parseInt(($('cloud-required-capacity') && $('cloud-required-capacity').value) || '0', 10) || 0
      };

      if (ownerMode) {
        const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month`, {
          method: 'POST',
          body
        }));
        state.projectPayload = payload;
        state.baseMonth = payload.month ? deepClone(payload.month) : null;
        renderWorkspace(true);
        await loadProjects();
        await loadHistory(project.id);
      } else {
        if (!ensureGuestName()) return;
        body.editor_name = state.guestName;
        const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/public/edit/${PAGE.token}/month`, {
          method: 'POST',
          body
        }));
        state.projectPayload = payload;
        state.baseMonth = payload.month ? deepClone(payload.month) : null;
        renderWorkspace(true);
      }

      showFlash(`${formatMonthKey(targetKey)} を作成しました`, 'success');
    }

    async function navigateMonth(delta, ownerMode) {
      const activeKey = currentMonthKey() || (currentProject() && currentProject().latest_month_key);
      if (!activeKey) return;

      const targetKey = nextMonthKey(activeKey, delta);
      if (!targetKey) return;

      const monthKeys = (currentProject().month_keys || []);
      if (monthKeys.includes(targetKey)) {
        if (ownerMode) {
          await selectProject(currentProject().id, targetKey);
        } else {
          await loadPublic(targetKey);
        }
        return;
      }

      if (!ownerMode && PAGE.accessMode !== 'edit') {
        showFlash('その月はまだ作成されていません', 'info');
        return;
      }

      await createMonth(targetKey, ownerMode);
    }

    async function deleteMonth() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;
      if (!window.confirm(`${formatMonthKey(currentMonthKey())} を削除しますか？`)) return;

      await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}`, { method: 'DELETE' });
      state.projectPayload = null;
      state.baseMonth = null;
      await loadProjects();
      updateCurrentProjectLabel();
      switchTab('list');
      showFlash('この月を削除しました', 'success');
    }

    async function deleteProject() {
      const project = currentProject();
      if (!project) return;
      if (!window.confirm(`シフト案件「${project.title}」を削除しますか？`)) return;

      await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}`, { method: 'DELETE' });
      state.projectPayload = null;
      state.baseMonth = null;
      state.leaveSync.calendars = [];
      state.leaveSync.selectedCalendarId = '';
      await loadProjects();
      renderHistory([]);
      renderWorkspace(true);
      updateCurrentProjectLabel();
      switchTab('list');
      showFlash('シフト表を削除しました', 'success');
    }

    async function regenerateUrls() {
      const project = currentProject();
      if (!project) return;
      if (!window.confirm('公開URLと編集URLを再発行しますか？既存のURLは無効になります。')) return;

      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/tokens/regenerate`, {
        method: 'POST',
        body: {}
      });

      if ($('cloud-view-url')) $('cloud-view-url').value = data.urls.view_url || '';
      if ($('cloud-edit-url')) $('cloud-edit-url').value = data.urls.edit_url || '';
      showFlash('URLを再発行しました', 'success');
    }

    async function copyText(text, message) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
      }
      showFlash(message, 'success');
    }

    function bindOwnerEvents() {
      document.querySelectorAll('[data-cloud-tab]').forEach((button) => {
        button.addEventListener('click', function() {
          switchTab(this.getAttribute('data-cloud-tab'));
        });
      });

      const refreshProjects = $('cloud-refresh-projects');
      if (refreshProjects) {
        refreshProjects.addEventListener('click', async () => {
          await loadProjects();
          showFlash('一覧を更新しました', 'info');
        });
      }

      const projectList = $('cloud-project-list');
      if (projectList) {
        projectList.addEventListener('click', (event) => {
          const item = event.target.closest('[data-project-id]');
          if (!item) return;
          selectProject(item.getAttribute('data-project-id')).catch((error) => showFlash(error.message, 'error'));
        });
      }

      const createForm = $('cloud-create-form');
      if (createForm) {
        createForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const formData = new FormData(event.currentTarget);
          const data = await requestJson('/tools/shiftersync/cloudshift/api/create', { method: 'POST', body: formData });
          state.projectPayload = unwrapProjectPayload(data);
          state.baseMonth = state.projectPayload.month ? deepClone(state.projectPayload.month) : null;
          await loadProjects();
          await loadLeaveSyncCalendars(state.projectPayload.project.id);
          await loadHistory(state.projectPayload.project.id);
          renderWorkspace(true);
          updateCurrentProjectLabel();
          switchTab('editor');
          showFlash('シフト表を作成しました', 'success');
        });
      }

      const importForm = $('cloud-import-form');
      if (importForm) {
        importForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const formData = new FormData(event.currentTarget);
          const data = await requestJson('/tools/shiftersync/cloudshift/api/create', { method: 'POST', body: formData });
          state.projectPayload = unwrapProjectPayload(data);
          state.baseMonth = state.projectPayload.month ? deepClone(state.projectPayload.month) : null;
          await loadProjects();
          await loadLeaveSyncCalendars(state.projectPayload.project.id);
          await loadHistory(state.projectPayload.project.id);
          renderWorkspace(true);
          updateCurrentProjectLabel();
          switchTab('editor');
          showFlash('CSV を読み込みました', 'success');
        });
      }

      const saveTitle = $('cloud-save-title');
      if (saveTitle) {
        saveTitle.addEventListener('click', async () => {
          const project = currentProject();
          if (!project) return;
          const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/meta`, {
            method: 'PUT',
            body: {
              title: $('cloud-project-title').value.trim(),
              employee_number: $('cloud-project-employee-number') ? $('cloud-project-employee-number').value.trim() : ''
            }
          }));
          state.projectPayload = payload;
          renderWorkspace(true);
          await loadProjects();
          await loadHistory(project.id);
          showFlash('タイトルを更新しました', 'success');
        });
      }

      const openView = $('cloud-open-view-url');
      if (openView) openView.addEventListener('click', () => window.open($('cloud-view-url').value, '_blank', 'noopener'));

      const openEdit = $('cloud-open-edit-url');
      if (openEdit) openEdit.addEventListener('click', () => window.open($('cloud-edit-url').value, '_blank', 'noopener'));

      const copyView = $('cloud-copy-view-url');
      if (copyView) copyView.addEventListener('click', () => copyText($('cloud-view-url').value, '閲覧URLをコピーしました').catch((error) => showFlash(error.message, 'error')));

      const copyEdit = $('cloud-copy-edit-url');
      if (copyEdit) copyEdit.addEventListener('click', () => copyText($('cloud-edit-url').value, '編集URLをコピーしました').catch((error) => showFlash(error.message, 'error')));

      const regenerate = $('cloud-regenerate-urls');
      if (regenerate) regenerate.addEventListener('click', () => regenerateUrls().catch((error) => showFlash(error.message, 'error')));

      const monthSelect = $('cloud-month-select');
      if (monthSelect) {
        monthSelect.addEventListener('change', (event) => {
          selectProject(currentProject().id, event.target.value).catch((error) => showFlash(error.message, 'error'));
        });
      }

      const createMode = $('cloud-create-mode');
      if (createMode) {
        createMode.addEventListener('change', () => {
          setTitleFieldMode('create');
        });
      }

      const createTitle = $('cloud-create-title');
      if (createTitle) {
        createTitle.addEventListener('input', () => scheduleEmployeeSearch('create'));
      }

      const projectTitle = $('cloud-project-title');
      if (projectTitle) {
        projectTitle.addEventListener('input', () => scheduleEmployeeSearch('project'));
      }

      document.addEventListener('click', (event) => {
        const candidate = event.target.closest('.cloud-employee-candidate');
        if (!candidate) return;
        applyEmployeeCandidate(candidate.getAttribute('data-kind'), {
          employee_name: candidate.getAttribute('data-employee-name') || '',
          employee_number: candidate.getAttribute('data-employee-number') || ''
        });
      });

      const syncCalendar = $('cloud-sync-calendar');
      if (syncCalendar) {
        syncCalendar.addEventListener('change', (event) => {
          state.leaveSync.selectedCalendarId = event.target.value || '';
          renderLeaveSyncControls();
        });
      }

      const syncLeaves = $('cloud-sync-leaves');
      if (syncLeaves) {
        syncLeaves.addEventListener('click', () => syncCurrentMonthLeaves().catch((error) => showFlash(error.message, 'error')));
      }

      const prevMonth = $('cloud-prev-month');
      if (prevMonth) prevMonth.addEventListener('click', () => navigateMonth(-1, true).catch((error) => showFlash(error.message, 'error')));

      const nextMonth = $('cloud-next-month');
      if (nextMonth) nextMonth.addEventListener('click', () => navigateMonth(1, true).catch((error) => showFlash(error.message, 'error')));

      const addPrevMonth = $('cloud-add-prev-month');
      if (addPrevMonth) addPrevMonth.addEventListener('click', () => createMonth(nextMonthKey(currentMonthKey() || currentProject().latest_month_key, -1), true).catch((error) => showFlash(error.message, 'error')));

      const addNextMonth = $('cloud-add-next-month');
      if (addNextMonth) addNextMonth.addEventListener('click', () => createMonth(nextMonthKey(currentMonthKey() || currentProject().latest_month_key, 1), true).catch((error) => showFlash(error.message, 'error')));

      const createFirstMonth = $('cloud-create-first-month');
      if (createFirstMonth) {
        createFirstMonth.addEventListener('click', () => {
          const monthKey = promptMonthKey();
          if (!monthKey) return;
          createMonth(monthKey, true).catch((error) => showFlash(error.message, 'error'));
        });
      }

      const requiredCapacity = $('cloud-required-capacity');
      if (requiredCapacity) {
        requiredCapacity.addEventListener('input', () => {
          const value = parseInt(requiredCapacity.value || '0', 10) || 0;
          ShifterSync.setState('capacityEnabled', value > 0);
          ShifterSync.setState('requiredCapacity', value);
          ShifterSync.updateAllCapacityWarnings();
        });
      }

      const saveMonth = $('cloud-save-month');
      if (saveMonth) saveMonth.addEventListener('click', () => saveMonthOwner().catch((error) => showFlash(error.message, 'error')));

      const exportCsv = $('cloud-export-csv');
      if (exportCsv) {
        exportCsv.addEventListener('click', () => {
          if (!currentProject() || !currentMonthKey()) return;
          window.location.href = `/tools/shiftersync/cloudshift/api/project/${currentProject().id}/export/csv?month_key=${encodeURIComponent(currentMonthKey())}`;
        });
      }

      const exportCalendar = $('cloud-export-calendar');
      if (exportCalendar) {
        exportCalendar.addEventListener('click', () => {
          if (!currentProject() || !currentMonthKey()) return;
          window.location.href = `/tools/shiftersync/cloudshift/api/project/${currentProject().id}/export/calendar_png?month_key=${encodeURIComponent(currentMonthKey())}`;
        });
      }

      const exportXlsx = $('cloud-export-xlsx');
      if (exportXlsx) {
        exportXlsx.addEventListener('click', () => {
          if (!currentProject() || !currentMonthKey()) return;
          window.location.href = `/tools/shiftersync/cloudshift/api/project/${currentProject().id}/export/xlsx?month_key=${encodeURIComponent(currentMonthKey())}`;
        });
      }

      const deleteMonthBtn = $('cloud-delete-month');
      if (deleteMonthBtn) deleteMonthBtn.addEventListener('click', () => deleteMonth().catch((error) => showFlash(error.message, 'error')));

      const deleteProjectBtn = $('cloud-delete-project');
      if (deleteProjectBtn) deleteProjectBtn.addEventListener('click', () => deleteProject().catch((error) => showFlash(error.message, 'error')));
    }

    function bindPublicEvents() {
      const monthSelect = $('cloud-month-select');
      if (monthSelect) {
        monthSelect.addEventListener('change', (event) => {
          loadPublic(event.target.value).catch((error) => showFlash(error.message, 'error'));
        });
      }

      const prevMonth = $('cloud-prev-month');
      if (prevMonth) prevMonth.addEventListener('click', () => navigateMonth(-1, false).catch((error) => showFlash(error.message, 'error')));

      const nextMonth = $('cloud-next-month');
      if (nextMonth) nextMonth.addEventListener('click', () => navigateMonth(1, false).catch((error) => showFlash(error.message, 'error')));

      const addPrevMonth = $('cloud-add-prev-month');
      if (addPrevMonth) addPrevMonth.addEventListener('click', () => createMonth(nextMonthKey(currentMonthKey() || currentProject().latest_month_key, -1), false).catch((error) => showFlash(error.message, 'error')));

      const addNextMonth = $('cloud-add-next-month');
      if (addNextMonth) addNextMonth.addEventListener('click', () => createMonth(nextMonthKey(currentMonthKey() || currentProject().latest_month_key, 1), false).catch((error) => showFlash(error.message, 'error')));

      const createFirstMonth = $('cloud-create-first-month');
      if (createFirstMonth) {
        createFirstMonth.addEventListener('click', () => {
          const monthKey = promptMonthKey();
          if (!monthKey) return;
          createMonth(monthKey, false).catch((error) => showFlash(error.message, 'error'));
        });
      }

      const saveMonth = $('cloud-save-month');
      if (saveMonth) saveMonth.addEventListener('click', () => saveMonthPublic().catch((error) => showFlash(error.message, 'error')));

      const requiredCapacity = $('cloud-required-capacity');
      if (requiredCapacity) {
        requiredCapacity.addEventListener('input', () => {
          const value = parseInt(requiredCapacity.value || '0', 10) || 0;
          ShifterSync.setState('capacityEnabled', value > 0);
          ShifterSync.setState('requiredCapacity', value);
          ShifterSync.updateAllCapacityWarnings();
        });
      }

      const exportCsv = $('cloud-export-csv');
      if (exportCsv) {
        exportCsv.addEventListener('click', () => {
          if (!currentMonthKey()) return;
          window.location.href = `/tools/shiftersync/cloudshift/api/public/${PAGE.accessMode}/${PAGE.token}/export/csv?month_key=${encodeURIComponent(currentMonthKey())}`;
        });
      }

      const exportCalendar = $('cloud-export-calendar');
      if (exportCalendar) {
        exportCalendar.addEventListener('click', () => {
          if (!currentMonthKey()) return;
          window.location.href = `/tools/shiftersync/cloudshift/api/public/${PAGE.accessMode}/${PAGE.token}/export/calendar_png?month_key=${encodeURIComponent(currentMonthKey())}`;
        });
      }

      const exportXlsx = $('cloud-export-xlsx');
      if (exportXlsx) {
        exportXlsx.addEventListener('click', () => {
          if (!currentMonthKey()) return;
          window.location.href = `/tools/shiftersync/cloudshift/api/public/${PAGE.accessMode}/${PAGE.token}/export/xlsx?month_key=${encodeURIComponent(currentMonthKey())}`;
        });
      }
    }

    async function initOwner() {
      const now = new Date();
      if ($('cloud-create-year')) $('cloud-create-year').value = now.getFullYear();
      if ($('cloud-create-month')) $('cloud-create-month').value = now.getMonth() + 1;
      setTitleFieldMode('create');
      bindOwnerEvents();
      ensureCloudActionButtons();
      await loadProjects();
      updateCurrentProjectLabel();
    }

    async function initPublic() {
      applyPublicDeviceMode();
      window.addEventListener('resize', applyPublicDeviceMode);
      bindPublicEvents();
      ensureCloudActionButtons();
      await loadPublic();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (PAGE.type === 'owner') {
        initOwner().catch((error) => showFlash(error.message, 'error'));
      } else {
        initPublic().catch((error) => showFlash(error.message, 'error'));
      }
    });
  })();
</script>
