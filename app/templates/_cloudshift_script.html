<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{{ url_for('static', filename='shiftersync/js/ss_common.js') }}"></script>
<script>
  (function() {
    'use strict';

    const PAGE = window.CLOUDSHIFT_PAGE || {};
    const state = {
      projects: [],
      projectPayload: null,
      baseMonth: null,
      editorMode: 'normal',
      draftVisualObserver: null,
      syncReturnContext: null,
      guestName: PAGE.authenticatedEditorName || '',
      assist: {
        contextKey: '',
        loaded: false,
        data: null,
        permissions: {
          can_edit_records: false,
          can_edit_rules: false,
          can_edit_profiles: false
        },
        activeTab: 'register',
        registerView: 'record',
        editView: 'records',
        detailSections: {
          overview: false,
          formulas: false
        },
        searchResult: null,
        recordDraft: null,
        dayContext: null,
        editFilters: {
          date_from: '',
          date_to: '',
          shift_key: '',
          role_type: '',
          candidate_query: ''
        },
        searchForm: {
          target_date: '',
          shift_key: ''
        }
      },
      leaveSync: {
        calendars: [],
        selectedCalendarId: ''
      },
      conflictCheck: {
        mode: 'scene',
        monthKey: '',
        selectedProjectIds: null,
        result: null
      }
    };
    const employeeSearchCache = new Map();
    const siteSearchCache = new Map();
    const siteBranchCache = new Map();
    const ASSIST_OPTIONLESS_LABEL = 'オプションなし';
    const ASSIST_WEEKDAYLESS_LABEL = '曜日なし';

    function $(id) {
      return document.getElementById(id);
    }

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function makeEntryId() {
      return `cloud-entry-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function parseEntryValue(value) {
      const text = String(value || '').trim();
      const match = text.match(/^!([^!]+)!(.+)$/);
      if (!match) {
        return { optionKey: null, name: text };
      }
      return { optionKey: match[1], name: match[2] };
    }

    function formatEntryValue(optionKey, name) {
      const safeName = String(name || '').trim();
      if (!safeName) {
        return '';
      }
      return optionKey ? `!${optionKey}!${safeName}` : safeName;
    }

    function optionMappings() {
      if (ShifterSync.getOptionMappings) {
        return ShifterSync.getOptionMappings();
      }
      return {
        A: "午前",
        P: "午後",
        E: "早番",
        L: "遅番",
        TEMP: "臨時便",
        M: "マイクロ",
        C: "中型",
        O: "大型",
        W: "ワゴン",
        V: "役員車両",
        N1: "1号車",
        N2: "2号車",
        N3: "3号車",
        N4: "4号車",
        N5: "5号車",
        PAID: "有休",
        COMP: "代休",
        CONDOLENCE: "慶弔休暇",
        CARE: "介護休暇",
        REFRESH: "リフレッシュ休暇",
        OTHER: "その他"
      };
    }

    function optionSectionsForMode(mode) {
      if (ShifterSync.getOptionSectionsForMode) {
        return ShifterSync.getOptionSectionsForMode(mode) || [];
      }
      const sections = [{ title: "時間帯", optionKeys: ["A", "P", "E", "L", "TEMP"] }];
      if (mode === "person") {
        sections.push({ title: "休暇種別", optionKeys: ["PAID", "COMP", "CONDOLENCE", "CARE", "REFRESH", "OTHER"] });
      }
      sections.push(
        { title: "車両タイプ", optionKeys: ["M", "C", "O", "W", "V"] },
        { title: "車番", optionKeys: ["N1", "N2", "N3", "N4", "N5"] }
      );
      return sections;
    }

    function bulkOptionSectionsForMode(mode) {
      return optionSectionsForMode(mode).map((section) => ({
        title: section.title,
        optionKeys: Array.isArray(section.optionKeys) ? section.optionKeys.slice() : []
      }));
    }

    function optionLabelForKey(optionKey) {
      return optionMappings()[optionKey] || optionKey;
    }

    function normalizeSiteBranchRowId(value) {
      const text = String(value || '').trim();
      if (!text || !/^\d+$/.test(text)) {
        return '';
      }
      return parseInt(text, 10) > 0 ? text : '';
    }

    function normalizeSiteBranchCandidate(branch) {
      if (!branch || typeof branch !== 'object') {
        return null;
      }
      const id = normalizeSiteBranchRowId(branch.id || branch.site_branch_row_id || branch.siteBranchRowId || '');
      const siteBranch = String(branch.site_branch || branch.siteBranch || '').trim();
      if (!id && !siteBranch) {
        return null;
      }
      return {
        id,
        site_branch: siteBranch,
        cloudshift_option_key: String(branch.cloudshift_option_key || branch.cloudshiftOptionKey || '').trim().toUpperCase(),
        option_label: String(branch.option_label || branch.optionLabel || '').trim(),
        is_active: branch.is_active !== false
      };
    }

    function currentProjectSiteBranches() {
      const raw = ShifterSync.getState ? ShifterSync.getState('siteBranches') : [];
      return Array.isArray(raw) ? raw.map((branch) => normalizeSiteBranchCandidate(branch)).filter(Boolean) : [];
    }

    function currentProjectSiteContext() {
      return ShifterSync.getState ? (ShifterSync.getState('siteContext') || null) : null;
    }

    function siteBranchCandidatesForOption(optionKey) {
      const branches = currentProjectSiteBranches().filter((branch) => branch.is_active !== false);
      if (!branches.length) {
        return [];
      }
      const normalizedOption = String(optionKey || '').trim().toUpperCase();
      if (!normalizedOption) {
        return branches;
      }
      const matched = branches.filter((branch) => branch.cloudshift_option_key === normalizedOption);
      return matched.length ? matched : branches;
    }

    function autoBranchFieldsForOption(optionKey) {
      const candidates = siteBranchCandidatesForOption(optionKey);
      if (candidates.length !== 1) {
        return { site_branch_row_id: '', site_branch: '' };
      }
      return {
        site_branch_row_id: candidates[0].id,
        site_branch: candidates[0].site_branch
      };
    }

    function setShifterSyncSiteStateForCurrentProject() {
      if (!ShifterSync.setState) {
        return;
      }
      const project = currentProject();
      const site = project && project.mode === 'scene' ? (project.site || null) : null;
      const cachedBranches = site && site.site_id && siteBranchCache.has(site.site_id)
        ? siteBranchCache.get(site.site_id)
        : [];
      ShifterSync.setState('siteContext', site);
      ShifterSync.setState('siteBranches', Array.isArray(cachedBranches) ? cachedBranches : []);
    }

    function monthDays(month) {
      if (!month) return 0;
      return new Date(month.year, month.month, 0).getDate();
    }

    function monthDayKeys(month) {
      return Array.from({ length: monthDays(month) }, (_, index) => String(index + 1));
    }

    function createBulkEntryFromForm(dayKey, refs) {
      const name = refs.nameInput ? refs.nameInput.value.trim() : '';
      if (!name) return null;
      const optionKey = refs.optionSelect ? refs.optionSelect.value : '';
      const comment = refs.commentInput ? refs.commentInput.value.trim() : '';
      const employeeNumber = refs.employeeInput
        ? refs.employeeInput.value.trim()
        : (refs.nameInput && refs.nameInput.dataset ? String(refs.nameInput.dataset.employeeNumber || '').trim() : '');
      const selectedBranchOption = refs.branchSelect && refs.branchSelect.selectedOptions && refs.branchSelect.selectedOptions.length
        ? refs.branchSelect.selectedOptions[0]
        : null;
      const explicitBranchRowId = refs.branchSelect ? normalizeSiteBranchRowId(refs.branchSelect.value) : '';
      const explicitBranch = explicitBranchRowId
        ? String(selectedBranchOption && selectedBranchOption.getAttribute('data-site-branch') || '').trim()
        : '';
      const autoBranchFields = currentProject() && currentProject().mode === 'scene' && !explicitBranchRowId
        ? autoBranchFieldsForOption(optionKey || null)
        : { site_branch_row_id: explicitBranchRowId, site_branch: explicitBranch };
      return {
        id: makeEntryId(),
        value: formatEntryValue(optionKey || null, name),
        comment,
        employee_number: employeeNumber,
        site_branch_row_id: autoBranchFields.site_branch_row_id,
        site_branch: autoBranchFields.site_branch
      };
    }

    function cloneEntryForBulk(entry) {
      return {
        id: makeEntryId(),
        value: String(entry && entry.value ? entry.value : '').trim(),
        comment: String(entry && entry.comment ? entry.comment : '').trim(),
        employee_number: String(entry && entry.employee_number ? entry.employee_number : '').trim(),
        site_branch_row_id: normalizeSiteBranchRowId(entry && (entry.site_branch_row_id || entry.siteBranchRowId || '')),
        site_branch: String(entry && (entry.site_branch || entry.siteBranch || '') ? (entry.site_branch || entry.siteBranch || '') : '').trim()
      };
    }

    function ensureCloudModal(modalId, titleText) {
      let modal = document.getElementById(modalId);
      if (modal) {
        if (titleText) {
          const title = modal.querySelector('[data-cloud-modal-title]');
          if (title) title.textContent = titleText;
        }
        return modal;
      }

      modal = document.createElement('div');
      modal.id = modalId;
      modal.className = 'cloud-modal-overlay cloud-hidden';
      modal.innerHTML = `
        <div class="cloud-modal-panel" role="dialog" aria-modal="true">
          <div class="cloud-modal-header">
            <div>
              <div class="cloud-modal-kicker">CloudShift</div>
              <h3 class="cloud-modal-title" data-cloud-modal-title>${escapeHtml(titleText || '')}</h3>
            </div>
            <button type="button" class="cloud-btn secondary cloud-modal-close" data-cloud-modal-close>閉じる</button>
          </div>
          <div class="cloud-modal-body" data-cloud-modal-body></div>
          <div class="cloud-modal-footer" data-cloud-modal-footer></div>
        </div>
      `;
      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          closeCloudModal(modalId);
        }
      });
      modal.querySelector('[data-cloud-modal-close]').addEventListener('click', () => closeCloudModal(modalId));
      document.body.appendChild(modal);
      return modal;
    }

    function closeCloudModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.add('cloud-hidden');
      }
      if (!document.querySelector('.cloud-modal-overlay:not(.cloud-hidden)')) {
        document.body.classList.remove('cloud-modal-open');
      }
    }

    function openCloudModal(modalId, titleText) {
      const modal = ensureCloudModal(modalId, titleText);
      if (titleText) {
        const title = modal.querySelector('[data-cloud-modal-title]');
        if (title) title.textContent = titleText;
      }
      modal.classList.remove('cloud-hidden');
      document.body.classList.add('cloud-modal-open');
      return modal;
    }

    function modalBody(modal) {
      return modal.querySelector('[data-cloud-modal-body]');
    }

    function modalFooter(modal) {
      return modal.querySelector('[data-cloud-modal-footer]');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function modeLabel(mode) {
      return mode === 'scene' ? '現場' : '個人';
    }

    function modeLongLabel(mode) {
      return mode === 'scene' ? '現場シフト' : '個人シフト';
    }

    function projectAccessRole(project) {
      return project && project.access_role === 'viewer' ? 'viewer' : 'owner';
    }

    function canEditCurrentProject() {
      return PAGE.type === 'owner' && projectAccessRole(currentProject()) === 'owner';
    }

    function shareBadgeText(project) {
      if (!project || !project.share) return '';
      if (project.share.role === 'viewer') return '共有されたシフト';
      return project.share.enabled ? '共有中' : '';
    }

    function isLikelyMobileDevice() {
      const ua = navigator.userAgent || '';
      const touchDevice = navigator.maxTouchPoints > 1;
      const narrowViewport = window.matchMedia('(max-width: 820px)').matches;
      return narrowViewport || /iPhone|iPad|iPod|Android|Mobile/i.test(ua) || touchDevice;
    }

    function applyPublicDeviceMode() {
      if (PAGE.type !== 'public') return;
      const mobile = isLikelyMobileDevice();
      document.body.classList.toggle('cloud-device-mobile', mobile);
      document.body.classList.toggle('cloud-device-desktop', !mobile);
      document.body.setAttribute('data-cloud-device', mobile ? 'mobile' : 'desktop');
      const shell = document.querySelector('.cloud-public-shell');
      if (shell) {
        shell.setAttribute('data-cloud-device', mobile ? 'mobile' : 'desktop');
      }
    }

    function showFlash(message, type) {
      const node = $('cloud-flash');
      if (!node) return;
      node.className = `cloud-flash ${type || 'info'}`;
      node.textContent = message;
      node.style.display = 'block';
      clearTimeout(showFlash._timer);
      showFlash._timer = setTimeout(() => {
        node.style.display = 'none';
      }, 2600);
    }

    function closeLegacyDetailModals() {
      ['ss-day-detail-modal', 'ss-entry-modal'].forEach((modalId) => {
        const modal = document.getElementById(modalId);
        if (modal) {
          modal.classList.add('ss-hidden');
        }
      });
    }

    function closeAssistRelatedModals() {
      [
        'cloud-assist-modal',
        'cloud-assist-day-modal',
        'cloud-assist-record-edit-modal',
        'cloud-assist-site-edit-modal',
        'cloud-assist-rule-edit-modal',
        'cloud-assist-profile-edit-modal'
      ].forEach((modalId) => closeCloudModal(modalId));
      closeLegacyDetailModals();
    }

    function notifyAssistAction(message) {
      closeAssistRelatedModals();
      showFlash(message, 'info');
    }

    async function requestJson(url, options) {
      const opts = Object.assign({ headers: {} }, options || {});
      if (opts.body && !(opts.body instanceof FormData) && !opts.headers['Content-Type']) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      const response = await fetch(url, opts);
      const isJson = (response.headers.get('content-type') || '').includes('application/json');
      const payload = isJson ? await response.json() : null;
      if (!response.ok) {
        throw new Error((payload && payload.error) || 'リクエストに失敗しました');
      }
      return payload;
    }

    function unwrapProjectPayload(payload) {
      return payload && payload.project && payload.project.project ? payload.project : payload;
    }

    function currentProject() {
      return state.projectPayload ? state.projectPayload.project : null;
    }

    function currentMonth() {
      return state.projectPayload ? state.projectPayload.month : null;
    }

    function currentMonthKey() {
      return state.projectPayload ? state.projectPayload.active_month_key : null;
    }

    function emptyEntriesForMonth(month) {
      const days = monthDays(month);
      return Array.from({ length: days }, (_, index) => String(index + 1)).reduce((acc, day) => {
        acc[day] = [];
        return acc;
      }, {});
    }

    function draftEntriesForMonth(month) {
      return month && month.draft_entries_per_day ? month.draft_entries_per_day : (month && month.entries_per_day ? month.entries_per_day : emptyEntriesForMonth(month));
    }

    function draftEntryCount(month) {
      return Object.values((month && month.draft_entries_per_day) || {}).reduce(
        (total, entries) => total + (Array.isArray(entries) ? entries.length : 0),
        0
      );
    }

    function entriesFingerprint(entries) {
      return JSON.stringify(entries || {});
    }

    function draftHasChanges(month) {
      if (!month) return false;
      return entriesFingerprint(draftEntriesForMonth(month)) !== entriesFingerprint(month.entries_per_day || {});
    }

    function displayedEntriesForMonth(month) {
      if (!month) return {};
      if (state.editorMode !== 'draft') {
        return month.entries_per_day || {};
      }
      const officialEntries = month.entries_per_day || {};
      const draftEntries = draftEntriesForMonth(month);
      const officialDayById = new Map();
      Object.keys(officialEntries).forEach((officialDayKey) => {
        const entries = officialEntries[officialDayKey];
        if (!Array.isArray(entries)) return;
        entries.forEach((entry) => {
          const id = String(entry && entry.id ? entry.id : '').trim();
          if (id) officialDayById.set(id, String(officialDayKey));
        });
      });
      return Object.keys(draftEntries || {}).reduce((acc, dayKey) => {
        const entries = Array.isArray(draftEntries[dayKey]) ? draftEntries[dayKey] : [];
        acc[dayKey] = entries.map((entry) => {
          const clone = Object.assign({}, entry);
          const id = String(clone && clone.id ? clone.id : '').trim();
          clone.cloud_draft_added = !!id && officialDayById.get(id) !== String(dayKey);
          return clone;
        });
        return acc;
      }, {});
    }

    function applyDraftVisualState(month, draftOverride) {
      document.querySelectorAll('.day-box.has-draft-deletion').forEach((node) => {
        node.classList.remove('has-draft-deletion');
      });
      document.querySelectorAll('.entry-item.is-cloud-draft-added').forEach((node) => {
        node.classList.remove('is-cloud-draft-added');
      });
      if (!month || state.editorMode !== 'draft') return;
      const draftEntries = draftOverride || draftEntriesForMonth(month);
      const officialEntries = month.entries_per_day || {};
      const officialDayById = new Map();
      Object.keys(officialEntries).forEach((officialDayKey) => {
        const entries = officialEntries[officialDayKey];
        if (!Array.isArray(entries)) return;
        entries.forEach((entry) => {
          const id = String(entry && entry.id ? entry.id : '').trim();
          if (id) officialDayById.set(id, String(officialDayKey));
        });
      });
      Object.keys(draftEntries).forEach((dayKey) => {
        const entries = draftEntries[dayKey];
        if (!Array.isArray(entries)) return;
        entries.forEach((entry) => {
          const id = String(entry && entry.id ? entry.id : '').trim();
          if (!id || officialDayById.get(id) === String(dayKey)) return;
          const node = document.querySelector(`.entry-item[data-entry-id="${id}"]`);
          if (node) node.classList.add('is-cloud-draft-added');
        });
      });
      Object.keys(officialEntries).forEach((dayKey) => {
        const officialIds = new Set((Array.isArray(officialEntries[dayKey]) ? officialEntries[dayKey] : [])
          .map((entry) => String(entry && entry.id ? entry.id : '').trim())
          .filter(Boolean));
        if (!officialIds.size) return;
        const draftIds = new Set((Array.isArray(draftEntries[dayKey]) ? draftEntries[dayKey] : [])
          .map((entry) => String(entry && entry.id ? entry.id : '').trim())
          .filter(Boolean));
        const hasDeletedOfficial = Array.from(officialIds).some((id) => !draftIds.has(id));
        if (!hasDeletedOfficial) return;
        const box = document.querySelector(`.day-box[data-day="${String(dayKey)}"]`);
        if (box) box.classList.add('has-draft-deletion');
      });
    }

    function watchDraftVisualState(month) {
      if (state.draftVisualObserver && typeof state.draftVisualObserver.disconnect === 'function') {
        state.draftVisualObserver.disconnect();
        state.draftVisualObserver = null;
      }
      const panel = $('cloud-editor-panel');
      if (!panel || !month || state.editorMode !== 'draft') return;
      let scheduled = false;
      state.draftVisualObserver = new MutationObserver(() => {
        if (scheduled) return;
        scheduled = true;
        window.setTimeout(() => {
          scheduled = false;
          const currentEntries = ShifterSync.getEntriesPerDay ? ShifterSync.getEntriesPerDay() : draftEntriesForMonth(month);
          applyDraftVisualState(month, currentEntries);
        }, 0);
      });
      state.draftVisualObserver.observe(panel, { childList: true, subtree: true });
    }

    function isPersonProject() {
      const project = currentProject();
      return !!project && project.mode === 'person';
    }

    function parseMonthKey(monthKey) {
      const match = String(monthKey || '').match(/^(\d{4})-(\d{2})$/);
      if (!match) return null;
      return { year: parseInt(match[1], 10), month: parseInt(match[2], 10) };
    }

    function formatMonthKey(monthKey) {
      const parsed = parseMonthKey(monthKey);
      return parsed ? `${parsed.year}年${parsed.month}月` : '未選択';
    }

    function nextMonthKey(monthKey, delta) {
      const parsed = parseMonthKey(monthKey);
      if (!parsed) return null;
      const date = new Date(parsed.year, parsed.month - 1 + delta, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    function promptMonthKey(defaultValue) {
      return window.prompt('作成する年月を YYYY-MM 形式で入力してください', defaultValue || new Date().toISOString().slice(0, 7));
    }

    function selectedLeaveCalendarId() {
      const node = $('cloud-sync-calendar');
      return node ? node.value : state.leaveSync.selectedCalendarId;
    }

    function titleFieldRefs(kind) {
      if (kind === 'create') {
        return {
          input: $('cloud-create-title'),
          hidden: $('cloud-create-employee-number'),
          panel: $('cloud-create-candidate-panel'),
          note: $('cloud-create-selected-note'),
          label: $('cloud-create-title') ? $('cloud-create-title').previousElementSibling : null
        };
      }
      return {
        input: $('cloud-project-title'),
        hidden: $('cloud-project-employee-number'),
        panel: $('cloud-project-candidate-panel'),
        note: $('cloud-project-selected-note'),
        label: $('cloud-project-title') ? $('cloud-project-title').previousElementSibling : null
      };
    }

    function siteFieldRefs(kind) {
      if (kind === 'create') {
        return {
          field: $('cloud-create-site-field'),
          display: $('cloud-create-site-display'),
          hidden: $('cloud-create-site-row-id'),
          note: $('cloud-create-site-note')
        };
      }
      return {
        field: $('cloud-project-site-field'),
        display: $('cloud-project-site-display'),
        hidden: $('cloud-project-site-row-id'),
        note: $('cloud-project-site-note')
      };
    }

    function titleFieldMode(kind) {
      if (kind === 'create') {
        return $('cloud-create-mode') ? $('cloud-create-mode').value : 'scene';
      }
      return currentProject() ? currentProject().mode : 'scene';
    }

    function applySiteSelection(kind, site) {
      const refs = siteFieldRefs(kind);
      if (!refs.display || !refs.hidden) {
        return;
      }
      const siteId = String(site && site.site_id ? site.site_id : '').trim();
      const siteName = String(site && site.site_name ? site.site_name : '').trim();
      const siteRowId = site && site.id != null ? String(site.id) : String(site && site.site_row_id ? site.site_row_id : '').trim();
      refs.display.value = siteId && siteName ? `${siteId} / ${siteName}` : '';
      refs.hidden.value = siteRowId;
      if (refs.note) {
        const branchCount = site && site.active_branch_count != null ? ` / 有効枝番号 ${site.active_branch_count}件` : '';
        refs.note.textContent = refs.hidden.value ? `現場ID: ${siteId}${branchCount}` : '';
      }
    }

    function clearSiteSelection(kind) {
      const refs = siteFieldRefs(kind);
      if (refs.display) refs.display.value = '';
      if (refs.hidden) refs.hidden.value = '';
      if (refs.note) refs.note.textContent = '';
    }

    function setTitleFieldMode(kind) {
      const refs = titleFieldRefs(kind);
      const siteRefs = siteFieldRefs(kind);
      const isPerson = titleFieldMode(kind) === 'person';
      if (refs.label) {
        refs.label.textContent = isPerson ? '社員' : 'タイトル';
      }
      if (refs.input) {
        refs.input.placeholder = isPerson ? '社員名' : 'タイトル';
      }
      if (!isPerson) {
        if (refs.hidden) refs.hidden.value = '';
        if (refs.note) refs.note.textContent = '';
        if (refs.panel) {
          refs.panel.innerHTML = '';
          refs.panel.classList.add('cloud-hidden');
        }
      }
      if (siteRefs.field) {
        siteRefs.field.classList.toggle('cloud-hidden', isPerson);
      }
      if (kind === 'create') {

    async function fetchEmployeeCandidates(query) {
      const key = String(query || '').trim();
      if (!key) return [];
      if (employeeSearchCache.has(key)) {
        return employeeSearchCache.get(key);
      }
      const response = await fetch(`/tools/pluslist/api/search_employee?q=${encodeURIComponent(key)}`, {
        credentials: 'same-origin',
        headers: { Accept: 'application/json' }
      });
      if (!response.ok) {
        throw new Error('社員候補の取得に失敗しました');
      }
      const payload = await response.json();
      const candidates = Array.isArray(payload)
        ? payload
        : Array.isArray(payload.results)
          ? payload.results
          : Array.isArray(payload.items)
            ? payload.items
            : Array.isArray(payload.employees)
              ? payload.employees
              : [];
      employeeSearchCache.set(key, candidates);
      return candidates;
    }

    async function fetchSiteCandidates(query) {
      const key = String(query || '').trim();
      if (siteSearchCache.has(key)) {
        return siteSearchCache.get(key);
      }
      const response = await fetch(`/tools/siteplus/api/cloudshift/sites?q=${encodeURIComponent(key)}`, {
        credentials: 'same-origin',
        headers: { Accept: 'application/json' }
      });
      if (!response.ok) {
        throw new Error('現場候補の取得に失敗しました');
      }
      const payload = await response.json();
      const candidates = Array.isArray(payload.sites) ? payload.sites : [];
      siteSearchCache.set(key, candidates);
      return candidates;
    }

    async function fetchSiteBranches(siteId) {
      const key = String(siteId || '').trim();
      if (!key) {
        return [];
      }
      if (siteBranchCache.has(key)) {
        return siteBranchCache.get(key);
      }
      const response = await fetch(`/tools/siteplus/api/cloudshift/sites/${encodeURIComponent(key)}/branches`, {
        credentials: 'same-origin',
        headers: { Accept: 'application/json' }
      });
      if (!response.ok) {
        throw new Error('枝番号候補の取得に失敗しました');
      }
      const payload = await response.json();
      const branches = Array.isArray(payload.branches)
        ? payload.branches.map((branch) => normalizeSiteBranchCandidate(branch)).filter(Boolean)
        : [];
      siteBranchCache.set(key, branches);
      return branches;
    }

    async function syncCurrentProjectSiteBranches() {
      setShifterSyncSiteStateForCurrentProject();
      const project = currentProject();
      const site = project && project.mode === 'scene' ? (project.site || null) : null;
      if (!project || project.mode !== 'scene' || !site || !site.is_linked || !site.site_id) {
        return [];
      }
      const projectId = project.id;
      const siteId = site.site_id;
      const branches = await fetchSiteBranches(siteId);
      const liveProject = currentProject();
      if (!liveProject || liveProject.id !== projectId) {
        return branches;
      }
      if (!ShifterSync.setState) {
        return branches;
      }
      ShifterSync.setState('siteContext', liveProject.site || site);
      ShifterSync.setState('siteBranches', branches);
      if (currentMonth()) {
        replaceCalendarEntries(currentEntriesSnapshot());
      }
      return branches;
    }

      if (PAGE.type === 'public' && PAGE.accessMode === 'edit') {
        if (!ensureGuestName()) {
          throw new Error('編集者名を入力してください');
        }
        return Object.assign({}, body, { editor_name: state.guestName });
      }

    }

    function applyAssistBootstrap(payload) {
      state.assist.data = payload && payload.assist ? payload.assist : defaultAssistDataForMode(currentAssistMode());
      state.assist.permissions = payload && payload.permissions ? payload.permissions : {
        can_edit_records: false,
        can_edit_rules: false,
        can_edit_profiles: false
      };
      state.assist.loaded = true;
    }

    async function ensureAssistLoaded(force) {
      syncAssistContext();
      if (!isAssistAvailable()) {
        resetAssistState();
        return currentAssistData();
      }
      if (state.assist.loaded && !force) {
        return currentAssistData();
      }
      const payload = await requestJson(assistBasePath());
      applyAssistBootstrap(payload);
      return currentAssistData();
    }

    function assistWeekdayLabels() {
      return ['月', '火', '水', '木', '金', '土', '日'];
    }

    function assistWeekdayLabel(index) {
      if (index == null || String(index).trim() === '') return ASSIST_WEEKDAYLESS_LABEL;
      return assistWeekdayLabels()[index] || '';
    }

    function assistRoleLabel(roleType) {
      if (roleType === 'dedicated') return '専従者';
      if (roleType === 'backup') return '代務者';
      return '通常';
    }

    function assistRoleBadgeClass(roleType) {
      if (roleType === 'dedicated') return 'is-dedicated';
      if (roleType === 'backup') return 'is-backup';
      return 'is-normal';
    }

    function assistWeekdayIndexFromDate(dateText) {
      if (!dateText) return null;
      const parts = String(dateText).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parts) return null;
      return (new Date(parseInt(parts[1], 10), parseInt(parts[2], 10) - 1, parseInt(parts[3], 10)).getDay() + 6) % 7;
    }

    function assistWeekdayLabelFromDate(dateText) {
      const parsed = String(dateText || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parsed) return '曜日: -';
      const weekday = (new Date(parseInt(parsed[1], 10), parseInt(parsed[2], 10) - 1, parseInt(parsed[3], 10)).getDay() + 6) % 7;
      return `曜日: ${assistWeekdayLabel(weekday)}`;
    }

    function assistShiftLabel(shiftKey) {
      return shiftKey ? optionLabelForKey(shiftKey) : ASSIST_OPTIONLESS_LABEL;
    }

    function assistRuleDisplayLabel(rule) {
      const weekdayLabel = rule && (rule.weekday == null || String(rule.weekday).trim() === '')
        ? ASSIST_WEEKDAYLESS_LABEL
        : `${assistWeekdayLabel(rule && rule.weekday)}曜`;
      return `${weekdayLabel} / ${assistShiftLabel(rule && rule.shift_key)}`;
    }

    function assistWeekdayValues(values) {
      if (!Array.isArray(values)) return [];
      return values
        .map((value) => parseInt(value, 10))
        .filter((value, index, list) => Number.isInteger(value) && value >= 0 && value <= 6 && list.indexOf(value) === index)
        .sort((left, right) => left - right);
    }

    function assistWeekdaySummary(values, emptyLabel) {
      const normalized = assistWeekdayValues(values);
      return normalized.length ? normalized.map((value) => assistWeekdayLabel(value)).join(' / ') : (emptyLabel || 'なし');
    }

    function buildAssistWeekdayPreferenceField(name, selectedValues, accentClass) {
      const selected = new Set(assistWeekdayValues(selectedValues).map((value) => String(value)));
      return `
        <div class="cloud-assist-weekday-picker">
          ${assistWeekdayLabels().map((label, index) => `
            <label class="cloud-assist-weekday-option ${accentClass || ''}">
              <input type="checkbox" name="${name}" value="${index}" ${selected.has(String(index)) ? 'checked' : ''}>

      return `${includeBlank ? `<option value="">${escapeHtml(blankLabel || ASSIST_OPTIONLESS_LABEL)}</option>` : ''}${groups}`;
    }

    function buildAssistRoleOptions(selectedValue, includeBlank) {
      const options = [
        { value: 'normal', label: '通常' },

    function buildAssistWeekdayOptions(selectedValue, includeBlank, blankLabel) {
      const options = assistWeekdayLabels().map((label, index) => `

    function assistCandidateFieldRefs(field) {
      return {
        nameInput: field ? field.querySelector('[data-assist-candidate-input]') : null,
        idInput: field ? field.querySelector('input[name$="_candidate_id"]') : null,
        employeeInput: field ? field.querySelector('input[name$="_employee_number"]') : null,
        note: field ? field.querySelector('[data-assist-selected-note]') : null,
        panel: field ? field.querySelector('[data-assist-candidate-panel]') : null
      };

    function clearAssistCandidateSelection(field) {
      const refs = assistCandidateFieldRefs(field);
      if (refs.idInput) refs.idInput.value = '';
      if (refs.employeeInput) refs.employeeInput.value = '';
      if (refs.note) {
        refs.note.textContent = '';
        refs.note.classList.add('cloud-hidden');
      }
    }

    function applyAssistCandidateSelection(field, candidate) {
      const refs = assistCandidateFieldRefs(field);
      if (!refs.nameInput) return;
      const selectedName = String(candidate.candidate_name || candidate.employee_name || candidate.name || '');
      refs.nameInput.value = selectedName;
      refs.nameInput.dataset.selectedEmployeeName = selectedName;
      if (refs.idInput) refs.idInput.value = String(candidate.candidate_id || '');
      if (refs.employeeInput) refs.employeeInput.value = String(candidate.employee_number || '');
      if (refs.note) {
        refs.note.textContent = candidate.employee_number ? `社員番号: ${candidate.employee_number}` : '';
        refs.note.classList.toggle('cloud-hidden', !candidate.employee_number);
      }
      if (refs.panel) {
        refs.panel.innerHTML = '';
        refs.panel.classList.add('cloud-hidden');
      }
    }

    function renderAssistCandidateSuggestions(field, candidates) {
      const refs = assistCandidateFieldRefs(field);
      if (!refs.panel) return;
      const normalized = (Array.isArray(candidates) ? candidates : [])
        .map((item) => ({
          candidate_id: String(item.candidate_id || ''),
          employee_number: String(item.employee_number || '').trim(),
          employee_name: String(item.employee_name || item.candidate_name || item.name || '').trim()
        }))
        .filter((item) => item.employee_name);
      if (!normalized.length) {
        refs.panel.innerHTML = '<div style="color: var(--cloud-muted); font-size: 12px; padding: 4px 2px;">候補が見つかりません</div>';
        refs.panel.classList.remove('cloud-hidden');
        return;
      }
      refs.panel.innerHTML = normalized.slice(0, 8).map((candidate) => `
        <button
          type="button"
          class="cloud-assist-candidate"
          data-candidate-id="${escapeHtml(candidate.candidate_id)}"
          data-candidate-name="${escapeHtml(candidate.employee_name)}"
          data-employee-name="${escapeHtml(candidate.employee_name)}"
          data-employee-number="${escapeHtml(candidate.employee_number)}"
        >${escapeHtml([candidate.employee_name, candidate.employee_number].filter(Boolean).join(' / '))}</button>
      `).join('');
      refs.panel.classList.remove('cloud-hidden');
    }

    function scheduleAssistCandidateSearch(field) {
      const refs = assistCandidateFieldRefs(field);
      if (!refs.nameInput) return;
      const query = refs.nameInput.value.trim();
      if (refs.nameInput.dataset.selectedEmployeeName && refs.nameInput.dataset.selectedEmployeeName !== query) {
        clearAssistCandidateSelection(field);
      }
      if (!query) {
        if (refs.panel) {
          refs.panel.innerHTML = '';
          refs.panel.classList.add('cloud-hidden');
        }
        return;
      }
      window.clearTimeout(assistCandidateSearchTimer);
      assistCandidateSearchTimer = window.setTimeout(async () => {
        const latestQuery = refs.nameInput.value.trim();
        if (!latestQuery) return;
        try {
          const candidates = await fetchEmployeeCandidates(latestQuery);
          if (refs.nameInput.value.trim() !== latestQuery) return;
          renderAssistCandidateSuggestions(field, candidates);
        } catch (_) {
          if (refs.panel) {
            refs.panel.innerHTML = '';
            refs.panel.classList.add('cloud-hidden');
          }
        }
      }, 220);
    }

      const node = $('cloud-current-project') || $('cloud-public-identity');
      if (!node) return;

      if (PAGE.type === 'public') {

          node.classList.add('cloud-hidden');
          return;
        }

        const editorName = PAGE.authenticatedEditorName || state.guestName;
        if (!editorName) {
          node.classList.add('cloud-hidden');
          return;
        }

        node.textContent = `編集中: ${editorName}`;
        node.classList.remove('cloud-hidden');

        const note = $('cloud-public-editor-note');
        if (note) {
          note.textContent = `${editorName} として編集中です`;
        }
        return;
      }

      const project = currentProject();
      node.textContent = project ? `${project.title} / ${modeLabel(project.mode)}` : '未選択';

    function normalizeAssistUiState() {
      const permissions = state.assist.permissions || {};
      const mode = currentAssistMode();
      const allowedTabs = mode === 'person' ? ['register', 'edit'] : ['register', 'edit', 'search', 'details'];
      if (!allowedTabs.includes(state.assist.activeTab)) {
        state.assist.activeTab = 'register';
      }
      if (mode === 'person') {
        if (!['experienced', 'training'].includes(state.assist.registerView)) {
          state.assist.registerView = 'experienced';
        }
        if (!['experienced', 'training'].includes(state.assist.editView)) {
          state.assist.editView = 'experienced';
        }
        return;
      }
      if (state.assist.registerView !== 'record' && state.assist.registerView !== 'rule') {
        state.assist.registerView = 'record';
      }
      if (!permissions.can_edit_rules) {
        state.assist.registerView = 'record';
      }
      const allowedEditViews = permissions.can_edit_profiles
        ? ['records', 'rules', 'profiles']
        : ['records', 'rules'];
      if (!allowedEditViews.includes(state.assist.editView)) {
        state.assist.editView = 'records';
      }
      const detailSections = state.assist.detailSections || {};
      state.assist.detailSections = {
        overview: detailSections.overview === true,
        formulas: detailSections.formulas === true
      };
    }

        rules: Array.isArray(data.rules) ? data.rules.length : 0,
        profiles: Array.isArray(data.profiles) ? data.profiles.length : 0
      };
    }

        },

      };
    }

    function assistScoreReference() {
      const result = state.assist.searchResult || {};
      return Object.assign(defaultAssistScoreReference(), result.score_reference || {});
    }

    function assistSearchStats() {
      const result = state.assist.searchResult;
      const items = result && Array.isArray(result.results) ? result.results : [];
      if (!items.length) {
        return {
          count: 0,
          average: null,
          max: null,
          min: null
        };
      }
      const scores = items.map((item) => Number(item.score || 0));
      const total = scores.reduce((sum, value) => sum + value, 0);
      return {
        count: scores.length,
        average: Math.round((total / scores.length) * 10) / 10,
        max: Math.max(...scores),
        min: Math.min(...scores)
      };
    }

    }

      const rules = (breakdown || []).filter((part) => part.category === 'rule');
      const records = (breakdown || []).filter((part) => part.category === 'record');
      let html = '';
      if (profiles.length) {
        html += `<div class="cloud-assist-category-section">
          <div class="cloud-assist-category-label">候補者条件</div>
          ${profiles.map((part) => `
            <div class="cloud-assist-category-item">
              <div class="cloud-assist-category-item-head">
                <span class="cloud-note-chip">${escapeHtml(part.match_label || '-')}</span>
              </div>
              <p class="cloud-panel-note">${escapeHtml(part.context || '-')} → ${escapeHtml(String(part.points || 0))}点 (${escapeHtml(part.formula || '-')})</p>
            </div>
          `).join('')}
        </div>`;
      }
      if (aptitudes.length) {
        html += `<div class="cloud-assist-category-section">
          <div class="cloud-assist-category-label">オプション適性</div>
          ${aptitudes.map((part) => `
            <div class="cloud-assist-category-item">
              <div class="cloud-assist-category-item-head">
                <span class="cloud-note-chip">${escapeHtml(part.match_label || '-')}</span>
                ${part.record_count != null ? `<span class="cloud-note-chip">実績 ${escapeHtml(String(part.record_count))}件</span>` : ''}
              </div>
              <p class="cloud-panel-note">${escapeHtml(part.context || '-')} → ${escapeHtml(String(part.points || 0))}点 (${escapeHtml(part.formula || '-')})</p>
            </div>
          `).join('')}
        </div>`;
      }
      if (rules.length) {
        html += `<div class="cloud-assist-category-section">
          <div class="cloud-assist-category-label">適用ルール</div>
          ${rules.map((part) => `
            <div class="cloud-assist-category-item">
              <div class="cloud-assist-category-item-head">
                <span class="cloud-note-chip">${escapeHtml(part.match_label || '-')}</span>
                <span class="cloud-note-chip">${escapeHtml(part.role_label || '通常')}</span>
                ${part.priority ? `<span class="cloud-note-chip">優先 ${escapeHtml(String(part.priority))}</span>` : ''}
                ${Number(part.custom_points || 0) ? `<span class="cloud-note-chip">独自 ${escapeHtml(`${Number(part.custom_points || 0) > 0 ? '+' : ''}${part.custom_points}`)}</span>` : ''}
              </div>
              <p class="cloud-panel-note">${escapeHtml(part.context || '-')} → ${escapeHtml(String(part.points || 0))}点 (${escapeHtml(part.formula || '-')})</p>
            </div>
          `).join('')}
        </div>`;
      }
      if (records.length) {
        html += `<div class="cloud-assist-category-section">
          <div class="cloud-assist-category-label">該当実績</div>
          ${records.map((part) => `
            <div class="cloud-assist-category-item">
              <div class="cloud-assist-category-item-head">
                <span class="cloud-note-chip">${escapeHtml(part.match_label || '-')}</span>
                <span class="cloud-note-chip">${escapeHtml(part.role_label || '通常')}</span>
                ${part.days_ago != null ? `<span class="cloud-note-chip">${escapeHtml(String(part.days_ago))}日前</span>` : ''}
              </div>
              <p class="cloud-panel-note">${escapeHtml(part.context || '-')} → ${escapeHtml(String(part.points || 0))}点 (${escapeHtml(part.formula || '-')})</p>
            </div>
          `).join('')}
        </div>`;
      }
      return html;
    }

    function buildAssistSceneConflictNotice(item) {
      const siteNames = Array.isArray(item && item.scene_conflict_site_names)
        ? item.scene_conflict_site_names.map((name) => String(name || '').trim()).filter(Boolean)
        : [];
      if (!siteNames.length) return '';
      return `
        <div class="cloud-assist-conflict-note">
          <strong>同日競合あり</strong>
          <p class="cloud-panel-note">競合先現場: ${escapeHtml(siteNames.join(' / '))}</p>
        </div>

    function buildAssistSearchResults(result) {
      if (!result || !Array.isArray(result.results)) {
        return '<div class="cloud-empty-state"><p>検索条件を入力して候補を表示します。</p></div>';
      }
      if (!result.results.length) {
        return '<div class="cloud-empty-state"><p>一致する候補が見つかりませんでした。</p></div>';
      }
      return result.results.map((item, index) => `
        <article class="cloud-assist-result-card${item && item.has_scene_conflict ? ' is-conflict' : ''}">
          <div class="cloud-assist-result-head">
            <div>
              <h4>${escapeHtml(item.name || '-')}</h4>
              <p>${escapeHtml(item.employee_number || '社員番号なし')}</p>
            </div>
            <div class="cloud-actions compact">

            <span class="cloud-note-chip">ルール一致 ${escapeHtml(String(item.matched_rule_count || 0))}</span>

    }

      if (candidate) {
        const reasons = Array.isArray(candidate.reasons)
          ? candidate.reasons.map((reason) => String(reason || '').trim()).filter(Boolean).slice(0, 3)
          : [];
        return `
          <article class="cloud-assist-result-card${candidate && candidate.has_scene_conflict ? ' is-conflict' : ''}">
            <div class="cloud-assist-result-head">
              <div>
                <h4>${escapeHtml(candidate.name || '-')}</h4>

              </div>
              <div class="cloud-actions compact">
                <div class="cloud-assist-score">${escapeHtml(String(candidate.score || 0))}点</div>

                  data-day-assist-top-add="${escapeHtml(String(day))}"
                  data-day-assist-top-shift="${escapeHtml(String(shiftKey || ''))}"

              ${candidate && candidate.has_scene_conflict ? `<span class="cloud-note-chip danger">同日競合 ${escapeHtml(String(candidate.scene_conflict_site_count || 0))}現場</span>` : ''}
            </div>
            ${buildAssistSceneConflictNotice(candidate)}
            ${reasons.length ? `
              <div class="cloud-assist-category-section">

      const records = parts.filter((part) => part.category === 'record');

      if (profiles.length) {

          <article class="cloud-assist-detail-breakdown-item">

    function currentAssistModal() {
      return document.getElementById('cloud-assist-modal');
    }

    function filteredAssistRecords() {
      const filters = state.assist.editFilters || {};
      return (currentAssistData().records || []).filter((record) => {
        if (filters.date_from && String(record.date || '') < filters.date_from) return false;
        if (filters.date_to && String(record.date || '') > filters.date_to) return false;
        if (filters.shift_key && String(record.shift_key || '') !== filters.shift_key) return false;
        if (filters.role_type && String(record.role_type || '') !== filters.role_type) return false;
        if (filters.candidate_query) {
          const query = filters.candidate_query.toLowerCase();
          const haystack = [
            record.candidate_name,
            record.employee_number,
            record.notes
          ].join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });
    }

    function filteredAssistSites(siteType) {
      const filters = state.assist.editFilters || {};
      const data = currentAssistData();
      const sites = siteType === 'training' ? (data.training_sites || []) : (data.experienced_sites || []);
      return sites.filter((site) => {
        if (filters.date_from && String(site.date || '') < filters.date_from) return false;
        if (filters.date_to && String(site.date || '') > filters.date_to) return false;
        if (filters.shift_key && String(site.shift_key || '') !== filters.shift_key) return false;
        if (filters.candidate_query) {
          const query = filters.candidate_query.toLowerCase();
          const haystack = [
            site.site_id,
            site.site_name,
            site.notes
          ].join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });
    }

    function filteredAssistRules() {
      const filters = state.assist.editFilters || {};
      return (currentAssistData().rules || []).filter((rule) => {
        if (filters.shift_key && String(rule.shift_key || '') !== filters.shift_key) return false;
        if (filters.candidate_query) {
          const query = filters.candidate_query.toLowerCase();
          const haystack = [
            rule.notes,
            ...(rule.assignments || []).map((item) => `${item.candidate_name} ${item.employee_number}`)
          ].join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        if (filters.role_type) {
          const matched = (rule.assignments || []).some((item) => String(item.role_type || '') === filters.role_type);
          if (!matched) return false;
        }
        return true;
      });
    }

    function filteredAssistProfiles() {
      const filters = state.assist.editFilters || {};
      return (currentAssistData().profiles || []).filter((profile) => {
        if (filters.candidate_query) {
          const query = filters.candidate_query.toLowerCase();
          const haystack = [
            profile.name,
            profile.employee_number,
            ...(profile.preferred_weekday_labels || []),
            ...(profile.blocked_weekday_labels || [])
          ].join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });
    }

    function collectAssistCandidatePayload(form, prefix) {
      return {
        candidate_id: (form.querySelector(`input[name="${prefix}_candidate_id"]`) || {}).value || '',
        candidate_name: (form.querySelector(`input[name="${prefix}_candidate_name"]`) || {}).value || '',
        employee_number: (form.querySelector(`input[name="${prefix}_employee_number"]`) || {}).value || ''
      };
    }

    function collectAssistRecordPayload(form) {
      return Object.assign(collectAssistCandidatePayload(form, form.getAttribute('data-form-id')), {
        date: form.querySelector('[name="date"]').value,
        shift_key: form.querySelector('[name="shift_key"]').value,
        role_type: form.querySelector('[name="role_type"]').value,
        notes: form.querySelector('[name="notes"]').value
      });
    }

    function collectAssistSitePayload(form) {
      const siteTypeField = form.querySelector('[name="site_type"]');
      return {
        site_type: siteTypeField ? siteTypeField.value : (state.assist.registerView || 'experienced'),
        date: form.querySelector('[name="date"]').value,
        site_row_id: (form.querySelector('[name="site_row_id"]') || {}).value || '',
        site_id: (form.querySelector('[name="site_id"]') || {}).value || '',
        site_name: form.querySelector('[name="site_name"]').value,
        shift_key: form.querySelector('[name="shift_key"]').value,
        notes: form.querySelector('[name="notes"]').value
      };
    }

    function collectAssistRulePayload(form) {
      const assignments = Array.from(form.querySelectorAll('[data-assist-assignment-row]')).map((row) => {
        const field = row.querySelector('[data-assist-candidate-field]');
        const refs = assistCandidateFieldRefs(field);
        return {
          candidate_id: refs.idInput ? refs.idInput.value : '',
          candidate_name: refs.nameInput ? refs.nameInput.value : '',
          employee_number: refs.employeeInput ? refs.employeeInput.value : '',
          role_type: (row.querySelector('[name="role_type"]') || {}).value || 'dedicated',
          priority: (row.querySelector('[name="priority"]') || {}).value || '1',
          custom_points: (row.querySelector('[name="custom_points"]') || {}).value || '0'
        };
      }).filter((item) => item.candidate_name);
      return {
        weekday: form.querySelector('[name="weekday"]').value,
        shift_key: form.querySelector('[name="shift_key"]').value,
        enabled: form.querySelector('[name="enabled"]').value === 'true',
        notes: form.querySelector('[name="notes"]').value,
        assignments
      };
    }

    function collectAssistProfilePayload(form) {
      const collectWeekdays = (name) => Array.from(form.querySelectorAll(`input[name="${name}"]:checked`))
        .map((input) => parseInt(input.value, 10))
        .filter((value) => Number.isInteger(value));
      return {
        active: (form.querySelector('[name="active"]') || {}).value === 'true',
        preferred_weekdays: collectWeekdays('preferred_weekdays'),
        blocked_weekdays: collectWeekdays('blocked_weekdays')
      };
    }

    function assistDateTextForDay(day) {
      const month = currentMonth();
      const parsedDay = parseInt(day || '0', 10);
      if (!month || !parsedDay) return defaultAssistTargetDate();
      return `${month.year}-${String(month.month).padStart(2, '0')}-${String(parsedDay).padStart(2, '0')}`;
    }

    function assistSelectedShiftKeyForDay(day) {
      if (!window.ShifterSync || !ShifterSync.getSelectedOptionsForDay) return '';
      const options = ShifterSync.getSelectedOptionsForDay(String(day));
      return Array.isArray(options) && options.length ? String(options[0] || '') : '';
    }

    function parseCalendarAssistEntry(entry) {
      const value = String(entry && entry.value ? entry.value : '').trim();
      const match = value.match(/^!([^!]+)!(.+)$/);
      return {
        shift_key: match ? String(match[1] || '').trim() : '',
        candidate_name: (match ? String(match[2] || '') : value).trim(),
        employee_number: String(entry && entry.employee_number ? entry.employee_number : '').trim(),
        notes: String(entry && entry.comment ? entry.comment : '').trim()
      };
    }

    function currentDayEntries(day) {
      const entriesPerDay = currentEntriesSnapshot();
      return Array.isArray(entriesPerDay[String(day)]) ? entriesPerDay[String(day)] : [];
    }

    function assistTargetDayFromContext() {
      const context = state.assist.dayContext || {};
      const directDay = parseInt(String(context.day || ''), 10);
      if (Number.isInteger(directDay) && directDay > 0) {
        return directDay;
      }
      const month = currentMonth();
      const match = String(context.date || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!month || !match) return null;
      if (parseInt(match[1], 10) !== parseInt(month.year, 10) || parseInt(match[2], 10) !== parseInt(month.month, 10)) {
        return null;
      }
      const parsedDay = parseInt(match[3], 10);
      return Number.isInteger(parsedDay) && parsedDay > 0 ? parsedDay : null;
    }

    function assistTargetShiftKeyFromContext() {
      const context = state.assist.dayContext || {};
      if (context.shift_key) return String(context.shift_key);
      const result = state.assist.searchResult || {};
      if (result.query && result.query.shift_key) return String(result.query.shift_key);
      const form = state.assist.searchForm || {};
      return String(form.shift_key || '');
    }

    function appendAssistEntryToDay(day, entry) {
      const dayKey = String(day || '');
      if (!dayKey || !entry || !entry.value) return false;
      const nextEntries = deepClone(currentEntriesSnapshot() || {});
      const dayEntries = Array.isArray(nextEntries[dayKey]) ? nextEntries[dayKey].slice() : [];
      dayEntries.push({
        id: entry.id || `assist-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
        value: String(entry.value || ''),
        comment: String(entry.comment || '').trim(),
        employee_number: String(entry.employee_number || '').trim()
      });
      nextEntries[dayKey] = dayEntries;
      replaceCalendarEntries(nextEntries);
      return true;
    }

    function suggestedTrainingSitesForDay(day) {
      const selectedShiftKey = assistSelectedShiftKeyForDay(day);
      return (currentAssistData().training_sites || []).slice().sort((left, right) => {
        const leftMatch = selectedShiftKey && String(left.shift_key || '') === selectedShiftKey ? 0 : 1;
        const rightMatch = selectedShiftKey && String(right.shift_key || '') === selectedShiftKey ? 0 : 1;
        if (leftMatch !== rightMatch) return leftMatch - rightMatch;
        const leftDate = String(left.date || '');
        const rightDate = String(right.date || '');
        if (leftDate !== rightDate) return rightDate.localeCompare(leftDate);
        return String(left.site_name || '').localeCompare(String(right.site_name || ''), 'ja');
      });
    }

    function assistCandidateEntryValue(site) {
      const siteName = String(site && site.site_name ? site.site_name : '').trim();
      const shiftKey = String(site && site.shift_key ? site.shift_key : '').trim();
      return shiftKey ? `!${shiftKey}!${siteName}` : siteName;
    }

    function appendAssistSiteCandidateToDay(day, site) {
      const dayKey = String(day || '');
      const siteName = String(site && site.site_name ? site.site_name : '').trim();
      if (!dayKey || !siteName) return false;
      return appendAssistEntryToDay(dayKey, {
        value: assistCandidateEntryValue(site),
        comment: String(site && site.notes ? site.notes : '').trim(),
        employee_number: ''
      });
    }

    function canAppendAssistSearchResultToDay() {
      return currentAssistMode() === 'scene' && assistTargetDayFromContext() != null;
    }

    function appendAssistSearchResultToDay(candidate) {
      const day = assistTargetDayFromContext();
      const name = String(candidate && candidate.name ? candidate.name : '').trim();
      if (!day || !name) return false;
      const shiftKey = assistTargetShiftKeyFromContext();
      return appendAssistEntryToDay(day, {
        value: shiftKey ? `!${shiftKey}!${name}` : name,
        comment: '',
        employee_number: String(candidate && candidate.employee_number ? candidate.employee_number : '').trim()
      });
    }

    function appendAssistSearchResultToSpecificDay(day, shiftKey, candidate) {
      const dayKey = String(day || '').trim();
      const name = String(candidate && candidate.name ? candidate.name : '').trim();
      if (!dayKey || !name) return false;
      return appendAssistEntryToDay(dayKey, {
        value: shiftKey ? `!${shiftKey}!${name}` : name,
        comment: '',
        employee_number: String(candidate && candidate.employee_number ? candidate.employee_number : '').trim()
      });
    }

    function buildAssistSearchResultAction(item, index) {
      if (!canAppendAssistSearchResultToDay()) return '';
      const day = assistTargetDayFromContext();
      return `
        <button
          type="button"

    function normalizeAssistSearchPayload(payload) {
      return {
        target_date: payload && payload.target_date ? payload.target_date : defaultAssistTargetDate(),
        shift_key: payload && payload.shift_key ? payload.shift_key : ''
      };

      const normalized = normalizeAssistSearchPayload(payload);
      return requestJson(`${assistBasePath()}/search`, {
        method: 'POST',

    async function executeAssistSearch(payload) {
      const normalized = normalizeAssistSearchPayload(payload);
      state.assist.searchForm = Object.assign({}, normalized);
      state.assist.searchResult = await fetchAssistSearchPreview(normalized);
      return state.assist.searchResult;

    async function saveAssistRecord(form, recordId) {
      const payload = assistRequestOptions(collectAssistRecordPayload(form));
      const base = assistBasePath();
      const response = await requestJson(recordId ? `${base}/records/${recordId}` : `${base}/records`, {
        method: recordId ? 'PUT' : 'POST',
        body: payload
      });
      state.assist.data = response.assist || currentAssistData();
      state.assist.loaded = true;
      if (!recordId) {
        state.assist.recordDraft = null;
      }
      const modal = currentAssistModal();
      if (modal && !modal.classList.contains('cloud-hidden')) {
        renderAssistModalContent(modal);
      }

      if (!form) return;
      const refs = assistSiteFieldRefs(form);

      const modal = openCloudModal('cloud-assist-site-picker-modal', '現場を選択');
      const body = modalBody(modal);
      const footer = modalFooter(modal);
      if (!body || !footer) return;

      body.innerHTML = `
        <div class="cloud-form">
          <label class="cloud-field">
            <span>現場検索</span>
            <input id="cloud-assist-site-picker-query" class="cloud-input" type="text" placeholder="契約番号または現場名" value="${escapeHtml(initialQuery)}">
          </label>
          <div id="cloud-assist-site-picker-list" class="cloud-project-list"></div>
        </div>
      `;
      footer.innerHTML = '<button type="button" class="cloud-btn secondary" data-cloud-assist-site-picker-close>閉じる</button>';
      footer.querySelector('[data-cloud-assist-site-picker-close]').addEventListener('click', () => closeCloudModal('cloud-assist-site-picker-modal'));

      const queryInput = body.querySelector('#cloud-assist-site-picker-query');
      const list = body.querySelector('#cloud-assist-site-picker-list');
      const renderList = async () => {
        if (!list) return;
        list.innerHTML = '<div class="cloud-empty-state"><p>検索中です...</p></div>';
        const sites = await fetchSiteCandidates(queryInput ? queryInput.value : '');
        list.innerHTML = sites.length ? sites.map((site) => `
          <article class="cloud-project-item">
            <div class="cloud-project-title">${escapeHtml(site.site_name || '-')}</div>
            <div class="cloud-project-meta">
              <span>${escapeHtml(site.site_id || '-')}</span>
              <span>${escapeHtml(`有効枝番号 ${site.active_branch_count || 0}件`)}</span>
            </div>
            <div class="cloud-actions compact">
              <button type="button" class="cloud-btn primary" data-assist-site-picker-select="${escapeHtml(String(site.id))}">この現場を使う</button>
            </div>
          </article>
        `).join('') : '<div class="cloud-empty-state"><p>一致する現場がありません。</p></div>';
        list.querySelectorAll('[data-assist-site-picker-select]').forEach((button) => {
          button.addEventListener('click', () => {
            const picked = sites.find((item) => String(item.id) === String(button.getAttribute('data-assist-site-picker-select') || ''));
            if (!picked) return;
            applyAssistSiteSelectionToForm(form, picked);
            closeCloudModal('cloud-assist-site-picker-modal');
          });
        });
      };

      if (queryInput) {
        queryInput.addEventListener('input', () => {
          window.clearTimeout(openAssistSitePickerForForm._timer);
          openAssistSitePickerForForm._timer = window.setTimeout(() => {
            renderList().catch((error) => showFlash(error.message, 'error'));
          }, 180);
        });
        queryInput.focus();
      }
      await renderList();
    }

    async function withAssistPending(trigger, task) {

      if (button) {

        button.dataset.assistPending = '1';
        button.disabled = true;
      }
      try {

          button.disabled = false;
          delete button.dataset.assistPending;
        }
      }
    }

    function bindAssistFormEvents(scope) {
      scope.querySelectorAll('[data-assist-candidate-input]').forEach((input) => {
        input.addEventListener('input', () => scheduleAssistCandidateSearch(input.closest('[data-assist-candidate-field]')));
      });
      scope.querySelectorAll('[name="date"]').forEach((input) => {
        const note = input.parentElement ? input.parentElement.querySelector('[data-assist-date-note]') : null;
        const sync = () => {
          if (note) note.textContent = assistWeekdayLabelFromDate(input.value);
        };
        input.addEventListener('input', sync);
        input.addEventListener('change', sync);
        sync();
      });
      scope.querySelectorAll('[data-assist-site-form] [name="site_name"]').forEach((input) => {
        if (input.dataset.assistSiteInputBound === '1') return;
        input.dataset.assistSiteInputBound = '1';
        const sync = () => {
          const form = input.closest('form');
          const refs = assistSiteFieldRefs(form);
          if (!refs.siteNameInput) return;
          const normalizedName = refs.siteNameInput.value.trim();
          if (!normalizedName) {
            if (refs.rowIdInput) refs.rowIdInput.value = '';
            if (refs.siteIdInput) refs.siteIdInput.value = '';
            if (refs.note) refs.note.textContent = '現場名を入力するか、現場リストPLUSから選択してください';
            return;
          }
          if (refs.rowIdInput && refs.rowIdInput.value) {
            refs.rowIdInput.value = '';
            if (refs.siteIdInput) refs.siteIdInput.value = '';
            if (refs.note) refs.note.textContent = '手入力に変更したため、現場リンクを解除しました';
          } else if (refs.note && !refs.siteIdInput?.value) {
            refs.note.textContent = '未紐付けの現場名です。必要に応じて現場リストPLUSから選択してください';
          }
        };
        input.addEventListener('input', sync);
      });
      scope.querySelectorAll('[data-assist-add-assignment]').forEach((button) => {
        button.addEventListener('click', () => {
          const container = button.closest('form').querySelector('[data-assist-assignments]');
          container.insertAdjacentHTML('beforeend', buildAssistRuleAssignmentRow({ role_type: 'backup', priority: 1 }, container.children.length));
          bindAssistFormEvents(container);
        });
      });
      scope.querySelectorAll('[data-assist-remove-assignment]').forEach((button) => {
        button.addEventListener('click', () => {
          const row = button.closest('[data-assist-assignment-row]');
          const container = row.parentElement;
          row.remove();
          if (!container.querySelector('[data-assist-assignment-row]')) {
            container.insertAdjacentHTML('beforeend', buildAssistRuleAssignmentRow({ role_type: 'backup', priority: 1 }, 0));
            bindAssistFormEvents(container);
          }
        });
      });
      scope.querySelectorAll('[data-assist-pick-site]').forEach((button) => {
        if (button.dataset.assistSitePickerBound === '1') return;
        button.dataset.assistSitePickerBound = '1';
        button.addEventListener('click', () => {
          openAssistSitePickerForForm(button.closest('form')).catch((error) => showFlash(error.message, 'error'));
        });
      });
      if (!scope.dataset.assistCandidateClickBound) {
        scope.dataset.assistCandidateClickBound = '1';
        scope.addEventListener('click', (event) => {
          const candidate = event.target.closest('.cloud-assist-candidate');
          if (!candidate) return;
          event.preventDefault();
          applyAssistCandidateSelection(candidate.closest('[data-assist-candidate-field]'), {
            candidate_id: candidate.getAttribute('data-candidate-id') || '',
            candidate_name: candidate.getAttribute('data-candidate-name') || candidate.getAttribute('data-employee-name') || '',
            employee_name: candidate.getAttribute('data-employee-name') || '',
            employee_number: candidate.getAttribute('data-employee-number') || ''
          });
        });
      }
    }

      if (Object.prototype.hasOwnProperty.call(next, 'activeTab')) {
        state.assist.activeTab = next.activeTab;
      }
      if (Object.prototype.hasOwnProperty.call(next, 'registerView')) {
        state.assist.registerView = next.registerView;
      }
      if (Object.prototype.hasOwnProperty.call(next, 'recordDraft')) {
        state.assist.recordDraft = next.recordDraft;
      }
      if (Object.prototype.hasOwnProperty.call(next, 'dayContext')) {
        state.assist.dayContext = next.dayContext;
      }
      if (Object.prototype.hasOwnProperty.call(next, 'searchForm')) {
        state.assist.searchForm = Object.assign(
          {
            target_date: defaultAssistTargetDate(),
            shift_key: ''
          },
          next.searchForm || {}
        );
      }
      if (mode === 'person') {
        if (!Object.prototype.hasOwnProperty.call(next, 'registerView')) {
          state.assist.registerView = next.recordDraft && next.recordDraft.site_type === 'training'
            ? 'training'
            : 'experienced';
        }
        if (!Object.prototype.hasOwnProperty.call(next, 'dayContext') && !Object.prototype.hasOwnProperty.call(next, 'recordDraft')) {
          state.assist.recordDraft = null;
        }
      }
      const modal = openCloudModal('cloud-assist-modal', `アシスト / ${currentProject().title}`);
      modalBody(modal).innerHTML = '<div class="cloud-empty-state"><p>アシストデータを読み込み中です...</p></div>';

      modalFooter(modal).querySelector('[data-cloud-assist-close]').addEventListener('click', () => closeCloudModal('cloud-assist-modal'));
      await ensureAssistLoaded(false);
      if (next.autoSearch) {
        await executeAssistSearch(state.assist.searchForm || {});
      }
      renderAssistModalContent(modal);
    }

    function conflictCheckMonthKeys(mode) {
      const keys = new Set();
      state.projects
        .filter((project) => project.mode === mode)
        .forEach((project) => {
          (project.month_keys || []).forEach((key) => keys.add(key));
        });
      return Array.from(keys).sort();
    }

    function defaultConflictCheckMonthKey(mode, availableKeys) {
      if (currentProject() && currentProject().mode === mode && currentMonthKey() && availableKeys.includes(currentMonthKey())) {
        return currentMonthKey();
      }
      return availableKeys.length ? availableKeys[availableKeys.length - 1] : '';
    }

    function syncConflictCheckState() {
      const nextMode = state.conflictCheck.mode === 'person' ? 'person' : 'scene';
      const monthKeys = conflictCheckMonthKeys(nextMode);
      state.conflictCheck.mode = nextMode;

      if (!monthKeys.length) {
        state.conflictCheck.monthKey = '';
        state.conflictCheck.selectedProjectIds = [];
        state.conflictCheck.result = null;
        return;
      }

      if (!monthKeys.includes(state.conflictCheck.monthKey)) {
        state.conflictCheck.monthKey = defaultConflictCheckMonthKey(nextMode, monthKeys);
        state.conflictCheck.result = null;
      }

      const availableIds = state.projects
        .filter((project) => project.mode === nextMode && (project.month_keys || []).includes(state.conflictCheck.monthKey))
        .map((project) => project.id);
      const currentIds = Array.isArray(state.conflictCheck.selectedProjectIds) ? state.conflictCheck.selectedProjectIds : null;
      const filteredIds = currentIds ? currentIds.filter((projectId) => availableIds.includes(projectId)) : [];
      if (currentIds && filteredIds.length !== currentIds.length) {
        state.conflictCheck.result = null;
      }
      state.conflictCheck.selectedProjectIds = currentIds === null ? availableIds.slice() : filteredIds;
    }

    function selectedConflictCheckProjects() {
      syncConflictCheckState();
      const selectedIds = new Set(state.conflictCheck.selectedProjectIds);
      return state.projects.filter((project) => selectedIds.has(project.id) && project.mode === state.conflictCheck.mode && (project.month_keys || []).includes(state.conflictCheck.monthKey));
    }

    function renderConflictCheckProjectList() {
      const container = $('cloud-check-project-list');
      if (!container) return;

      syncConflictCheckState();
      const monthKey = state.conflictCheck.monthKey;
      const projects = state.projects.filter((project) => project.mode === state.conflictCheck.mode && (project.month_keys || []).includes(monthKey));
      if (!projects.length) {
        container.innerHTML = '<div class="cloud-empty-state"><p>選択中の条件に一致するシフト帳がありません。</p></div>';
        return;
      }

      const selectedIds = new Set(state.conflictCheck.selectedProjectIds);
      container.innerHTML = projects.map((project) => `
        <article class="cloud-check-project-item ${selectedIds.has(project.id) ? 'is-selected' : ''}" data-check-project-card="${project.id}">
          <label class="cloud-check-project-label">
            <div class="cloud-check-project-head">
              <input type="checkbox" data-check-project-id="${project.id}" ${selectedIds.has(project.id) ? 'checked' : ''}>
              <div>
                <h3 class="cloud-check-project-title">${escapeHtml(project.title)}</h3>
                <p class="cloud-check-project-meta">${escapeHtml(modeLongLabel(project.mode))} / ${escapeHtml(formatMonthKey(monthKey))}</p>
              </div>
            </div>
            <div class="cloud-badges">
              <span class="cloud-badge">${escapeHtml(project.latest_month_key ? formatMonthKey(project.latest_month_key) : '未作成月')}</span>
              <span class="cloud-badge">${escapeHtml(`${project.month_count}か月`)}</span>
            </div>
          </label>
        </article>
      `).join('');
    }

    function renderConflictCheckResult(result) {
      const container = $('cloud-check-results');
      if (!container) return;

      if (!result) {
        container.innerHTML = '<div class="cloud-empty-state"><p>比較条件を選んで「比較する」を押すと結果を表示します。</p></div>';
        return;
      }

      const sources = Array.isArray(result.sources) && result.sources.length
        ? result.sources
        : (result.targets || []).map((label) => ({ label }));
      const labels = sources.map((source) => source.label || source.title || 'シフト帳');
      const capacities = Array.isArray(result.capacities) ? result.capacities : [];
      const dates = Array.isArray(result.dates) ? result.dates : [];
      const matrix = result.matrix && typeof result.matrix === 'object' ? result.matrix : {};
      const conflicts = Array.isArray(result.conflicts) ? result.conflicts : [];
      const sameSiteConflicts = Array.isArray(result.same_site_conflicts) ? result.same_site_conflicts : [];
      const conflictSet = new Set(conflicts.map((item) => `${item.date}-${item.entry}`));
      const sameSiteSet = new Set(sameSiteConflicts.map((item) => `${item.date}-${item.entry}-${item.file_index}`));

      const summaryHtml = `
        <div class="cloud-check-summary">
          <span class="cloud-badge">対象 ${labels.length}件</span>
          <span class="cloud-badge">年月 ${escapeHtml(formatMonthKey(result.month_key || `${result.year}-${String(result.month || '').padStart(2, '0')}`))}</span>
          <span class="cloud-badge">他シフト重複 ${conflicts.length}件</span>
          <span class="cloud-badge">同一シフト帳内重複 ${sameSiteConflicts.length}件</span>
        </div>
      `;

      const headerRow = `
        <div class="cloud-check-header-row">
          <div class="cloud-check-corner">日付</div>
          ${labels.map((label, index) => `
            <div class="cloud-check-header-cell">
              <div class="cloud-check-header-title">${escapeHtml(label)}</div>
              <div class="cloud-check-header-meta">${capacities[index] ? `必要人数 ${escapeHtml(String(capacities[index]))}` : '必要人数なし'}</div>
            </div>
          `).join('')}
        </div>
      `;

      const weekdayLabels = ['日', '月', '火', '水', '木', '金', '土'];
      const resultYear = Number(result.year);
      const resultMonth = Number(result.month);
      const hasYearMonth = Number.isFinite(resultYear) && Number.isFinite(resultMonth) && resultMonth > 0;

      const bodyRows = dates.map((day) => {
        let weekdayClass = '';
        let weekdayText = '';
        if (hasYearMonth) {
          const weekdayIdx = new Date(resultYear, resultMonth - 1, day).getDay();
          weekdayText = weekdayLabels[weekdayIdx] || '';
          if (weekdayIdx === 6) weekdayClass = ' is-saturday';
          else if (weekdayIdx === 0) weekdayClass = ' is-sunday';
        }
        return `
        <div class="cloud-check-date-row${weekdayClass}">
          <div class="cloud-check-date-cell${weekdayClass}">${day}日${weekdayText ? ` (${weekdayText})` : ''}</div>
          ${labels.map((_, index) => {
            const entries = Array.isArray(matrix[day] && matrix[day][index]) ? matrix[day][index] : [];
            const capacity = capacities[index];
            const needsWarning = capacity && entries.length < capacity;
            const entryHtml = entries.length
              ? entries.map((entry) => {
                  const isConflict = conflictSet.has(`${day}-${entry.original}`);
                  const isSameSite = sameSiteSet.has(`${day}-${entry.original}-${index}`);
                  return `<div class="cloud-check-entry${isConflict ? ' is-conflict' : ''}${isSameSite ? ' is-self-conflict' : ''}">${escapeHtml(entry.display || entry.original || '')}</div>`;
                }).join('')
              : '<div class="cloud-check-entry is-empty">未登録</div>';
            return `<div class="cloud-check-cell${weekdayClass}${needsWarning ? ' is-capacity-warning' : ''}"><div class="cloud-check-entry-list">${entryHtml}</div></div>`;
          }).join('')}
        </div>
      `;
      }).join('');

      container.innerHTML = `
        ${summaryHtml}
        <div class="cloud-check-scroll">
          <div class="cloud-check-table" style="--cloud-check-columns: ${labels.length};">
            ${headerRow}
            ${bodyRows}
          </div>
        </div>
      `;
    }

    function renderConflictCheckPanel() {
      const modeSelect = $('cloud-check-mode');
      const monthSelect = $('cloud-check-month');
      const summary = $('cloud-check-selection-summary');
      if (!modeSelect || !monthSelect || !summary) {
        return;
      }

      syncConflictCheckState();
      const availableMonthKeys = conflictCheckMonthKeys(state.conflictCheck.mode);
      modeSelect.value = state.conflictCheck.mode;
      monthSelect.innerHTML = availableMonthKeys.length
        ? availableMonthKeys.map((key) => `<option value="${key}" ${key === state.conflictCheck.monthKey ? 'selected' : ''}>${formatMonthKey(key)}</option>`).join('')
        : '<option value="">対象なし</option>';
      monthSelect.disabled = !availableMonthKeys.length;

      const selectedProjects = selectedConflictCheckProjects();
      if (!availableMonthKeys.length) {
        summary.textContent = '対象月がありません';
      } else if (!selectedProjects.length) {
        summary.textContent = '比較対象を選択してください';
      } else {
        summary.textContent = `${formatMonthKey(state.conflictCheck.monthKey)} / ${selectedProjects.length}件選択中`;
      }

      renderConflictCheckProjectList();
      renderConflictCheckResult(state.conflictCheck.result);
    }

    async function runConflictCheck() {
      syncConflictCheckState();
      const selectedProjects = selectedConflictCheckProjects();
      if (!state.conflictCheck.monthKey) {
        showFlash('比較する年月を選択してください', 'error');
        return;
      }
      if (!selectedProjects.length) {
        showFlash('比較するシフト帳を選択してください', 'error');
        return;
      }

      const result = await requestJson('/tools/shiftersync/cloudshift/api/conflict-check', {
        method: 'POST',
        body: {
          month_key: state.conflictCheck.monthKey,
          project_ids: selectedProjects.map((project) => project.id)
        }
      });
      state.conflictCheck.result = result;
      renderConflictCheckPanel();
      showFlash('重複チェックを更新しました', 'success');
    }
