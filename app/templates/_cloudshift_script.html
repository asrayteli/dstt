<script>
  (function() {
    'use strict';

    const PAGE = window.CLOUDSHIFT_PAGE || {};
    const state = {
      projects: [],
      projectPayload: null,
      baseMonth: null,
      editorMode: 'normal',
      draftVisualObserver: null,
      unsavedObserver: null,
      unsavedBaseline: null,
      pendingSubstituteRequests: [],
      syncReturnContext: null,
      guestName: PAGE.authenticatedEditorName || '',
      assist: {
        contextKey: '',
        loaded: false,
        data: null,
        permissions: {
          can_edit_records: false,
          can_edit_rules: false,
          can_edit_profiles: false
        },
        activeTab: 'register',
        registerView: 'record',
        editView: 'records',
        detailSections: {
          overview: false,
          formulas: false
        },
        searchResult: null,
        recordDraft: null,
        dayContext: null,
        editFilters: {
          date_from: '',
          date_to: '',
          shift_key: '',
          role_type: '',
          candidate_query: ''
        },
        searchForm: {
          target_date: '',
          shift_key: ''
        },
        templates: [],
        templatesLoaded: false,
        templateApply: null
      },
      shiftBookSettings: {
        activeTab: 'requests',
        loaded: false,
        settings: { leave_change_requests: { enabled: false }, leave_sync: { calendar_id: '', option_keys: [] } },
        leaveCalendars: [],
        leaveOptions: [],
        requests: [],
        approvedRequestIds: [],
        accountShares: null,
        revisions: [],
        pushSubscriptions: null
      },
      ownerTransfer: {
        info: null,
        query: '',
        selected: null,
        candidate: null,
        shareWithPreviousOwner: true,
        checking: false
      },
      conflictCheck: {
        mode: 'scene',
        monthKey: '',
        selectedProjectIds: null,
        result: null
      },
      spot: {
        date: '',
        personQuery: '',
        siteQuery: '',
        include: {
          assignments: true,
          people_available: true,
          people_on_leave: true,
          sites_available: true
        },
        result: null
      },
      masterTargets: {
        create: {
          targetType: 'person',
          people: [],
          sites: []
        },
        project: {
          targetType: 'person',
          people: [],
          sites: []
        }
      }
    };

    const SPOT_INCLUDE_STORAGE_KEY = 'cloudshift:spot:include';
    const SPOT_RESULT_SECTIONS = [
      { key: 'assignments', label: '勤務あり', summaryKey: 'assignment_count' },
      { key: 'people_available', label: '空き個人', summaryKey: 'available_people_count' },
      { key: 'people_on_leave', label: '休暇', summaryKey: 'leave_people_count' },
      { key: 'sites_available', label: '空き現場', summaryKey: 'available_site_count' }
    ];

    const employeeSearchCache = new Map();
    const siteSearchCache = new Map();
    const siteBranchCache = new Map();
    const ASSIST_OPTIONLESS_LABEL = 'オプションなし';
    const ASSIST_WEEKDAYLESS_LABEL = '曜日なし';

    function $(id) {
      return document.getElementById(id);
    }

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function makeEntryId() {
      return `cloud-entry-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function parseEntryValue(value) {
      const text = String(value || '').trim();
      const match = text.match(/^!([^!]+)!(.+)$/);
      if (!match) {
        return { optionKey: null, name: text };
      }
      return { optionKey: match[1], name: match[2] };
    }

    function formatEntryValue(optionKey, name) {
      const safeName = String(name || '').trim();
      if (!safeName) {
        return '';
      }
      return optionKey ? `!${optionKey}!${safeName}` : safeName;
    }

    function optionMappings() {
      if (ShifterSync.getOptionMappings) {
        return ShifterSync.getOptionMappings();
      }
      return {
        A: "午前",
        P: "午後",
        E: "早番",
        L: "遅番",
        TEMP: "臨時便",
        M: "マイクロ",
        C: "中型",
        O: "大型",
        W: "ワゴン",
        V: "役員車両",
        N1: "1号車",
        N2: "2号車",
        N3: "3号車",
        N4: "4号車",
        N5: "5号車",
        SUB: "代務",
        TRAIN: "研修",
        PAID: "有休",
        COMP: "代休",
        PUBLIC: "公休",
        CONDOLENCE: "慶弔休暇",
        CARE: "介護休暇",
        REFRESH: "リフレッシュ休暇",
        OTHER: "その他"
      };
    }

    function optionSectionsForMode(mode) {
      if (ShifterSync.getOptionSectionsForMode) {
        return ShifterSync.getOptionSectionsForMode(mode) || [];
      }
      const sections = [{ title: "時間帯", optionKeys: ["A", "P", "E", "L", "TEMP"] }];
      if (mode === "person") {
        sections.push({ title: "休暇種別", optionKeys: ["PAID", "COMP", "PUBLIC", "CONDOLENCE", "CARE", "REFRESH", "OTHER"] });
      }
      sections.push(
        { title: "車両タイプ", optionKeys: ["M", "C", "O", "W", "V"] },
        { title: "車番", optionKeys: ["N1", "N2", "N3", "N4", "N5"] }
      );
      return sections;
    }

    function bulkOptionSectionsForMode(mode) {
      return optionSectionsForMode(mode).map((section) => ({
        title: section.title,
        optionKeys: Array.isArray(section.optionKeys) ? section.optionKeys.slice() : []
      }));
    }

    function optionLabelForKey(optionKey) {
      return optionMappings()[optionKey] || optionKey;
    }

    function normalizeSiteBranchRowId(value) {
      const text = String(value || '').trim();
      if (!text || !/^\d+$/.test(text)) {
        return '';
      }
      return parseInt(text, 10) > 0 ? text : '';
    }

    function normalizeSiteBranchCandidate(branch) {
      if (!branch || typeof branch !== 'object') {
        return null;
      }
      const id = normalizeSiteBranchRowId(branch.id || branch.site_branch_row_id || branch.siteBranchRowId || '');
      const siteBranch = String(branch.site_branch || branch.siteBranch || '').trim();
      if (!id && !siteBranch) {
        return null;
      }
      return {
        id,
        site_branch: siteBranch,
        cloudshift_option_key: String(branch.cloudshift_option_key || branch.cloudshiftOptionKey || '').trim().toUpperCase(),
        option_label: String(branch.option_label || branch.optionLabel || '').trim(),
        is_active: branch.is_active !== false
      };
    }

    function currentProjectSiteBranches() {
      const raw = ShifterSync.getState ? ShifterSync.getState('siteBranches') : [];
      return Array.isArray(raw) ? raw.map((branch) => normalizeSiteBranchCandidate(branch)).filter(Boolean) : [];
    }

    function currentProjectSiteContext() {
      return ShifterSync.getState ? (ShifterSync.getState('siteContext') || null) : null;
    }

    function siteBranchCandidatesForOption(optionKey) {
      const branches = currentProjectSiteBranches().filter((branch) => branch.is_active !== false);
      if (!branches.length) {
        return [];
      }
      const normalizedOption = String(optionKey || '').trim().toUpperCase();
      if (!normalizedOption) {
        return branches;
      }
      const matched = branches.filter((branch) => branch.cloudshift_option_key === normalizedOption);
      return matched.length ? matched : branches;
    }

    function autoBranchFieldsForOption(optionKey) {
      const candidates = siteBranchCandidatesForOption(optionKey);
      if (candidates.length !== 1) {
        return { site_branch_row_id: '', site_branch: '' };
      }
      return {
        site_branch_row_id: candidates[0].id,
        site_branch: candidates[0].site_branch
      };
    }

    function setShifterSyncSiteStateForCurrentProject() {
      if (!ShifterSync.setState) {
        return;
      }
      const project = currentProject();
      const site = project && project.mode === 'scene' ? (project.site || null) : null;
      const cachedBranches = site && site.site_id && siteBranchCache.has(site.site_id)
        ? siteBranchCache.get(site.site_id)
        : [];
      ShifterSync.setState('siteContext', site);
      ShifterSync.setState('siteBranches', Array.isArray(cachedBranches) ? cachedBranches : []);
    }

    function monthDays(month) {
      if (!month) return 0;
      return new Date(month.year, month.month, 0).getDate();
    }

    function monthDayKeys(month) {
      return Array.from({ length: monthDays(month) }, (_, index) => String(index + 1));
    }

    function normalizeSecondOptionKey(value) {
      const key = String(value || '').trim().toUpperCase();
      return key === 'SUB' || key === 'TRAIN' ? key : '';
    }

    // 勤怠/出勤を扱えるのは、現場が特定できるシフト帳だけ（個人シフト、または現場を
    // 紐付けた現場シフト）。
    function shiftTimeTogglesAvailableForProject(project) {
      if (!project) return false;
      if (project.mode === 'person') return true;
      return project.mode === 'scene' && !!(project.site && project.site.is_linked);
    }

    function createBulkEntryFromForm(dayKey, refs) {
      const name = refs.nameInput ? refs.nameInput.value.trim() : '';
      if (!name) return null;
      const optionKey = refs.optionSelect ? refs.optionSelect.value : '';
      const secondOption = refs.secondOptionSelect ? normalizeSecondOptionKey(refs.secondOptionSelect.value) : '';
      const comment = refs.commentInput ? refs.commentInput.value.trim() : '';
      const employeeNumber = refs.employeeInput
        ? refs.employeeInput.value.trim()
        : (refs.nameInput && refs.nameInput.dataset ? String(refs.nameInput.dataset.employeeNumber || '').trim() : '');
      const selectedBranchOption = refs.branchSelect && refs.branchSelect.selectedOptions && refs.branchSelect.selectedOptions.length
        ? refs.branchSelect.selectedOptions[0]
        : null;
      const explicitBranchRowId = refs.branchSelect ? normalizeSiteBranchRowId(refs.branchSelect.value) : '';
      const explicitBranch = explicitBranchRowId
        ? String(selectedBranchOption && selectedBranchOption.getAttribute('data-site-branch') || '').trim()
        : '';
      const autoBranchFields = currentProject() && currentProject().mode === 'scene' && !explicitBranchRowId
        ? autoBranchFieldsForOption(optionKey || null)
        : { site_branch_row_id: explicitBranchRowId, site_branch: explicitBranch };
      const isPersonProject = !!(currentProject() && currentProject().mode === 'person');
      const nameDataset = refs.nameInput && refs.nameInput.dataset ? refs.nameInput.dataset : {};
      const selectedSiteName = String(nameDataset.selectedSiteName || '').trim();
      // 個人シフトは現場リンクを持たせる（勤怠/出勤の解決にも使う）。名前を手入力で
      // 書き換えた場合は候補選択が外れたとみなし、リンクを付けない。
      const siteFields = isPersonProject && selectedSiteName && selectedSiteName === name
        ? {
          site_row_id: String(nameDataset.siteRowId || '').trim(),
          site_id: String(nameDataset.siteId || '').trim(),
          site_name: selectedSiteName
        }
        : { site_row_id: '', site_id: '', site_name: '' };
      return {
        id: makeEntryId(),
        value: formatEntryValue(optionKey || null, name),
        second_option: secondOption,
        comment,
        employee_number: employeeNumber,
        ...siteFields,
        site_branch_row_id: autoBranchFields.site_branch_row_id,
        site_branch: autoBranchFields.site_branch,
        show_attendance_time: !!(refs.showAttendanceInput && refs.showAttendanceInput.checked),
        show_report_time: !!(refs.showReportInput && refs.showReportInput.checked)
      };
    }

    function cloneEntryForBulk(entry) {
      return {
        id: makeEntryId(),
        value: String(entry && entry.value ? entry.value : '').trim(),
        second_option: normalizeSecondOptionKey(entry && (entry.second_option || entry.secondOption || '')),
        comment: String(entry && entry.comment ? entry.comment : '').trim(),
        employee_number: String(entry && entry.employee_number ? entry.employee_number : '').trim(),
        site_row_id: String(entry && (entry.site_row_id || entry.siteRowId || '') ? (entry.site_row_id || entry.siteRowId) : '').trim(),
        site_id: String(entry && (entry.site_id || entry.siteId || '') ? (entry.site_id || entry.siteId) : '').trim(),
        site_name: String(entry && (entry.site_name || entry.siteName || '') ? (entry.site_name || entry.siteName) : '').trim(),
        site_branch_row_id: normalizeSiteBranchRowId(entry && (entry.site_branch_row_id || entry.siteBranchRowId || '')),
        site_branch: String(entry && (entry.site_branch || entry.siteBranch || '') ? (entry.site_branch || entry.siteBranch || '') : '').trim(),
        show_attendance_time: !!(entry && (entry.show_attendance_time || entry.showAttendanceTime)),
        show_report_time: !!(entry && (entry.show_report_time || entry.showReportTime)),
        attendance_times: Array.isArray(entry && entry.attendance_times) ? entry.attendance_times.slice() : [],
        report_time: String(entry && entry.report_time ? entry.report_time : '').trim()
      };
    }

    // 一括コピーの元データから、外部同期エントリと代務要請の表示専用エントリを除外する。
    // （読み取り専用のミラーや申請プレースホルダを実体としてコピーしてしまわないようにする）
    function bulkCopyableSourceEntries(entries) {
      return (Array.isArray(entries) ? entries : [])
        .filter((entry) => !String(entry && entry.sync_source_type ? entry.sync_source_type : '').trim())
        .filter((entry) => !isSubstituteRequestDisplayEntry(entry));
    }

    function ensureCloudModal(modalId, titleText) {
      let modal = document.getElementById(modalId);
      if (modal) {
        if (titleText) {
          const title = modal.querySelector('[data-cloud-modal-title]');
          if (title) title.textContent = titleText;
        }
        return modal;
      }

      modal = document.createElement('div');
      modal.id = modalId;
      modal.className = 'cloud-modal-overlay cloud-hidden';
      modal.innerHTML = `
        <div class="cloud-modal-panel" role="dialog" aria-modal="true">
          <div class="cloud-modal-header">
            <div>
              <div class="cloud-modal-kicker">CloudShift</div>
              <h3 class="cloud-modal-title" data-cloud-modal-title>${escapeHtml(titleText || '')}</h3>
            </div>
            <button type="button" class="cloud-btn secondary cloud-modal-close" data-cloud-modal-close>閉じる</button>
          </div>
          <div class="cloud-modal-body" data-cloud-modal-body></div>
          <div class="cloud-modal-footer" data-cloud-modal-footer></div>
        </div>
      `;
      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          closeCloudModal(modalId);
        }
      });
      modal.querySelector('[data-cloud-modal-close]').addEventListener('click', () => closeCloudModal(modalId));
      document.body.appendChild(modal);
      return modal;
    }

    function closeCloudModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.add('cloud-hidden');
      }
      if (!document.querySelector('.cloud-modal-overlay:not(.cloud-hidden)')) {
        document.body.classList.remove('cloud-modal-open');
      }
    }

    function openCloudModal(modalId, titleText) {
      const modal = ensureCloudModal(modalId, titleText);
      if (titleText) {
        const title = modal.querySelector('[data-cloud-modal-title]');
        if (title) title.textContent = titleText;
      }
      modal.classList.remove('cloud-hidden');
      document.body.classList.add('cloud-modal-open');
      return modal;
    }

    function modalBody(modal) {
      return modal.querySelector('[data-cloud-modal-body]');
    }

    function modalFooter(modal) {
      return modal.querySelector('[data-cloud-modal-footer]');
    }

    // ネイティブの window.confirm / prompt / alert に代わる、アプリ内デザインで
    // 統一した確認・入力モーダル。×ボタン・背景クリック・Escでの閉じる操作は
    // すべて「キャンセル（confirm=false / prompt=null）」として解決する。
    function cloudConfirm(options) {
      const opts = options || {};
      return new Promise((resolve) => {
        const modal = openCloudModal('cloud-confirm-modal', opts.title || '確認');
        const body = modalBody(modal);
        const footer = modalFooter(modal);
        const messageHtml = escapeHtml(String(opts.message || '')).replace(/\n/g, '<br>');
        body.innerHTML = `<p class="cloud-modal-message">${messageHtml}</p>`;
        footer.innerHTML = `
          <button type="button" class="cloud-btn ghost" data-cloud-confirm-cancel>${escapeHtml(opts.cancelLabel || 'キャンセル')}</button>
          <button type="button" class="cloud-btn ${opts.danger ? 'danger' : 'primary'}" data-cloud-confirm-ok>${escapeHtml(opts.confirmLabel || 'OK')}</button>
        `;
        let settled = false;
        const observer = new MutationObserver(() => {
          if (modal.classList.contains('cloud-hidden')) finish(false);
        });
        function finish(value) {
          if (settled) return;
          settled = true;
          observer.disconnect();
          closeCloudModal('cloud-confirm-modal');
          resolve(value);
        }
        footer.querySelector('[data-cloud-confirm-cancel]').addEventListener('click', () => finish(false));
        const okBtn = footer.querySelector('[data-cloud-confirm-ok]');
        okBtn.addEventListener('click', () => finish(true));
        observer.observe(modal, { attributes: true, attributeFilter: ['class'] });
        try { okBtn.focus(); } catch (_) { /* noop */ }
      });
    }

    function cloudAlert(options) {
      const opts = options || {};
      return cloudConfirm({
        title: opts.title || 'お知らせ',
        message: opts.message || '',
        confirmLabel: opts.confirmLabel || 'OK',
        cancelLabel: opts.confirmLabel || 'OK',
        danger: !!opts.danger
      }).then(() => undefined);
    }

    // 入力モーダル。OKで入力値（trim 後）、キャンセル/閉じるで null を返す。
    // required=true のとき空入力では確定できない。type で input の種類を指定可。
    function cloudPrompt(options) {
      const opts = options || {};
      return new Promise((resolve) => {
        const modal = openCloudModal('cloud-prompt-modal', opts.title || '入力');
        const body = modalBody(modal);
        const footer = modalFooter(modal);
        const inputType = opts.type || 'text';
        const labelHtml = opts.label ? `<span class="cloud-field-label-text">${escapeHtml(opts.label)}</span>` : '';
        const messageHtml = opts.message ? `<p class="cloud-modal-message">${escapeHtml(String(opts.message)).replace(/\n/g, '<br>')}</p>` : '';
        body.innerHTML = `
          ${messageHtml}
          <label class="cloud-field">
            ${labelHtml}
            <input id="cloud-prompt-input" class="cloud-input" type="${escapeHtml(inputType)}"
              value="${escapeHtml(opts.defaultValue || '')}"
              placeholder="${escapeHtml(opts.placeholder || '')}"
              ${opts.min ? `min="${escapeHtml(String(opts.min))}"` : ''}
              ${opts.max ? `max="${escapeHtml(String(opts.max))}"` : ''}>
            <span id="cloud-prompt-error" class="cloud-field-note cloud-prompt-error cloud-hidden"></span>
          </label>
        `;
        footer.innerHTML = `
          <button type="button" class="cloud-btn ghost" data-cloud-prompt-cancel>${escapeHtml(opts.cancelLabel || 'キャンセル')}</button>
          <button type="button" class="cloud-btn primary" data-cloud-prompt-ok>${escapeHtml(opts.confirmLabel || '決定')}</button>
        `;
        const input = body.querySelector('#cloud-prompt-input');
        const errorNode = body.querySelector('#cloud-prompt-error');
        let settled = false;
        const observer = new MutationObserver(() => {
          if (modal.classList.contains('cloud-hidden')) finish(null);
        });
        function finish(value) {
          if (settled) return;
          settled = true;
          observer.disconnect();
          closeCloudModal('cloud-prompt-modal');
          resolve(value);
        }
        function submit() {
          const value = String(input.value || '').trim();
          if (opts.required && !value) {
            errorNode.textContent = opts.requiredMessage || '入力してください';
            errorNode.classList.remove('cloud-hidden');
            input.setAttribute('aria-invalid', 'true');
            try { input.focus(); } catch (_) { /* noop */ }
            return;
          }
          finish(value);
        }
        footer.querySelector('[data-cloud-prompt-cancel]').addEventListener('click', () => finish(null));
        footer.querySelector('[data-cloud-prompt-ok]').addEventListener('click', submit);
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') { event.preventDefault(); submit(); }
        });
        observer.observe(modal, { attributes: true, attributeFilter: ['class'] });
        try { input.focus(); input.select(); } catch (_) { /* noop */ }
      });
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function modeLabel(mode) {
      if (mode === 'scene') return '現場';
      if (mode === 'master') return 'マスター';
      if (mode === 'substitute') return '要代務';
      if (mode === 'large') return '大規模';
      return '個人';
    }

    function modeLongLabel(mode) {
      if (mode === 'scene') return '現場シフト';
      if (mode === 'master') return 'マスターシフト';
      if (mode === 'substitute') return '要代務シフト';
      if (mode === 'large') return '大規模シフト';
      return '個人シフト';
    }

    function projectAccessRole(project) {
      if (project && project.access_role === 'viewer') return 'viewer';
      if (project && project.access_role === 'editor') return 'editor';
      return 'owner';
    }

    function canEditCurrentProject() {
      if (PAGE.type === 'engine_preview') return true;
      return PAGE.type === 'owner' && projectAccessRole(currentProject()) !== 'viewer';
    }

    function shareBadgeText(project) {
      if (!project || !project.share) return '';
      if (project.share.role === 'viewer') return '共有されたシフト';
      if (project.share.role === 'editor') return '営業所共有・編集可';
      return project.share.enabled ? '共有中' : '';
    }

    function unviewedLeaveChangeRequestCount(project) {
      const shiftBook = project && project.shift_book ? project.shift_book : {};
      return Number(shiftBook.unviewed_leave_change_request_count || 0);
    }

    function setNotificationBadge(button, count) {
      if (!button) return;
      button.classList.add('cloud-notify-host');
      let badge = button.querySelector('.cloud-notify-badge');
      if (!count || count <= 0) {
        if (badge) badge.remove();
        return;
      }
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'cloud-notify-badge';
        button.appendChild(badge);
      }
      badge.textContent = '!';
      badge.setAttribute('aria-label', `${count}件の未表示申請`);
    }

    function isLikelyMobileDevice() {
      const ua = navigator.userAgent || '';
      const touchDevice = navigator.maxTouchPoints > 1;
      const narrowViewport = window.matchMedia('(max-width: 820px)').matches;
      return narrowViewport || /iPhone|iPad|iPod|Android|Mobile/i.test(ua) || touchDevice;
    }

    function applyPublicDeviceMode() {
      if (PAGE.type !== 'public' && PAGE.type !== 'engine_preview') return;
      const mobile = isLikelyMobileDevice();
      document.body.classList.toggle('cloud-device-mobile', mobile);
      document.body.classList.toggle('cloud-device-desktop', !mobile);
      document.body.setAttribute('data-cloud-device', mobile ? 'mobile' : 'desktop');
      const shell = document.querySelector('.cloud-public-shell');
      if (shell) {
        shell.setAttribute('data-cloud-device', mobile ? 'mobile' : 'desktop');
      }
    }

    function showFlash(message, type) {
      const node = $('cloud-flash');
      if (!node) return;
      node.className = `cloud-flash ${type || 'info'}`;
      node.textContent = message;
      node.style.display = 'block';
      clearTimeout(showFlash._timer);
      showFlash._timer = setTimeout(() => {
        node.style.display = 'none';
      }, 2600);
    }

    // 作成・紐づけ操作のエラー（重複など）は見落とさないよう、フラッシュに加えて
    // ダイアログでも明示する。
    function notifyActionError(error) {
      const message = (error && error.message) ? error.message : 'リクエストに失敗しました';
      showFlash(message, 'error');
      try {
        window.alert(message);
      } catch (_) {
        /* noop */
      }
    }

    // 新規作成・月追加の完了後、編集画面が画面内に確実に見えるようスクロールする。
    function scrollEditorIntoView() {
      const panel = document.getElementById('cloud-panel-editor');
      if (panel && typeof panel.scrollIntoView === 'function') {
        try {
          panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (_) {
          panel.scrollIntoView();
        }
      }
    }

    function closeLegacyDetailModals() {
      ['ss-day-detail-modal', 'ss-entry-modal'].forEach((modalId) => {
        const modal = document.getElementById(modalId);
        if (modal) {
          modal.classList.add('ss-hidden');
        }
      });
    }

    function closeAssistRelatedModals() {
      [
        'cloud-assist-modal',
        'cloud-assist-day-modal',
        'cloud-assist-record-edit-modal',
        'cloud-assist-site-edit-modal',
        'cloud-assist-rule-edit-modal',
        'cloud-assist-profile-edit-modal'
      ].forEach((modalId) => closeCloudModal(modalId));
      closeLegacyDetailModals();
    }

    function notifyAssistAction(message) {
      closeAssistRelatedModals();
      showFlash(message, 'info');
    }

    async function requestJson(url, options) {
      const opts = Object.assign({ headers: {} }, options || {});
      if (opts.body && !(opts.body instanceof FormData) && !opts.headers['Content-Type']) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      const response = await fetch(url, opts);
      const isJson = (response.headers.get('content-type') || '').includes('application/json');
      const payload = isJson ? await response.json() : null;
      if (!response.ok) {
        throw new Error((payload && payload.error) || 'リクエストに失敗しました');
      }
      return payload;
    }

    async function withDsttLoading(options, task) {
      if (window.DSTTLoading && typeof window.DSTTLoading.during === 'function') {
        return window.DSTTLoading.during(options, task);
      }
      return task();
    }

    // ローディングのメッセージ・説明文を更新する小ヘルパー。
    function setLoadingDetail(message, detail) {
      if (window.DSTTLoading && typeof window.DSTTLoading.setText === 'function') {
        window.DSTTLoading.setText(message, detail);
      }
    }

    // 新規作成・CSV取込の共通処理。
    // - ローディング中はサーバーが今おこなっている処理を説明文として順次表示する。
    // - 編集タブへ遷移するまでに 10 秒以上かかる場合は異常とみなし、進行中のリクエストを
    //   中断してローディングを閉じ、エラーを通知する（遷移後の付随読み込みは対象外）。
    async function runCloudCreateFlow({ buildFormData, successMessage, phases }) {
      const TRANSITION_TIMEOUT_MS = 10000;
      const message = 'シフト帳を作成中...';
      const serverPhases = (phases && phases.length) ? phases : [
        'シフト帳を保存しています...',
        '既存の現場・個人シフトを照合して取り込んでいます...',
        '共有用URLと編集データを準備しています...'
      ];
      const controller = new AbortController();
      let timedOut = false;
      let transitioned = false;
      let phaseTimer = null;
      const timeoutTimer = setTimeout(() => {
        if (transitioned) return;
        timedOut = true;
        try { controller.abort(); } catch (_) { /* noop */ }
      }, TRANSITION_TIMEOUT_MS);
      let projectId = null;
      try {
        await withDsttLoading({ message, detail: serverPhases[0] }, async () => {
          // 実際のサーバー進捗は取得できないため、想定フェーズを一定間隔で送りながら説明する。
          let phaseIndex = 0;
          phaseTimer = setInterval(() => {
            phaseIndex = Math.min(phaseIndex + 1, serverPhases.length - 1);
            setLoadingDetail(message, serverPhases[phaseIndex]);
          }, 2500);

          const formData = buildFormData();
          const data = await requestJson('/tools/shiftersync/cloudshift/api/create', {
            method: 'POST',
            body: formData,
            signal: controller.signal
          });

          if (phaseTimer) { clearInterval(phaseTimer); phaseTimer = null; }
          setLoadingDetail(message, '編集画面を準備しています...');

          state.projectPayload = unwrapProjectPayload(data);
          state.baseMonth = state.projectPayload.month ? deepClone(state.projectPayload.month) : null;
          projectId = state.projectPayload.project ? state.projectPayload.project.id : null;
          // まず編集画面の描画と遷移を確定させる。付随的な再読み込みはローディングを
          // 閉じたあとに行い、失敗しても遷移を妨げない。
          await renderWorkspaceWithSiteBranches(true);
          updateCurrentProjectLabel();
          switchTab('editor');
          scrollEditorIntoView();
          transitioned = true;
          clearTimeout(timeoutTimer);
          showFlash(successMessage, 'success');
        });
      } catch (error) {
        if (timedOut) {
          notifyActionError(new Error('編集画面への遷移に10秒以上かかったため処理を中断しました。通信状況をご確認のうえ、シフト帳一覧を更新して作成済みかご確認ください。'));
        } else {
          notifyActionError(error);
        }
        return;
      } finally {
        clearTimeout(timeoutTimer);
        if (phaseTimer) { clearInterval(phaseTimer); phaseTimer = null; }
      }
      // 遷移は完了済み。一覧・休暇連携・履歴の再読み込みはローディングを閉じてから実施する。
      if (projectId) {
        await loadProjectSidecars(projectId);
      }
    }

    function unwrapProjectPayload(payload) {
      return payload && payload.project && payload.project.project ? payload.project : payload;
    }

    function currentProject() {
      return state.projectPayload ? state.projectPayload.project : null;
    }

    function currentMonth() {
      return state.projectPayload ? state.projectPayload.month : null;
    }

    function currentMonthKey() {
      return state.projectPayload ? state.projectPayload.active_month_key : null;
    }

    function emptyEntriesForMonth(month) {
      const days = monthDays(month);
      return Array.from({ length: days }, (_, index) => String(index + 1)).reduce((acc, day) => {
        acc[day] = [];
        return acc;
      }, {});
    }

    function draftEntriesForMonth(month) {
      return month && month.draft_entries_per_day ? month.draft_entries_per_day : (month && month.entries_per_day ? month.entries_per_day : emptyEntriesForMonth(month));
    }

    function draftEntryCount(month) {
      return Object.values((month && month.draft_entries_per_day) || {}).reduce(
        (total, entries) => total + (Array.isArray(entries) ? entries.length : 0),
        0
      );
    }

    function entriesFingerprint(entries) {
      return JSON.stringify(entries || {});
    }

    function editingEntriesFingerprint(entries) {
      const normalized = {};
      Object.keys(entries || {}).forEach((dayKey) => {
        normalized[dayKey] = (Array.isArray(entries[dayKey]) ? entries[dayKey] : []).map((entry) => {
          const clone = Object.assign({}, entry || {});
          delete clone.cloud_draft_added;
          delete clone.cloudDraftAdded;
          return clone;
        });
      });
      return entriesFingerprint(normalized);
    }

    function draftHasChanges(month) {
      if (!month) return false;
      return entriesFingerprint(draftEntriesForMonth(month)) !== entriesFingerprint(month.entries_per_day || {});
    }

    function currentEditingEntries() {
      if (currentProject() && currentProject().mode === 'large' && window.CloudShiftLarge) {
        return window.CloudShiftLarge.getEntries();
      }
      try {
        return ShifterSync.getEntriesPerDay ? ShifterSync.getEntriesPerDay() : {};
      } catch (_) {
        return {};
      }
    }

    function currentEditingMeta() {
      if (currentProject() && currentProject().mode === 'large' && window.CloudShiftLarge) {
        return window.CloudShiftLarge.getMeta();
      }
      return (currentMonth() && currentMonth().meta_data) || {};
    }

    function currentRequiredCapacityValue() {
      return parseInt(($('cloud-required-capacity') && $('cloud-required-capacity').value) || '0', 10) || 0;
    }

    function monthKeyForValue(month) {
      return month ? `${month.year}-${String(month.month).padStart(2, '0')}` : '';
    }

    function samePendingSubstituteRequest(left, right) {
      return String(left && left.project_id || '') === String(right && right.project_id || '')
        && String(left && left.month_key || '') === String(right && right.month_key || '')
        && String(left && left.day || '') === String(right && right.day || '')
        && String(left && left.entry_id || '') === String(right && right.entry_id || '');
    }

    function currentPendingSubstituteRequests() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return [];
      const projectId = String(project.id || '');
      const monthKey = currentMonthKey() || monthKeyForValue(month);
      return state.pendingSubstituteRequests.filter((item) => (
        String(item.project_id || '') === projectId
        && String(item.month_key || '') === String(monthKey || '')
      ));
    }

    function pendingSubstituteRequestsFingerprint() {
      return JSON.stringify(currentPendingSubstituteRequests().map((item) => ({
        project_id: String(item.project_id || ''),
        month_key: String(item.month_key || ''),
        day: String(item.day || ''),
        entry_id: String(item.entry_id || ''),
        option_key: String(item.option_key || ''),
        comment: String(item.comment || '')
      })));
    }

    function normalizePendingSubstituteRequest(context) {
      const project = currentProject();
      const month = currentMonth();
      const day = String(context && context.day ? context.day : '').trim();
      if (!project || !month || !day) return null;
      return {
        project_id: String(project.id || ''),
        month_key: currentMonthKey() || monthKeyForValue(month),
        year: month.year,
        month: month.month,
        day,
        entry_id: String(context.entryId || ''),
        option_key: String(context.optionKey || ''),
        comment: String(context.comment || ''),
        source_entry: context.entry ? deepClone(context.entry) : null
      };
    }

    function queuePendingSubstituteRequest(context) {
      const item = normalizePendingSubstituteRequest(context);
      if (!item) return 0;
      const index = state.pendingSubstituteRequests.findIndex((candidate) => samePendingSubstituteRequest(candidate, item));
      if (index >= 0) {
        state.pendingSubstituteRequests.splice(index, 1, item);
      } else {
        state.pendingSubstituteRequests.push(item);
      }
      return currentPendingSubstituteRequests().length;
    }

    function clearPendingSubstituteRequests() {
      state.pendingSubstituteRequests = [];
    }

    async function submitPendingSubstituteRequestsForCurrentMonth() {
      const project = currentProject();
      if (!project) return 0;
      const pending = currentPendingSubstituteRequests();
      let submitted = 0;
      for (const item of pending) {
        await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/substitute-request`, {
          method: 'POST',
          body: {
            year: item.year,
            month: item.month,
            day: item.day,
            entry_id: item.entry_id || '',
            option_key: item.option_key || '',
            comment: item.comment || ''
          }
        });
        submitted += 1;
        state.pendingSubstituteRequests = state.pendingSubstituteRequests.filter((candidate) => !samePendingSubstituteRequest(candidate, item));
      }
      return submitted;
    }

    async function reloadCurrentProjectPayload(monthKey) {
      const project = currentProject();
      if (!project || PAGE.type !== 'owner') return;
      const query = monthKey ? `?month_key=${encodeURIComponent(monthKey)}` : '';
      const payload = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}${query}`);
      state.projectPayload = unwrapProjectPayload(payload);
      state.baseMonth = state.projectPayload.month ? deepClone(state.projectPayload.month) : null;
    }

    function resetUnsavedBaseline() {
      state.unsavedBaseline = currentMonth()
        ? {
            entries: editingEntriesFingerprint(currentEditingEntries()),
            meta: JSON.stringify(currentEditingMeta() || {}),
            requiredCapacity: currentRequiredCapacityValue(),
            editorMode: state.editorMode,
            substituteRequests: pendingSubstituteRequestsFingerprint()
          }
        : null;
    }

    function hasUnsavedMonthChanges() {
      if (!currentMonth() || !state.unsavedBaseline) return false;
      if (state.editorMode !== state.unsavedBaseline.editorMode) return false;
      if (editingEntriesFingerprint(currentEditingEntries()) !== state.unsavedBaseline.entries) {
        return true;
      }
      if (currentProject() && currentProject().mode === 'large' && JSON.stringify(currentEditingMeta() || {}) !== state.unsavedBaseline.meta) {
        return true;
      }
      if (currentRequiredCapacityValue() !== state.unsavedBaseline.requiredCapacity) {
        return true;
      }
      return pendingSubstituteRequestsFingerprint() !== state.unsavedBaseline.substituteRequests;
    }

    function updateUnsavedIndicator() {
      const node = $('cloud-unsaved-indicator');
      if (!node) return;
      node.classList.toggle('cloud-hidden', !hasUnsavedMonthChanges());
    }

    function confirmDiscardUnsavedChanges(message) {
      if (!hasUnsavedMonthChanges()) return true;
      return window.confirm(message || '未保存の変更があります。保存せずに移動すると、このセッションでの編集内容は失われます。続行しますか？');
    }

    function isSubstituteRequestDisplayEntry(entry) {
      return String(entry && entry.sync_source_type ? entry.sync_source_type : '').trim() === 'substitute_request';
    }

    function entriesWithoutSubstituteRequestDisplays(entriesPerDay) {
      const cleaned = {};
      Object.keys(entriesPerDay || {}).forEach((dayKey) => {
        const entries = Array.isArray(entriesPerDay[dayKey]) ? entriesPerDay[dayKey] : [];
        cleaned[dayKey] = entries.filter((entry) => !isSubstituteRequestDisplayEntry(entry));
      });
      return cleaned;
    }

    function substituteRequestDisplayId(item) {
      return [
        'substitute-request-display',
        item && item.project_id ? item.project_id : '',
        item && item.month_key ? item.month_key : '',
        item && item.day ? item.day : '',
        item && item.entry_id ? item.entry_id : 'day'
      ].join('-');
    }

    function sourceEntryForPendingSubstituteRequest(item, entriesPerDay) {
      const dayKey = String(item && item.day ? item.day : '');
      const entryId = String(item && item.entry_id ? item.entry_id : '');
      if (!dayKey || !entryId) return item && item.source_entry ? item.source_entry : null;
      const entries = Array.isArray(entriesPerDay && entriesPerDay[dayKey]) ? entriesPerDay[dayKey] : [];
      return entries.find((entry) => String(entry && entry.id ? entry.id : '') === entryId)
        || (item && item.source_entry ? item.source_entry : null);
    }

    function buildPendingSubstituteDisplayEntry(item, sourceEntry) {
      const project = currentProject() || {};
      const mode = String(project.mode || '').trim();
      const projectSite = project.site || {};
      const optionKey = String(item && item.option_key ? item.option_key : '').trim();
      const fallbackName = mode === 'scene'
        ? String(projectSite.site_name || project.site_name || project.title || '').trim()
        : String(project.title || '').trim();
      const value = sourceEntry && sourceEntry.value
        ? String(sourceEntry.value || '').trim()
        : formatEntryValue(optionKey || null, fallbackName);
      const displayEntry = Object.assign({}, sourceEntry || {}, {
        id: substituteRequestDisplayId(item),
        value,
        comment: String(item && item.comment ? item.comment : (sourceEntry && sourceEntry.comment) || '').trim(),
        sync_source_type: 'substitute_request',
        sync_source_project_id: '',
        sync_source_project_title: '要代務シフト帳',
        sync_source_month_key: String(item && item.month_key ? item.month_key : ''),
        sync_source_day: String(item && item.day ? item.day : ''),
        sync_source_entry_id: String(item && item.entry_id ? item.entry_id : 'day'),
        substitute_request_type: mode === 'person' ? 'person' : 'scene',
        substitute_resolved: false,
        substitute_source_project_id: String(project.id || ''),
        substitute_source_project_title: String(project.title || ''),
        substitute_source_project_mode: mode,
        substitute_source_month_key: String(item && item.month_key ? item.month_key : ''),
        substitute_source_day: String(item && item.day ? item.day : ''),
        substitute_source_entry_id: String(item && item.entry_id ? item.entry_id : 'day')
      });
      if (mode === 'scene') {
        displayEntry.site_row_id = String(projectSite.site_row_id || project.site_row_id || '');
        displayEntry.site_id = String(projectSite.site_id || project.site_id || '');
        displayEntry.site_name = String(projectSite.site_name || project.site_name || project.title || '');
      } else if (mode === 'person') {
        displayEntry.employee_name = String(project.title || '');
        displayEntry.employee_number = String(project.employee_number || '');
      }
      return displayEntry;
    }

    function mergeSubstituteRequestDisplays(entriesPerDay, month) {
      const merged = entriesWithoutSubstituteRequestDisplays(deepClone(entriesPerDay || {}));
      const addDisplayEntry = (dayKey, entry) => {
        if (!dayKey || !entry || !entry.value) return;
        if (!Array.isArray(merged[dayKey])) merged[dayKey] = [];
        const id = String(entry.id || '');
        if (id && merged[dayKey].some((candidate) => String(candidate && candidate.id ? candidate.id : '') === id)) return;
        merged[dayKey].push(entry);
      };

      Object.entries((month && month.pending_substitute_entries_per_day) || {}).forEach(([dayKey, entries]) => {
        (Array.isArray(entries) ? entries : []).forEach((entry) => addDisplayEntry(String(dayKey), entry));
      });

      currentPendingSubstituteRequests().forEach((item) => {
        const dayKey = String(item.day || '');
        addDisplayEntry(dayKey, buildPendingSubstituteDisplayEntry(item, sourceEntryForPendingSubstituteRequest(item, entriesPerDay)));
      });

      return merged;
    }

    function targetLosesCurrentEdits(projectId, monthKey) {
      const project = currentProject();
      if (!project || !currentMonth()) return false;
      if (String(projectId || '') !== String(project.id || '')) return true;
      if (!monthKey) return true;
      return !!monthKey && String(monthKey) !== String(currentMonthKey() || '');
    }

    function displayedEntriesForMonth(month) {
      if (!month) return {};
      if (state.editorMode !== 'draft') {
        return mergeSubstituteRequestDisplays(month.entries_per_day || {}, month);
      }
      const officialEntries = month.entries_per_day || {};
      const draftEntries = draftEntriesForMonth(month);
      const officialDayById = new Map();
      Object.keys(officialEntries).forEach((officialDayKey) => {
        const entries = officialEntries[officialDayKey];
        if (!Array.isArray(entries)) return;
        entries.forEach((entry) => {
          const id = String(entry && entry.id ? entry.id : '').trim();
          if (id) officialDayById.set(id, String(officialDayKey));
        });
      });
      const displayedDraft = Object.keys(draftEntries || {}).reduce((acc, dayKey) => {
        const entries = Array.isArray(draftEntries[dayKey]) ? draftEntries[dayKey] : [];
        acc[dayKey] = entries.map((entry) => {
          const clone = Object.assign({}, entry);
          const id = String(clone && clone.id ? clone.id : '').trim();
          clone.cloud_draft_added = !!id && officialDayById.get(id) !== String(dayKey);
          return clone;
        });
        return acc;
      }, {});
      return mergeSubstituteRequestDisplays(displayedDraft, month);
    }

    function applyDraftVisualState(month, draftOverride) {
      document.querySelectorAll('.day-box.has-draft-deletion').forEach((node) => {
        node.classList.remove('has-draft-deletion');
      });
      document.querySelectorAll('.entry-item.is-cloud-draft-added').forEach((node) => {
        node.classList.remove('is-cloud-draft-added');
      });
      if (!month || state.editorMode !== 'draft') return;
      const draftEntries = draftOverride || draftEntriesForMonth(month);
      const officialEntries = month.entries_per_day || {};
      const officialDayById = new Map();
      Object.keys(officialEntries).forEach((officialDayKey) => {
        const entries = officialEntries[officialDayKey];
        if (!Array.isArray(entries)) return;
        entries.forEach((entry) => {
          const id = String(entry && entry.id ? entry.id : '').trim();
          if (id) officialDayById.set(id, String(officialDayKey));
        });
      });
      Object.keys(draftEntries).forEach((dayKey) => {
        const entries = draftEntries[dayKey];
        if (!Array.isArray(entries)) return;
        entries.forEach((entry) => {
          const id = String(entry && entry.id ? entry.id : '').trim();
          if (!id || officialDayById.get(id) === String(dayKey)) return;
          const node = document.querySelector(`.entry-item[data-entry-id="${id}"]`);
          if (node) node.classList.add('is-cloud-draft-added');
        });
      });
      Object.keys(officialEntries).forEach((dayKey) => {
        const officialIds = new Set((Array.isArray(officialEntries[dayKey]) ? officialEntries[dayKey] : [])
          .map((entry) => String(entry && entry.id ? entry.id : '').trim())
          .filter(Boolean));
        if (!officialIds.size) return;
        const draftIds = new Set((Array.isArray(draftEntries[dayKey]) ? draftEntries[dayKey] : [])
          .map((entry) => String(entry && entry.id ? entry.id : '').trim())
          .filter(Boolean));
        const hasDeletedOfficial = Array.from(officialIds).some((id) => !draftIds.has(id));
        if (!hasDeletedOfficial) return;
        const box = document.querySelector(`.day-box[data-day="${String(dayKey)}"]`);
        if (box) box.classList.add('has-draft-deletion');
      });
    }

    function watchDraftVisualState(month) {
      if (state.draftVisualObserver && typeof state.draftVisualObserver.disconnect === 'function') {
        state.draftVisualObserver.disconnect();
        state.draftVisualObserver = null;
      }
      const panel = $('cloud-editor-panel');
      if (!panel || !month || state.editorMode !== 'draft') return;
      let scheduled = false;
      state.draftVisualObserver = new MutationObserver(() => {
        if (scheduled) return;
        scheduled = true;
        window.setTimeout(() => {
          scheduled = false;
          const currentEntries = currentEditingEntries();
          applyDraftVisualState(month, currentEntries);
        }, 0);
      });
      state.draftVisualObserver.observe(panel, { childList: true, subtree: true });
    }

    function watchUnsavedState() {
      if (state.unsavedObserver && typeof state.unsavedObserver.disconnect === 'function') {
        state.unsavedObserver.disconnect();
        state.unsavedObserver = null;
      }
      const panel = $('cloud-editor-panel');
      if (!panel || !currentMonth()) {
        updateUnsavedIndicator();
        return;
      }
      let scheduled = false;
      state.unsavedObserver = new MutationObserver(() => {
        if (scheduled) return;
        scheduled = true;
        window.requestAnimationFrame(() => {
          scheduled = false;
          updateUnsavedIndicator();
        });
      });
      state.unsavedObserver.observe(panel, { childList: true, subtree: true, characterData: true });
      resetUnsavedBaseline();
      updateUnsavedIndicator();
    }

    function isPersonProject() {
      const project = currentProject();
      return !!project && project.mode === 'person';
    }

    function parseMonthKey(monthKey) {
      const match = String(monthKey || '').match(/^(\d{4})-(\d{2})$/);
      if (!match) return null;
      return { year: parseInt(match[1], 10), month: parseInt(match[2], 10) };
    }

    function formatMonthKey(monthKey) {
      const parsed = parseMonthKey(monthKey);
      return parsed ? `${parsed.year}年${parsed.month}月` : '未選択';
    }

    function currentJstParts() {
      const date = new Date();
      return new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: 'numeric',
        day: 'numeric'
      }).formatToParts(date).reduce((acc, part) => {
        acc[part.type] = parseInt(part.value, 10);
        return acc;
      }, {});
    }

    function currentJstMonthKey() {
      const parts = currentJstParts();
      return `${parts.year}-${String(parts.month).padStart(2, '0')}`;
    }

    function currentJstDateText() {
      const parts = currentJstParts();
      return `${parts.year}-${String(parts.month).padStart(2, '0')}-${String(parts.day).padStart(2, '0')}`;
    }

    function formatTimestamp(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      const normalized = text.includes('T') ? text : text.replace(' ', 'T');
      const date = new Date(normalized);
      if (Number.isNaN(date.getTime())) return text;
      const parts = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).formatToParts(date).reduce((acc, part) => {
        acc[part.type] = part.value;
        return acc;
      }, {});
      return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
    }

    window.CLOUDSHIFT_FORMAT_TIMESTAMP = formatTimestamp;

    function nextMonthKey(monthKey, delta) {
      const parsed = parseMonthKey(monthKey);
      if (!parsed) return null;
      const date = new Date(parsed.year, parsed.month - 1 + delta, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    function promptMonthKey(defaultValue) {
      // 月ピッカー（type="month"）で YYYY-MM を直接選ばせる。書式の手入力ミスが起きない。
      return cloudPrompt({
        title: '月を作成',
        label: '作成する年月',
        type: 'month',
        defaultValue: defaultValue || currentJstMonthKey(),
        confirmLabel: '作成',
        required: true,
        requiredMessage: '年月を選択してください'
      });
    }

    function titleFieldRefs(kind) {
      const inputId = kind === 'create' ? 'cloud-create-title' : 'cloud-project-title';
      const inputEl = $(inputId);
      const labelEl = inputEl && inputEl.closest('label') ? inputEl.closest('label').querySelector(':scope > span') : null;
      if (kind === 'create') {
        return {
          input: inputEl,
          hidden: $('cloud-create-employee-number'),
          panel: $('cloud-create-candidate-panel'),
          note: $('cloud-create-selected-note'),
          label: labelEl,
          pickButton: $('cloud-create-pick-employee'),
          clearButton: $('cloud-create-clear-employee')
        };
      }
      return {
        input: inputEl,
        hidden: $('cloud-project-employee-number'),
        panel: $('cloud-project-candidate-panel'),
        note: $('cloud-project-selected-note'),
        label: labelEl,
        pickButton: $('cloud-project-pick-employee'),
        clearButton: $('cloud-project-clear-employee')
      };
    }

    function siteFieldRefs(kind) {
      if (kind === 'create') {
        return {
          field: $('cloud-create-site-field'),
          display: $('cloud-create-site-display'),
          hidden: $('cloud-create-site-row-id'),
          note: $('cloud-create-site-note')
        };
      }
      return {
        field: $('cloud-project-site-field'),
        display: $('cloud-project-site-display'),
        hidden: $('cloud-project-site-row-id'),
        note: $('cloud-project-site-note')
      };
    }

    function masterFieldRefs(kind) {
      if (kind === 'create') {
        return {
          field: $('cloud-create-master-field'),
          targetType: $('cloud-create-master-target-type'),
          query: $('cloud-create-master-query'),
          candidates: $('cloud-create-master-candidates'),
          selected: $('cloud-create-master-selected'),
          people: $('cloud-create-master-people'),
          sites: $('cloud-create-master-sites')
        };
      }
      return {
        field: $('cloud-project-master-field'),
        targetType: $('cloud-project-master-target-type'),
        query: $('cloud-project-master-query'),
        candidates: $('cloud-project-master-candidates'),
        selected: $('cloud-project-master-selected'),
        people: $('cloud-project-master-people'),
        sites: $('cloud-project-master-sites')
      };
    }

    function normalizeMasterPerson(item) {
      if (!item || typeof item !== 'object') return null;
      const employeeNumber = String(item.employee_number || item.employeeNumber || '').trim();
      const name = String(item.name || item.employee_name || item.employeeName || '').trim();
      if (!employeeNumber) return null;
      return { employee_number: employeeNumber, name: name || employeeNumber };
    }

    function normalizeMasterSite(item) {
      if (!item || typeof item !== 'object') return null;
      const siteRowId = String(item.site_row_id || item.id || item.siteRowId || '').trim();
      const siteId = String(item.site_id || item.siteId || '').trim();
      const siteName = String(item.site_name || item.siteName || '').trim();
      if (!siteRowId && !siteId) return null;
      return {
        site_row_id: siteRowId,
        site_id: siteId,
        site_name: siteName,
        active_branch_count: parseInt(item.active_branch_count || item.activeBranchCount || '0', 10) || 0
      };
    }

    function setMasterTargets(kind, targetType, people, sites) {
      const nextType = targetType === 'scene' ? 'scene' : 'person';
      state.masterTargets[kind] = {
        targetType: nextType,
        people: nextType === 'person' ? (Array.isArray(people) ? people.map(normalizeMasterPerson).filter(Boolean) : []) : [],
        sites: nextType === 'scene' ? (Array.isArray(sites) ? sites.map(normalizeMasterSite).filter(Boolean) : []) : []
      };
      const refs = masterFieldRefs(kind);
      if (refs.query) refs.query.value = '';
      renderMasterTargets(kind);
    }

    function syncMasterTargetHiddenInputs(kind) {
      const refs = masterFieldRefs(kind);
      const targets = state.masterTargets[kind] || { targetType: 'person', people: [], sites: [] };
      if (refs.targetType) refs.targetType.value = targets.targetType;
      if (kind === 'create') {
        const hiddenType = $('cloud-create-master-target-type-input');
        if (hiddenType) hiddenType.value = targets.targetType;
      }
      if (refs.people) refs.people.value = targets.targetType === 'person' ? JSON.stringify(targets.people) : '';
      if (refs.sites) refs.sites.value = targets.targetType === 'scene' ? JSON.stringify(targets.sites) : '';
    }

    function renderMasterTargets(kind) {
      const refs = masterFieldRefs(kind);
      const targets = state.masterTargets[kind] || { targetType: 'person', people: [], sites: [] };
      syncMasterTargetHiddenInputs(kind);
      if (refs.query) {
        refs.query.placeholder = targets.targetType === 'person' ? '社員名または社員番号で検索' : '契約番号または現場名で検索';
      }
      if (refs.selected) {
        const items = targets.targetType === 'person' ? targets.people : targets.sites;
        refs.selected.innerHTML = items.length ? items.map((item, index) => {
          const label = targets.targetType === 'person'
            ? `${item.name || item.employee_number} / ${item.employee_number}`
            : `${item.site_id || item.site_row_id} / ${item.site_name || ''}`;
          return `
            <span class="cloud-master-chip">
              ${escapeHtml(label)}
              <button type="button" data-master-remove="${index}" aria-label="削除">×</button>
            </span>
          `;
        }).join('') : '<span class="cloud-note-chip">まだ選択されていません</span>';
      }
      if (refs.candidates) {
        refs.candidates.innerHTML = '';
        refs.candidates.classList.add('cloud-hidden');
      }
    }

    function addMasterTarget(kind, item) {
      const targets = state.masterTargets[kind] || { targetType: 'person', people: [], sites: [] };
      if (targets.targetType === 'person') {
        const normalized = normalizeMasterPerson(item);
        if (!normalized) return;
        if (!targets.people.some((person) => person.employee_number === normalized.employee_number)) {
          targets.people.push(normalized);
        }
      } else {
        const normalized = normalizeMasterSite(item);
        if (!normalized) return;
        const key = normalized.site_row_id || normalized.site_id;
        if (!targets.sites.some((site) => (site.site_row_id || site.site_id) === key)) {
          targets.sites.push(normalized);
        }
      }
      state.masterTargets[kind] = targets;
      const refs = masterFieldRefs(kind);
      if (refs.query) refs.query.value = '';
      renderMasterTargets(kind);
      if (kind === 'create') refreshCreateMasterTypeLock();
    }

    function removeMasterTarget(kind, index) {
      const targets = state.masterTargets[kind] || { targetType: 'person', people: [], sites: [] };
      const list = targets.targetType === 'person' ? targets.people : targets.sites;
      if (index < 0 || index >= list.length) return;
      list.splice(index, 1);
      renderMasterTargets(kind);
      if (kind === 'create') refreshCreateMasterTypeLock();
    }

    async function searchMasterTargets(kind) {
      const refs = masterFieldRefs(kind);
      const targets = state.masterTargets[kind] || { targetType: 'person', people: [], sites: [] };
      const query = refs.query ? refs.query.value.trim() : '';
      if (!refs.candidates || !query) {
        if (refs.candidates) refs.candidates.classList.add('cloud-hidden');
        return;
      }
      const items = targets.targetType === 'person'
        ? (await fetchEmployeeCandidates(query)).map(normalizeMasterPerson).filter(Boolean)
        : (await fetchSiteCandidates(query)).map(normalizeMasterSite).filter(Boolean);
      if (!items.length) {
        refs.candidates.innerHTML = '<div class="cloud-empty-state compact"><p>候補が見つかりません。</p></div>';
      } else {
        refs.candidates.innerHTML = items.slice(0, 10).map((item, index) => {
          const label = targets.targetType === 'person'
            ? `${item.name || item.employee_number} / ${item.employee_number}`
            : `${item.site_id || item.site_row_id} / ${item.site_name || ''}`;
          return `<button type="button" class="cloud-master-candidate" data-master-candidate="${index}">${escapeHtml(label)}</button>`;
        }).join('');
        refs.candidates.querySelectorAll('[data-master-candidate]').forEach((button) => {
          button.addEventListener('click', () => {
            const selected = items[parseInt(button.getAttribute('data-master-candidate') || '-1', 10)];
            addMasterTarget(kind, selected);
          });
        });
      }
      refs.candidates.classList.remove('cloud-hidden');
    }

    function applyMasterTypeLock(kind, lockedType) {
      const refs = masterFieldRefs(kind);
      if (!refs.targetType) return;
      const selectEl = refs.targetType;
      const parent = selectEl.closest('label') || selectEl.parentElement;
      if (!parent) return;
      let display = parent.querySelector('.cloud-master-type-display');
      if (lockedType) {
        selectEl.style.display = 'none';
        selectEl.disabled = true;
        if (!display) {
          display = document.createElement('span');
          display.className = 'cloud-master-type-display cloud-input';
          parent.appendChild(display);
        }
        display.textContent = lockedType === 'scene' ? '現場マスター（変更不可）' : '個人マスター（変更不可）';
        display.style.display = '';
      } else {
        selectEl.style.display = '';
        selectEl.disabled = false;
        if (display) display.style.display = 'none';
      }
    }

    function refreshCreateMasterTypeLock() {
      const targets = state.masterTargets.create || { targetType: 'person', people: [], sites: [] };
      const hasItems = (targets.people && targets.people.length > 0) || (targets.sites && targets.sites.length > 0);
      const refs = masterFieldRefs('create');
      if (!refs.targetType) return;
      refs.targetType.disabled = hasItems;
      refs.targetType.title = hasItems ? '登録済みの対象を全て削除すると再選択できます' : '';
    }

    function bindMasterTargetControls(kind) {
      const refs = masterFieldRefs(kind);
      if (!refs.field) return;
      if (refs.targetType) {
        refs.targetType.addEventListener('change', () => {
          setMasterTargets(kind, refs.targetType.value === 'scene' ? 'scene' : 'person', [], []);
        });
      }
      if (refs.query) {
        refs.query.addEventListener('input', () => {
          window.clearTimeout(refs.query._masterTimer);
          refs.query._masterTimer = window.setTimeout(() => searchMasterTargets(kind).catch((error) => showFlash(error.message, 'error')), 220);
        });
      }
      if (refs.selected) {
        refs.selected.addEventListener('click', (event) => {
          const button = event.target.closest('[data-master-remove]');
          if (!button) return;
          removeMasterTarget(kind, parseInt(button.getAttribute('data-master-remove') || '-1', 10));
        });
      }
      renderMasterTargets(kind);
    }

    function titleFieldMode(kind) {
      if (kind === 'create') {
        return $('cloud-create-mode') ? $('cloud-create-mode').value : 'scene';
      }
      return currentProject() ? currentProject().mode : 'scene';
    }

    function applySiteSelection(kind, site) {
      const refs = siteFieldRefs(kind);
      if (!refs.display || !refs.hidden) {
        return;
      }
      const siteId = String(site && site.site_id ? site.site_id : '').trim();
      const siteName = String(site && site.site_name ? site.site_name : '').trim();
      const siteRowId = site && site.id != null ? String(site.id) : String(site && site.site_row_id ? site.site_row_id : '').trim();
      refs.display.value = siteId && siteName ? `${siteId} / ${siteName}` : '';
      refs.hidden.value = siteRowId;
      if (refs.note) {
        const branchCount = site && site.active_branch_count != null ? ` / 有効枝番号 ${site.active_branch_count}件` : '';
        refs.note.textContent = refs.hidden.value ? `現場ID: ${siteId}${branchCount}` : '';
      }
    }

    function clearSiteSelection(kind) {
      const refs = siteFieldRefs(kind);
      if (refs.display) refs.display.value = '';
      if (refs.hidden) refs.hidden.value = '';
      if (refs.note) refs.note.textContent = '';
    }

    function setTitleFieldMode(kind) {
      const refs = titleFieldRefs(kind);
      const siteRefs = siteFieldRefs(kind);
      const masterRefs = masterFieldRefs(kind);
      const isPerson = titleFieldMode(kind) === 'person';
      const isMaster = titleFieldMode(kind) === 'master';
      const isSubstitute = titleFieldMode(kind) === 'substitute';
      const isLarge = titleFieldMode(kind) === 'large';
      if (refs.label) {
        refs.label.textContent = isPerson ? '社員' : 'タイトル';
      }
      if (refs.input) {
        refs.input.placeholder = isPerson ? '社員名（未指定なら「未割り当て」になります）' : 'タイトル';
        if (kind === 'create') {
          refs.input.required = !isPerson;
        }
      }
      if (refs.pickButton) refs.pickButton.classList.toggle('cloud-hidden', !isPerson);
      if (refs.clearButton) refs.clearButton.classList.toggle('cloud-hidden', !isPerson);
      if (!isPerson) {
        if (refs.hidden) refs.hidden.value = '';
        if (refs.note) refs.note.textContent = '';
        if (refs.panel) {
          refs.panel.innerHTML = '';
          refs.panel.classList.add('cloud-hidden');
        }
      }
      if (siteRefs.field) {
        siteRefs.field.classList.toggle('cloud-hidden', isPerson || isMaster || isSubstitute);
      }
      if (masterRefs.field) {
        masterRefs.field.classList.toggle('cloud-hidden', !isMaster);
        if (isMaster) renderMasterTargets(kind);
      }
      if (kind === 'create') {
        if ($('cloud-create-pick-site')) $('cloud-create-pick-site').classList.toggle('cloud-hidden', isPerson || isMaster || isSubstitute);
        if ($('cloud-create-clear-site')) $('cloud-create-clear-site').classList.toggle('cloud-hidden', isPerson || isMaster || isSubstitute);
        if ($('cloud-create-capacity-field')) $('cloud-create-capacity-field').classList.toggle('cloud-hidden', isLarge);
        if ($('cloud-create-large-note')) $('cloud-create-large-note').classList.toggle('cloud-hidden', !isLarge);
      } else {
        if ($('cloud-project-pick-site')) $('cloud-project-pick-site').classList.toggle('cloud-hidden', isPerson || isMaster);
        if ($('cloud-project-clear-site')) $('cloud-project-clear-site').classList.toggle('cloud-hidden', isPerson || isMaster);
      }
      if (isPerson || isMaster || isSubstitute) {
        clearSiteSelection(kind);
      }
    }

    function resetCreateForm() {
      const form = $('cloud-create-form');
      const refs = titleFieldRefs('create');
      const now = currentJstParts();
      if (form) {
        form.reset();
      }
      if ($('cloud-create-year')) $('cloud-create-year').value = now.year;
      if ($('cloud-create-month')) $('cloud-create-month').value = now.month;
      if ($('cloud-create-mode')) $('cloud-create-mode').value = 'scene';
      if (refs.input) {
        refs.input.value = '';
        refs.input.dataset.selectedEmployeeName = '';
      }
      if (refs.hidden) refs.hidden.value = '';
      if (refs.note) refs.note.textContent = '';
      if (refs.panel) {
        refs.panel.innerHTML = '';
        refs.panel.classList.add('cloud-hidden');
      }
      clearSiteSelection('create');
      setMasterTargets('create', 'person', [], []);
      refreshCreateMasterTypeLock();
      setTitleFieldMode('create');
    }

    async function fetchEmployeeCandidates(query) {
      const key = String(query || '').trim();
      if (!key) return [];
      if (employeeSearchCache.has(key)) {
        return employeeSearchCache.get(key);
      }
      const response = await fetch(`/tools/pluslist/api/search_employee?q=${encodeURIComponent(key)}`, {
        credentials: 'same-origin',
        headers: { Accept: 'application/json' }
      });
      if (!response.ok) {
        throw new Error('社員候補の取得に失敗しました');
      }
      const payload = await response.json();
      const candidates = Array.isArray(payload)
        ? payload
        : Array.isArray(payload.results)
          ? payload.results
          : Array.isArray(payload.items)
            ? payload.items
            : Array.isArray(payload.employees)
              ? payload.employees
              : [];
      employeeSearchCache.set(key, candidates);
      return candidates;
    }

    async function fetchSiteCandidates(query) {
      const key = String(query || '').trim();
      const response = await fetch(`/tools/siteplus/api/cloudshift/sites?q=${encodeURIComponent(key)}`, {
        credentials: 'same-origin',
        headers: { Accept: 'application/json' }
      });
      if (!response.ok) {
        throw new Error('現場候補の取得に失敗しました');
      }
      const payload = await response.json();
      const candidates = Array.isArray(payload.sites) ? payload.sites : [];
      return candidates;
    }

    async function fetchSiteBranches(siteId) {
      const key = String(siteId || '').trim();
      if (!key) {
        return [];
      }
      if (siteBranchCache.has(key)) {
        return siteBranchCache.get(key);
      }
      const response = await fetch(`/tools/siteplus/api/cloudshift/sites/${encodeURIComponent(key)}/branches`, {
        credentials: 'same-origin',
        headers: { Accept: 'application/json' }
      });
      if (!response.ok) {
        throw new Error('枝番号候補の取得に失敗しました');
      }
      const payload = await response.json();
      const branches = Array.isArray(payload.branches)
        ? payload.branches.map((branch) => normalizeSiteBranchCandidate(branch)).filter(Boolean)
        : [];
      siteBranchCache.set(key, branches);
      return branches;
    }

    async function syncCurrentProjectSiteBranches() {
      setShifterSyncSiteStateForCurrentProject();
      const project = currentProject();
      const site = project && project.mode === 'scene' ? (project.site || null) : null;
      if (!project || project.mode !== 'scene' || !site || !site.is_linked || !site.site_id) {
        return [];
      }
      const projectId = project.id;
      const siteId = site.site_id;
      const branches = await fetchSiteBranches(siteId);
      const liveProject = currentProject();
      if (!liveProject || liveProject.id !== projectId) {
        return branches;
      }
      if (!ShifterSync.setState) {
        return branches;
      }
      ShifterSync.setState('siteContext', liveProject.site || site);
      ShifterSync.setState('siteBranches', branches);
      if (currentMonth()) {
        replaceCalendarEntries(currentEntriesSnapshot());
      }
      return branches;
    }

    async function openSitePicker(kind) {
      const modal = openCloudModal('cloud-site-picker-modal', kind === 'create' ? '現場を選択' : '現場設定');

      const footer = modalFooter(modal);
      if (!body || !footer) return;

        <div class="cloud-form">
          <label class="cloud-field">
            <span>現場検索</span>
            <input id="cloud-site-picker-query" class="cloud-input" type="text" placeholder="契約番号または現場名">
          </label>
          <div id="cloud-site-picker-list" class="cloud-project-list"></div>
        </div>
      `;
      footer.innerHTML = '<button type="button" class="cloud-btn secondary" data-cloud-modal-close-pick>閉じる</button>';
      const closeBtn = footer.querySelector('[data-cloud-modal-close-pick]');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => closeCloudModal('cloud-site-picker-modal'));
      }

      const queryInput = $('cloud-site-picker-query');
      const list = $('cloud-site-picker-list');
      if (!queryInput || !list) return;

      const render = (items) => {
        if (!items.length) {
          list.innerHTML = '<div class="cloud-empty-state"><p>候補が見つかりません。</p></div>';
          return;
        }
        list.innerHTML = items.map((item) => `

            <div class="cloud-project-card-head">
              <div>
                <h3>${escapeHtml(`${item.site_id || ''} / ${item.site_name || ''}`)}</h3>
                <p>有効枝番号 ${escapeHtml(String(item.active_branch_count || 0))}件</p>
              </div>
              <span class="cloud-badge">${escapeHtml(item.site_id || '')}</span>
            </div>
          </article>
        `).join('');

          node.addEventListener('click', () => {

            applySiteSelection(kind, selected);

      const load = async () => {
        const items = await fetchSiteCandidates(queryInput.value.trim());

        window.clearTimeout(queryInput._siteTimer);

      }
    }

    async function openEmployeePicker(kind) {

      const body = modalBody(modal);
      const footer = modalFooter(modal);

        <div class="cloud-form">

            <span>社員検索</span>
            <input id="cloud-employee-picker-query" class="cloud-input" type="text" placeholder="社員名または社員番号">
          </label>
          <div id="cloud-employee-picker-list" class="cloud-project-list"></div>
        </div>
      `;
      footer.innerHTML = '<button type="button" class="cloud-btn secondary" data-cloud-modal-close-pick>閉じる</button>';

      if (closeBtn) {

      if (!queryInput || !list) return;

      const render = (items) => {

    function scheduleBulkCandidateSearch(form) {
      const project = currentProject();
      const refs = bulkFieldRefs(form);
      if (!project || !refs.nameInput) {
        return;
      }
      const mode = project.mode === 'person' ? 'person' : 'scene';
      const query = refs.nameInput.value.trim();
      if (mode === 'scene') {
        if (refs.nameInput.dataset.selectedEmployeeName && refs.nameInput.dataset.selectedEmployeeName !== query) {
          clearBulkEmployeeSelection(form);
        }
      } else {
        if (refs.nameInput.dataset.selectedSiteName && refs.nameInput.dataset.selectedSiteName !== query) {
          clearBulkSiteSelection(form);
        }
      }
      if (!query) {
        if (refs.panel) {
          refs.panel.innerHTML = '';
          refs.panel.classList.add('cloud-hidden');
        }
        return;
      }
      window.clearTimeout(bulkEmployeeSearchTimer);
      bulkEmployeeSearchTimer = window.setTimeout(async () => {
        const latestQuery = refs.nameInput.value.trim();
        if (!latestQuery) {
          if (refs.panel) {
            refs.panel.innerHTML = '';
            refs.panel.classList.add('cloud-hidden');
          }
          return;
        }
        try {
          if (mode === 'scene') {
            const candidates = await fetchEmployeeCandidates(latestQuery);
            if (refs.nameInput.value.trim() !== latestQuery) {
              return;
            }
            renderBulkEmployeeCandidates(form, candidates);
          } else {
            const candidates = await fetchSiteCandidates(latestQuery);
            if (refs.nameInput.value.trim() !== latestQuery) {

            renderBulkSiteCandidates(form, candidates);

        } catch (_) {

          }
        }

    function resetAssistState() {
      state.assist.contextKey = '';
      state.assist.loaded = false;
      state.assist.data = null;
      state.assist.permissions = {
        can_edit_records: false,
        can_edit_rules: false,

      };
      state.assist.activeTab = 'register';
      state.assist.registerView = 'record';
      state.assist.editView = 'records';
      state.assist.searchResult = null;
      state.assist.recordDraft = null;
