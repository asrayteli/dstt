    // -----------------------------------------------------------------
    // 自動シフト作成（shift-engine）UI
    // 設計書 docs/cloudshift_shift_engine_design.md の context/plan/apply-draft を呼ぶ。
    // -----------------------------------------------------------------
    const shiftEngineState = { context: null, lastPlan: null, projectId: null, year: null, month: null, lastTargetDayCount: null };

    function shiftEnginePrefsFromContext(context) {
      const settings = (context && context.shift_engine_settings) || {};
      return settings.default_preferences || {};
    }

    function seDemandLabel(source) {
      return ({ settings: '設定', required_capacity_fallback: '必要人数から展開', prev_month_estimate: '前月推定', target_override: '対象日の指定人数', none: '未設定' })[source] || source || '';
    }

    function seWeekdayLabel(weekday) {
      return ['月', '火', '水', '木', '金', '土', '日'][weekday] || '';
    }

    function seSevLabel(s) { return ({ blocker: '重大', hard: '必須違反', warning: '警告', info: '情報' })[s] || s; }
    function seStatusLabel(s) { return ({ feasible: '生成OK', partial: '一部未充足', failed: '生成失敗', optimal: '最適' })[s] || s; }
    function seDateLabel(iso) { const p = String(iso || '').split('-'); return p.length === 3 ? `${parseInt(p[1], 10)}/${parseInt(p[2], 10)}` : iso; }

    // ---- 自動作成の対象日選択（カレンダー形式 + 曜日・プリセット） ----
    function seDaysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
    function seWeekdayOfDay(year, month, day) { return (new Date(year, month - 1, day).getDay() + 6) % 7; }
    function seIsHoliday(year, month, day) {
      const iso = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      return Array.isArray(window.SHIFTERSYNC_HOLIDAYS) && window.SHIFTERSYNC_HOLIDAYS.indexOf(iso) >= 0;
    }

    function seBuildTargetDaySection(year, month) {
      const totalDays = seDaysInMonth(year, month);
      const firstDow = seWeekdayOfDay(year, month, 1);
      const weekdayLabels = ['月', '火', '水', '木', '金', '土', '日'];
      const headCells = weekdayLabels.map((label) => `<div class="cloud-se-day-head">${label}</div>`).join('');
      const cells = [];
      for (let index = 0; index < firstDow; index += 1) {
        cells.push('<div class="cloud-se-day-cell is-empty" aria-hidden="true"></div>');
      }
      for (let day = 1; day <= totalDays; day += 1) {
        const weekday = seWeekdayOfDay(year, month, day);
        const holiday = seIsHoliday(year, month, day);
        const classes = ['cloud-se-day-cell', 'is-selected'];
        if (holiday) classes.push('is-holiday');
        else if (weekday === 6) classes.push('is-sunday');
        else if (weekday === 5) classes.push('is-saturday');
        cells.push(`
          <button type="button" class="${classes.join(' ')}"
            data-se-day="${day}" data-se-weekday="${weekday}" data-se-holiday="${holiday ? '1' : '0'}"
            aria-pressed="true">${day}</button>
        `);
      }
      const chips = weekdayLabels.map((label, weekday) => `
        <button type="button" class="cloud-se-weekday-chip" data-se-weekday-chip="${weekday}">${label}</button>
      `).join('');
      return `
        <div class="cloud-field cloud-se-target-days">
          <span>自動作成の対象日（選んだ日だけシフトを埋めます。連勤などの判定は月全体で行います）</span>
          <div class="cloud-se-day-presets">
            <button type="button" class="cloud-btn secondary" data-se-preset="all">全日</button>
            <button type="button" class="cloud-btn secondary" data-se-preset="weekday">平日のみ</button>
            <button type="button" class="cloud-btn secondary" data-se-preset="weekend">土日祝のみ</button>
            <button type="button" class="cloud-btn secondary" data-se-preset="none">全解除</button>
            <span class="cloud-se-muted">曜日で切替:</span>
            ${chips}
          </div>
          <div class="cloud-se-day-grid">${headCells}${cells.join('')}</div>
          <p class="cloud-se-muted" data-se-target-count></p>
          <label class="cloud-field cloud-se-target-required">
            <span>対象日の必要人数（任意）。指定すると需要設定・前月推定より優先します。需要0で配置されない日の解決にも使えます</span>
            <input class="cloud-input" type="number" min="1" max="99" data-se-target-required placeholder="未指定（既存の需要設定に従う）">
          </label>
        </div>
      `;
    }

    function seTargetDayCells(body) {
      return Array.from(body.querySelectorAll('[data-se-day]'));
    }

    function seSetDayCellSelected(cell, selected) {
      cell.classList.toggle('is-selected', selected);
      cell.setAttribute('aria-pressed', selected ? 'true' : 'false');
    }

    function seUpdateTargetCount(body) {
      const label = body.querySelector('[data-se-target-count]');
      if (!label) return;
      const cells = seTargetDayCells(body);
      const selected = cells.filter((cell) => cell.classList.contains('is-selected')).length;
      label.textContent = selected === cells.length
        ? `対象: 全日（${cells.length}日）`
        : `対象: ${selected}/${cells.length} 日`;
    }

    function seBindTargetDayEvents(body) {
      seTargetDayCells(body).forEach((cell) => {
        cell.addEventListener('click', () => {
          seSetDayCellSelected(cell, !cell.classList.contains('is-selected'));
          seUpdateTargetCount(body);
        });
      });
      body.querySelectorAll('[data-se-preset]').forEach((button) => {
        button.addEventListener('click', () => {
          const preset = button.getAttribute('data-se-preset');
          seTargetDayCells(body).forEach((cell) => {
            const weekday = parseInt(cell.getAttribute('data-se-weekday') || '0', 10);
            const holiday = cell.getAttribute('data-se-holiday') === '1';
            let selected = false;
            if (preset === 'all') selected = true;
            else if (preset === 'weekday') selected = weekday < 5 && !holiday;
            else if (preset === 'weekend') selected = weekday >= 5 || holiday;
            seSetDayCellSelected(cell, selected);
          });
          seUpdateTargetCount(body);
        });
      });
      body.querySelectorAll('[data-se-weekday-chip]').forEach((chip) => {
        chip.addEventListener('click', () => {
          const weekday = chip.getAttribute('data-se-weekday-chip');
          const cells = seTargetDayCells(body).filter((cell) => cell.getAttribute('data-se-weekday') === weekday);
          const allSelected = cells.length > 0 && cells.every((cell) => cell.classList.contains('is-selected'));
          cells.forEach((cell) => seSetDayCellSelected(cell, !allSelected));
          seUpdateTargetCount(body);
        });
      });
      seUpdateTargetCount(body);
    }

    async function openShiftEngineModal() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || project.mode !== 'scene') { showFlash('自動作成は現場シフト帳で利用できます', 'error'); return; }
      if (!month) { showFlash('対象の月がありません', 'error'); return; }
      const modal = openCloudModal('cloud-shift-engine-modal', `自動作成 / ${project.title}`);
      const body = modalBody(modal);
      const footer = modalFooter(modal);
      body.innerHTML = '<p class="cloud-se-muted">準備中…</p>';
      footer.innerHTML = '';
      let context;
      try {
        const url = `/tools/shiftersync/cloudshift/api/project/${project.id}/shift-engine/context?year=${month.year}&month=${month.month}`;
        context = await requestJson(url);
      } catch (error) {
        body.innerHTML = `<p class="cloud-se-error">${escapeHtml(error.message)}</p>`;
        return;
      }
      shiftEngineState.context = context;
      shiftEngineState.lastPlan = null;
      shiftEngineState.projectId = project.id;
      shiftEngineState.year = month.year;
      shiftEngineState.month = month.month;
      renderShiftEngineForm(modal, context);
    }

    function renderShiftEngineForm(modal, context) {
      const body = modalBody(modal);
      const prefs = shiftEnginePrefsFromContext(context);
      const baseline = prefs.eligibility_baseline || 'dedicated_or_experienced';
      const existingPolicy = prefs.existing_policy || 'lock_manual';
      const unconfirmed = prefs.unconfirmed_leave_strength || 'hard';
      const allowPartial = prefs.allow_partial !== false;
      const includeTrainees = !!prefs.include_trainees;

      // 有休カレンダーは既定で全て取り込み対象にする（休みの日に配置しないため）
      const calendars = (context.leave_calendar_options || []).map((opt) => {
        const id = opt.id || opt.calendar_id || opt.value || '';
        const name = opt.name || opt.label || opt.title || id;
        return `<label class="cloud-se-check"><input type="checkbox" data-se-calendar value="${escapeHtml(String(id))}" checked> ${escapeHtml(String(name))}</label>`;
      }).join('') || '<p class="cloud-se-muted">アクセスできる有休カレンダーがありません</p>';

      const factors = (context.emptiness_factors || []).map((f) => `<li>${escapeHtml(f)}</li>`).join('');
      const warnings = (context.warnings || []).map((w) => `<li>${escapeHtml(w.message)}</li>`).join('');

      body.innerHTML = `
        <div class="cloud-se-info">
          <span>候補者 ${context.candidate_count || 0} 名（適格 ${context.eligible_candidate_count || 0} 名）</span>
          <span>需要 ${context.required_slot_count || 0} 枠（${escapeHtml(seDemandLabel(context.demand_source))}）</span>
          <span>他現場占有 ${context.external_assignment_count || 0} 件</span>
          <span>固定 ${context.fixed_assignment_count || 0} 件</span>
        </div>
        ${factors ? `<details class="cloud-se-fold"><summary>空欄が増えうる設定（${(context.emptiness_factors || []).length}）</summary><ul>${factors}</ul></details>` : ''}
        ${warnings ? `<details class="cloud-se-fold"><summary>設定の警告</summary><ul>${warnings}</ul></details>` : ''}
        <div class="cloud-se-grid">
          <label class="cloud-field"><span>配置の最低基準</span>
            <select class="cloud-input" data-se-baseline>
              <option value="dedicated_or_experienced"${baseline === 'dedicated_or_experienced' ? ' selected' : ''}>専従・経験者のみ（既定）</option>
              <option value="any"${baseline === 'any' ? ' selected' : ''}>全員可</option>
            </select></label>
          <label class="cloud-field"><span>既存シフトの扱い</span>
            <select class="cloud-input" data-se-existing>
              <option value="lock_manual"${existingPolicy === 'lock_manual' ? ' selected' : ''}>手入力だけ固定（既定）</option>
              <option value="lock_all"${existingPolicy === 'lock_all' ? ' selected' : ''}>すべて固定</option>
              <option value="replace_all"${existingPolicy === 'replace_all' ? ' selected' : ''}>すべて再配置候補</option>
            </select></label>
          <label class="cloud-field"><span>未確認休暇の扱い</span>
            <select class="cloud-input" data-se-unconfirmed>
              <option value="hard"${unconfirmed === 'hard' ? ' selected' : ''}>配置しない（既定）</option>
              <option value="soft"${unconfirmed === 'soft' ? ' selected' : ''}>避ける（減点のみ）</option>
              <option value="info"${unconfirmed === 'info' ? ' selected' : ''}>参考のみ</option>
            </select></label>
          <label class="cloud-field"><span>スコア下限（任意）</span>
            <input class="cloud-input" type="number" data-se-minscore placeholder="未設定"></label>
        </div>
        <div class="cloud-se-checks">
          <label class="cloud-se-check"><input type="checkbox" data-se-trainees${includeTrainees ? ' checked' : ''}> 研修者も入れる</label>
          <label class="cloud-se-check"><input type="checkbox" data-se-partial${allowPartial ? ' checked' : ''}> 未充足を許可する</label>
        </div>
        ${seBuildTargetDaySection(shiftEngineState.year, shiftEngineState.month)}
        <div class="cloud-field"><span>有休共有カレンダー（チェックしたカレンダーの休みの日には配置しません）</span><div class="cloud-se-calendars">${calendars}</div></div>
        <div class="cloud-se-result" data-se-result></div>
      `;
      seBindTargetDayEvents(body);

      const footer = modalFooter(modal);
      footer.innerHTML = `
        <button type="button" class="cloud-btn secondary" data-se-plan>試算する</button>
        <button type="button" class="cloud-btn primary" data-se-preview disabled>プレビューを開いて確認・反映</button>
      `;
      footer.querySelector('[data-se-plan]').addEventListener('click', () => runShiftEnginePlan(modal).catch((e) => showFlash(e.message, 'error')));
      footer.querySelector('[data-se-preview]').addEventListener('click', () => openShiftEnginePreviewWindow(modal));
    }

    function collectShiftEnginePayload(modal) {
      const body = modalBody(modal);
      const minRaw = body.querySelector('[data-se-minscore]').value;
      const preferences = {
        eligibility_baseline: body.querySelector('[data-se-baseline]').value,
        existing_policy: body.querySelector('[data-se-existing]').value,
        unconfirmed_leave_strength: body.querySelector('[data-se-unconfirmed]').value,
        include_trainees: body.querySelector('[data-se-trainees]').checked,
        allow_partial: body.querySelector('[data-se-partial]').checked,
      };
      if (minRaw !== '' && !Number.isNaN(parseInt(minRaw, 10))) preferences.min_assignment_score = parseInt(minRaw, 10);
      const calendar_ids = Array.from(body.querySelectorAll('[data-se-calendar]:checked')).map((el) => el.value);
      const payload = { year: shiftEngineState.year, month: shiftEngineState.month, preferences, calendar_ids };
      const dayCells = seTargetDayCells(body);
      const selectedDays = dayCells
        .filter((cell) => cell.classList.contains('is-selected'))
        .map((cell) => parseInt(cell.getAttribute('data-se-day') || '0', 10))
        .filter((day) => day > 0);
      if (selectedDays.length === 0) {
        throw new Error('自動作成の対象日が選択されていません。少なくとも1日選んでください');
      }
      if (selectedDays.length < dayCells.length) {
        payload.target_days = selectedDays;
      }
      shiftEngineState.lastTargetDayCount = selectedDays.length < dayCells.length ? selectedDays.length : null;
      const requiredRaw = body.querySelector('[data-se-target-required]');
      if (requiredRaw && requiredRaw.value !== '' && !Number.isNaN(parseInt(requiredRaw.value, 10)) && parseInt(requiredRaw.value, 10) > 0) {
        payload.target_required_count = parseInt(requiredRaw.value, 10);
      }
      return payload;
    }

    async function runShiftEnginePlan(modal) {
      const payload = collectShiftEnginePayload(modal);
      const result = modalBody(modal).querySelector('[data-se-result]');
      result.innerHTML = '<p class="cloud-se-muted">試算中…</p>';
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${shiftEngineState.projectId}/shift-engine/plan`, { method: 'POST', body: payload });
      shiftEngineState.lastPlan = data;
      renderShiftEngineResult(modal, data);
    }

    function seCandidateFactorText(factors) {
      return (factors || [])
        .map((f) => `${f.label}${f.points > 0 ? '+' : ''}${f.points}`)
        .join('・');
    }

    function buildShiftEngineDayDetails(data) {
      const result = data.result || {};
      const summaries = data.day_summary || [];
      if (!summaries.length) return '';

      const explanationByAssignment = {};
      (result.explanations || []).forEach((ex) => { explanationByAssignment[ex.assignment_id] = ex; });
      const assignmentsByDay = {};
      (result.assignments || []).forEach((a) => {
        (assignmentsByDay[a.day] = assignmentsByDay[a.day] || []).push(a);
      });
      const panelsByDay = {};
      (result.candidate_panels || []).forEach((p) => {
        (panelsByDay[p.day] = panelsByDay[p.day] || []).push(p);
      });
      const unfilledByDay = {};
      (result.unfilled_slots || []).forEach((u) => {
        (unfilledByDay[u.day] = unfilledByDay[u.day] || []).push(u);
      });

      const rows = summaries
        .filter((s) => s.in_scope && (s.demand > 0 || s.unfilled > 0 || s.no_demand
          || (assignmentsByDay[s.day] || []).length))
        .map((s) => {
          const assignments = assignmentsByDay[s.day] || [];
          const dayLabel = `${parseInt(String(s.date).split('-')[1], 10)}/${s.day}(${seWeekdayLabel(s.weekday)}${s.is_holiday ? '・祝' : ''})`;
          const needsAttention = s.no_demand || s.unfilled > 0;

          if (s.no_demand) {
            return `
              <details class="cloud-se-dayrow is-warn">
                <summary>${escapeHtml(dayLabel)} <strong>需要0</strong> — この日は配置されません</summary>
                <div class="cloud-se-dayrow-body">
                  <p class="cloud-se-error">必要人数が設定されていない日です（運転士がいないのではなく、埋めるべき枠が0件）。</p>
                  <p class="cloud-se-muted">対処: 上の「対象日の必要人数」に人数を入れて再試算するか、シフト帳の必要人数・需要設定・前月実績を確認してください。</p>
                </div>
              </details>
            `;
          }

          const chips = assignments.map((a) => {
            const fixed = a.source !== 'engine';
            const label = `${a.shift_key ? `${a.shift_key} ` : ''}${a.employee_name || a.employee_number}`;
            return `<span class="cloud-se-assign-chip${fixed ? ' is-fixed' : ''}">${escapeHtml(label)}${fixed ? '🔒' : ''}</span>`;
          }).join(' ');

          const reasonLines = assignments
            .filter((a) => a.source === 'engine')
            .map((a) => {
              const ex = explanationByAssignment[a.assignment_id];
              const why = ex ? (seCandidateFactorText(ex.factors) || ex.summary) : '';
              return `<li><strong>${escapeHtml(a.employee_name || a.employee_number)}</strong>（${a.score}点）${why ? `: ${escapeHtml(why)}` : ''}</li>`;
            }).join('');

          const panelBlocks = (panelsByDay[s.day] || []).map((p) => {
            const candidateRows = (p.candidates || []).map((c) => `
              <li class="${c.selected ? 'is-selected-candidate' : ''}">
                ${c.selected ? '★ ' : ''}${escapeHtml(c.name || c.employee_number)} ${c.score}点
                ${c.factors && c.factors.length ? `<span class="cloud-se-muted">（${escapeHtml(seCandidateFactorText(c.factors))}）</span>` : ''}
              </li>
            `).join('');
            const excludedText = (p.excluded || []).map((e) => `${e.label}${e.count}名`).join('・');
            const heading = `${p.shift_key ? `${p.shift_key} ` : ''}枠${p.selected_employee_number ? '' : '（未充足）'}`;
            return `
              <div class="cloud-se-panel">
                <div class="cloud-se-panel-title">${escapeHtml(heading)} <span class="cloud-se-muted">配置可能 ${p.eligible_count} 名</span></div>
                ${candidateRows ? `<ul class="cloud-se-candidates">${candidateRows}</ul>` : '<p class="cloud-se-muted">配置可能な候補がいません</p>'}
                ${excludedText ? `<p class="cloud-se-muted">候補外: ${escapeHtml(excludedText)}</p>` : ''}
              </div>
            `;
          }).join('');

          const unfilledLines = (unfilledByDay[s.day] || [])
            .map((u) => `<li class="cloud-se-sev-warning">×${u.shortage} ${escapeHtml(u.shift_key || '指定なし')}: ${escapeHtml(u.reason)}</li>`)
            .join('');

          return `
            <details class="cloud-se-dayrow${needsAttention ? ' is-warn' : ''}">
              <summary>
                ${escapeHtml(dayLabel)} 需要${s.demand}
                / 配置${s.engine_count + s.fixed_count}（自動${s.engine_count}・固定${s.fixed_count}${s.leave_count ? `・休み${s.leave_count}` : ''}）
                ${s.unfilled > 0 ? `/ <strong>未充足${s.unfilled}</strong>` : ''}
                ${chips ? `<span class="cloud-se-chiprow">${chips}</span>` : ''}
              </summary>
              <div class="cloud-se-dayrow-body">
                ${reasonLines ? `<p class="cloud-se-panel-title">選定理由</p><ul class="cloud-se-reasons">${reasonLines}</ul>` : ''}
                ${unfilledLines ? `<ul class="cloud-se-violations">${unfilledLines}</ul>` : ''}
                ${panelBlocks ? `<p class="cloud-se-panel-title">候補の比較（その日の他の候補と除外理由）</p>${panelBlocks}` : ''}
              </div>
            </details>
          `;
        });

      if (!rows.length) return '';
      return `
        <details class="cloud-se-fold" open>
          <summary>日別の結果（行をクリックすると選定理由・候補比較を表示）</summary>
          <div class="cloud-se-days">${rows.join('')}</div>
        </details>
      `;
    }

    function renderShiftEngineResult(modal, data) {
      const result = modalBody(modal).querySelector('[data-se-result]');
      const score = data.result.score;
      const status = data.result.status;
      const fill = Math.round((score.fill_rate || 0) * 100);
      const violations = data.result.violations || [];
      const blockers = violations.filter((v) => v.severity === 'blocker');
      const hards = violations.filter((v) => v.severity === 'hard');
      const warns = (data.result.warnings || []).concat(data.context_warnings || []);
      const unfilled = (data.result.unfilled_slots || []).slice(0, 12);

      const violationHtml = violations.length ? `<ul class="cloud-se-violations">${violations.slice(0, 12).map((v) => `<li class="cloud-se-sev-${escapeHtml(v.severity)}">[${escapeHtml(seSevLabel(v.severity))}] ${escapeHtml(v.message)}</li>`).join('')}</ul>` : '';
      const dayDetailsHtml = buildShiftEngineDayDetails(data);
      const unfilledHtml = unfilled.length ? `<details class="cloud-se-fold"><summary>未充足 ${score.unfilled_count} 件</summary><ul>${unfilled.map((u) => `<li>${escapeHtml(seDateLabel(u.date))} ${escapeHtml(u.shift_key || '指定なし')} ×${u.shortage}：${escapeHtml(u.reason)}</li>`).join('')}</ul></details>` : '';
      const warnHtml = warns.length ? `<details class="cloud-se-fold"><summary>警告 ${warns.length} 件</summary><ul>${warns.slice(0, 20).map((w) => `<li>${escapeHtml(w.message)}</li>`).join('')}</ul></details>` : '';
      const diff = data.diff || {};

      result.innerHTML = `
        <div class="cloud-se-score">
          <span class="cloud-se-badge cloud-se-status-${escapeHtml(status)}">${escapeHtml(seStatusLabel(status))}</span>
          ${shiftEngineState.lastTargetDayCount ? `<span>対象日 ${shiftEngineState.lastTargetDayCount} 日のみ</span>` : ''}
          <span>充足率 ${fill}%（${score.assigned_count}/${score.required_count}）</span>
          <span>未充足 ${score.unfilled_count}</span>
          <span>最大連勤 ${score.max_consecutive_days}</span>
          <span>公平性 ${Math.round((score.fairness_index || 0) * 100)}%</span>
          <span>差分 +${diff.added || 0} / -${diff.removed || 0} / 維持 ${diff.kept || 0}</span>
        </div>
        ${blockers.length ? '<p class="cloud-se-error">重大違反(blocker)があります。プレビューで内容を調整してください。</p>' : ''}
        ${violationHtml}
        ${dayDetailsHtml}
        ${unfilledHtml}
        ${warnHtml}
        <p class="cloud-se-muted">「プレビューを開く」で別ウィンドウに表示し、確認・調整のうえ保存します（このパネルでは正式シフトに反映されません）。</p>
      `;
      const previewBtn = modalFooter(modal).querySelector('[data-se-preview]');
      if (previewBtn) previewBtn.disabled = false;
    }

    function openShiftEnginePreviewWindow(modal) {
      const plan = shiftEngineState.lastPlan;
      if (!plan) { showFlash('先に試算してください', 'error'); return; }
      const projectId = shiftEngineState.projectId;
      const year = shiftEngineState.year;
      const month = shiftEngineState.month;
      const result = plan.result || {};
      const score = result.score || {};
      const payload = {
        entries: plan.draft_preview || {},
        request_hash: plan.request_hash,
        summary: {
          status: result.status,
          fill_rate: score.fill_rate,
          assigned_count: score.assigned_count,
          required_count: score.required_count,
          unfilled_count: score.unfilled_count,
          max_consecutive_days: score.max_consecutive_days,
          violations: result.violations || [],
          warnings: (result.warnings || []).concat(plan.context_warnings || [])
        },
        created_at: new Date().toISOString()
      };
      try {
        window.localStorage.setItem(`cloudshift_engine_preview:${projectId}:${year}:${month}`, JSON.stringify(payload));
      } catch (e) {
        showFlash('プレビューデータの保存に失敗しました', 'error');
        return;
      }
      const url = `/tools/shiftersync/cloudshift/project/${projectId}/shift-engine/preview?year=${year}&month=${month}`;
      const win = window.open(url, `cloudshift_preview_${projectId}_${year}_${month}`);
      if (!win) {
        showFlash('ポップアップがブロックされました。ポップアップを許可して再度お試しください。', 'error');
        return;
      }
      try { win.focus(); } catch (_) { /* noop */ }
      closeCloudModal('cloud-shift-engine-modal');
      showFlash('プレビューウィンドウを開きました。確認・調整のうえ保存してください。', 'success');
    }

    function bindOwnerEvents() {
      document.querySelectorAll('[data-cloud-tab]').forEach((button) => {
        button.addEventListener('click', function() {
          switchTab(this.getAttribute('data-cloud-tab'));
        });
      });

      const refreshProjects = $('cloud-refresh-projects');
      if (refreshProjects) {
        refreshProjects.addEventListener('click', async () => {
          await loadProjects();
          showFlash('一覧を更新しました', 'info');
        });
      }

      const manageVisibility = $('cloud-manage-visibility');
      if (manageVisibility) {
        manageVisibility.addEventListener('click', () => {
          openVisibilityManager().catch((error) => notifyActionError(error));
        });
      }

      const projectList = $('cloud-project-list');
      if (projectList) {
        projectList.addEventListener('click', (event) => {
          const hideButton = event.target.closest('[data-project-hide]');
          if (hideButton) {
            event.stopPropagation();
            hideProjectFromList(hideButton.getAttribute('data-project-hide')).catch((error) => notifyActionError(error));
            return;
          }
          const item = event.target.closest('[data-project-id]');
          if (!item) return;
          selectProject(item.getAttribute('data-project-id')).catch((error) => showFlash(error.message, 'error'));
        });
      }

      const createForm = $('cloud-create-form');
      if (createForm) {
        createForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!confirmDiscardUnsavedChanges('未保存の変更があります。保存せずに新しいシフト帳を作成すると、このセッションでの編集内容は失われます。続行しますか？')) return;
          const form = event.currentTarget;
          await runCloudCreateFlow({
            successMessage: 'シフト帳を作成しました。編集画面に移動しました',
            phases: [
              'シフト帳を保存しています...',
              '既存の現場・個人シフトを照合して取り込んでいます...',
              '共有用URLと編集データを準備しています...'
            ],
            buildFormData: () => {
              const formData = new FormData(form);
              if (formData.get('mode') === 'master') {
                const targets = state.masterTargets.create || { targetType: 'person', people: [], sites: [] };
                formData.set('master_target_type', targets.targetType === 'scene' ? 'scene' : 'person');
                formData.set('master_people', targets.targetType === 'person' ? JSON.stringify(targets.people || []) : '');
                formData.set('master_sites', targets.targetType === 'scene' ? JSON.stringify(targets.sites || []) : '');
              }
              return formData;
            }
          });
        });
      }

      const importForm = $('cloud-import-form');
      if (importForm) {
        importForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!confirmDiscardUnsavedChanges('未保存の変更があります。保存せずにCSVを取り込むと、このセッションでの編集内容は失われます。続行しますか？')) return;
          const form = event.currentTarget;
          await runCloudCreateFlow({
            successMessage: 'CSV を読み込みました。編集画面に移動しました',
            phases: [
              'CSVを解析しています...',
              'シフト帳を保存し、既存のシフトを照合しています...',
              '共有用URLと編集データを準備しています...'
            ],
            buildFormData: () => new FormData(form)
          });
        });
      }

      const saveTitle = $('cloud-save-title');
      if (saveTitle) {
        saveTitle.addEventListener('click', async () => {
          const project = currentProject();
          if (!project) return;
          if (!confirmDiscardUnsavedChanges('未保存の変更があります。タイトル保存で画面を再読み込みすると、このセッションでの編集内容は失われます。続行しますか？')) return;
          try {
            const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/meta`, {
              method: 'PUT',
              body: {
                title: $('cloud-project-title').value.trim(),
                employee_number: $('cloud-project-employee-number') ? $('cloud-project-employee-number').value.trim() : '',
                site_row_id: $('cloud-project-site-row-id') ? $('cloud-project-site-row-id').value.trim() : '',

    // ---- ViewPWA: 更新通知の購読 ----
    const PWA_DEVICE_ID_KEY = 'cloudshift-pwa-device-id';

    function pwaDeviceId() {
      let id = '';
      try {
        id = window.localStorage.getItem(PWA_DEVICE_ID_KEY) || '';
        if (!id) {
          if (window.crypto && window.crypto.randomUUID) {
            id = window.crypto.randomUUID().replace(/-/g, '');
          } else {
            id = Math.random().toString(36).slice(2) + Date.now().toString(36);
          }
          window.localStorage.setItem(PWA_DEVICE_ID_KEY, id);
        }
      } catch (error) {
        id = id || (Math.random().toString(36).slice(2) + Date.now().toString(36));
      }
      return id;
    }

    function pwaUrlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = window.atob(base64);
      const output = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i += 1) {
        output[i] = raw.charCodeAt(i);
      }
      return output;
    }

    function pwaSameAppServerKey(existing, wanted) {
      if (!existing) return false;
      const current = new Uint8Array(existing);
      if (current.length !== wanted.length) return false;
      for (let i = 0; i < current.length; i += 1) {
        if (current[i] !== wanted[i]) return false;
      }
      return true;
    }

    async function registerPwaServiceWorker() {
      if (!('serviceWorker' in navigator)) return null;
      const registration = await navigator.serviceWorker.register('/cloudshift-service-worker.js', {
        scope: '/tools/shiftersync/cloudshift/'
      });
      await navigator.serviceWorker.ready;
      return registration;
    }

    async function refreshPwaNotifyButton() {
      const button = $('cloud-pwa-notify');
      if (!button) return;
      const supported = 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
      if (!supported || !PAGE.pushAvailable) {
        button.hidden = true;
        return;
      }
      button.hidden = false;
      let subscribed = false;
      try {
        const registration = await navigator.serviceWorker.getRegistration('/tools/shiftersync/cloudshift/');
        subscribed = Boolean(registration && (await registration.pushManager.getSubscription()));
      } catch (error) {
        subscribed = false;
      }
      button.dataset.state = subscribed ? 'on' : 'off';
      button.textContent = subscribed ? '通知を無効化' : '通知を有効化';
    }

    async function enablePwaPush() {
      if (Notification.permission === 'denied') {
        showFlash('ブラウザの通知がブロックされています。設定から許可してください。', 'error');
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        showFlash('通知が許可されませんでした。', 'error');
        return;
      }
      const registration = await registerPwaServiceWorker();
      if (!registration) {
        showFlash('この端末では通知を利用できません。', 'error');
        return;
      }
      const keyData = await requestJson(`/tools/shiftersync/cloudshift/api/pwa/${PAGE.token}/push/public-key`);
      if (!keyData || keyData.status !== 'ok' || !keyData.public_key) {
        showFlash((keyData && keyData.message) || '通知の準備ができていません。', 'error');
        return;
      }
      const appServerKey = pwaUrlBase64ToUint8Array(keyData.public_key);
      let subscription = await registration.pushManager.getSubscription();
      if (subscription && !pwaSameAppServerKey(subscription.options && subscription.options.applicationServerKey, appServerKey)) {
        try { await subscription.unsubscribe(); } catch (error) { /* noop */ }
        subscription = null;
      }
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: appServerKey
        });
      }
      await requestJson(`/tools/shiftersync/cloudshift/api/pwa/${PAGE.token}/push/subscribe`, {
        method: 'POST',
        body: { device_id: pwaDeviceId(), subscription: subscription.toJSON() }
      });
      showFlash('シフト更新の通知を有効にしました', 'success');
      await refreshPwaNotifyButton();
    }

    async function disablePwaPush() {
      try {
        const registration = await navigator.serviceWorker.getRegistration('/tools/shiftersync/cloudshift/');
        const subscription = registration ? await registration.pushManager.getSubscription() : null;
        if (subscription) {
          await subscription.unsubscribe();
        }
      } catch (error) {
        /* 端末側の解除に失敗してもサーバー側は無効化する */
      }
      await requestJson(`/tools/shiftersync/cloudshift/api/pwa/${PAGE.token}/push/unsubscribe`, {
        method: 'POST',
        body: { device_id: pwaDeviceId() }
      });
      showFlash('通知を無効にしました', 'success');
      await refreshPwaNotifyButton();
    }

        <div class="cloud-actions compact">
          <a class="cloud-btn primary" href="${escapeHtml(webcalUrl)}">カレンダーアプリで登録</a>
          <button type="button" class="cloud-btn secondary" data-pwa-calendar-copy>購読URLをコピー</button>
        </div>
        <p class="cloud-panel-note">iPhone/iPad は「カレンダーアプリで登録」をタップしてください。Googleカレンダーは「他のカレンダー → URLで追加」にコピーしたURLを貼り付けてください。</p>
      `;
      footer.innerHTML = '<button type="button" class="cloud-btn ghost" data-pwa-calendar-close>閉じる</button>';
      footer.querySelector('[data-pwa-calendar-close]').addEventListener('click', () => closeCloudModal('cloud-pwa-calendar-modal'));
      body.querySelector('[data-pwa-calendar-copy]').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(httpsUrl);
          showFlash('購読URLをコピーしました', 'success');
        } catch (error) {
          showFlash(`コピーできませんでした。URL: ${httpsUrl}`, 'error');
        }
      });
    }

    async function initPwa() {
      const calendarButton = $('cloud-pwa-calendar');
      if (calendarButton && !calendarButton.dataset.pwaBound) {
        calendarButton.dataset.pwaBound = '1';
        calendarButton.addEventListener('click', () => {
          try {
            openPwaCalendarSubscribe();
          } catch (error) {
            showFlash(error.message || 'カレンダー登録画面を開けませんでした', 'error');
          }
        });
      }
      const button = $('cloud-pwa-notify');
      if (button && !button.dataset.pwaBound) {
        button.dataset.pwaBound = '1';
        button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            if (button.dataset.state === 'on') {
              await disablePwaPush();
            } else {
              await enablePwaPush();
            }
          } catch (error) {
            showFlash(error.message || '通知の設定に失敗しました', 'error');
          } finally {
            button.disabled = false;
          }
        });
      }
      try {
        await registerPwaServiceWorker();
      } catch (error) {
        /* SW 登録に失敗しても閲覧は継続できる */
      }
      await refreshPwaNotifyButton();
    }

    // -----------------------------------------------------------------
    // 自動作成プレビュー（engine_preview）専用ウィンドウ
    // 生成結果は localStorage 経由で受け取り、ここで保存操作をしない限り
    // 正式シフトには一切反映されない（閉じれば破棄）。
    // -----------------------------------------------------------------
    function enginePreviewStorageKey(projectId, year, month) {
      return `cloudshift_engine_preview:${projectId}:${year}:${month}`;
    }

    function readEnginePreviewData() {
      try {
        const raw = window.localStorage.getItem(enginePreviewStorageKey(PAGE.projectId, PAGE.year, PAGE.month));
        return raw ? JSON.parse(raw) : null;
      } catch (_) { return null; }
    }

    function clearEnginePreviewData() {
      try { window.localStorage.removeItem(enginePreviewStorageKey(PAGE.projectId, PAGE.year, PAGE.month)); } catch (_) {}
    }

    function renderEnginePreviewSummary(data) {
      const host = $('cloud-se-preview-summary');
      if (!host) return;
      const summary = (data && data.summary) || null;
      if (!summary) { host.classList.add('cloud-hidden'); return; }
      const fill = Math.round((summary.fill_rate || 0) * 100);
      const violations = summary.violations || [];
      const warns = summary.warnings || [];
      const violationHtml = violations.length
        ? `<ul class="cloud-se-violations">${violations.slice(0, 10).map((v) => `<li class="cloud-se-sev-${escapeHtml(v.severity)}">[${escapeHtml(seSevLabel(v.severity))}] ${escapeHtml(v.message)}</li>`).join('')}</ul>` : '';
      const warnHtml = warns.length
        ? `<details class="cloud-se-fold"><summary>警告 ${warns.length} 件</summary><ul>${warns.slice(0, 20).map((w) => `<li>${escapeHtml(w.message)}</li>`).join('')}</ul></details>` : '';
      host.innerHTML = `
        <div class="cloud-se-score">
          <span class="cloud-se-badge cloud-se-status-${escapeHtml(summary.status)}">${escapeHtml(seStatusLabel(summary.status))}</span>
          <span>充足率 ${fill}%（${summary.assigned_count}/${summary.required_count}）</span>
          <span>未充足 ${summary.unfilled_count}</span>
          <span>最大連勤 ${summary.max_consecutive_days}</span>
        </div>
        ${violationHtml}${warnHtml}
        <p class="cloud-se-muted">内容を確認・調整し、「仮保存」または「正式シフトに反映」を押してください。何もせず閉じると破棄されます。</p>
      `;
      host.classList.remove('cloud-hidden');
    }

    async function initEnginePreview() {
      applyPublicDeviceMode();
      window.addEventListener('resize', applyPublicDeviceMode);
      bindEnginePreviewEvents();
      await loadEnginePreview();
    }

    async function loadEnginePreview() {
      const monthKey = `${PAGE.year}-${String(PAGE.month).padStart(2, '0')}`;
      const payload = unwrapProjectPayload(await requestJson(
        `/tools/shiftersync/cloudshift/api/project/${PAGE.projectId}?month_key=${encodeURIComponent(monthKey)}`));
      state.projectPayload = payload;
      const data = readEnginePreviewData();
      if (!data || !data.entries) {
        showFlash('表示できる生成結果がありません。自動作成からやり直してください。', 'error');
        if ($('cloud-public-empty')) $('cloud-public-empty').classList.remove('cloud-hidden');
      } else if (state.projectPayload.month) {
        // 生成結果を draft として注入する（サーバーには未保存）。
        state.projectPayload.month.draft_entries_per_day = data.entries;
      }
      state.baseMonth = state.projectPayload.month ? deepClone(state.projectPayload.month) : null;
      state.editorMode = 'draft';
      syncAssistContext();
      updateCurrentProjectLabel();
      await renderWorkspaceWithSiteBranches(true);
      renderEnginePreviewSummary(data);
    }

    function bindEnginePreviewEvents() {
      const saveBtn = $('cloud-se-preview-save-draft');
      if (saveBtn) saveBtn.addEventListener('click', () => withDsttLoading(
        { message: '仮保存中…' }, () => enginePreviewSaveDraft()).catch((e) => showFlash(e.message, 'error')));
      const pubBtn = $('cloud-se-preview-publish');
      if (pubBtn) pubBtn.addEventListener('click', () => withDsttLoading(
        { message: '正式シフトへ反映中…' }, () => enginePreviewPublish()).catch((e) => showFlash(e.message, 'error')));
      const discardBtn = $('cloud-se-preview-discard');
      if (discardBtn) discardBtn.addEventListener('click', () => enginePreviewDiscard());
    }

    async function enginePreviewSaveDraft() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) { showFlash('生成結果がありません', 'error'); return; }
      const payload = unwrapProjectPayload(await requestJson(
        `/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/draft`, {
          method: 'PUT',
          body: { entries_per_day: entriesWithoutSubstituteRequestDisplays(ShifterSync.getEntriesPerDay()) }
        }));
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      state.editorMode = 'draft';
      await renderWorkspaceWithSiteBranches(true);
      showFlash('仮保存しました。正式に反映するには「正式シフトに反映」を押してください。', 'success');
    }

    async function enginePreviewPublish() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) { showFlash('生成結果がありません', 'error'); return; }
      if (!(await cloudConfirm({ title: '正式シフトに反映', message: 'この内容を正式シフトへ反映します。現在の正式シフトは置き換わります。よろしいですか？', confirmLabel: '反映する' }))) return;
      // 編集内容をまず下書きへ保存してから公開する
      await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/draft`, {
        method: 'PUT',
        body: { entries_per_day: entriesWithoutSubstituteRequestDisplays(ShifterSync.getEntriesPerDay()) }
      });
      const payload = unwrapProjectPayload(await requestJson(
        `/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/draft/publish`, {
          method: 'POST', body: {}
        }));
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      state.editorMode = 'normal';
      clearEnginePreviewData();
      await renderWorkspaceWithSiteBranches(true);
      if ($('cloud-se-preview-summary')) $('cloud-se-preview-summary').classList.add('cloud-hidden');
      showFlash('正式シフトへ反映しました。このウィンドウは閉じて構いません。', 'success');
    }

    function enginePreviewDiscard() {
      clearEnginePreviewData();
      // 未保存ガード(beforeunload)を回避してから閉じる
      resetUnsavedBaseline();
      window.close();
      showFlash('自動作成結果を破棄しました。ウィンドウを閉じてください。', 'info');
    }

    async function initPublic() {
      applyPublicDeviceMode();
      window.addEventListener('resize', applyPublicDeviceMode);
      bindPublicEvents();
      ensureCloudActionButtons();
      await loadPublic();
      if (PAGE.accessMode === 'pwa') {
        await initPwa();
      }
    }

    window.CLOUDSHIFT_CAN_OPEN_SYNC_SOURCE = function(entry) {
      if (PAGE.type !== 'owner') {
        return false;
      }
      return !!(
        entry
        && entry.sync_source_project_id
        && entry.sync_source_month_key
        && entry.sync_source_day
        && entry.sync_source_entry_id
      );
    };

    window.CLOUDSHIFT_OPEN_SYNC_SOURCE = function(entry) {
      openSyncedSourceEntry(entry).catch((error) => showFlash(error.message, 'error'));
    };

    window.addEventListener('beforeunload', (event) => {
      if (!hasUnsavedMonthChanges()) return;
      event.preventDefault();
      event.returnValue = '';
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (PAGE.type === 'owner') {
        initOwner().catch((error) => showFlash(error.message, 'error'));
      } else if (PAGE.type === 'engine_preview') {
        initEnginePreview().catch((error) => showFlash(error.message, 'error'));
      } else {
        initPublic().catch((error) => showFlash(error.message, 'error'));
      }
    });
  })();
</script>
