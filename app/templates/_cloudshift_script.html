    function guestNameKey() {
      return `cloudshift:guest:${PAGE.token}`;
    }

    async function ensureGuestName() {
      if (PAGE.authenticatedEditorName) {
        state.guestName = PAGE.authenticatedEditorName;
        updateCurrentProjectLabel();
        return true;
      }

      if (!state.guestName) {
        state.guestName = window.localStorage.getItem(guestNameKey()) || '';
      }

      if (!state.guestName) {
        const entered = await cloudPrompt({
          title: '編集者名の確認',
          message: '保存すると、この名前が編集履歴と共有先に表示されます。',
          label: '編集者名',
          placeholder: '例：山田 太郎',
          confirmLabel: '保存して続行',
          required: true,
          requiredMessage: '編集者名を入力してください'
        });
        if (!entered) {
          showFlash('編集者名を入力すると保存できます', 'error');
          return false;
        }
        state.guestName = entered;
        window.localStorage.setItem(guestNameKey(), state.guestName);
      }

      updateCurrentProjectLabel();
      return true;
    }

    function branchWarningItemsFromEntries() {
      const entriesPerDay = currentEntriesSnapshot();
      const branchIds = new Set(currentProjectSiteBranches().map((branch) => String(branch.id)));
      const invalid = [];

      Object.keys(entriesPerDay)
        .sort((a, b) => parseInt(a, 10) - parseInt(b, 10))
        .forEach((dayKey) => {
          const dayEntries = Array.isArray(entriesPerDay[dayKey]) ? entriesPerDay[dayKey] : [];
          dayEntries.forEach((entry) => {
            const value = String(entry && entry.value ? entry.value : '').trim();
            if (!value) {
              return;
            }
            const parsed = parseEntryValue(value);
            const label = parsed.optionKey
              ? `${parsed.name} / ${optionLabelForKey(parsed.optionKey)}`
              : parsed.name;
            const branchRowId = normalizeSiteBranchRowId(entry && (entry.site_branch_row_id || entry.siteBranchRowId || ''));
            const snapshotBranch = String(entry && (entry.site_branch || entry.siteBranch || '') ? (entry.site_branch || entry.siteBranch || '') : '').trim();
            if (!branchRowId) {
              return;
            }
            if (!branchIds.has(branchRowId)) {
              invalid.push({ day: dayKey, label, site_branch: snapshotBranch });
            }
          });
        });

      return { invalid };
    }

    function confirmSceneBranchSave() {
      const project = currentProject();
      if (!project || project.mode !== 'scene') {
        return true;
      }
      const site = project.site || currentProjectSiteContext() || {};
      const entriesPerDay = currentEntriesSnapshot();
      const entryCount = Object.values(entriesPerDay).reduce((total, entries) => total + (Array.isArray(entries) ? entries.length : 0), 0);
      if (entryCount <= 0 || !site || !site.is_linked) {
        return true;
      }

      const branches = currentProjectSiteBranches();
      const lines = [];
      if (branches.length) {
        const warnings = branchWarningItemsFromEntries();
        if (warnings.invalid.length) {
          lines.push(`現在は無効な枝番号を参照している割当が ${warnings.invalid.length} 件あります。`);
          warnings.invalid.slice(0, 5).forEach((item) => {
            const suffix = item.site_branch ? ` / 旧枝 ${item.site_branch}` : '';
            lines.push(`- ${item.day}日: ${item.label}${suffix}`);
          });
        }
      }

      if (!lines.length) {
        return true;
      }
      lines.push('');
      lines.push('このまま保存しますか？');
      return window.confirm(lines.join('\n'));
    }

    async function saveMonthOwner() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;
      if (state.editorMode === 'draft') {
        await saveMonthDraft();
        return;
      }
      if (!confirmSceneBranchSave()) return;

      const response = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}`, {
        method: 'PUT',
        body: collectMonthPayload()
      });
      const payload = unwrapProjectPayload(response);
      const leaveSync = response.leave_sync || null;
      state.shiftBookSettings.approvedRequestIds = [];
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      const submittedRequests = await submitPendingSubstituteRequestsForCurrentMonth();
      if (submittedRequests) {
        await reloadCurrentProjectPayload(`${month.year}-${String(month.month).padStart(2, '0')}`);
      }
      await renderWorkspaceWithSiteBranches(true);
      await loadProjects();
      await loadHistory(project.id);
      if (await maybeReturnToSyncOrigin(project.id, `${month.year}-${String(month.month).padStart(2, '0')}`)) {
        return;
      }
      let saveMessage = submittedRequests
        ? `この月を保存し、代務要請 ${submittedRequests} 件を要代務シフト帳へ登録しました`
        : 'この月を保存しました';
      if (leaveSync && leaveSync.status === 'synced') {
        saveMessage += `。有休マネージャーへ ${leaveSync.created_total || 0}件を自動同期しました`;
      } else if (leaveSync && leaveSync.status === 'failed') {
        showFlash(leaveSync.message || 'シフトは保存しましたが、有休マネージャーへの自動同期に失敗しました', 'error');
        return;
      }
      const needsLargeBaseline = project.mode === 'large' && !(payload.month && payload.month.meta_data && payload.month.meta_data.baseline);
      showFlash(needsLargeBaseline
        ? `${saveMessage}。初回シフトを確定した場合は「現在を基準版に確定」して、以後の変更を見分けられるようにしてください。`
        : saveMessage, 'success');
    }

    async function saveMonthDraft() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;
      if (!confirmSceneBranchSave()) return;

      const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/draft`, {
        method: 'PUT',
        body: { entries_per_day: entriesWithoutSubstituteRequestDisplays(currentEditingEntries()) }
      }));
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      state.editorMode = 'draft';
      const submittedRequests = await submitPendingSubstituteRequestsForCurrentMonth();
      if (submittedRequests) {
        await reloadCurrentProjectPayload(`${month.year}-${String(month.month).padStart(2, '0')}`);
        state.editorMode = 'draft';
      }
      await renderWorkspaceWithSiteBranches(true);
      await loadProjects();
      await loadHistory(project.id);
      showFlash(submittedRequests
        ? `仮保存し、代務要請 ${submittedRequests} 件を要代務シフト帳へ登録しました`
        : '仮保存しました', 'success');
    }

    async function publishMonthDraft() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;
      if (!draftHasChanges(month)) {
        showFlash('反映する仮保存の変更がありません', 'info');
        return;
      }
      if (!(await cloudConfirm({ title: '正式シフトに反映', message: '仮保存モードの内容を正式なシフトへ反映します。現在の正式シフトは仮保存の内容で置き換わります。よろしいですか？', confirmLabel: '反映する' }))) return;
      const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/draft/publish`, {
        method: 'POST',
        body: {}
      }));
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      state.editorMode = 'normal';
      await renderWorkspaceWithSiteBranches(true);
      await loadProjects();
      await loadHistory(project.id);
      const needsLargeBaseline = project.mode === 'large' && !(payload.month && payload.month.meta_data && payload.month.meta_data.baseline);
      showFlash(needsLargeBaseline
        ? '仮保存をシフトへ反映しました。初回シフトなら「現在を基準版に確定」してください。'
        : '仮保存をシフトへ反映しました', 'success');

    async function clearMonthDraft() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;
      if (!draftHasChanges(month)) {
        showFlash('破棄する仮保存の変更がありません', 'info');

      }
      if (!(await cloudConfirm({ title: '仮保存を破棄', message: '仮保存モードの変更を破棄し、正式シフトの内容に戻しますか？', confirmLabel: '破棄する', danger: true }))) return;
      const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month/${month.year}/${month.month}/draft`, {

      }));

      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      state.editorMode = 'draft';

    async function switchEditorMode(mode) {
      const nextMode = mode === 'draft' ? 'draft' : 'normal';
      if (state.editorMode === nextMode) return;
      if (!confirmDiscardUnsavedChanges('未保存の変更があります。保存せずにモードを切り替えると、このセッションでの編集内容は失われます。続行しますか？')) {
        updateUnsavedIndicator();
        return;
      }
      state.editorMode = nextMode;
      await renderWorkspaceWithSiteBranches(projectAccessRole(currentProject()) !== 'viewer');

    async function saveMonthPublic() {
      const month = currentMonth();
      if (!month || !(await ensureGuestName())) return;
      if (!confirmSceneBranchSave()) return;

      const response = await requestJson(`/tools/shiftersync/cloudshift/api/public/edit/${PAGE.token}/month/${month.year}/${month.month}`, {
        method: 'PUT',
        body: Object.assign(collectMonthPayload(), { editor_name: state.guestName })
      });
      const payload = unwrapProjectPayload(response);
      state.projectPayload = payload;
      state.baseMonth = payload.month ? deepClone(payload.month) : null;
      await renderWorkspaceWithSiteBranches(true);
      const leaveSync = response.leave_sync || null;
      if (leaveSync && leaveSync.status === 'failed') {
        showFlash(leaveSync.message || 'シフトは保存しましたが、有休マネージャーへの自動同期に失敗しました', 'error');
      } else if (leaveSync && leaveSync.status === 'synced') {
        showFlash(`この月を保存し、有休マネージャーへ ${leaveSync.created_total || 0}件を自動同期しました`, 'success');
      } else {
        showFlash('この月を保存しました', 'success');
      }
    }

    async function openSyncedSourceEntry(entry) {
      if (PAGE.type !== 'owner') {
        showFlash('反映元を直接開けるのは管理画面のみです', 'error');
        return;
      }
      const originProject = currentProject();
      const originMonthKey = currentMonthKey();
      const sourceProjectId = String(entry && entry.sync_source_project_id ? entry.sync_source_project_id : '').trim();
      const sourceMonthKey = String(entry && entry.sync_source_month_key ? entry.sync_source_month_key : '').trim();
      const sourceDay = String(entry && entry.sync_source_day ? entry.sync_source_day : '').trim();
      const sourceEntryId = String(entry && entry.sync_source_entry_id ? entry.sync_source_entry_id : '').trim();
      if (!sourceProjectId || !sourceMonthKey || !sourceDay || !sourceEntryId) {
        showFlash('反映元の情報が見つからないため編集できません', 'error');
        return;
      }
      const returnContext = originProject && originMonthKey ? {
        origin_project_id: originProject.id,
        origin_project_title: originProject.title,
        origin_month_key: originMonthKey,
        source_project_id: sourceProjectId,
        source_month_key: sourceMonthKey
      } : null;
      closeLegacyDetailModals();
      const opened = await selectProject(sourceProjectId, sourceMonthKey, { preserveSyncReturnContext: true });
      if (!opened) return;
      state.syncReturnContext = returnContext;
      const sourceEntry = currentEntryByDayAndId(sourceDay, sourceEntryId);
      if (!sourceEntry) {
        state.syncReturnContext = null;
        showFlash('反映元のエントリが見つかりませんでした', 'error');
        return;
      }
      if (!ShifterSync.openEntryModal) {
        state.syncReturnContext = null;
        showFlash('編集モーダルを開けませんでした', 'error');
        return;
      }
      ShifterSync.openEntryModal(sourceDay, sourceEntryId);
      showFlash('反映元のシフトを開きました。編集後に「この月を保存」で自動同期されます', 'info');
    }

    async function maybeReturnToSyncOrigin(savedProjectId, savedMonthKey) {
      const ctx = state.syncReturnContext;
      if (!ctx) {
        return false;
      }
      if (
        String(ctx.source_project_id || '') !== String(savedProjectId || '')
        || String(ctx.source_month_key || '') !== String(savedMonthKey || '')
      ) {
        return false;
      }
      state.syncReturnContext = null;
      await selectProject(ctx.origin_project_id, ctx.origin_month_key, { skipUnsavedGuard: true });
      showFlash(`${ctx.origin_project_title || '元のシフト'} に戻りました`, 'success');
      return true;
    }

    async function createMonth(targetKey, ownerMode) {
      const project = currentProject();
      if (!project) return;
      if (ownerMode && projectAccessRole(project) !== 'owner') {
        showFlash('共有されたシフト帳では新しい月を追加できません', 'info');
        return;
      }

      const parsed = parseMonthKey(targetKey);
      if (!parsed) {
        showFlash('年月を YYYY-MM 形式で入力してください', 'error');
        return;
      }
      if (!confirmDiscardUnsavedChanges('未保存の変更があります。保存せずに月を作成すると、このセッションでの編集内容は失われます。続行しますか？')) return;

      // 前月コピーは廃止し、常に空の月を作る（引き継ぎは範囲一括編集・テンプレートで行う）。
      // 月ピッカーから作る初回の月は、そのダイアログ自体が確認になっているので聞き直さない。
      if (currentMonthKey()) {
        const confirmed = await cloudConfirm({
          title: '月を追加',
          message: `${formatMonthKey(targetKey)} を追加します。よろしいですか？`,
          confirmLabel: '追加する'
        });
        if (!confirmed) return;
      }
      clearPendingSubstituteRequests();

      const body = {
        year: parsed.year,
        month: parsed.month,
        init_mode: 'blank',
        source_month_key: null,
        required_capacity: parseInt(($('cloud-required-capacity') && $('cloud-required-capacity').value) || '0', 10) || 0
      };

      if (ownerMode) {
        const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/month`, {
          method: 'POST',
          body
        }));
        state.projectPayload = payload;
        state.baseMonth = payload.month ? deepClone(payload.month) : null;
        // 先に編集画面の描画と遷移を確定させ、付随的な再読み込みは後段に回す。
        await renderWorkspaceWithSiteBranches(true);
        switchTab('editor');
        scrollEditorIntoView();
        try {
          await loadProjects();
        } catch (error) {
          if (window.console && console.error) console.error('loadProjects failed', error);
        }
        await loadHistory(project.id);
      } else {
        if (!(await ensureGuestName())) return;
        body.editor_name = state.guestName;
        const payload = unwrapProjectPayload(await requestJson(`/tools/shiftersync/cloudshift/api/public/edit/${PAGE.token}/month`, {
          method: 'POST',
          body
        }));
        state.projectPayload = payload;
        state.baseMonth = payload.month ? deepClone(payload.month) : null;
        await renderWorkspaceWithSiteBranches(true);
        scrollEditorIntoView();
      }

      showFlash(`${formatMonthKey(targetKey)} を作成し、その月に移動しました`, 'success');
    }

    async function navigateMonth(delta, ownerMode) {
      const activeKey = currentMonthKey() || (currentProject() && currentProject().latest_month_key);
      if (!activeKey) return;

      const targetKey = nextMonthKey(activeKey, delta);
      if (!targetKey) return;

      const monthKeys = (currentProject().month_keys || []);
      if (monthKeys.includes(targetKey)) {
        if (ownerMode) {
          await selectProject(currentProject().id, targetKey);
        } else {
          await loadPublic(targetKey);
        }
        return;
      }

      if (!ownerMode) {
        showFlash('その月はまだ作成されていません', 'info');
        return;
      }

      await createMonth(targetKey, ownerMode);
    }

    async function deleteMonth() {
      const project = currentProject();
      const month = currentMonth();
      if (!project || !month) return;
      if (!confirmDiscardUnsavedChanges('未保存の変更があります。保存せずにこの月を削除すると、このセッションでの編集内容は失われます。続行しますか？')) return;
      if (!(await cloudConfirm({ title: '月を削除', message: `${formatMonthKey(currentMonthKey())} を削除しますか？`, confirmLabel: '削除する', danger: true }))) return;

      switchTab('list');

    async function deleteProject() {

      if (!project) return;

    // 同一紐づけを他オーナーも所持している場合のみ、自分の一覧から非表示にする。
    // サーバーのデータは削除せず、表示からのみ除外する（誤削除によるデータ消失を防ぐ）。

    const SHARE_URL_LABELS = { view: '閲覧URL', edit: '編集URL', pwa: '通知付き閲覧URL' };

    function applyRegeneratedUrls(urls) {
      if (!urls) return;
      if (state.projectPayload && state.projectPayload.project) {
        state.projectPayload.project.urls = urls;
      }
      if ($('cloud-view-url')) $('cloud-view-url').value = urls.view_url || '';
      if ($('cloud-edit-url')) $('cloud-edit-url').value = urls.edit_url || '';
      if ($('cloud-pwa-url')) $('cloud-pwa-url').value = urls.pwa_url || '';
    }

    async function regenerateUrls() {
      const project = currentProject();
      if (!project) return;
      if (!(await cloudConfirm({ title: '共有URLを再発行', message: '閲覧URL・編集URL・通知付き閲覧URLの3つすべてを再発行しますか？既存のURLは無効になります。', confirmLabel: '再発行する', danger: true }))) return;

      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/tokens/regenerate`, {
        method: 'POST',
        body: {}
      });

      applyRegeneratedUrls(data.urls);
      showFlash('共有URLを再発行しました', 'success');
    }

    async function regenerateSingleUrl(target) {
      const project = currentProject();
      if (!project) return;
      const label = SHARE_URL_LABELS[target] || '共有URL';
      if (!(await cloudConfirm({ title: 'URLを再発行', message: `${label}を再発行しますか？既存の${label}は無効になります（他の共有URLはそのまま使えます）。`, confirmLabel: '再発行する', danger: true }))) return;

      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/tokens/regenerate`, {
        method: 'POST',
        body: { targets: [target] }
      });

      applyRegeneratedUrls(data.urls);
      showFlash(`${label}を再発行しました`, 'success');
    }

    async function copyText(text, message) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
      }
      showFlash(message, 'success');
    }

    function employeeShareNumbersFromForm(form) {
      const manual = String((form.querySelector('[name="share_employee_numbers"]') || {}).value || '')
        .split(/[\s,、]+/)
        .map((value) => value.trim())
        .filter(Boolean);
      const selected = Array.from(form.querySelectorAll('[name="share_office_candidates"] option:checked'))
        .map((option) => String(option.value || '').trim())
        .filter(Boolean);
      return Array.from(new Set(manual.concat(selected)));
    }

    function accountShareFormHtml(data) {
      const shares = data.shares || {};
      const office = shares.office || {};
      const employees = Array.isArray(shares.employees) ? shares.employees : [];
      const ownerOffices = Array.isArray(data.owner_offices) ? data.owner_offices : [];
      const officeCandidates = Array.isArray(data.office_candidates) ? data.office_candidates : [];
      const selectedNumbers = new Set(employees.map((item) => String(item.employee_number || '').trim()));
      const candidateNumbers = new Set(officeCandidates.map((item) => String(item.employee_number || '').trim()));
      const manualNumbers = employees
        .map((item) => String(item.employee_number || '').trim())
        .filter((number) => number && !candidateNumbers.has(number));
      return `
        <form class="cloud-share-form">
          <p class="cloud-panel-note">DSTTアカウントを持っている人向けの共有です。共有URLはアカウントがない人向けとして残します。</p>
          <label class="cloud-share-option">
            <input type="checkbox" name="share_office" ${office.enabled ? 'checked' : ''} ${ownerOffices.length ? '' : 'disabled'}>
            <span>
              <strong>同じ営業所内</strong>
              <small>${ownerOffices.length ? ownerOffices.map((item) => item.label).join('、') : '共有に使える営業所権限がありません'}</small>
            </span>
          </label>
          <label class="cloud-field">
            <span>同じ営業所内から選択</span>
            <input name="share_candidate_query" class="cloud-input" type="search" placeholder="氏名または社員番号で絞り込み">
            <select name="share_office_candidates" class="cloud-input cloud-share-candidate-select" multiple size="8">
              ${officeCandidates.length
                ? officeCandidates.map((item) => `<option value="${escapeHtml(item.employee_number)}" data-search-text="${escapeHtml(`${item.name || ''} ${item.employee_number || ''}`.toLowerCase())}" ${selectedNumbers.has(String(item.employee_number || '').trim()) ? 'selected' : ''}>${escapeHtml(`${item.name || item.employee_number} / ${item.employee_number}`)}</option>`).join('')
                : '<option value="" disabled>選択できるDSTTアカウントがありません</option>'}
            </select>
            <small class="cloud-field-note">Ctrl（MacはCommand）を押しながらクリックすると複数選択できます。</small>
          </label>
          <label class="cloud-field">
            <span>特定社員宛（社員番号を直接指定）</span>
            <textarea name="share_employee_numbers" class="cloud-input cloud-share-textarea" rows="4" placeholder="例: 3243012&#10;複数指定は改行・カンマ区切り">${escapeHtml(manualNumbers.join('\n'))}</textarea>
          </label>
          <div class="cloud-share-current">
            <h4>現在の共有先</h4>
            <div class="cloud-badges">
              ${office.enabled ? `<span class="cloud-badge shared-owner">同じ営業所内</span>` : ''}
              ${employees.map((item) => `<span class="cloud-badge shared-owner">${escapeHtml(item.name || item.employee_number)} / ${escapeHtml(item.employee_number)}</span>`).join('')}
              ${!office.enabled && !employees.length ? '<span class="cloud-badge">未共有</span>' : ''}
            </div>
          </div>
        </form>
      `;
    }

    function bindAccountShareCandidateSearch(root) {
      const form = root.querySelector('.cloud-share-form');
      if (!form) return;
      const query = form.querySelector('[name="share_candidate_query"]');
      const select = form.querySelector('[name="share_office_candidates"]');
      if (!query || !select) return;
      query.addEventListener('input', () => {
        const needle = String(query.value || '').trim().toLowerCase();
        Array.from(select.options).forEach((option) => {
          option.hidden = !!needle && !String(option.getAttribute('data-search-text') || '').includes(needle);
        });
      });
    }

    function renderAccountShareModalBody(modal, data) {
      modalBody(modal).innerHTML = accountShareFormHtml(data);
      modalFooter(modal).innerHTML = `
        <button type="button" class="cloud-btn secondary" data-cloud-share-close>閉じる</button>
        <button type="button" class="cloud-btn primary" data-cloud-share-save>保存</button>
      `;
      modalFooter(modal).querySelector('[data-cloud-share-close]').addEventListener('click', () => closeCloudModal('cloud-account-share-modal'));
      modalFooter(modal).querySelector('[data-cloud-share-save]').addEventListener('click', () => {
        saveAccountShares(modal).catch((error) => showFlash(error.message, 'error'));
      });
      bindAccountShareCandidateSearch(modal);
    }

    async function openAccountShareModal() {
      const project = currentProject();
      if (!project || projectAccessRole(project) !== 'owner') return;
      const modal = openCloudModal('cloud-account-share-modal', `シフト帳共有 / ${project.title}`);
      modalBody(modal).innerHTML = '<div class="cloud-empty-state"><p>共有設定を読み込み中です...</p></div>';

    async function saveAccountShares(modal) {
      const project = currentProject();
      const form = modal.querySelector('.cloud-share-form');
      if (!project || !form) return;
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/account-shares`, {
        method: 'PUT',
        body: {
          share_office: !!form.querySelector('[name="share_office"]')?.checked,
          employee_numbers: employeeShareNumbersFromForm(form)
        }
      });
      if (state.projectPayload && state.projectPayload.project) {
        state.projectPayload.project.share = { role: 'owner', enabled: !!(data.shares && (data.shares.office.enabled || data.shares.employees.length)), settings: data.shares };
      }
      closeCloudModal('cloud-account-share-modal');
      await loadProjects();
      if (hasUnsavedMonthChanges()) {
        updateCurrentProjectLabel();
        updateUnsavedIndicator();
      } else {
        renderWorkspace(canEditCurrentProject());
      }
      showFlash('シフト帳共有を保存しました', 'success');
    }

    async function saveAccountSharesFromSettings(modal) {
      const project = currentProject();
      const form = modal.querySelector('.cloud-share-form');
      if (!project || !form) return;
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/account-shares`, {
        method: 'PUT',
        body: {
          share_office: !!form.querySelector('[name="share_office"]')?.checked,

      });

      renderShiftBookSettingsModalBody(modal);

    // ===== オーナー変更（所有権の移譲） =====
    // 担当の異動などでシフト帳の持ち主が変わるとき、削除して作り直さずに
    // 所有権だけを別の DSTT アカウントへ移すためのモーダル。

    function ownerTransferSelectedNumber() {
      const selected = state.ownerTransfer.selected;
      return selected ? String(selected.employee_number || '').trim() : '';
    }

    function ownerTransferIsReady() {
      const candidate = state.ownerTransfer.candidate;
      return !!(candidate && !candidate.error && candidate.employee_number && candidate.employee_number === ownerTransferSelectedNumber());
    }

    function renderOwnerTransferStatus(modal) {
      const host = modal.querySelector('[data-owner-transfer-status]');
      if (!host) return;
      const transfer = state.ownerTransfer;
      const candidate = transfer.candidate;
      if (transfer.checking) {
        host.innerHTML = '<div class="cloud-note-chip">確認中です...</div>';
      } else if (!candidate) {
        host.innerHTML = '<div class="cloud-note-chip">新しいオーナーを選んでください。</div>';
      } else if (candidate.error) {
        host.innerHTML = `<div class="cloud-note-chip danger">${escapeHtml(candidate.error)}</div>`;
      } else {
        host.innerHTML = `
          <div class="cloud-note-chip">新しいオーナー: ${escapeHtml(candidate.label || candidate.employee_number)}</div>
          ${candidate.already_shared ? '<p class="cloud-panel-note">この人は現在このシフト帳の共有先です。オーナーになると共有先からは外れます。</p>' : ''}
        `;
      }
      const submit = modalFooter(modal).querySelector('[data-owner-transfer-submit]');
      if (submit) submit.disabled = !ownerTransferIsReady();
    }

    // 移譲先の検索はDSTTアカウントが対象（社員名簿の検索は自分の営業所内に限られ、
    // 異動先の担当者を出せないため）。移譲できない候補も理由付きで表示する。
    async function fetchOwnerTransferCandidates(query) {
      const project = currentProject();
      if (!project) return [];
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/owner/candidates?q=${encodeURIComponent(query)}`);
      return Array.isArray(data.candidates) ? data.candidates : [];
    }

    function ownerTransferCandidateBlockedReason(item) {
      if (item.is_current_owner) return '現在のオーナー';
      if (item.has_duplicate) return '同じ対象のシフト帳を所持';
      return '';
    }

    function renderOwnerTransferCandidates(modal, candidates) {
      const panel = modal.querySelector('[data-owner-transfer-candidates]');
      if (!panel) return;
      const normalized = (Array.isArray(candidates) ? candidates : [])
        .filter((item) => item && String(item.employee_number || '').trim());
      if (!normalized.length) {
        panel.innerHTML = '<div style="color: var(--cloud-muted); font-size: 12px; padding: 4px 2px;">該当するDSTTアカウントがありません。社員番号または氏名を確認してください。</div>';
        panel.classList.remove('cloud-hidden');
        return;
      }
      panel.innerHTML = normalized.map((item) => {
        const blocked = ownerTransferCandidateBlockedReason(item);
        const notes = [blocked, item.already_shared ? '共有中' : ''].filter(Boolean).join(' / ');
        return `
          <button
            type="button"
            class="cloud-employee-candidate"
            data-owner-transfer-pick="${escapeHtml(item.employee_number)}"
            data-owner-transfer-name="${escapeHtml(item.name || '')}"
            ${blocked ? 'disabled' : ''}
            style="display:block; width:100%; text-align:left; border:1px solid var(--cloud-line); border-radius:10px; background:#fff; color:var(--cloud-text); padding:8px 10px; cursor:${blocked ? 'not-allowed' : 'pointer'}; opacity:${blocked ? '0.55' : '1'}; margin:0 0 6px;"
          >${escapeHtml(item.label || item.employee_number)}${notes ? `<span style="color: var(--cloud-muted); font-size: 12px;"> — ${escapeHtml(notes)}</span>` : ''}</button>
        `;
      }).join('');
      panel.classList.remove('cloud-hidden');
      panel.querySelectorAll('[data-owner-transfer-pick]').forEach((node) => {
        node.addEventListener('click', () => {
          selectOwnerTransferCandidate(modal, {
            employee_number: node.getAttribute('data-owner-transfer-pick') || '',
            employee_name: node.getAttribute('data-owner-transfer-name') || ''
          }).catch((error) => showFlash(error.message, 'error'));
        });
      });
    }

    async function selectOwnerTransferCandidate(modal, selected) {
      const project = currentProject();
      const number = String((selected || {}).employee_number || '').trim();
      if (!project || !number) return;
      state.ownerTransfer.selected = { employee_number: number, employee_name: String((selected || {}).employee_name || '') };
      state.ownerTransfer.candidate = null;
      state.ownerTransfer.checking = true;
      const panel = modal.querySelector('[data-owner-transfer-candidates]');
      if (panel) {
        panel.innerHTML = '';
        panel.classList.add('cloud-hidden');
      }
      const queryInput = modal.querySelector('[data-owner-transfer-query]');
      if (queryInput) {
        // 入力中に仕込まれた検索タイマーが後から候補一覧を出し直さないよう止める。
        window.clearTimeout(queryInput._ownerTransferTimer);
        queryInput.value = number;
      }
      state.ownerTransfer.query = number;
      renderOwnerTransferStatus(modal);
      try {
        const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/owner?employee_number=${encodeURIComponent(number)}`);
        // 確認中に別の候補へ切り替わっていたら、古い応答は捨てる。
        if (ownerTransferSelectedNumber() !== number) return;
        state.ownerTransfer.candidate = data.candidate || null;
      } finally {
        // 後発の確認が走っている場合は、そちらの結果を待つ（「確認中」のまま維持）。
        if (ownerTransferSelectedNumber() === number) {
          state.ownerTransfer.checking = false;
          renderOwnerTransferStatus(modal);
        }
      }
    }

    function bindOwnerTransferModalEvents(modal) {
      const queryInput = modal.querySelector('[data-owner-transfer-query]');
      if (queryInput) {
        queryInput.addEventListener('input', () => {
          state.ownerTransfer.query = queryInput.value.trim();
          state.ownerTransfer.selected = null;
          state.ownerTransfer.candidate = null;
          renderOwnerTransferStatus(modal);
          window.clearTimeout(queryInput._ownerTransferTimer);
          queryInput._ownerTransferTimer = window.setTimeout(async () => {
            const latest = queryInput.value.trim();
            const panel = modal.querySelector('[data-owner-transfer-candidates]');
            if (!latest) {
              if (panel) {
                panel.innerHTML = '';
                panel.classList.add('cloud-hidden');
              }
              return;
            }
            try {
              const candidates = await fetchOwnerTransferCandidates(latest);
              if (queryInput.value.trim() !== latest) return;
              renderOwnerTransferCandidates(modal, candidates);
            } catch (_) {
              if (panel) {
                panel.innerHTML = '';
                panel.classList.add('cloud-hidden');
              }
            }
          }, 220);
        });
      }
      const checkButton = modal.querySelector('[data-owner-transfer-check]');
      if (checkButton) {
        checkButton.addEventListener('click', () => {
          const value = queryInput ? queryInput.value.trim() : '';
          if (!value) {
            showFlash('社員番号を入力してください', 'error');
            return;
          }
          selectOwnerTransferCandidate(modal, { employee_number: value, employee_name: '' })
            .catch((error) => showFlash(error.message, 'error'));
        });
      }
      const shareBack = modal.querySelector('[data-owner-transfer-share-back]');
      if (shareBack) {
        shareBack.addEventListener('change', () => {
          state.ownerTransfer.shareWithPreviousOwner = !!shareBack.checked;
        });
      }
      // 閉じる／実行ボタンはフッター側。モーダルIDは実体から取る。
      const closeButton = modalFooter(modal).querySelector('[data-owner-transfer-close]');
      if (closeButton) closeButton.addEventListener('click', () => closeCloudModal(modal.id));
      const submit = modalFooter(modal).querySelector('[data-owner-transfer-submit]');
      if (submit) {
        submit.addEventListener('click', () => transferProjectOwner(modal).catch((error) => showFlash(error.message, 'error')));
      }
    }

    // 「シフト帳の設定 → オーナー変更」タブのフォーム（全モード共通）。
    function ownerTransferFormHtml() {
      const project = currentProject();
      const info = state.ownerTransfer.info || {};

      if (!info.can_transfer) {
        return `<div class="cloud-empty-state"><p>${escapeHtml(info.blocked_reason || 'このシフト帳のオーナーは変更できません。')}</p></div>`;
      }
      return `
        <section class="cloud-settings-card">
          <p class="cloud-panel-note">シフト帳の所有権を、別の DSTT アカウントへ引き継ぎます。担当が変わったときに、削除して作り直さずにそのまま移せます。月データ・編集履歴・共有URL・テンプレートはすべてそのまま残ります。</p>
          <label class="cloud-field">
            <span>現在のオーナー</span>
            <input class="cloud-input" type="text" value="${escapeHtml(owner.label || owner.user_id || '')}" readonly>
          </label>
          <label class="cloud-field">
            <span>新しいオーナー（社員番号または氏名）</span>
            <input class="cloud-input" type="text" data-owner-transfer-query placeholder="例: 3243012 / 山田" autocomplete="off" value="${escapeHtml(state.ownerTransfer.query || '')}">
            <small class="cloud-field-note">DSTTアカウントを検索します（営業所を問わず、異動先の人も探せます）。候補に出ないときは社員番号を直接入力して「この社員番号で確認」を押してください。</small>
          </label>
          <div class="cloud-actions compact">
            <button type="button" class="cloud-btn secondary" data-owner-transfer-check>この社員番号で確認</button>
          </div>
          <div class="cloud-input-panel wide cloud-hidden" data-owner-transfer-candidates></div>
          ${project && project.mode === 'large' ? '<p class="cloud-panel-note">大規模シフトは同期先のシフト帳もオーナー単位で扱われます。関連する現場・個人シフトの引き継ぎも忘れずに確認してください。</p>' : ''}
          <div data-owner-transfer-status></div>
        </section>
        <section class="cloud-settings-card">
          <label class="cloud-share-option">
            <input type="checkbox" data-owner-transfer-share-back ${state.ownerTransfer.shareWithPreviousOwner ? 'checked' : ''}>
            <span>
              <strong>変更後も自分（元オーナー）に共有する</strong>
              <small>チェックすると、あなたは「特定社員への共有」先として残り、引き続き閲覧できます。外すと、あなたの「自分のシフト帳」一覧からこのシフト帳は消えます。</small>
            </span>
          </label>
          <p class="cloud-panel-note">同じ営業所内への共有と共有URLは、変更前の設定のまま引き継がれます。新オーナーが「シフト帳共有」タブから変更できます。</p>
        </section>
      `;
    }

    function resetOwnerTransferState() {
      state.ownerTransfer = {
        info: null,
        query: '',
        selected: null,
        candidate: null,
        shareWithPreviousOwner: true,
        checking: false
      };
    }

    async function loadOwnerTransferInfo(projectId) {
      return requestJson(`/tools/shiftersync/cloudshift/api/project/${projectId}/owner`);
    }

    async function transferProjectOwner(modal) {
      const project = currentProject();
      const candidate = state.ownerTransfer.candidate;
      if (!project || !ownerTransferIsReady()) return;
      if (!confirmDiscardUnsavedChanges('未保存の変更があります。保存せずにオーナーを変更すると、このセッションでの編集内容は失われます。続行しますか？')) return;
      const shareBack = !!state.ownerTransfer.shareWithPreviousOwner;
      const confirmed = await cloudConfirm({
        title: 'オーナーを変更',
        message: `シフト帳「${project.title}」のオーナーを ${candidate.label || candidate.employee_number} さんに変更します。\n`
          + (shareBack
            ? '変更後、あなたには閲覧のみの共有が残ります。\n'
            : '変更後、このシフト帳はあなたの一覧から消えます（新オーナーに共有してもらうまで開けません）。\n')
          + 'よろしいですか？',
        confirmLabel: 'オーナーを変更する'
      });
      if (!confirmed) return;

      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/owner`, {
        method: 'PUT',
        body: {
          new_owner_user_id: candidate.employee_number,
          share_with_previous_owner: shareBack
        }
      });
      closeCloudModal(modal.id);
      // 自分はもうオーナーではないため、編集中の状態を持ち越さず一覧から開き直す。
      state.projectPayload = null;
      state.baseMonth = null;
      resetAssistState();
      await loadProjects();
      renderHistory([]);
      renderWorkspace(true);
      updateCurrentProjectLabel();
      switchTab('list');
      const ownerLabel = (data.owner && (data.owner.label || data.owner.user_id)) || candidate.employee_number;
      showFlash(
        data.shared_with_previous_owner
          ? `オーナーを ${ownerLabel} さんに変更しました（あなたには閲覧共有が残ります）`
          : `オーナーを ${ownerLabel} さんに変更しました`,
        'success'
      );
    }

    function leaveRequestStatusLabel(status) {
      if (status === 'approved') return '承認済み';
      if (status === 'rejected') return '拒否済み';
      return '未処理';
    }

    function currentEntryForLeaveRequest(request) {
      const month = currentMonth();
      if (!month || String(currentMonthKey() || '') !== String(request.month_key || '')) {
        return null;
      }
      const entries = currentEntriesSnapshot();
      const dayEntries = Array.isArray(entries[String(request.day)]) ? entries[String(request.day)] : [];
      return dayEntries.find((entry) => String(entry && entry.id ? entry.id : '') === String(request.entry_id || '')) || null;
    }

    function renderLeaveChangeRequestCard(request) {
      const planned = state.shiftBookSettings.approvedRequestIds.includes(request.id);
      const statusClass = planned ? 'is-planned' : request.status === 'approved' ? 'is-approved' : request.status === 'rejected' ? 'is-rejected' : '';
      const sameMonth = String(currentMonthKey() || '') === String(request.month_key || '');
      const canDecide = request.status === 'pending' && !planned;
      return `
        <article class="cloud-request-card ${statusClass}">
          <div class="cloud-inline-actions" style="justify-content: space-between; align-items: flex-start;">
            <div>
              <div class="cloud-badge">${escapeHtml(leaveRequestStatusLabel(planned ? 'approved' : request.status))}${planned ? '（保存待ち）' : ''}</div>
              <h4 class="cloud-section-title" style="margin: 8px 0 4px;">${escapeHtml(request.month_key || '')} / ${escapeHtml(String(request.day || ''))}日</h4>
          <p class="cloud-panel-note">${escapeHtml(request.entry_name || '休暇')} : ${escapeHtml(request.old_leave_type || '')} → ${escapeHtml(request.requested_leave_type || '')}</p>
              ${request.request_comment ? `<p class="cloud-panel-note">コメント: ${escapeHtml(request.request_comment)}</p>` : ''}
              <p class="cloud-panel-note">申請日時: ${escapeHtml(formatTimestamp(request.requested_at) || request.requested_at || '-')}</p>
            </div>
          </div>
          <div class="cloud-actions compact">
            ${!sameMonth && request.status === 'pending' ? `<button type="button" class="cloud-btn secondary" data-shift-settings-open-month="${escapeHtml(request.month_key || '')}">対象月を開く</button>` : ''}
            ${canDecide && sameMonth ? `<button type="button" class="cloud-btn primary" data-shift-settings-approve="${escapeHtml(request.id)}">許可してカレンダーへ反映</button>` : ''}
            ${planned ? `<button type="button" class="cloud-btn ghost" data-shift-settings-undo-approve="${escapeHtml(request.id)}">許可予定を取り消す</button>` : ''}
            ${canDecide ? `<button type="button" class="cloud-btn danger" data-shift-settings-reject="${escapeHtml(request.id)}">拒否</button>` : ''}
          </div>
        </article>
      `;
    }

    function renderCloudPushSubscriptionRows(subscriptions) {
      if (subscriptions === null || subscriptions === undefined) {
        return '<div class="cloud-empty-state"><p>通知先を読み込み中です...</p></div>';
      }
      if (!subscriptions.length) {
        return '<div class="cloud-empty-state"><p>登録済みの通知先はありません。通知付き閲覧URL（PWA）で通知を有効化すると、ここに表示されます。</p></div>';
      }
      return subscriptions.map((item) => `
        <div class="cloud-device ${item.is_active ? '' : 'is-disabled'}" data-cloud-device-id="${escapeHtml(String(item.id))}">
          <div class="cloud-device-main">
            <input class="cloud-input cloud-device-label" value="${escapeHtml(item.device_label || '')}" aria-label="通知先名">
            <div class="cloud-device-meta">${item.is_active ? '有効' : '無効'}${item.updated_at ? ` / 更新: ${escapeHtml(formatTimestamp(item.updated_at) || item.updated_at)}` : ''}${item.endpoint_tail ? ` / ${escapeHtml(item.endpoint_tail)}` : ''}</div>
          </div>
          <div class="cloud-device-actions">
            <button type="button" class="cloud-btn small secondary" data-cloud-device-save="${escapeHtml(String(item.id))}">保存</button>
            <button type="button" class="cloud-btn small ghost" data-cloud-device-disable="${escapeHtml(String(item.id))}" ${item.is_active ? '' : 'disabled'}>無効化</button>
            <button type="button" class="cloud-btn small danger" data-cloud-device-delete="${escapeHtml(String(item.id))}">削除</button>
          </div>
        </div>
      `).join('');
    }

    function applyShiftBookSettingsPayload(data) {
      if (!state.projectPayload || !state.projectPayload.project) return;
      state.projectPayload.project.shift_book = {
        ...(state.projectPayload.project.shift_book || {}),
        settings: data.settings || state.shiftBookSettings.settings,
        pending_leave_change_request_count: data.pending_leave_change_request_count || 0,
        unviewed_leave_change_request_count: data.unviewed_leave_change_request_count || 0
      };
      if (data.urls) {
        state.projectPayload.project.urls = data.urls;
      }
    }

    async function loadShiftBookSettings() {
      const project = currentProject();
      if (!project || projectAccessRole(project) !== 'owner') return null;
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/settings`);
      state.shiftBookSettings.loaded = true;
      state.shiftBookSettings.settings = data.settings || { leave_change_requests: { enabled: false } };
      state.shiftBookSettings.leaveCalendars = Array.isArray(data.leave_calendars) ? data.leave_calendars : [];
      state.shiftBookSettings.leaveOptions = Array.isArray(data.leave_options) ? data.leave_options : [];
      state.shiftBookSettings.requests = data.leave_change_requests || [];
      applyShiftBookSettingsPayload(data);
      state.shiftBookSettings.accountShares = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/account-shares`);
      // オーナー変更タブ用。開くたびに入力途中の候補は持ち越さずリセットする。
      resetOwnerTransferState();
      try {
        state.ownerTransfer.info = await loadOwnerTransferInfo(project.id);
      } catch (_) {
        state.ownerTransfer.info = { can_transfer: false, blocked_reason: 'オーナー情報を読み込めませんでした。' };
      }
      const month = currentMonth();
      if (month) {
        try {
          state.shiftBookSettings.revisions = await loadRevisionSnapshots(project, month);
        } catch (_) {
          state.shiftBookSettings.revisions = [];
        }
      } else {
        state.shiftBookSettings.revisions = [];
      }
      // 現場シフトは複数人が閲覧するため、通知先（ViewPWA 購読端末）を管理できるようにする。
      if (project.mode === 'scene') {
        try {
          const pushData = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/pwa/subscriptions`);
          state.shiftBookSettings.pushSubscriptions = pushData.subscriptions || [];
        } catch (_) {
          state.shiftBookSettings.pushSubscriptions = [];
        }
      } else {
        state.shiftBookSettings.pushSubscriptions = null;
      }
      return data;
    }

    async function openShiftBookSettingsModal() {
      const project = currentProject();
      if (!project || projectAccessRole(project) !== 'owner') return;
      const modal = openCloudModal('cloud-shift-book-settings-modal', `シフト帳の設定 / ${project.title}`);

    async function saveShiftBookSettings(modal) {
      const project = currentProject();
      if (!project) return;
      const enabledInput = modal.querySelector('[name="leave_change_requests_enabled"]');
      const enabled = enabledInput
        ? !!enabledInput.checked
        : !!(state.shiftBookSettings.settings.leave_change_requests || {}).enabled;
      const calendarSelect = modal.querySelector('[name="leave_sync_calendar_id"]');
      const selectedOptionInputs = Array.from(modal.querySelectorAll('[name="leave_sync_option_key"]'));
      const leaveSync = state.shiftBookSettings.settings.leave_sync || { calendar_id: '', option_keys: [] };
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/settings`, {
        method: 'PUT',
        body: {
          leave_change_requests_enabled: enabled,
          leave_sync_calendar_id: calendarSelect ? calendarSelect.value : leaveSync.calendar_id,
          leave_sync_option_keys: selectedOptionInputs.length
            ? selectedOptionInputs.filter((input) => input.checked).map((input) => input.value)
            : leaveSync.option_keys
        }
      });
      state.shiftBookSettings.settings = data.settings || state.shiftBookSettings.settings;
      state.shiftBookSettings.requests = data.leave_change_requests || state.shiftBookSettings.requests;
      applyShiftBookSettingsPayload(data);
      renderShiftBookSettingsModalBody(modal);
      renderWorkspace(canEditCurrentProject());
      showFlash('シフト帳の設定を保存しました', 'success');
    }

    function approveLeaveChangeRequestInCalendar(requestId, modal) {
      const request = (state.shiftBookSettings.requests || []).find((item) => item.id === requestId);
      if (!request) return;
      if (String(currentMonthKey() || '') !== String(request.month_key || '')) {
        showFlash('対象月を開いてから許可してください', 'error');
        return;
      }
      const entry = currentEntryForLeaveRequest(request);
      if (!entry) {
        showFlash('対象の休暇が見つかりません。再読み込みしてください', 'error');
        return;
      }
      const parsed = parseEntryValue(entry.value);
      if (String(parsed.optionKey || '').toUpperCase() !== String(request.old_option_key || '').toUpperCase()) {
        showFlash('対象の休暇種別が申請時から変わっているため許可できません', 'error');
        return;
      }
      const nextEntries = currentEntriesSnapshot();
      const dayKey = String(request.day);
      nextEntries[dayKey] = (nextEntries[dayKey] || []).map((item) => {
        if (String(item.id || '') !== String(request.entry_id || '')) return item;
        return {
          ...item,
          value: formatEntryValue(request.requested_option_key, parsed.name)
        };
      });
      replaceCalendarEntries(nextEntries);
      if (!state.shiftBookSettings.approvedRequestIds.includes(request.id)) {
        state.shiftBookSettings.approvedRequestIds.push(request.id);
      }
      updateUnsavedIndicator();
      renderShiftBookSettingsModalBody(modal);
      showFlash('カレンダーに反映しました。「この月を保存」で確定します。', 'info');
    }

    function undoApprovedLeaveChangeRequestInCalendar(requestId, modal) {
      const request = (state.shiftBookSettings.requests || []).find((item) => item.id === requestId);
      if (!request) return;
      state.shiftBookSettings.approvedRequestIds = state.shiftBookSettings.approvedRequestIds.filter((id) => id !== requestId);
      const entry = currentEntryForLeaveRequest(request);
      if (entry) {
        const parsed = parseEntryValue(entry.value);
        if (String(parsed.optionKey || '').toUpperCase() === String(request.requested_option_key || '').toUpperCase()) {
          const nextEntries = currentEntriesSnapshot();
          const dayKey = String(request.day);
          nextEntries[dayKey] = (nextEntries[dayKey] || []).map((item) => {
            if (String(item.id || '') !== String(request.entry_id || '')) return item;
            return {
              ...item,
              value: formatEntryValue(request.old_option_key, parsed.name)
            };
          });
          replaceCalendarEntries(nextEntries);
        }
      }
      updateUnsavedIndicator();
      renderShiftBookSettingsModalBody(modal);
      showFlash('許可予定を取り消しました', 'info');
    }

    async function rejectLeaveChangeRequest(requestId, modal) {
      const project = currentProject();
      if (!project || !requestId) return;
      if (!(await cloudConfirm({ title: '申請を拒否', message: 'この休暇種別変更申請を拒否しますか？', confirmLabel: '拒否する', danger: true }))) return;
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/leave-change-requests/${requestId}/reject`, {
        method: 'POST',
        body: {}
      });
      state.shiftBookSettings.requests = data.leave_change_requests || [];
      state.shiftBookSettings.approvedRequestIds = state.shiftBookSettings.approvedRequestIds.filter((id) => id !== requestId);
      applyShiftBookSettingsPayload(data);
      renderShiftBookSettingsModalBody(modal);
      renderWorkspace(canEditCurrentProject());
      showFlash('申請を拒否しました', 'success');
    }

    async function regenerateUrlsFromSettings(rejectPending, modal) {
      const project = currentProject();
      if (!project) return;
      const pendingCount = (state.shiftBookSettings.requests || []).filter((item) => item.status === 'pending').length;
      const actionText = rejectPending ? '未処理申請を破棄してURLを再発行します。' : '未処理申請を残してURLを再発行します。';
      if (!(await cloudConfirm({ title: '共有URLを再発行', message: `${actionText}\n旧URLは無効になります。よろしいですか？`, confirmLabel: '再発行する', danger: true }))) return;
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/tokens/regenerate`, {
        method: 'POST',
        body: {
          reject_pending_leave_change_requests: rejectPending
        }
      });
      applyRegeneratedUrls(data.urls);
      applyShiftBookSettingsPayload(data);
      state.shiftBookSettings.requests = data.leave_change_requests || state.shiftBookSettings.requests;
      renderShiftBookSettingsModalBody(modal);
      renderWorkspace(canEditCurrentProject());
      showFlash(rejectPending && pendingCount ? '未処理申請を破棄して共有URLを再発行しました' : '共有URLを再発行しました', 'success');
    }

    async function regenerateSingleUrlFromSettings(target, modal) {
      const project = currentProject();
      if (!project) return;
      const label = SHARE_URL_LABELS[target] || '共有URL';
      if (!(await cloudConfirm({ title: 'URLを再発行', message: `${label}を再発行しますか？既存の${label}は無効になります（他の共有URLはそのまま使えます）。`, confirmLabel: '再発行する', danger: true }))) return;
      const data = await requestJson(`/tools/shiftersync/cloudshift/api/project/${project.id}/tokens/regenerate`, {
        method: 'POST',
        body: { targets: [target] }
      });
      applyRegeneratedUrls(data.urls);
      applyShiftBookSettingsPayload(data);
      state.shiftBookSettings.requests = data.leave_change_requests || state.shiftBookSettings.requests;
      renderShiftBookSettingsModalBody(modal);
      renderWorkspace(canEditCurrentProject());
      showFlash(`${label}を再発行しました`, 'success');
