    function currentAssistMode() {
      const project = currentProject();
      return project && project.mode === 'person' ? 'person' : 'scene';
    }

    function defaultAssistDataForMode(mode) {
      if (mode === 'person') {
        return {
          experienced_sites: [],
          training_sites: []
        };
      }
      return {
        profiles: [],
        records: [],
        rules: [],
        experienced_people: []
      };
    }

    function assistContextKey() {
      const project = currentProject();
      if (!project) return '';
      return PAGE.type === 'owner'
        ? `owner:${project.id}`
        : `public:${PAGE.accessMode}:${PAGE.token}:${project.id}`;
    }

    function syncAssistContext() {
      const key = assistContextKey();
      if (state.assist.contextKey !== key) {
        resetAssistState();
        state.assist.contextKey = key;
      }
    }

    function isAssistAvailable() {
      const project = currentProject();
      return !!project && (project.mode === 'scene' || project.mode === 'person') && (PAGE.type === 'owner' || PAGE.accessMode === 'edit');
    }

    function assistBasePath() {
      const project = currentProject();
      if (!project || (project.mode !== 'scene' && project.mode !== 'person')) return '';
      if (PAGE.type === 'owner') {
        return `/tools/shiftersync/cloudshift/api/project/${project.id}/assist`;
      }
      return `/tools/shiftersync/cloudshift/api/public/edit/${PAGE.token}/assist`;
    }

    function currentAssistData() {
      return state.assist.data || defaultAssistDataForMode(currentAssistMode());
    }

    async function assistRequestOptions(body) {
      if (PAGE.type === 'public' && PAGE.accessMode === 'edit') {
        if (!(await ensureGuestName())) {
          throw new Error('編集者名を入力してください');
        }
        return Object.assign({}, body, { editor_name: state.guestName });
      }
      return body;
    }

    function applyAssistBootstrap(payload) {
      state.assist.data = payload && payload.assist ? payload.assist : defaultAssistDataForMode(currentAssistMode());
      state.assist.permissions = payload && payload.permissions ? payload.permissions : {
        can_edit_records: false,
        can_edit_rules: false,
        can_edit_profiles: false
      };
      state.assist.loaded = true;
    }

    async function ensureAssistLoaded(force) {
      syncAssistContext();
      if (!isAssistAvailable()) {
        resetAssistState();
        return currentAssistData();
      }
      if (state.assist.loaded && !force) {
        return currentAssistData();
      }
      const payload = await requestJson(assistBasePath());
      applyAssistBootstrap(payload);
      return currentAssistData();
    }

    function assistWeekdayLabels() {
      return ['月', '火', '水', '木', '金', '土', '日'];
    }

    function assistWeekdayLabel(index) {
      if (index == null || String(index).trim() === '') return ASSIST_WEEKDAYLESS_LABEL;
      return assistWeekdayLabels()[index] || '';
    }

    function assistRoleLabel(roleType) {
      if (roleType === 'dedicated') return '専従者';
      if (roleType === 'backup') return '代務者';
      return '通常';
    }

    function assistRoleBadgeClass(roleType) {
      if (roleType === 'dedicated') return 'is-dedicated';
      if (roleType === 'backup') return 'is-backup';
      return 'is-normal';
    }

    function assistWeekdayIndexFromDate(dateText) {
      if (!dateText) return null;
      const parts = String(dateText).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parts) return null;
      return (new Date(parseInt(parts[1], 10), parseInt(parts[2], 10) - 1, parseInt(parts[3], 10)).getDay() + 6) % 7;
    }

    function assistWeekdayLabelFromDate(dateText) {
      const parsed = String(dateText || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parsed) return '曜日: -';
      const weekday = (new Date(parseInt(parsed[1], 10), parseInt(parsed[2], 10) - 1, parseInt(parsed[3], 10)).getDay() + 6) % 7;
      return `曜日: ${assistWeekdayLabel(weekday)}`;
    }

    function assistShiftLabel(shiftKey) {
      return shiftKey ? optionLabelForKey(shiftKey) : ASSIST_OPTIONLESS_LABEL;
    }

    function assistRuleDisplayLabel(rule) {
      const weekdayLabel = rule && (rule.weekday == null || String(rule.weekday).trim() === '')
        ? ASSIST_WEEKDAYLESS_LABEL
        : `${assistWeekdayLabel(rule && rule.weekday)}曜`;
      return `${weekdayLabel} / ${assistShiftLabel(rule && rule.shift_key)}`;
    }

    function assistWeekdayValues(values) {
      if (!Array.isArray(values)) return [];
      return values
        .map((value) => parseInt(value, 10))
        .filter((value, index, list) => Number.isInteger(value) && value >= 0 && value <= 6 && list.indexOf(value) === index)
        .sort((left, right) => left - right);
    }

    function assistWeekdaySummary(values, emptyLabel) {
      const normalized = assistWeekdayValues(values);
      return normalized.length ? normalized.map((value) => assistWeekdayLabel(value)).join(' / ') : (emptyLabel || 'なし');
    }

    function buildAssistWeekdayPreferenceField(name, selectedValues, accentClass) {
      const selected = new Set(assistWeekdayValues(selectedValues).map((value) => String(value)));
      return `
        <div class="cloud-assist-weekday-picker">
          ${assistWeekdayLabels().map((label, index) => `
            <label class="cloud-assist-weekday-option ${accentClass || ''}">
              <input type="checkbox" name="${name}" value="${index}" ${selected.has(String(index)) ? 'checked' : ''}>
              <span>${escapeHtml(label)}</span>
            </label>
          `).join('')}
        </div>
      `;
    }

    function buildAssistShiftOptions(selectedValue, includeBlank, blankLabel) {
      const sections = bulkOptionSectionsForMode('scene');
      const groups = sections.map((section) => `
        <optgroup label="${escapeHtml(section.title)}">
          ${section.optionKeys.map((key) => `
            <option value="${escapeHtml(key)}" ${key === selectedValue ? 'selected' : ''}>${escapeHtml(optionLabelForKey(key))}</option>
          `).join('')}
        </optgroup>
      `).join('');
      return `${includeBlank ? `<option value="">${escapeHtml(blankLabel || ASSIST_OPTIONLESS_LABEL)}</option>` : ''}${groups}`;
    }

    function buildAssistRoleOptions(selectedValue, includeBlank) {
      const options = [
        { value: 'normal', label: '通常' },
        { value: 'dedicated', label: '専従者' },
        { value: 'backup', label: '代務者' }

      return `${includeBlank ? '<option value="">すべて</option>' : ''}${options.map((item) => `

    function buildAssistWeekdayOptions(selectedValue, includeBlank, blankLabel) {
      const options = assistWeekdayLabels().map((label, index) => `

        }))
        .filter((item) => item.employee_name);
      if (!normalized.length) {
        refs.panel.innerHTML = '<div style="color: var(--cloud-muted); font-size: 12px; padding: 4px 2px;">候補が見つかりません</div>';
        refs.panel.classList.remove('cloud-hidden');
        return;
      }
      refs.panel.innerHTML = normalized.slice(0, 8).map((candidate) => `
        <button
          type="button"
          class="cloud-assist-candidate"
          data-candidate-id="${escapeHtml(candidate.candidate_id)}"
          data-candidate-name="${escapeHtml(candidate.employee_name)}"
          data-employee-name="${escapeHtml(candidate.employee_name)}"
          data-employee-number="${escapeHtml(candidate.employee_number)}"
        >${escapeHtml([candidate.employee_name, candidate.employee_number].filter(Boolean).join(' / '))}</button>
      `).join('');
      refs.panel.classList.remove('cloud-hidden');
    }

    function scheduleAssistCandidateSearch(field) {
      const refs = assistCandidateFieldRefs(field);
      if (!refs.nameInput) return;
      const query = refs.nameInput.value.trim();
      if (refs.nameInput.dataset.selectedEmployeeName && refs.nameInput.dataset.selectedEmployeeName !== query) {
        clearAssistCandidateSelection(field);
      }
      if (!query) {
        if (refs.panel) {
          refs.panel.innerHTML = '';
          refs.panel.classList.add('cloud-hidden');
        }
        return;
      }
      window.clearTimeout(assistCandidateSearchTimer);
      assistCandidateSearchTimer = window.setTimeout(async () => {
        const latestQuery = refs.nameInput.value.trim();
        if (!latestQuery) return;
        try {
          const candidates = await fetchEmployeeCandidates(latestQuery);
          if (refs.nameInput.value.trim() !== latestQuery) return;
          renderAssistCandidateSuggestions(field, candidates);
        } catch (_) {
          if (refs.panel) {
            refs.panel.innerHTML = '';
            refs.panel.classList.add('cloud-hidden');
          }
        }
      }, 220);
    }

      const node = $('cloud-current-project') || $('cloud-public-identity');
      if (!node) return;

      if (PAGE.type === 'public') {
        if (PAGE.accessMode !== 'edit') {
          node.classList.add('cloud-hidden');
          return;
        }

        const editorName = PAGE.authenticatedEditorName || state.guestName;
        if (!editorName) {
          node.classList.add('cloud-hidden');
          return;
        }

        node.textContent = `編集中: ${editorName}`;
        node.classList.remove('cloud-hidden');

        const note = $('cloud-public-editor-note');
        if (note) {
          note.textContent = `${editorName} として編集中です`;
        }
        return;

      const project = currentProject();

    function normalizeAssistUiState() {
      const permissions = state.assist.permissions || {};
      const mode = currentAssistMode();
      const allowedTabs = mode === 'person' ? ['register', 'edit', 'details'] : ['register', 'edit', 'people', 'search', 'details'];
      if (isTemplateFeatureAvailable()) {
        allowedTabs.push('template');
      }
      if (!allowedTabs.includes(state.assist.activeTab)) {
        state.assist.activeTab = 'register';
      }
      if (mode === 'person') {
        if (!['experienced', 'training'].includes(state.assist.registerView)) {
          state.assist.registerView = 'experienced';
        }
        if (!['experienced', 'training'].includes(state.assist.editView)) {
          state.assist.editView = 'experienced';
        }
        return;
      }
      if (state.assist.registerView !== 'record' && state.assist.registerView !== 'rule') {
        state.assist.registerView = 'record';
      }
      if (!permissions.can_edit_rules) {
        state.assist.registerView = 'record';
      }
      const allowedEditViews = permissions.can_edit_profiles
        ? ['records', 'rules', 'profiles']
        : ['records', 'rules'];
      if (!allowedEditViews.includes(state.assist.editView)) {
        state.assist.editView = 'records';
      }
      const detailSections = state.assist.detailSections || {};
      state.assist.detailSections = {
        overview: detailSections.overview === true,
        formulas: detailSections.formulas === true
      };
    }

    function assistSearchStats() {
      const result = state.assist.searchResult;
      const items = result && Array.isArray(result.results) ? result.results : [];
      if (!items.length) {
        return {
          count: 0,
          average: null,
          max: null,
          min: null
        };
      }
      const scores = items.map((item) => Number(item.score || 0));
      const total = scores.reduce((sum, value) => sum + value, 0);
      return {
        count: scores.length,
        average: Math.round((total / scores.length) * 10) / 10,
        max: Math.max(...scores),
        min: Math.min(...scores)
      };
    }

    function buildAssistBreakdownByCategory(breakdown) {
      const profiles = (breakdown || []).filter((part) => part.category === 'profile');
      const aptitudes = (breakdown || []).filter((part) => part.category === 'aptitude');
      const rules = (breakdown || []).filter((part) => part.category === 'rule');
      const records = (breakdown || []).filter((part) => part.category === 'record');
      let html = '';
      if (profiles.length) {
        html += `<div class="cloud-assist-category-section">
          <div class="cloud-assist-category-label">候補者条件</div>
          ${profiles.map((part) => `
            <div class="cloud-assist-category-item">
              <div class="cloud-assist-category-item-head">
                <span class="cloud-note-chip">${escapeHtml(part.match_label || '-')}</span>
              </div>
              <p class="cloud-panel-note">${escapeHtml(part.context || '-')} → ${escapeHtml(String(part.points || 0))}点 (${escapeHtml(part.formula || '-')})</p>
            </div>
          `).join('')}
        </div>`;
      }
      if (aptitudes.length) {
        html += `<div class="cloud-assist-category-section">
          <div class="cloud-assist-category-label">オプション適性</div>
          ${aptitudes.map((part) => `
            <div class="cloud-assist-category-item">
              <div class="cloud-assist-category-item-head">
                <span class="cloud-note-chip">${escapeHtml(part.match_label || '-')}</span>
                ${part.record_count != null ? `<span class="cloud-note-chip">実績 ${escapeHtml(String(part.record_count))}件</span>` : ''}
              </div>
              <p class="cloud-panel-note">${escapeHtml(part.context || '-')} → ${escapeHtml(String(part.points || 0))}点 (${escapeHtml(part.formula || '-')})</p>
            </div>
          `).join('')}
        </div>`;
      }
      if (rules.length) {
        html += `<div class="cloud-assist-category-section">
          <div class="cloud-assist-category-label">適用ルール</div>
          ${rules.map((part) => `
            <div class="cloud-assist-category-item">
              <div class="cloud-assist-category-item-head">
                <span class="cloud-note-chip">${escapeHtml(part.match_label || '-')}</span>
                <span class="cloud-note-chip">${escapeHtml(part.role_label || '通常')}</span>
                ${part.priority ? `<span class="cloud-note-chip">優先 ${escapeHtml(String(part.priority))}</span>` : ''}
                ${Number(part.custom_points || 0) ? `<span class="cloud-note-chip">独自 ${escapeHtml(`${Number(part.custom_points || 0) > 0 ? '+' : ''}${part.custom_points}`)}</span>` : ''}
              </div>
              <p class="cloud-panel-note">${escapeHtml(part.context || '-')} → ${escapeHtml(String(part.points || 0))}点 (${escapeHtml(part.formula || '-')})</p>
            </div>
          `).join('')}
        </div>`;
      }
      if (records.length) {
        html += `<div class="cloud-assist-category-section">
          <div class="cloud-assist-category-label">該当実績</div>
          ${records.map((part) => `
            <div class="cloud-assist-category-item">
              <div class="cloud-assist-category-item-head">
                <span class="cloud-note-chip">${escapeHtml(part.match_label || '-')}</span>
                <span class="cloud-note-chip">${escapeHtml(part.role_label || '通常')}</span>
                ${part.days_ago != null ? `<span class="cloud-note-chip">${escapeHtml(String(part.days_ago))}日前</span>` : ''}
              </div>
              <p class="cloud-panel-note">${escapeHtml(part.context || '-')} → ${escapeHtml(String(part.points || 0))}点 (${escapeHtml(part.formula || '-')})</p>
            </div>
          `).join('')}
        </div>`;
      }
      return html;
    }

    function buildAssistSceneConflictNotice(item) {
      const conflicts = Array.isArray(item && item.scene_conflicts) ? item.scene_conflicts : [];
      const shiftLines = conflicts.map((conflict) => {
        const body = [
          String(conflict.project_title || '').trim(),
          String(conflict.shift_label || '').trim()
        ].filter(Boolean).join('・');
        if (!body) return '';
        // 現場シフト帳か個人シフト帳かが分かるようにしておく。
        const modeLabel = String(conflict.project_mode_label || '').trim();
        return modeLabel ? `${body}（${modeLabel}）` : body;
      }).filter(Boolean);
      const siteNames = Array.isArray(item && item.scene_conflict_site_names)
        ? item.scene_conflict_site_names.map((name) => String(name || '').trim()).filter(Boolean)
        : [];
      if (!siteNames.length) return '';
      return `
        <div class="cloud-assist-conflict-note">
          <strong>同日競合あり</strong>
          <p class="cloud-panel-note">勤務中: ${escapeHtml((shiftLines.length ? shiftLines : siteNames).join(' / '))}</p>
        </div>
      `;
    }

    function buildAssistSearchResults(result) {
      if (!result || !Array.isArray(result.results)) {
        return '<div class="cloud-empty-state"><p>検索条件を入力して候補を表示します。</p></div>';
      }
      if (!result.results.length) {
        return '<div class="cloud-empty-state"><p>一致する候補が見つかりませんでした。</p></div>';
      }
      return result.results.map((item, index) => `
        <article class="cloud-assist-result-card${item && item.has_scene_conflict ? ' is-conflict' : ''}">
          <div class="cloud-assist-result-head">
            <div>
              <h4>${escapeHtml(item.name || '-')}</h4>
              <p>${escapeHtml(item.employee_number || '社員番号なし')}</p>
            </div>
            <div class="cloud-actions compact">
              <div class="cloud-assist-score">${escapeHtml(String(item.score || 0))}点</div>
              ${buildAssistSearchResultAction(item, index)}
            </div>
          </div>
          <div class="cloud-assist-result-meta">
            <span class="cloud-note-chip">ルール一致 ${escapeHtml(String(item.matched_rule_count || 0))}</span>
            <span class="cloud-note-chip">実績一致 ${escapeHtml(String(item.matched_record_count || 0))}</span>
            ${item && item.has_scene_conflict ? `<span class="cloud-note-chip danger">同日競合 ${escapeHtml(String(item.scene_conflict_site_count || 0))}現場</span>` : ''}
          </div>
          ${buildAssistSceneConflictNotice(item)}
          ${buildAssistBreakdownByCategory(item.breakdown)}
        </article>
      `).join('');
    }

    function buildAssistDayTopCandidateCard(day, shiftKey, result, previewError) {
      const candidate = result && Array.isArray(result.results) ? result.results[0] : null;
      if (candidate) {
        const reasons = Array.isArray(candidate.reasons)
          ? candidate.reasons.map((reason) => String(reason || '').trim()).filter(Boolean).slice(0, 3)
          : [];
        return `
          <article class="cloud-assist-result-card${candidate && candidate.has_scene_conflict ? ' is-conflict' : ''}">
            <div class="cloud-assist-result-head">
              <div>
                <h4>${escapeHtml(candidate.name || '-')}</h4>
                <p>${escapeHtml(candidate.employee_number || '社員番号なし')}</p>
              </div>
              <div class="cloud-actions compact">
                <div class="cloud-assist-score">${escapeHtml(String(candidate.score || 0))}点</div>
                <button
                  type="button"
                  class="cloud-btn secondary"
                  data-day-assist-top-add="${escapeHtml(String(day))}"
                  data-day-assist-top-shift="${escapeHtml(String(shiftKey || ''))}"
                  data-day-assist-top-name="${escapeHtml(candidate.name || '')}"
                  data-day-assist-top-employee="${escapeHtml(candidate.employee_number || '')}"
                  ${candidate && candidate.has_scene_conflict ? 'disabled' : ''}
                >${candidate && candidate.has_scene_conflict ? '同日勤務あり' : 'この候補を入れる'}</button>
              </div>
            </div>
            <div class="cloud-assist-result-meta">
              <span class="cloud-note-chip">ルール一致 ${escapeHtml(String(candidate.matched_rule_count || 0))}</span>
              <span class="cloud-note-chip">実績一致 ${escapeHtml(String(candidate.matched_record_count || 0))}</span>
              ${candidate && candidate.has_scene_conflict ? `<span class="cloud-note-chip danger">同日競合 ${escapeHtml(String(candidate.scene_conflict_site_count || 0))}現場</span>` : ''}
            </div>
            ${buildAssistSceneConflictNotice(candidate)}
            ${reasons.length ? `
              <div class="cloud-assist-category-section">
                <div class="cloud-assist-category-label">主な理由</div>
                ${reasons.map((reason) => `<p class="cloud-panel-note">${escapeHtml(reason)}</p>`).join('')}
              </div>
            ` : ''}
          </article>
        `;
      }
      if (previewError) {
        return `<div class="cloud-empty-state"><p>${escapeHtml(previewError)}</p></div>`;
      }
      return '<div class="cloud-empty-state"><p>この条件では候補者が見つかりませんでした。</p></div>';
    }

      const expanded = detailSections[sectionKey] === true;
      return `
        <section class="cloud-assist-section cloud-assist-detail-accordion${expanded ? ' is-expanded' : ' is-collapsed'}">
          <button
            type="button"
            class="cloud-assist-detail-toggle"
            data-assist-detail-toggle="${escapeHtml(sectionKey)}"
            aria-expanded="${expanded ? 'true' : 'false'}"
          >
            <div class="cloud-assist-detail-toggle-copy">
              <strong>${escapeHtml(title)}</strong>
              <p class="cloud-panel-note">${escapeHtml(description)}</p>
            </div>
            <div class="cloud-assist-detail-toggle-meta">
              ${chipText ? `<span class="cloud-note-chip">${escapeHtml(chipText)}</span>` : ''}
              <span class="cloud-assist-detail-toggle-icon">${expanded ? '閉じる' : '展開'}</span>

    function buildAssistDetailResultBreakdown(result) {
      const parts = Array.isArray(result.breakdown) ? result.breakdown : [];
      if (!parts.length) {
        return '<div class="cloud-empty-state"><p>内訳はありません。</p></div>';
      }
      const profiles = parts.filter((part) => part.category === 'profile');
      const aptitudes = parts.filter((part) => part.category === 'aptitude');
      const rules = parts.filter((part) => part.category === 'rule');
      const records = parts.filter((part) => part.category === 'record');
      let html = '';
      if (profiles.length) {
        html += `<div class="cloud-assist-detail-category-heading">候補者条件</div>`;
        html += profiles.map((part) => `
          <article class="cloud-assist-detail-breakdown-item">
            <div class="cloud-assist-result-head">
              <div>
                <strong>${escapeHtml(part.label || '-')}</strong>
                <p class="cloud-panel-note">${escapeHtml(part.context || '-')}</p>
              </div>
              <div class="cloud-assist-score">${escapeHtml(String(part.points || 0))}点</div>
            </div>
            <div class="cloud-assist-result-meta">
              ${part.match_label ? `<span class="cloud-note-chip">${escapeHtml(part.match_label)}</span>` : ''}
            </div>
            <p class="cloud-panel-note">式: ${escapeHtml(part.formula || '-')}</p>
          </article>
        `).join('');
      }
      if (aptitudes.length) {
        html += `<div class="cloud-assist-detail-category-heading">オプション適性</div>`;
        html += aptitudes.map((part) => `
          <article class="cloud-assist-detail-breakdown-item">
            <div class="cloud-assist-result-head">
              <div>
                <strong>${escapeHtml(part.label || '-')}</strong>
                <p class="cloud-panel-note">${escapeHtml(part.context || '-')}</p>
              </div>
              <div class="cloud-assist-score">${escapeHtml(String(part.points || 0))}点</div>
            </div>
            <div class="cloud-assist-result-meta">
              ${part.match_label ? `<span class="cloud-note-chip">${escapeHtml(part.match_label)}</span>` : ''}
              ${part.record_count != null ? `<span class="cloud-note-chip">実績 ${escapeHtml(String(part.record_count))}件</span>` : ''}
            </div>
            <p class="cloud-panel-note">式: ${escapeHtml(part.formula || '-')}</p>
          </article>
        `).join('');

      const ordered = sites.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

        const shiftLabel = site.shift_label || (site.shift_key ? assistShiftLabel(site.shift_key) : ASSIST_OPTIONLESS_LABEL);

          ? `<span class="cloud-assist-auto-badge">${escapeHtml(site.source_label)}</span>`

    function assistExperienceSiteKey(site) {
      return String(site && (site.site_row_id || site.site_id || site.site_name) || '').trim().toLowerCase();
    }

    function assistPersonSiteGroups() {
      const data = currentAssistData();
      const experienced = Array.isArray(data.experienced_sites) ? data.experienced_sites : [];
      const substitute = experienced.filter((site) => String(site.shift_key || '').toUpperCase() === 'SUB');
      const substituteKeys = new Set(substitute.map((site) => assistExperienceSiteKey(site)).filter(Boolean));
      const trained = experienced.filter((site) => (
        String(site.shift_key || '').toUpperCase() === 'TRAIN'
        && !substituteKeys.has(assistExperienceSiteKey(site))
      ));
      return {
        substitute,
        trained,
        trainingRequired: Array.isArray(data.training_sites) ? data.training_sites : []
      };
    }

    function openAssistSiteDetailPopup(siteType) {
      const data = currentAssistData();

            <ul class="cloud-assist-reasons">
              <li>希望曜日が一致したら加点します</li>
              <li>NG曜日が一致した候補は検索結果から除外します</li>

          <article class="cloud-assist-detail-card">
            <strong>しきい値型の適性学習</strong>
            <p class="cloud-panel-note">学習元: ${escapeHtml(reference.option_aptitude && reference.option_aptitude.source ? reference.option_aptitude.source : 'assist_records')}</p>
            <ul class="cloud-assist-reasons">
              ${((reference.option_aptitude && reference.option_aptitude.tiers) || []).map((tier) => `

        <div class="cloud-assist-stack cloud-assist-details-stack">

            overviewBody,
            '基準一覧'
          )}
          ${buildAssistDetailAccordion(
            'formulas',
            '計算式一覧',
            '現在の内部式をそのまま一覧化しています。',
            formulasBody,
            '内部式'
          )}
          <div class="cloud-assist-section cloud-assist-section-results">
            <div class="cloud-assist-subhead">
              <div>
                <strong>最新検索の内訳</strong>
                <p class="cloud-panel-note">${result && result.query ? escapeHtml(`${result.query.target_date} / ${result.query.weekday_label} / ${result.query.shift_label}`) : 'サーチを実行すると候補ごとの加点内訳を表示します。'}</p>
              </div>
              <span class="cloud-note-chip">候補 ${escapeHtml(String(stats.count || 0))}件</span>
            </div>
            <div class="cloud-assist-detail-breakdown-list">
              ${items.length ? items.map((item, index) => `
                <article class="cloud-assist-detail-result">
                  <div class="cloud-assist-result-head">
                    <div>
                      <h4>${escapeHtml(item.name || '-')}</h4>

                    <div class="cloud-actions compact">
                      <div class="cloud-assist-score">${escapeHtml(String(item.score || 0))}点</div>
                      ${buildAssistSearchResultAction(item, index)}
                    </div>
                  </div>
                  <div class="cloud-assist-result-meta">
                    <span class="cloud-note-chip">ルール一致 ${escapeHtml(String(item.matched_rule_count || 0))}</span>
                    <span class="cloud-note-chip">実績一致 ${escapeHtml(String(item.matched_record_count || 0))}</span>
                  </div>
                  ${buildAssistDetailResultBreakdown(item)}

    function renderAssistModalContent(modal) {
      const body = modalBody(modal);
      const footer = modalFooter(modal);
      const mode = currentAssistMode();
      normalizeAssistUiState();
      modal.classList.add('cloud-modal-overlay-workspace');
      const panel = modal.querySelector('.cloud-modal-panel');
      if (panel) panel.classList.add('cloud-modal-panel-workspace');
      const templatePanel = isTemplateFeatureAvailable()
        ? `
          <div class="cloud-assist-panel${state.assist.activeTab === 'template' ? ' is-active' : ''}" data-assist-panel="template">
            ${buildAssistTemplatePanel()}
          </div>
        `
        : '';
      const panels = mode === 'person'
        ? `
          <div class="cloud-assist-panel${state.assist.activeTab === 'register' ? ' is-active' : ''}" data-assist-panel="register">
            ${buildAssistRegisterPanel()}
          </div>
          <div class="cloud-assist-panel${state.assist.activeTab === 'edit' ? ' is-active' : ''}" data-assist-panel="edit">
            ${buildAssistEditPanels()}
          </div>
          <div class="cloud-assist-panel${state.assist.activeTab === 'details' ? ' is-active' : ''}" data-assist-panel="details">
            ${buildAssistPersonDetailsPanel()}
          </div>
          ${templatePanel}
        `
        : `
          <div class="cloud-assist-panel${state.assist.activeTab === 'register' ? ' is-active' : ''}" data-assist-panel="register">
            ${buildAssistRegisterPanel()}
          </div>
          <div class="cloud-assist-panel${state.assist.activeTab === 'edit' ? ' is-active' : ''}" data-assist-panel="edit">
            ${buildAssistEditPanels()}
          </div>
          <div class="cloud-assist-panel${state.assist.activeTab === 'people' ? ' is-active' : ''}" data-assist-panel="people">
            ${buildAssistScenePeoplePanel()}
          </div>
          <div class="cloud-assist-panel${state.assist.activeTab === 'search' ? ' is-active' : ''}" data-assist-panel="search">
            ${buildAssistSearchPanel()}
          </div>
          <div class="cloud-assist-panel${state.assist.activeTab === 'details' ? ' is-active' : ''}" data-assist-panel="details">
            ${buildAssistDetailsPanel()}
          </div>
          ${templatePanel}
        `;
      body.innerHTML = `
        <div class="cloud-assist-shell">
          ${buildAssistTabs()}
          ${panels}
        </div>
      `;
      footer.innerHTML = '';
      bindAssistModalEvents(modal);
      if (state.assist.activeTab === 'edit') {
        renderAssistEditLists(modal);
      }
      if (state.assist.activeTab === 'template') {
        ensureTemplatesLoaded(modal);
      }
    }

    function currentAssistModal() {
      return document.getElementById('cloud-assist-modal');
    }

    // ===== テンプレート（アシスト → テンプレート） =====
    function templateApiBase() {
      const project = currentProject();
      return project ? `/tools/shiftersync/cloudshift/api/project/${project.id}/templates` : '';
    }

    function templateBasisLabel(basis) {
      if (basis === 'weekday') return '曜日基準';
      if (basis === 'week') return '週基準';
      return '日付基準';
    }

    async function ensureTemplatesLoaded(modal, force) {
      if (!isTemplateFeatureAvailable()) return;
      if (state.assist.templatesLoaded && !force) return;
      try {
        const data = await requestJson(templateApiBase());
        state.assist.templates = Array.isArray(data.templates) ? data.templates : [];
        state.assist.templatesLoaded = true;
      } catch (error) {
        state.assist.templates = [];
        state.assist.templatesLoaded = true;
        showFlash(error.message || 'テンプレートの読み込みに失敗しました', 'error');
      }
      const targetModal = modal || currentAssistModal();
      if (targetModal && state.assist.activeTab === 'template') {
        renderAssistModalContent(targetModal);
      }
    }

    function defaultTemplateApplyTarget() {
      const key = currentMonthKey() || (currentProject() && currentProject().latest_month_key) || '';
      const matched = String(key).match(/^(\d{4})-(\d{2})$/);
      if (matched) {
        return { year: parseInt(matched[1], 10), month: parseInt(matched[2], 10) };
      }
      const now = new Date();
      return { year: now.getFullYear(), month: now.getMonth() + 1 };
    }

    function buildTemplateApplyForm(template) {
      const apply = state.assist.templateApply || {};
      const basis = apply.basis || template.basis || 'date';
      const options = template.options || {};
      const applyMode = apply.apply_mode || options.apply_mode || 'overwrite';
      const holidayMode = apply.holiday_mode || options.holiday_mode || 'as_template';
      const targetFilter = apply.target_filter || options.target_filter || 'all';
      const weekDate = apply.week_date || `${apply.year}-${String(apply.month).padStart(2, '0')}-01`;
      const isWeek = basis === 'week';
      return `
        <form class="cloud-template-apply" data-template-apply-form="${escapeHtml(template.id)}">
          <div class="cloud-form-grid">
            <label class="cloud-field" data-template-apply-ym-field style="${isWeek ? 'display:none;' : ''}"><span>反映する年</span><input class="cloud-input" type="number" min="2000" max="2100" value="${apply.year}" data-template-apply-year></label>
            <label class="cloud-field" data-template-apply-ym-field style="${isWeek ? 'display:none;' : ''}"><span>反映する月</span><input class="cloud-input" type="number" min="1" max="12" value="${apply.month}" data-template-apply-month></label>
            <label class="cloud-field" data-template-apply-week-field style="${isWeek ? '' : 'display:none;'}"><span>反映先の日付（この日を含む週）</span><input class="cloud-input" type="date" value="${escapeHtml(weekDate)}" data-template-apply-week-date></label>
            <label class="cloud-field"><span>基準</span>
              <select class="cloud-input" data-template-apply-basis>
                <option value="date"${basis === 'date' ? ' selected' : ''}>日付基準</option>
                <option value="weekday"${basis === 'weekday' ? ' selected' : ''}>曜日基準</option>
                <option value="week"${basis === 'week' ? ' selected' : ''}>週基準</option>
              </select>
            </label>
            <label class="cloud-field"><span>上書き方法</span>
              <select class="cloud-input" data-template-apply-mode>
                <option value="overwrite"${applyMode === 'overwrite' ? ' selected' : ''}>上書き</option>
                <option value="append"${applyMode === 'append' ? ' selected' : ''}>追加</option>
                <option value="fill_empty"${applyMode === 'fill_empty' ? ' selected' : ''}>空き日のみ</option>
              </select>
            </label>
            <label class="cloud-field"><span>対象日</span>
              <select class="cloud-input" data-template-apply-target>
                <option value="all"${targetFilter === 'all' ? ' selected' : ''}>すべての日</option>
                <option value="weekday"${targetFilter === 'weekday' ? ' selected' : ''}>平日のみ</option>
                <option value="weekend"${targetFilter === 'weekend' ? ' selected' : ''}>土日・祝</option>
                <option value="holiday"${targetFilter === 'holiday' ? ' selected' : ''}>祝日のみ</option>
                <option value="non_holiday"${targetFilter === 'non_holiday' ? ' selected' : ''}>祝日以外</option>
              </select>
            </label>
            <label class="cloud-field cloud-template-holiday-field" data-template-holiday-field style="${basis === 'weekday' || basis === 'week' ? '' : 'display:none;'}"><span>祝日の扱い</span>
              <select class="cloud-input" data-template-apply-holiday>
                <option value="as_template"${holidayMode === 'as_template' ? ' selected' : ''}>テンプレートの祝日枠</option>
                <option value="as_weekday"${holidayMode === 'as_weekday' ? ' selected' : ''}>その曜日として</option>
                <option value="as_sunday"${holidayMode === 'as_sunday' ? ' selected' : ''}>日曜パターン</option>
                <option value="skip"${holidayMode === 'skip' ? ' selected' : ''}>触らない</option>
                <option value="clear"${holidayMode === 'clear' ? ' selected' : ''}>空にする</option>
              </select>
            </label>
          </div>
          <div class="cloud-actions compact">
            <button type="submit" class="cloud-btn primary">この内容で反映</button>
            <button type="button" class="cloud-btn ghost" data-template-apply-cancel>キャンセル</button>
          </div>
          <p class="cloud-panel-note">「上書き」は対象日の手入力予定を置き換えます（他帳から同期された予定は保持されます）。週基準は指定日を含む「月曜始まりの1週間」だけに反映されます（対象月の外にはみ出す日は反映されません）。反映前に未保存の編集は保存してください。</p>
        </form>
      `;
    }

    function buildAssistTemplatePanel() {
      const templates = Array.isArray(state.assist.templates) ? state.assist.templates : [];
      const loaded = state.assist.templatesLoaded;
      const applyId = state.assist.templateApply ? state.assist.templateApply.templateId : '';
      const listHtml = !loaded
        ? '<div class="cloud-empty-state"><p>テンプレートを読み込み中です…</p></div>'
        : (templates.length === 0
          ? '<div class="cloud-empty-state"><p>まだテンプレートがありません。「新規テンプレート作成」から、その月の予定をカレンダーで作って保存してください。</p></div>'
          : templates.map((template) => `
            <article class="cloud-template-item">
              <div class="cloud-template-item-head">
                <div>
                  <h4 class="cloud-section-title">${escapeHtml(template.name)}</h4>
                  <div class="cloud-meta cloud-template-meta">
                    <span class="cloud-badge">${templateBasisLabel(template.basis)}</span>
                    <span class="cloud-badge">${Number(template.filled_day_count || 0)}${template.slot_format === 'weekday' ? '枠' : '日'} / ${Number(template.entry_count || 0)}件</span>
                    ${template.slot_format !== 'weekday' && template.representative_month_key ? `<span class="cloud-badge">代表 ${escapeHtml(template.representative_month_key)}</span>` : ''}
                  </div>
                </div>
                <div class="cloud-inline-actions">
                  <button type="button" class="cloud-btn secondary" data-template-edit="${escapeHtml(template.id)}">編集</button>
                  <button type="button" class="cloud-btn primary" data-template-apply-open="${escapeHtml(template.id)}">反映</button>
                  <button type="button" class="cloud-btn danger" data-template-delete="${escapeHtml(template.id)}">削除</button>
                </div>
              </div>
              ${applyId === template.id ? buildTemplateApplyForm(template) : ''}
            </article>
          `).join(''));
      return `
        <div class="cloud-template-panel">
          <div class="cloud-panel-head">
            <div>
              <h3>テンプレート</h3>
              <p>その${currentAssistMode() === 'scene' ? '現場' : '人'}のパターンをテンプレートにして、「日付基準」（1か月分を同じ日付へ）「曜日基準」（曜日パターンを月全体へ）「週基準」（7日分を指定した週へ）で反映できます。作成は別ウィンドウのカレンダーで行います。</p>
            </div>
            <div class="cloud-inline-actions">
              <button type="button" class="cloud-btn primary" data-template-new>新規テンプレート作成</button>
              <button type="button" class="cloud-btn ghost" data-template-refresh>再読み込み</button>
            </div>
          </div>
          <div class="cloud-template-list">${listHtml}</div>
        </div>
      `;
    }

    function openTemplateEditor(templateId) {
      const project = currentProject();
      if (!project) return;
      let url = `/tools/shiftersync/cloudshift/project/${project.id}/template-editor`;
      if (templateId) {
        url += `?template_id=${encodeURIComponent(templateId)}`;
      }
      const win = window.open(url, `cloudshift-template-editor-${project.id}`, 'width=1100,height=900');
      if (win) {
        try { win.focus(); } catch (error) { /* noop */ }
      } else {
        showFlash('ポップアップがブロックされました。ブラウザの設定で許可してください。', 'error');
      }
    }

    function openTemplateApplyForm(templateId) {
      const template = (state.assist.templates || []).find((item) => item.id === templateId);
      if (!template) return;
      const target = defaultTemplateApplyTarget();
      const options = template.options || {};
      state.assist.templateApply = {
        templateId,
        year: target.year,
        month: target.month,
        week_date: `${target.year}-${String(target.month).padStart(2, '0')}-01`,
        basis: template.basis || 'date',
        apply_mode: options.apply_mode || 'overwrite',
        holiday_mode: options.holiday_mode || 'as_template',
        target_filter: options.target_filter || 'all'
      };
      const modal = currentAssistModal();
      if (modal) {
        renderAssistModalContent(modal);
      }
    }

    async function submitTemplateApply(formEl, templateId) {
      const project = currentProject();
      if (!project || !formEl) return;
      if (!confirmDiscardUnsavedChanges('未保存の変更があります。テンプレートの反映は保存済みデータに対して行われ、未保存の変更は失われます。続行しますか？')) {
        return;
      }
      const basis = formEl.querySelector('[data-template-apply-basis]').value;
      let year;
      let month;
      let targetDay = null;
      if (basis === 'week') {
        // 週基準は日付指定：その日を含む「月曜始まりの1週間」へ反映する。
        const weekDateValue = String(formEl.querySelector('[data-template-apply-week-date]').value || '');
        const matched = weekDateValue.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!matched) {
          showFlash('反映先の日付を選択してください', 'error');
          return;
        }
        year = parseInt(matched[1], 10);
        month = parseInt(matched[2], 10);
        targetDay = parseInt(matched[3], 10);
      } else {
        year = parseInt(formEl.querySelector('[data-template-apply-year]').value, 10);
        month = parseInt(formEl.querySelector('[data-template-apply-month]').value, 10);
      }
      if (!year || year < 2000 || year > 2100 || !month || month < 1 || month > 12) {
        showFlash('反映する年月を正しく入力してください', 'error');
        return;
      }
      const body = {
        year,
        month,
        basis,
        apply_mode: formEl.querySelector('[data-template-apply-mode]').value,
        holiday_mode: formEl.querySelector('[data-template-apply-holiday]').value,
        target_filter: formEl.querySelector('[data-template-apply-target]').value
      };
      if (targetDay !== null) {
        body.target_day = targetDay;
      }
      const result = await requestJson(`${templateApiBase()}/${templateId}/apply`, { method: 'POST', body });
      state.assist.templateApply = null;
      closeCloudModal('cloud-assist-modal');
      const monthKey = `${year}-${String(month).padStart(2, '0')}`;
      await selectProject(project.id, monthKey, { skipUnsavedGuard: true });
      showFlash(`テンプレートを反映しました（${Number(result.applied_days || 0)}日分）`, 'success');
    }

    async function deleteTemplate(templateId) {
      const template = (state.assist.templates || []).find((item) => item.id === templateId);
      const name = template ? template.name : '';
      if (!(await cloudConfirm({ title: 'テンプレートを削除', message: `テンプレート「${name}」を削除しますか？この操作は元に戻せません。`, confirmLabel: '削除する', danger: true }))) {
        return;
      }
      await requestJson(`${templateApiBase()}/${templateId}`, { method: 'DELETE' });
      if (state.assist.templateApply && state.assist.templateApply.templateId === templateId) {
        state.assist.templateApply = null;
      }
      showFlash('テンプレートを削除しました', 'success');
      await ensureTemplatesLoaded(currentAssistModal(), true);
    }

    function bindAssistTemplateEvents(modal) {
      const newButton = modal.querySelector('[data-template-new]');
      if (newButton) {
        newButton.addEventListener('click', () => openTemplateEditor(''));
      }
      const refreshButton = modal.querySelector('[data-template-refresh]');
      if (refreshButton) {
        refreshButton.addEventListener('click', () => ensureTemplatesLoaded(modal, true).catch((error) => showFlash(error.message, 'error')));
      }
      modal.querySelectorAll('[data-template-edit]').forEach((button) => {
        button.addEventListener('click', () => openTemplateEditor(button.getAttribute('data-template-edit')));
      });
      modal.querySelectorAll('[data-template-apply-open]').forEach((button) => {
        button.addEventListener('click', () => openTemplateApplyForm(button.getAttribute('data-template-apply-open')));
      });
      modal.querySelectorAll('[data-template-delete]').forEach((button) => {
        button.addEventListener('click', () => deleteTemplate(button.getAttribute('data-template-delete')).catch((error) => showFlash(error.message, 'error')));
      });
      modal.querySelectorAll('[data-template-apply-cancel]').forEach((button) => {
        button.addEventListener('click', () => {
          state.assist.templateApply = null;
          renderAssistModalContent(modal);
        });
      });
      modal.querySelectorAll('[data-template-apply-basis]').forEach((select) => {
        select.addEventListener('change', () => {
          const form = select.closest('[data-template-apply-form]');
          if (!form) return;
          const isWeek = select.value === 'week';
          const holidayField = form.querySelector('[data-template-holiday-field]');
          if (holidayField) {
            holidayField.style.display = select.value === 'weekday' || isWeek ? '' : 'none';
          }
          form.querySelectorAll('[data-template-apply-ym-field]').forEach((field) => {
            field.style.display = isWeek ? 'none' : '';
          });
          const weekField = form.querySelector('[data-template-apply-week-field]');
          if (weekField) {
            weekField.style.display = isWeek ? '' : 'none';
          }
        });
      });
      modal.querySelectorAll('[data-template-apply-form]').forEach((form) => {
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          submitTemplateApply(form, form.getAttribute('data-template-apply-form')).catch((error) => showFlash(error.message, 'error'));
        });
      });
    }

    function filteredAssistRecords() {
      const filters = state.assist.editFilters || {};
      return (currentAssistData().records || []).filter((record) => {
        if (filters.date_from && String(record.date || '') < filters.date_from) return false;
        if (filters.date_to && String(record.date || '') > filters.date_to) return false;
        if (filters.shift_key && String(record.shift_key || '') !== filters.shift_key) return false;
        if (filters.role_type && String(record.role_type || '') !== filters.role_type) return false;
        if (filters.candidate_query) {
          const query = filters.candidate_query.toLowerCase();
          const haystack = [
            record.candidate_name,
            record.employee_number,
            record.notes
          ].join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });
    }

    function filteredAssistSites(siteType) {
      const filters = state.assist.editFilters || {};
      const data = currentAssistData();
      const sites = siteType === 'training' ? (data.training_sites || []) : (data.experienced_sites || []);
      return sites.filter((site) => {
        if (filters.date_from && String(site.date || '') < filters.date_from) return false;
        if (filters.date_to && String(site.date || '') > filters.date_to) return false;
        if (filters.shift_key && String(site.shift_key || '') !== filters.shift_key) return false;
        if (filters.candidate_query) {
          const query = filters.candidate_query.toLowerCase();
          const haystack = [
            site.site_id,
            site.site_name,
            site.notes
          ].join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });
    }

    function filteredAssistRules() {
      const filters = state.assist.editFilters || {};
      return (currentAssistData().rules || []).filter((rule) => {
        if (filters.shift_key && String(rule.shift_key || '') !== filters.shift_key) return false;
        if (filters.candidate_query) {
          const query = filters.candidate_query.toLowerCase();
          const haystack = [
            rule.notes,
            ...(rule.assignments || []).map((item) => `${item.candidate_name} ${item.employee_number}`)
          ].join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        if (filters.role_type) {
          const matched = (rule.assignments || []).some((item) => String(item.role_type || '') === filters.role_type);
          if (!matched) return false;
        }
        return true;
      });
    }

    function filteredAssistProfiles() {
      const filters = state.assist.editFilters || {};
      return (currentAssistData().profiles || []).filter((profile) => {
        if (filters.candidate_query) {
          const query = filters.candidate_query.toLowerCase();
          const haystack = [
            profile.name,
            profile.employee_number,
            ...(profile.preferred_weekday_labels || []),
            ...(profile.blocked_weekday_labels || [])
          ].join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });
    }

    function renderAssistEditLists(modal) {
      const list = modal.querySelector('[data-assist-edit-list]');
      if (!list) return;
      if (currentAssistMode() === 'person') {
        const siteType = state.assist.editView === 'training' ? 'training' : 'experienced';
        const sites = filteredAssistSites(siteType);
        list.innerHTML = sites.length ? sites.map((site) => `
          <article class="cloud-assist-card">
            <div class="cloud-assist-card-head">
              <div>
                <h4>${escapeHtml(site.site_name || '-')}</h4>
                <p>${escapeHtml(`${site.date || '-'} / ${assistShiftLabel(site.shift_key)} / ${assistSiteTypeLabel(site.site_type || siteType)}`)}</p>
              </div>
              <div class="cloud-actions compact">
                <button type="button" class="cloud-btn secondary" data-assist-edit-site="${escapeHtml(site.id)}">編集</button>
                <button type="button" class="cloud-btn ghost" data-assist-delete-site="${escapeHtml(site.id)}">削除</button>
              </div>
            </div>
            <div class="cloud-assist-card-meta">
              <span>${escapeHtml(site.site_id || '契約番号未設定')}</span>
              <span>${escapeHtml(site.shift_key ? assistShiftLabel(site.shift_key) : ASSIST_OPTIONLESS_LABEL)}</span>
              <span>${escapeHtml(assistSiteTypeLabel(site.site_type || siteType))}</span>

        const canEditProfiles = !!(state.assist.permissions && state.assist.permissions.can_edit_profiles);
        list.innerHTML = profiles.length ? profiles.map((profile) => `
          <article class="cloud-assist-card">
            <div class="cloud-assist-card-head">
              <div>
                <h4>${escapeHtml(profile.name || '-')}</h4>
                <p>${escapeHtml(profile.employee_number || '社員番号なし')}</p>
              </div>
              <div class="cloud-actions compact${canEditProfiles ? '' : ' cloud-hidden'}">
                <button type="button" class="cloud-btn secondary" data-assist-edit-profile="${escapeHtml(profile.id)}">編集</button>
              </div>
            </div>
            <div class="cloud-assist-card-meta">
              <span>${profile.active === false ? '検索対象外' : '有効'}</span>
              <span>${escapeHtml(`希望 ${assistWeekdaySummary(profile.preferred_weekdays || [], 'なし')}`)}</span>
              <span>${escapeHtml(`NG ${assistWeekdaySummary(profile.blocked_weekdays || [], 'なし')}`)}</span>
            </div>
            <div class="cloud-assist-summary-row">
              ${(profile.preferred_weekday_labels || []).map((label) => `
                <span class="cloud-assist-summary-chip is-preferred">希望 ${escapeHtml(label)}</span>
              `).join('')}
              ${(profile.blocked_weekday_labels || []).map((label) => `
                <span class="cloud-assist-summary-chip is-blocked">NG ${escapeHtml(label)}</span>
              `).join('')}
              ${!(profile.preferred_weekday_labels || []).length && !(profile.blocked_weekday_labels || []).length ? '<span class="cloud-note-chip">曜日条件なし</span>' : ''}
            </div>
          </article>
        `).join('') : '<div class="cloud-empty-state"><p>一致する候補者プロファイルはありません。</p></div>';
        bindAssistEditListEvents(modal);
        return;
      }
      if (state.assist.editView === 'rules') {
        const rules = filteredAssistRules();
        const canEditRules = !!(state.assist.permissions && state.assist.permissions.can_edit_rules);
        list.innerHTML = rules.length ? rules.map((rule) => `
          <article class="cloud-assist-card">
              <div class="cloud-assist-card-head">
              <div>
                <h4>${escapeHtml(assistRuleDisplayLabel(rule))}</h4>
                <p>${rule.enabled ? '有効' : '無効'}</p>
              </div>
              <div class="cloud-actions compact${canEditRules ? '' : ' cloud-hidden'}">
                <button type="button" class="cloud-btn secondary" data-assist-edit-rule="${escapeHtml(rule.id)}">編集</button>
                <button type="button" class="cloud-btn ghost" data-assist-delete-rule="${escapeHtml(rule.id)}">削除</button>
              </div>
            </div>
            <div class="cloud-assist-summary-row">
              ${buildAssistRuleSummary(rule)}
            </div>
            <p class="cloud-panel-note">${escapeHtml(rule.notes || 'メモなし')}</p>
          </article>
        `).join('') : '<div class="cloud-empty-state"><p>一致するルールはありません。</p></div>';
        bindAssistEditListEvents(modal);
        return;
      }
      const records = filteredAssistRecords();
      list.innerHTML = records.length ? records.map((record) => `
        <article class="cloud-assist-card${record.source_label ? ' is-auto-record' : ''}">
          <div class="cloud-assist-card-head">
            <div>
              <h4>${escapeHtml(record.candidate_name || '-')}</h4>
              <p>${escapeHtml(`${record.date} (${record.weekday_label}) / ${record.shift_label} / ${record.role_label}`)}</p>
              ${record.source_label ? `<span class="cloud-assist-auto-badge">${escapeHtml(record.source_label)}</span>` : ''}
            </div>
            <div class="cloud-actions compact">
              <button type="button" class="cloud-btn secondary" data-assist-edit-record="${escapeHtml(record.id)}">編集</button>
              <button type="button" class="cloud-btn ghost" data-assist-delete-record="${escapeHtml(record.id)}">削除</button>
            </div>
          </div>
          <div class="cloud-assist-card-meta">
            <span>${escapeHtml(record.employee_number || '社員番号なし')}</span>
            <span>${escapeHtml(record.updated_by || '')}</span>
          </div>
          <p class="cloud-panel-note">${escapeHtml(record.notes || 'メモなし')}</p>
        </article>
      `).join('') : '<div class="cloud-empty-state"><p>一致する実績はありません。</p></div>';
      bindAssistEditListEvents(modal);
    }

    function collectAssistCandidatePayload(form, prefix) {
      return {
        candidate_id: (form.querySelector(`input[name="${prefix}_candidate_id"]`) || {}).value || '',
        candidate_name: (form.querySelector(`input[name="${prefix}_candidate_name"]`) || {}).value || '',
        employee_number: (form.querySelector(`input[name="${prefix}_employee_number"]`) || {}).value || ''
      };
    }

    function collectAssistRecordPayload(form) {
      return Object.assign(collectAssistCandidatePayload(form, form.getAttribute('data-form-id')), {
        date: form.querySelector('[name="date"]').value,
        shift_key: form.querySelector('[name="shift_key"]').value,
        role_type: form.querySelector('[name="role_type"]').value,
        notes: form.querySelector('[name="notes"]').value
      });
    }

    function collectAssistSitePayload(form) {
      const siteTypeField = form.querySelector('[name="site_type"]');
      return {
        site_type: siteTypeField ? siteTypeField.value : (state.assist.registerView || 'experienced'),
        date: form.querySelector('[name="date"]').value,
        site_row_id: (form.querySelector('[name="site_row_id"]') || {}).value || '',
        site_id: (form.querySelector('[name="site_id"]') || {}).value || '',
        site_name: form.querySelector('[name="site_name"]').value,
        shift_key: form.querySelector('[name="shift_key"]').value,
        notes: form.querySelector('[name="notes"]').value
      };
    }

    function collectAssistRulePayload(form) {
      const assignments = Array.from(form.querySelectorAll('[data-assist-assignment-row]')).map((row) => {
        const field = row.querySelector('[data-assist-candidate-field]');
        const refs = assistCandidateFieldRefs(field);
        return {
          candidate_id: refs.idInput ? refs.idInput.value : '',
          candidate_name: refs.nameInput ? refs.nameInput.value : '',
          employee_number: refs.employeeInput ? refs.employeeInput.value : '',
          role_type: (row.querySelector('[name="role_type"]') || {}).value || 'dedicated',
          priority: (row.querySelector('[name="priority"]') || {}).value || '1',
          custom_points: (row.querySelector('[name="custom_points"]') || {}).value || '0'
        };
      }).filter((item) => item.candidate_name);
      return {
        weekday: form.querySelector('[name="weekday"]').value,
        shift_key: form.querySelector('[name="shift_key"]').value,
        enabled: form.querySelector('[name="enabled"]').value === 'true',
        notes: form.querySelector('[name="notes"]').value,
        assignments
      };
    }

    function collectAssistProfilePayload(form) {
      const collectWeekdays = (name) => Array.from(form.querySelectorAll(`input[name="${name}"]:checked`))
        .map((input) => parseInt(input.value, 10))
        .filter((value) => Number.isInteger(value));
      return {
        active: (form.querySelector('[name="active"]') || {}).value === 'true',
        preferred_weekdays: collectWeekdays('preferred_weekdays'),
        blocked_weekdays: collectWeekdays('blocked_weekdays')
      };
    }

    function assistDateTextForDay(day) {
      const month = currentMonth();
      const parsedDay = parseInt(day || '0', 10);
      if (!month || !parsedDay) return defaultAssistTargetDate();
      return `${month.year}-${String(month.month).padStart(2, '0')}-${String(parsedDay).padStart(2, '0')}`;
    }

    function assistSelectedShiftKeyForDay(day) {
      if (!window.ShifterSync || !ShifterSync.getSelectedOptionsForDay) return '';
      const options = ShifterSync.getSelectedOptionsForDay(String(day));
      return Array.isArray(options) && options.length ? String(options[0] || '') : '';
    }

    function parseCalendarAssistEntry(entry) {
      const value = String(entry && entry.value ? entry.value : '').trim();
      const match = value.match(/^!([^!]+)!(.+)$/);
      return {
        shift_key: match ? String(match[1] || '').trim() : '',
        candidate_name: (match ? String(match[2] || '') : value).trim(),
        employee_number: String(entry && entry.employee_number ? entry.employee_number : '').trim(),
        notes: String(entry && entry.comment ? entry.comment : '').trim()
      };
    }

    function currentDayEntries(day) {
      const entriesPerDay = currentEntriesSnapshot();
      return Array.isArray(entriesPerDay[String(day)]) ? entriesPerDay[String(day)] : [];
    }

    function assistTargetDayFromContext() {
      const context = state.assist.dayContext || {};
      const directDay = parseInt(String(context.day || ''), 10);
      if (Number.isInteger(directDay) && directDay > 0) {
        return directDay;
      }
      const month = currentMonth();
      const match = String(context.date || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!month || !match) return null;
      if (parseInt(match[1], 10) !== parseInt(month.year, 10) || parseInt(match[2], 10) !== parseInt(month.month, 10)) {
        return null;
      }
      const parsedDay = parseInt(match[3], 10);
      return Number.isInteger(parsedDay) && parsedDay > 0 ? parsedDay : null;
    }

    function assistTargetShiftKeyFromContext() {
      const context = state.assist.dayContext || {};
      if (context.shift_key) return String(context.shift_key);
      const result = state.assist.searchResult || {};
      if (result.query && result.query.shift_key) return String(result.query.shift_key);
      const form = state.assist.searchForm || {};
      return String(form.shift_key || '');
    }

    function appendAssistEntryToDay(day, entry) {
      const dayKey = String(day || '');
      if (!dayKey || !entry || !entry.value) return false;
      const nextEntries = deepClone(currentEntriesSnapshot() || {});
      const dayEntries = Array.isArray(nextEntries[dayKey]) ? nextEntries[dayKey].slice() : [];
      dayEntries.push({
        id: entry.id || `assist-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
        value: String(entry.value || ''),
        comment: String(entry.comment || '').trim(),
        employee_number: String(entry.employee_number || '').trim()
      });
      nextEntries[dayKey] = dayEntries;
      replaceCalendarEntries(nextEntries);
      return true;
    }

    function suggestedTrainingSitesForDay(day) {
      const selectedShiftKey = assistSelectedShiftKeyForDay(day);
      return (currentAssistData().training_sites || []).slice().sort((left, right) => {
        const leftMatch = selectedShiftKey && String(left.shift_key || '') === selectedShiftKey ? 0 : 1;
        const rightMatch = selectedShiftKey && String(right.shift_key || '') === selectedShiftKey ? 0 : 1;
        if (leftMatch !== rightMatch) return leftMatch - rightMatch;
        const leftDate = String(left.date || '');
        const rightDate = String(right.date || '');
        if (leftDate !== rightDate) return rightDate.localeCompare(leftDate);
        return String(left.site_name || '').localeCompare(String(right.site_name || ''), 'ja');
      });
    }

    function assistCandidateEntryValue(site) {
      const siteName = String(site && site.site_name ? site.site_name : '').trim();
      const shiftKey = String(site && site.shift_key ? site.shift_key : '').trim();
      return shiftKey ? `!${shiftKey}!${siteName}` : siteName;
    }

    function appendAssistSiteCandidateToDay(day, site) {
      const dayKey = String(day || '');
      const siteName = String(site && site.site_name ? site.site_name : '').trim();
      if (!dayKey || !siteName) return false;
      return appendAssistEntryToDay(dayKey, {
        value: assistCandidateEntryValue(site),
        comment: String(site && site.notes ? site.notes : '').trim(),
        employee_number: ''
      });
    }

    function canAppendAssistSearchResultToDay() {
      return currentAssistMode() === 'scene' && assistTargetDayFromContext() != null;
    }

    function appendAssistSearchResultToDay(candidate) {
      const day = assistTargetDayFromContext();
      const name = String(candidate && candidate.name ? candidate.name : '').trim();
      if (!day || !name) return false;
      const shiftKey = assistTargetShiftKeyFromContext();
      return appendAssistEntryToDay(day, {
        value: shiftKey ? `!${shiftKey}!${name}` : name,
        comment: '',
        employee_number: String(candidate && candidate.employee_number ? candidate.employee_number : '').trim()
      });
    }

    function appendAssistSearchResultToSpecificDay(day, shiftKey, candidate) {
      const dayKey = String(day || '').trim();
      const name = String(candidate && candidate.name ? candidate.name : '').trim();
      if (!dayKey || !name) return false;
      return appendAssistEntryToDay(dayKey, {
        value: shiftKey ? `!${shiftKey}!${name}` : name,
        comment: '',
        employee_number: String(candidate && candidate.employee_number ? candidate.employee_number : '').trim()
      });
    }

    function assistTargetEntryIdFromContext() {
      const context = state.assist.dayContext || {};
      return String(context.entry_id || '').trim();
    }

    // エントリ詳細から開いたアシストでは「追加」ではなく、その行の差し替えになる。
    function assistReplaceTargetEntry() {
      const day = assistTargetDayFromContext();
      const entryId = assistTargetEntryIdFromContext();
      if (!day || !entryId) return null;
      return currentEntryByDayAndId(String(day), entryId);
    }

    function assistReplaceTargetLabel(entry) {
      const parsed = parseCalendarAssistEntry(entry);
      return parsed.candidate_name || String((state.assist.dayContext || {}).entry_name || '');
    }

    function replaceAssistTargetEntryWithCandidate(candidate) {
      const day = assistTargetDayFromContext();
      const entryId = assistTargetEntryIdFromContext();
      const name = String(candidate && candidate.name ? candidate.name : '').trim();
      if (!day || !entryId || !name) return false;
      const dayKey = String(day);
      const nextEntries = deepClone(currentEntriesSnapshot() || {});
      const dayEntries = Array.isArray(nextEntries[dayKey]) ? nextEntries[dayKey] : null;
      if (!dayEntries) return false;
      const index = dayEntries.findIndex((entry) => String(entry && entry.id ? entry.id : '') === entryId);
      if (index < 0) return false;
      const target = dayEntries[index];
      // オプション・コメント・第二オプション・枝番号・並び順はそのまま。
      // 差し替えるのは表示名と社員番号だけにする。
      const shiftKey = String(parseCalendarAssistEntry(target).shift_key || '');
      dayEntries[index] = Object.assign({}, target, {
        value: shiftKey ? `!${shiftKey}!${name}` : name,
        employee_name: name,
        employee_number: String(candidate && candidate.employee_number ? candidate.employee_number : '').trim()
      });
      replaceCalendarEntries(nextEntries);
      return true;
    }

    function buildAssistSearchResultAction(item, index) {
      if (!canAppendAssistSearchResultToDay()) return '';
      const day = assistTargetDayFromContext();
      if (item && item.has_scene_conflict) {
        return '<button type="button" class="cloud-btn secondary" disabled>同日勤務あり</button>';
      }
      const replaceTarget = assistReplaceTargetEntry();
      const label = replaceTarget
        ? `${assistReplaceTargetLabel(replaceTarget) || `${day}日のエントリ`}と入れ替える`
        : `${day}日のシフトに追加`;
      return `
        <button
          type="button"
          class="cloud-btn secondary"
          data-assist-add-search-result-index="${escapeHtml(String(index))}"
        >${escapeHtml(label)}</button>
      `;
    }

    function normalizeAssistSearchPayload(payload) {
      return {
        target_date: payload && payload.target_date ? payload.target_date : defaultAssistTargetDate(),
        shift_key: payload && payload.shift_key ? payload.shift_key : ''
      };
    }

    async function fetchAssistSearchPreview(payload) {
      const normalized = normalizeAssistSearchPayload(payload);
      return requestJson(`${assistBasePath()}/search`, {
        method: 'POST',
        body: normalized
      });
    }

    async function executeAssistSearch(payload) {
      const normalized = normalizeAssistSearchPayload(payload);
      state.assist.searchForm = Object.assign({}, normalized);
      state.assist.searchResult = await fetchAssistSearchPreview(normalized);
      return state.assist.searchResult;
    }

    function assistDaySearchPayload(day, shiftKey) {
      return {
        target_date: assistDateTextForDay(day),
        shift_key: shiftKey || ''
      };
    }

    function buildAssistDaySearchAction(day, shiftKey, label) {
      return `
        <button
          type="button"
          class="cloud-btn primary"
          data-day-assist-search="${escapeHtml(String(day))}"
          data-day-assist-shift="${escapeHtml(shiftKey || '')}"
        >${escapeHtml(label)}</button>
      `;
    }

    function buildAssistDayActionModal(day, previewResult, previewError) {
      const normalized = {
        target_date: '',
        shift_key: ''
      };
      normalized.target_date = assistDateTextForDay(day);
      normalized.shift_key = assistSelectedShiftKeyForDay(day);

      const shiftKey = normalized.shift_key;
      const entries = currentDayEntries(day).map((entry) => parseCalendarAssistEntry(entry)).filter((entry) => entry.candidate_name);
      if (currentAssistMode() === 'person') {
        const actionLabel = (siteType) => `${assistSiteTypeLabel(siteType)}へ登録`;
        const trainingCandidates = !entries.length ? suggestedTrainingSitesForDay(day) : [];
        return `
          <div class="cloud-assist-stack">
            ${!entries.length ? `
              <div class="cloud-assist-section">
                <div class="cloud-assist-subhead">
                  <div>
                    <strong>研修要現場の候補</strong>
                    <p class="cloud-panel-note">${escapeHtml(`${dateText} / ${assistShiftLabel(shiftKey)}`)} の候補として、登録済みの研修要現場を表示します。</p>
                  </div>
                </div>

                          <strong>${escapeHtml(site.site_name || '-')}</strong>

                        </div>
                        <div class="cloud-actions compact">
                          <button
                            type="button"
                            class="cloud-btn primary"

                        </div>
                      </div>
                      <p class="cloud-panel-note">${escapeHtml(site.notes || 'コメントなし')}</p>
                    </article>
                  `).join('') : `
                    <div class="cloud-empty-state">
                      <p>研修要現場の候補はまだ登録されていません。</p>
                    </div>
                  `}
                </div>
              </div>
            ` : ''}
            <div class="cloud-assist-section">
              <div class="cloud-assist-subhead">
                <div>
                  <strong>現場メモを登録</strong>
                  <p class="cloud-panel-note">${escapeHtml(`${dateText} / ${assistShiftLabel(shiftKey)}`)} の内容を person assist の登録フォームへ引き継ぎます。</p>
                </div>
              </div>
              <div class="cloud-assist-detail-breakdown-list">
                ${entries.length ? entries.map((entry, index) => `
                  <article class="cloud-assist-detail-breakdown-item">
                    <div class="cloud-assist-result-head">
                      <div>
                        <strong>${escapeHtml(entry.candidate_name)}</strong>
                        <p class="cloud-panel-note">${escapeHtml(`${assistShiftLabel(entry.shift_key)} / ${entry.employee_number || '社員番号なし'}`)}</p>
                      </div>
                      <div class="cloud-actions compact">
                        <button
                          type="button"
                          class="cloud-btn secondary"
                          data-day-assist-site="${escapeHtml(String(day))}"
                          data-day-assist-index="${escapeHtml(String(index))}"
                          data-day-assist-site-type="experienced"
                        >${escapeHtml(actionLabel('experienced'))}</button>
                        <button
                          type="button"
                          class="cloud-btn secondary"
                          data-day-assist-site="${escapeHtml(String(day))}"
                          data-day-assist-index="${escapeHtml(String(index))}"
                          data-day-assist-site-type="training"
                        >${escapeHtml(actionLabel('training'))}</button>
                      </div>
                    </div>
                    <p class="cloud-panel-note">${escapeHtml(entry.notes || 'コメントなし')}</p>
                  </article>
                `).join('') : `
                  <div class="cloud-empty-state">
                    <p>この日に登録済みエントリはありません。空の登録フォームを開けます。</p>
                    <div class="cloud-actions compact">
                      <button type="button" class="cloud-btn secondary" data-day-assist-site="${escapeHtml(String(day))}" data-day-assist-index="" data-day-assist-site-type="experienced">${escapeHtml(actionLabel('experienced'))}</button>
                      <button type="button" class="cloud-btn secondary" data-day-assist-site="${escapeHtml(String(day))}" data-day-assist-index="" data-day-assist-site-type="training">${escapeHtml(actionLabel('training'))}</button>
                    </div>
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }
      return `

    function applyAssistSiteSelectionToForm(form, site) {
      const refs = assistSiteFieldRefs(form);
      if (!refs.rowIdInput || !refs.siteNameInput) {
        return;
      }
      const normalized = {
        site_row_id: String(site && (site.id != null ? site.id : site.site_row_id) || '').trim(),
        site_id: String(site && site.site_id || '').trim(),
        site_name: String(site && site.site_name || '').trim(),
        site: site || null
      };
      refs.rowIdInput.value = normalized.site_row_id;
      if (refs.siteIdInput) refs.siteIdInput.value = normalized.site_id;
      refs.siteNameInput.value = normalized.site_name;
      if (refs.note) refs.note.textContent = assistSiteNoteText(normalized);
    }

    async function openAssistSitePickerForForm(form) {
      if (!form) return;
      const refs = assistSiteFieldRefs(form);
      const initialQuery = refs.siteNameInput && refs.siteNameInput.value ? refs.siteNameInput.value.trim() : '';
      const modal = openCloudModal('cloud-assist-site-picker-modal', '現場を選択');
      const body = modalBody(modal);
      const footer = modalFooter(modal);
      if (!body || !footer) return;

      body.innerHTML = `
        <div class="cloud-form">
          <label class="cloud-field">
            <span>現場検索</span>
            <input id="cloud-assist-site-picker-query" class="cloud-input" type="text" placeholder="契約番号または現場名" value="${escapeHtml(initialQuery)}">
          </label>
          <div id="cloud-assist-site-picker-list" class="cloud-project-list"></div>
        </div>
      `;
      footer.innerHTML = '<button type="button" class="cloud-btn secondary" data-cloud-assist-site-picker-close>閉じる</button>';
      footer.querySelector('[data-cloud-assist-site-picker-close]').addEventListener('click', () => closeCloudModal('cloud-assist-site-picker-modal'));

      const queryInput = body.querySelector('#cloud-assist-site-picker-query');
      const list = body.querySelector('#cloud-assist-site-picker-list');
      const renderList = async () => {
        if (!list) return;
        list.innerHTML = '<div class="cloud-empty-state"><p>検索中です...</p></div>';
        const sites = await fetchSiteCandidates(queryInput ? queryInput.value : '');
        list.innerHTML = sites.length ? sites.map((site) => `
          <article class="cloud-project-item">
            <div class="cloud-project-title">${escapeHtml(site.site_name || '-')}</div>
            <div class="cloud-project-meta">
              <span>${escapeHtml(site.site_id || '-')}</span>
              <span>${escapeHtml(`有効枝番号 ${site.active_branch_count || 0}件`)}</span>
            </div>
            <div class="cloud-actions compact">
              <button type="button" class="cloud-btn primary" data-assist-site-picker-select="${escapeHtml(String(site.id))}">この現場を使う</button>
            </div>
          </article>
        `).join('') : '<div class="cloud-empty-state"><p>一致する現場がありません。</p></div>';
        list.querySelectorAll('[data-assist-site-picker-select]').forEach((button) => {
          button.addEventListener('click', () => {
            const picked = sites.find((item) => String(item.id) === String(button.getAttribute('data-assist-site-picker-select') || ''));
            if (!picked) return;
            applyAssistSiteSelectionToForm(form, picked);
            closeCloudModal('cloud-assist-site-picker-modal');
          });
        });
      };

      if (queryInput) {
        queryInput.addEventListener('input', () => {
          window.clearTimeout(openAssistSitePickerForForm._timer);
          openAssistSitePickerForForm._timer = window.setTimeout(() => {
            renderList().catch((error) => showFlash(error.message, 'error'));
          }, 180);
        });
        queryInput.focus();
      }
      await renderList();
    }

    async function withAssistPending(trigger, task) {
      const button = trigger || null;
      if (button) {
        if (button.dataset.assistPending === '1') return;
        button.dataset.assistPending = '1';
        button.disabled = true;
      }
      try {
        return await task();
      } finally {
        if (button) {
          button.disabled = false;
          delete button.dataset.assistPending;
        }
      }
    }
