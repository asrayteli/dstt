{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-2">🎨 抜き出しツール</h1>
  <p class="text-sm text-gray-600 mb-6">PDF/画像から指定色を抽出・除外・置換。複数色指定、スポイト、リアルタイムプレビューに対応。</p>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-white rounded-2xl shadow p-6">
      <h2 class="font-semibold text-lg mb-4">設定</h2>

      <form id="colorExtractForm" method="POST" action="/tools/color_extract/process" enctype="multipart/form-data" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">ファイル（PDF/PNG/JPG/WEBP）</label>
          <input id="fileInput" name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp" class="w-full border rounded px-3 py-2" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">モード</label>
          <select id="mode" name="mode" class="w-full border rounded px-3 py-2">
            <option value="exclude">指定色のみ除外</option>
            <option value="extract">指定色のみ抜き出し</option>
            <option value="replace">指定色を別色へ変更</option>
          </select>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-sm font-medium">対象色（複数指定）</label>
            <div class="flex gap-2">
              <button id="addColorBtn" type="button" class="text-xs bg-gray-100 border px-2 py-1 rounded hover:bg-gray-200">+ 色を追加</button>
              <button id="eyedropperBtn" type="button" class="text-xs bg-indigo-100 border px-2 py-1 rounded hover:bg-indigo-200">🧪 スポイト</button>
            </div>
          </div>
          <div id="colorList" class="space-y-2"></div>
          <input type="hidden" id="targetColorsInput" name="target_colors">
          <p class="text-xs text-gray-500 mt-1">※ スポイトは対応ブラウザで利用できます。未対応時はプレビュー画像クリックで色取得。</p>
        </div>

        <div id="replacementWrap" class="hidden">
          <label class="block text-sm font-medium mb-1">置換先色</label>
          <div class="flex items-center gap-2">
            <input id="replacementColor" name="replacement_color" type="color" value="#0000ff" class="h-10 w-14 border rounded">
            <input id="replacementHex" type="text" value="#0000ff" class="flex-1 border rounded px-3 py-2 uppercase">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">許容誤差（Tolerance）: <span id="tolValue">20</span></label>
          <input id="tolerance" name="tolerance" type="range" min="0" max="120" value="20" class="w-full">
        </div>

        <div class="flex items-center gap-2">
          <input id="transparentOutput" name="transparent_output" type="checkbox" checked>
          <label for="transparentOutput" class="text-sm">透明化を有効にする（extract / exclude）</label>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">画像出力形式（PDF入力時はPDF固定）</label>
          <select id="outputFormat" name="output_format" class="w-full border rounded px-3 py-2">
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
          </select>
        </div>

        <input type="hidden" id="processRegionInput" name="process_region">

        <div class="pt-2">
          <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">処理してダウンロード</button>
        </div>
      </form>
    </div>

    <div class="bg-white rounded-2xl shadow p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-lg">リアルタイムプレビュー</h2>
        <span id="previewStatus" class="text-xs text-gray-500">待機中</span>
      </div>
      <div class="flex items-center gap-2 mb-3 flex-wrap">
        <button id="zoomOutBtn" type="button" class="text-xs bg-gray-100 border px-2 py-1 rounded hover:bg-gray-200">−</button>
        <span id="zoomLabel" class="text-xs text-gray-600 w-16 text-center">100%</span>
        <button id="zoomInBtn" type="button" class="text-xs bg-gray-100 border px-2 py-1 rounded hover:bg-gray-200">＋</button>
        <button id="resetViewBtn" type="button" class="text-xs bg-gray-100 border px-2 py-1 rounded hover:bg-gray-200">表示をリセット</button>
        <button id="toolHandBtn" type="button" class="text-xs bg-gray-100 border px-2 py-1 rounded hover:bg-gray-200">✋ 手のひら</button>
        <button id="toolPickerBtn" type="button" class="text-xs bg-indigo-100 border px-2 py-1 rounded hover:bg-indigo-200">🎯 色指定</button>
        <button id="toggleRegionBtn" type="button" class="text-xs bg-amber-100 border px-2 py-1 rounded hover:bg-amber-200">範囲指定: OFF</button>
        <button id="clearRegionBtn" type="button" class="text-xs bg-gray-100 border px-2 py-1 rounded hover:bg-gray-200">範囲クリア</button>
      </div>
      <div id="previewViewport" class="border rounded-lg min-h-[360px] h-[70vh] bg-gray-50 overflow-hidden relative">
        <div id="previewCanvasWrap" class="absolute inset-0 flex items-center justify-center select-none">
          <img id="previewImage" alt="preview" class="hidden cursor-crosshair pointer-events-auto" draggable="false">
          <div id="selectionBox" class="hidden absolute border-2 border-amber-500 pointer-events-none"></div>
          <p id="previewPlaceholder" class="text-sm text-gray-500">ファイルを選択するとプレビューが表示されます</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-3">ツールを「手のひら」「色指定」で切替できます。範囲指定ONでドラッグすると処理範囲を制限できます。</p>
    </div>
  </div>
</div>

<script>
(() => {
  const form = document.getElementById('colorExtractForm');
  const fileInput = document.getElementById('fileInput');
  const mode = document.getElementById('mode');
  const tolerance = document.getElementById('tolerance');
  const tolValue = document.getElementById('tolValue');
  const outputFormat = document.getElementById('outputFormat');
  const transparentOutput = document.getElementById('transparentOutput');
  const replacementWrap = document.getElementById('replacementWrap');
  const replacementColor = document.getElementById('replacementColor');
  const replacementHex = document.getElementById('replacementHex');
  const targetColorsInput = document.getElementById('targetColorsInput');
  const processRegionInput = document.getElementById('processRegionInput');
  const colorList = document.getElementById('colorList');
  const addColorBtn = document.getElementById('addColorBtn');
  const eyedropperBtn = document.getElementById('eyedropperBtn');
  const previewImage = document.getElementById('previewImage');
  const previewPlaceholder = document.getElementById('previewPlaceholder');
  const previewStatus = document.getElementById('previewStatus');
  const previewViewport = document.getElementById('previewViewport');
  const selectionBox = document.getElementById('selectionBox');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const resetViewBtn = document.getElementById('resetViewBtn');
  const toolHandBtn = document.getElementById('toolHandBtn');
  const toolPickerBtn = document.getElementById('toolPickerBtn');
  const toggleRegionBtn = document.getElementById('toggleRegionBtn');
  const clearRegionBtn = document.getElementById('clearRegionBtn');
  const zoomLabel = document.getElementById('zoomLabel');

  let currentPreviewUrl = null;
  let debounceTimer = null;
  let colors = ['#ff0000'];
  let zoomLevel = 1;
  let panX = 0;
  let panY = 0;
  let isPanning = false;
  let panStartX = 0;
  let panStartY = 0;

  let regionMode = false;
  let selectingRegion = false;
  let suppressClick = false;
  let selectionStart = null;
  let selectedRegion = null; // normalized {x,y,w,h}
  let activeTool = 'picker'; // picker | hand

  function normalizeHex(value) {
    const v = (value || '').trim();
    const withHash = v.startsWith('#') ? v : `#${v}`;
    return /^#[0-9a-fA-F]{6}$/.test(withHash) ? withHash.toLowerCase() : null;
  }

  function renderColorList() {
    colorList.innerHTML = '';
    colors.forEach((color, idx) => {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2';
      row.innerHTML = `
        <input type="color" class="h-10 w-14 border rounded" value="${color}" data-type="picker" data-idx="${idx}">
        <input type="text" class="flex-1 border rounded px-3 py-2 uppercase" value="${color}" data-type="hex" data-idx="${idx}">
        <button type="button" class="text-xs bg-red-100 border px-2 py-1 rounded hover:bg-red-200" data-type="remove" data-idx="${idx}">削除</button>
      `;
      colorList.appendChild(row);
    });
    targetColorsInput.value = JSON.stringify(colors);
  }

  function syncReplacement() {
    replacementHex.value = replacementColor.value.toUpperCase();
  }

  function updateModeUI() {
    const isReplace = mode.value === 'replace';
    replacementWrap.classList.toggle('hidden', !isReplace);
    schedulePreview();
  }

  function schedulePreview() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(triggerPreview, 350);
  }

  function applyPreviewTransform() {
    previewImage.style.transformOrigin = 'center center';
    previewImage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
    if (regionMode || activeTool === 'picker') {
      previewImage.style.cursor = 'crosshair';
    } else {
      previewImage.style.cursor = zoomLevel > 1 ? (isPanning ? 'grabbing' : 'grab') : 'grab';
    }
    zoomLabel.textContent = `${Math.round(zoomLevel * 100)}%`;
  }

  function resetPreviewView() {
    zoomLevel = 1;
    panX = 0;
    panY = 0;
    applyPreviewTransform();
  }

  function changeZoom(step) {
    const next = Math.min(4, Math.max(0.25, zoomLevel + step));
    zoomLevel = Number(next.toFixed(2));
    if (zoomLevel <= 1) {
      panX = 0;
      panY = 0;
    }
    applyPreviewTransform();
  }

  function setRegionMode(enabled) {
    regionMode = enabled;
    toggleRegionBtn.textContent = `範囲指定: ${enabled ? 'ON' : 'OFF'}`;
    toggleRegionBtn.classList.toggle('bg-amber-300', enabled);
    applyPreviewTransform();
  }

  function setActiveTool(tool) {
    activeTool = tool;
    toolHandBtn.classList.toggle('bg-sky-300', tool === 'hand');
    toolPickerBtn.classList.toggle('bg-indigo-300', tool === 'picker');
    toolHandBtn.classList.toggle('font-semibold', tool === 'hand');
    toolPickerBtn.classList.toggle('font-semibold', tool === 'picker');
    applyPreviewTransform();
  }

  function clearRegion() {
    selectedRegion = null;
    processRegionInput.value = '';
    selectionBox.classList.add('hidden');
    schedulePreview();
  }

  function clamp01(v) {
    return Math.min(1, Math.max(0, v));
  }

  function getNormalizedPosFromEvent(e) {
    const rect = previewImage.getBoundingClientRect();
    const nx = clamp01((e.clientX - rect.left) / rect.width);
    const ny = clamp01((e.clientY - rect.top) / rect.height);
    return { x: nx, y: ny, rect };
  }

  function renderSelectionBox() {
    if (!selectedRegion || !previewImage.src) {
      selectionBox.classList.add('hidden');
      return;
    }

    const rect = previewImage.getBoundingClientRect();
    selectionBox.classList.remove('hidden');
    selectionBox.style.left = `${rect.left - previewViewport.getBoundingClientRect().left + rect.width * selectedRegion.x}px`;
    selectionBox.style.top = `${rect.top - previewViewport.getBoundingClientRect().top + rect.height * selectedRegion.y}px`;
    selectionBox.style.width = `${rect.width * selectedRegion.w}px`;
    selectionBox.style.height = `${rect.height * selectedRegion.h}px`;
  }

  async function triggerPreview() {
    if (!fileInput.files.length || colors.length === 0) return;

    const fd = new FormData();
    fd.append('file', fileInput.files[0]);
    fd.append('mode', mode.value);
    fd.append('target_colors', JSON.stringify(colors));
    fd.append('tolerance', tolerance.value);
    fd.append('transparent_output', transparentOutput.checked ? 'true' : 'false');
    fd.append('replacement_color', replacementColor.value);
    if (selectedRegion) {
      fd.append('process_region', JSON.stringify(selectedRegion));
    }

    previewStatus.textContent = 'プレビュー更新中...';

    try {
      const response = await fetch('/tools/color_extract/preview', { method: 'POST', body: fd });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({ error: 'プレビュー生成に失敗しました' }));
        throw new Error(payload.error || 'プレビュー生成に失敗しました');
      }

      const blob = await response.blob();
      if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
      currentPreviewUrl = URL.createObjectURL(blob);
      previewImage.src = currentPreviewUrl;
      previewImage.classList.remove('hidden');
      previewPlaceholder.classList.add('hidden');
      resetPreviewView();
      requestAnimationFrame(renderSelectionBox);
      previewStatus.textContent = 'プレビュー更新完了';
    } catch (err) {
      previewStatus.textContent = `エラー: ${err.message}`;
    }
  }

  function addColor(hex) {
    const n = normalizeHex(hex);
    if (!n) return;
    if (!colors.includes(n)) {
      colors.push(n);
      renderColorList();
      schedulePreview();
    }
  }

  colorList.addEventListener('input', (e) => {
    const idx = Number(e.target.dataset.idx);
    if (Number.isNaN(idx)) return;
    if (e.target.dataset.type === 'picker') {
      colors[idx] = e.target.value.toLowerCase();
      renderColorList();
      schedulePreview();
    }
    if (e.target.dataset.type === 'hex') {
      const normalized = normalizeHex(e.target.value);
      if (normalized) {
        colors[idx] = normalized;
        targetColorsInput.value = JSON.stringify(colors);
        schedulePreview();
      }
    }
  });

  colorList.addEventListener('click', (e) => {
    if (e.target.dataset.type === 'remove') {
      const idx = Number(e.target.dataset.idx);
      if (colors.length === 1) return;
      colors.splice(idx, 1);
      renderColorList();
      schedulePreview();
    }
  });

  addColorBtn.addEventListener('click', () => addColor('#000000'));

  eyedropperBtn.addEventListener('click', async () => {
    if ('EyeDropper' in window) {
      try {
        const eyeDropper = new EyeDropper();
        const result = await eyeDropper.open();
        addColor(result.sRGBHex);
      } catch (_) {
        // cancel
      }
      return;
    }
    previewStatus.textContent = 'このブラウザはEyeDropper API非対応です。プレビュー画像クリックで色取得できます。';
  });

  replacementColor.addEventListener('input', () => {
    syncReplacement();
    schedulePreview();
  });

  replacementHex.addEventListener('input', () => {
    const normalized = normalizeHex(replacementHex.value);
    if (normalized) {
      replacementColor.value = normalized;
      schedulePreview();
    }
  });

  previewImage.addEventListener('click', (e) => {
    if (!previewImage.src || isPanning || selectingRegion || suppressClick) return;
    if (regionMode || activeTool !== 'picker') return;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const rect = previewImage.getBoundingClientRect();
    const scaleX = previewImage.naturalWidth / rect.width;
    const scaleY = previewImage.naturalHeight / rect.height;

    canvas.width = previewImage.naturalWidth;
    canvas.height = previewImage.naturalHeight;
    ctx.drawImage(previewImage, 0, 0);

    const x = Math.max(0, Math.floor((e.clientX - rect.left) * scaleX));
    const y = Math.max(0, Math.floor((e.clientY - rect.top) * scaleY));
    const pixel = ctx.getImageData(x, y, 1, 1).data;
    const hex = `#${pixel[0].toString(16).padStart(2, '0')}${pixel[1].toString(16).padStart(2, '0')}${pixel[2].toString(16).padStart(2, '0')}`;
    addColor(hex);
  });

  previewViewport.addEventListener('wheel', (e) => {
    if (!previewImage.src) return;
    e.preventDefault();
    changeZoom(e.deltaY > 0 ? -0.1 : 0.1);
    requestAnimationFrame(renderSelectionBox);
  }, { passive: false });

  previewImage.addEventListener('mousedown', (e) => {
    if (!previewImage.src) return;

    if (regionMode) {
      selectingRegion = true;
      suppressClick = false;
      const pos = getNormalizedPosFromEvent(e);
      selectionStart = { x: pos.x, y: pos.y };
      selectedRegion = { x: pos.x, y: pos.y, w: 0.0001, h: 0.0001 };
      processRegionInput.value = JSON.stringify(selectedRegion);
      renderSelectionBox();
      e.preventDefault();
      return;
    }

    if (activeTool !== 'hand') return;
    if (zoomLevel <= 1) return;
    isPanning = true;
    panStartX = e.clientX - panX;
    panStartY = e.clientY - panY;
    applyPreviewTransform();
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (isPanning) {
      panX = e.clientX - panStartX;
      panY = e.clientY - panStartY;
      applyPreviewTransform();
      requestAnimationFrame(renderSelectionBox);
      return;
    }

    if (!selectingRegion || !selectionStart) return;
    const pos = getNormalizedPosFromEvent(e);
    const minX = Math.min(selectionStart.x, pos.x);
    const minY = Math.min(selectionStart.y, pos.y);
    const maxX = Math.max(selectionStart.x, pos.x);
    const maxY = Math.max(selectionStart.y, pos.y);
    selectedRegion = {
      x: minX,
      y: minY,
      w: Math.max(0.0001, maxX - minX),
      h: Math.max(0.0001, maxY - minY),
    };
    processRegionInput.value = JSON.stringify(selectedRegion);
    renderSelectionBox();
    suppressClick = true;
  });

  window.addEventListener('mouseup', () => {
    if (isPanning) {
      isPanning = false;
      applyPreviewTransform();
    }

    if (selectingRegion) {
      selectingRegion = false;
      if (selectedRegion && (selectedRegion.w < 0.01 || selectedRegion.h < 0.01)) {
        selectedRegion = null;
        processRegionInput.value = '';
        selectionBox.classList.add('hidden');
      } else if (selectedRegion) {
        processRegionInput.value = JSON.stringify(selectedRegion);
      }
      schedulePreview();
      setTimeout(() => { suppressClick = false; }, 50);
    }
  });

  tolerance.addEventListener('input', () => {
    tolValue.textContent = tolerance.value;
    schedulePreview();
  });

  zoomInBtn.addEventListener('click', () => { changeZoom(0.25); requestAnimationFrame(renderSelectionBox); });
  zoomOutBtn.addEventListener('click', () => { changeZoom(-0.25); requestAnimationFrame(renderSelectionBox); });
  resetViewBtn.addEventListener('click', () => { resetPreviewView(); requestAnimationFrame(renderSelectionBox); });
  toolHandBtn.addEventListener('click', () => setActiveTool('hand'));
  toolPickerBtn.addEventListener('click', () => setActiveTool('picker'));
  toggleRegionBtn.addEventListener('click', () => setRegionMode(!regionMode));
  clearRegionBtn.addEventListener('click', clearRegion);

  mode.addEventListener('change', updateModeUI);
  transparentOutput.addEventListener('change', schedulePreview);
  outputFormat.addEventListener('change', schedulePreview);
  fileInput.addEventListener('change', () => {
    const isPdf = fileInput.files[0] && fileInput.files[0].name.toLowerCase().endsWith('.pdf');
    outputFormat.disabled = !!isPdf;
    schedulePreview();
  });

  form.addEventListener('submit', () => {
    targetColorsInput.value = JSON.stringify(colors);
    processRegionInput.value = selectedRegion ? JSON.stringify(selectedRegion) : '';
  });

  window.addEventListener('resize', () => requestAnimationFrame(renderSelectionBox));

  renderColorList();
  syncReplacement();
  updateModeUI();
  setActiveTool('picker');
  applyPreviewTransform();
})();
</script>
{% endblock %}
