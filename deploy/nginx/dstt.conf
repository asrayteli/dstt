server {
    listen 80;
    listen [::]:80;
    server_name dstt.dipalette.com;
    return 301 https://dstt.dipalette.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dstt.dipalette.com;

    ssl_certificate /etc/letsencrypt/live/dstt.dipalette.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dstt.dipalette.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
