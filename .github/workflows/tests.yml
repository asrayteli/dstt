name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python -m pytest -q

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dstt
          POSTGRES_PASSWORD: dstt-ci-only
          POSTGRES_DB: dstt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dstt -d dstt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DSTT_TEST_POSTGRES_URI: postgresql+psycopg://dstt:dstt-ci-only@127.0.0.1:5432/dstt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python -m pytest -q -m postgres
