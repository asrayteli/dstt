name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install security tools
        run: python -m pip install --disable-pip-version-check bandit pip-audit
      - name: Audit pinned dependencies
        run: python -m pip_audit --requirement requirements.txt
      - name: Scan Python source for high-severity issues
        run: python -m bandit -q -lll -r app
      - name: Compile application
        run: python -m compileall -q app
